// ─── Model: what the plant looks like at any growth, shared by both views ───

const GOLDEN = Math.PI * (3 - Math.sqrt(5));   // the golden angle, ≈137.5°: each floret turns this far from the last
// However finely a spec divides the head, it keeps within the instance budget.
const MAX_FLORETS = 5000;
const MAX_BUDS = 20000;
const STALK_STEPS = 16;
const LEAF_STEPS = 40;
// The petiole and midrib are drawn as this many tapering pieces, out to this share of the leaf: its tip is too thin to show.
const MIDRIB_PIECES = 8;
const MIDRIB_REACH = 0.93;

const lerp = (from, to, t) => from + (to - from) * t;

/** 0 before span[0], 1 after span[1], linear between. A span of no length switches at once. */
function phase(value, [from, to]) {
    if (to <= from) return value >= from ? 1 : 0;
    return clamp01((value - from) / (to - from));
}

/** A per-generation spec value; a list shorter than the generations repeats its last entry. */
const perLevel = (list, level) => list[Math.min(level, list.length - 1)];
/** Solid angle of a dome reaching `cap` radians from its axis. */
const capArea = cap => TAU * (1 - Math.cos(cap));
const mixArray = (from, to, t) => from.map((channel, index) => channel + (to[index] - channel) * t);
const rgbString = (rgb, factor = 1) => `rgb(${rgb.map(channel => Math.round(Math.min(255, Math.max(0, channel * factor)))).join(',')})`;

// Leaf `index` in the order they grow: 0 = the first, lowest leaf, 1 = the youngest, under the head.
const leafOrder = index => index / Math.max(1, BROCCOLI.leaves.count - 1);
const leafBirth = index => lerp(BROCCOLI.timeline.leaves[0], BROCCOLI.timeline.leaves[1], leafOrder(index));
// Where a leaf joins the stalk once everything has stretched, as a share of the leaf zone.
const leafAttach = index => Math.pow(leafOrder(index), BROCCOLI.leaves.crowding);

/**
 * The stalk at this growth. Every leaf is born at the stalk's tip, and the internode below it stretches while the leaf grows,
 * lifting it and everything above it; so the tip always sits among the youngest leaves. Once the head forms, the neck under it
 * stretches. Gives how tall and thick the stalk is, how far up it each leaf sits, and how far the seedling is still bent over.
 */
function stalkAt(growth) {
    const { stalk, leaves, timeline } = BROCCOLI;
    const sprout = phase(growth, timeline.sprout);
    const thick = smooth(phase(growth, timeline.thicken));
    let reach = stalk.seedlingHeight * easeOut(sprout);
    const nodes = Array.from({ length: leaves.count }, (_, index) => {
        const internode = stalk.leafZone * (leafAttach(index) - (index > 0 ? leafAttach(index - 1) : 0));
        reach += internode * smooth(phase(growth, [leafBirth(index), leafBirth(index) + timeline.leafGrow]));
        return reach;
    });
    // The seedling's stem is even; the leafy stalk tapers to a narrow growing tip, which widens to carry the head as it swells.
    const tipNarrows = smooth(phase(growth, [timeline.leaves[0], timeline.leaves[0] + timeline.leafGrow]));
    const seedlingTaper = lerp(1, stalk.apexRadius, tipNarrows);
    const headTaper = stalk.topRadius / stalk.radius;
    const swelling = smooth(phase(growth, timeline.head));
    return {
        sprout,
        nodes,
        height: reach + stalk.neck * smooth(phase(growth, timeline.neck)),
        radius: lerp(stalk.seedlingRadius, stalk.radius, thick) * clamp01(sprout * 4),
        topShare: lerp(seedlingTaper, headTaper, swelling),
        hook: stalk.hook * (1 - smooth(phase(sprout, stalk.straighten))),
        lean: stalk.lean * smooth(phase(growth, [timeline.leaves[0], timeline.neck[1]])),
    };
}

/** Points up the stalk from the soil, in its own upright plane: sideways h, height y, angle off vertical, radius. */
function stalkCurve(stalkNow) {
    const { flare } = BROCCOLI.stalk;
    const step = stalkNow.height / STALK_STEPS;
    const points = [];
    let h = 0;
    let y = 0;
    for (let index = 0; index <= STALK_STEPS; index++) {
        const s = index / STALK_STEPS;
        // The lean grows steadily up the stalk; the seedling's hook bends only its top half.
        const angle = stalkNow.lean * s + stalkNow.hook * smooth(clamp01((s - 0.45) / 0.55));
        const radius = stalkNow.radius * lerp(1, stalkNow.topShare, s) * (1 + flare * Math.pow(1 - s, 8));
        points.push({ h, y, angle, radius });
        h += Math.sin(angle) * step;
        y += Math.cos(angle) * step;
    }
    return points;
}

/** The point `length` up the stalk from the soil (at most its top), with its angle and radius. */
function alongStalk(curve, stalkNow, length) {
    const at = clamp01(length / Math.max(stalkNow.height, 1e-6)) * STALK_STEPS;
    const index = Math.min(STALK_STEPS - 1, Math.floor(at));
    const t = at - index;
    const [a, b] = [curve[index], curve[index + 1]];
    return { h: lerp(a.h, b.h, t), y: lerp(a.y, b.y, t), angle: lerp(a.angle, b.angle, t), radius: lerp(a.radius, b.radius, t) };
}

/** Where a leaf joins the stalk now. */
const leafNode = (curve, stalkNow, leaf) => alongStalk(curve, stalkNow, stalkNow.nodes[leaf.index]);

/** The seed leaves: unfolding as the seedling straightens, then yellowing, drooping and withering away under the rosette. */
function seedLeavesAt(growth, stalkNow) {
    const { seedLeaves, timeline } = BROCCOLI;
    const wither = smooth(phase(growth, timeline.seedLeavesWither));
    const unfold = smooth(phase(stalkNow.sprout, seedLeaves.unfold));
    return {
        size: easeOut(phase(stalkNow.sprout, seedLeaves.grow)) * (1 - wither),
        open: lerp(seedLeaves.folded, seedLeaves.open, unfold) + seedLeaves.witherDroop * wither,
        wither,
    };
}

/** Relative size of the leaf at `order` (0 = first, 1 = youngest): small, then the biggest, then smaller again under the head. */
function leafSize(order) {
    const { sizes: [first, biggest, last], biggestAt } = BROCCOLI.leaves;
    if (order < biggestAt) return lerp(first, biggest, smooth(order / biggestAt));
    return lerp(biggest, last, smooth((order - biggestAt) / Math.max(1e-6, 1 - biggestAt)));
}

/** The true leaves in the order they grow, spiralling up the stalk. */
function buildLeaves(rand) {
    const { leaves, colors } = BROCCOLI;
    const firstAzimuth = rand() * TAU;
    return Array.from({ length: leaves.count }, (_, index) => {
        const order = leafOrder(index);
        return {
            index,
            order,
            azimuth: firstAzimuth + index * leaves.divergence + (rand() - 0.5) * 0.3,
            length: leaves.length * leafSize(order) * (0.92 + rand() * 0.16),
            baseAngle: lerp(leaves.baseAngle[0], leaves.baseAngle[1], order) + (rand() - 0.5) * 0.14,
            droop: lerp(leaves.droop[0], leaves.droop[1], order) * (0.85 + rand() * 0.3),
            birth: leafBirth(index),
            wavePhase: rand() * TAU,
            color: pick(rand, colors.leaf),
        };
    });
}

/** One leaf at this growth: a small, half-folded leaf that lengthens, broadens, opens and arches outwards. */
function leafAt(leaf, growth) {
    const { leaves, timeline } = BROCCOLI;
    const progress = phase(growth, [leaf.birth, leaf.birth + timeline.leafGrow]);
    const opened = smooth(progress);
    const length = leaf.length * easeOut(progress);
    return {
        length,
        // A new leaf starts slender and broadens as it opens.
        halfWidth: length * leaves.width / 2 * lerp(leaves.youngWidth, 1, opened),
        baseAngle: lerp(leaves.youngAngle, leaf.baseAngle, opened),
        droop: leaf.droop * opened,
        fold: lerp(leaves.youngFold, leaves.fold, opened),
        maturity: opened,
        // Only the oldest leaves yellow, and only a little.
        age: smooth(phase(growth, timeline.age)) * clamp01(1 - leaf.order / leaves.oldShare) * leaves.oldYellow,
    };
}

/** Half width of the blade at t (0 = where it starts after the petiole, 1 = tip), as a share of its widest. */
function bladeProfile(t) {
    const { lobes, lobeSize, lobeZone } = BROCCOLI.leaves;
    if (t < lobeZone) {
        // Small ear-like lobes, larger towards the main blade.
        const lobe = Math.abs(Math.sin(Math.PI * lobes * t / lobeZone));
        return lobeSize * (0.55 + 0.45 * t / lobeZone) * Math.pow(lobe, 0.8);
    }
    // Obovate: narrow at its base, widest past the middle, rounded at the tip.
    const k = (t - lobeZone) / (1 - lobeZone);
    return Math.pow(Math.sin(Math.PI * Math.pow(k, 0.7)), 0.7);
}

/** The leaf's half width at u (0 = stalk, 1 = tip) with its scalloped edge, and the up-and-down wave of that edge. */
function bladeAt(leaf, leafNow, u) {
    const { petiole, waves, waveDepth } = BROCCOLI.leaves;
    if (u <= petiole) return { width: 0, wave: 0 };
    const t = (u - petiole) / (1 - petiole);
    return {
        width: leafNow.halfWidth * bladeProfile(t) * (1 + 0.06 * Math.sin(t * 23 + leaf.wavePhase)),
        wave: waveDepth * leafNow.halfWidth * Math.sin(t * waves * TAU + leaf.wavePhase) * Math.min(1, t * 4),
    };
}

/**
 * The midrib from the stalk to the tip, in the leaf's own upright plane: out, up and the angle off vertical. `height` is where the
 * leaf joins the stalk: a drooping leaf that gets down to the soil lies along it.
 */
function leafMidrib(leafNow, height) {
    const floor = BROCCOLI.leaves.floor - height;
    const points = [];
    const step = leafNow.length / LEAF_STEPS;
    let out = 0;
    let up = 0;
    for (let index = 0; index <= LEAF_STEPS; index++) {
        const u = index / LEAF_STEPS;
        let angle = leafNow.baseAngle + leafNow.droop * Math.pow(u, 1.6);
        if (up <= floor && angle > Math.PI / 2) angle = Math.PI / 2;
        points.push({ out, up, angle, u });
        out += Math.sin(angle) * step;
        // Never down through the soil.
        up = Math.max(Math.min(up, floor), up + Math.cos(angle) * step);
    }
    return points;
}

// The soil mound's profile: rings over its shoulder, then across its top.
const SOIL_SHOULDER_RINGS = 5;
const SOIL_TOP_RINGS = 8;

/**
 * A ring of the soil mound's shoulder, `s` of the way from its foot (0) up to the edge of its top (1): it leaves the foot level
 * and rounds over into the top, so the mound has a soft foot and a rounded shoulder.
 */
function soilRing(s) {
    const { radius, foot, depth } = BROCCOLI.soil;
    return { radius: lerp(radius * foot, radius, s), height: -depth * (1 - smooth(s)) };
}

/**
 * The seed leaf's heart-shaped blade, notched at its far end, from one side of its stalk's end round to the other (`stalkHalf`
 * off the leaf's line). Canvas contexts and THREE.Shape share these calls, so 2D and 3D draw the one outline.
 */
function traceSeedBlade(path, length, width, stalkEnd, stalkHalf) {
    const shoulder = stalkEnd + (length - stalkEnd) * 0.1;
    path.bezierCurveTo(shoulder, -width * 0.55, length * 1.02, -width * 0.62, length, -width * 0.18);
    path.quadraticCurveTo(length * 0.98, 0, length * 0.9, 0);
    path.quadraticCurveTo(length * 0.98, 0, length, width * 0.18);
    path.bezierCurveTo(length * 1.02, width * 0.62, shoulder, width * 0.55, stalkEnd, stalkHalf);
}

// ─── The head: a fractal of florets ───
// Head space: the stalk's top at the origin, the stalk's axis along +y, full size. A floret is a dome (centre, axis, radius) on a
// stalk that branches off its parent's stalk; the head itself is the first dome. Each view scales and places head space itself.

/**
 * `count` directions spread evenly over a dome reaching `cap` radians from `axis`, on Vogel's sunflower spiral: each turns the
 * golden angle from the last and sits a little further out (`rim`: 0 in the middle of the dome, 1 at its edge). `share` is how
 * wide each may be, as a share of the dome's radius, for neighbours widened by `overlap` to press together.
 */
function spiralOn(axis, cap, count, overlap, jitter, rand) {
    const spacing = Math.sqrt(capArea(cap) / (Math.PI * count)) * overlap;
    const firstTurn = rand() * TAU;
    const spots = Array.from({ length: count }, (_, index) => {
        const rim = Math.sqrt((index + 0.5) / count);
        const tilt = rim * cap + (rand() - 0.5) * jitter;
        const turn = firstTurn + index * GOLDEN + (rand() - 0.5) * jitter * 2;
        return { rim, dir: splay(axis, tilt, turn) };
    });
    return { spots, share: spacing / (1 + spacing) };
}

/** Florets on a parent's dome. Rim florets are smaller and branch off lower down their parent's stalk. */
function floretsOn(parent, level, rand) {
    const { head, colors } = BROCCOLI;
    const { spots, share } = spiralOn(parent.axis, perLevel(head.capAngle, level), head.counts[level], perLevel(head.overlap, level), 0.07, rand);
    return spots.map(({ rim, dir: axis }) => {
        const radius = parent.radius * share * (1 - head.outerShrink * rim) * (0.93 + rand() * 0.14);
        // Its dome touches the inside of the parent's.
        const center = parent.center.clone().addScaledVector(axis, parent.radius - radius);
        return {
            level: level + 1, parent, axis, radius, center,
            offset: center.clone().sub(parent.center),
            attach: perLevel(head.attachSpan, level) * rim * rim,
            // Neighbouring florets differ a little in hue.
            color: pick(rand, colors.bud),
        };
    });
}

/** Bead-like buds packed over a last-generation floret's dome, on the same spiral. */
function budsOn(floret, count, rand) {
    const { head, colors } = BROCCOLI;
    const { spots, share } = spiralOn(floret.axis, head.budCap, count, head.budOverlap, 0.1, rand);
    return spots.map(({ rim, dir: normal }) => {
        const radius = floret.radius * share * (0.85 + rand() * 0.3);
        // Most buds share their floret's hue.
        const color = rand() < 0.75 ? floret.color : pick(rand, colors.bud);
        return { floret, normal, rim, radius, offset: normal.clone().multiplyScalar(floret.radius - radius), color, flower: null };
    });
}

/**
 * How much light reaches a ball of the head (a bud, or a floret's core) at `center` with `radius`, sitting on `floret`: less the
 * deeper it lies in the creases between florets, and between the florets on a floret.
 */
function creaseLight(center, radius, floret, crown) {
    const { crease: [deep, shallow], creaseDepth: [headCrease, floretCrease] } = BROCCOLI.look;
    let first = floret;
    while (first.level > 1) first = first.parent;
    // How far out its surface reaches, from the head's centre and from its first-generation floret's centre (1 = the surface).
    const outer = (center.distanceTo(crown.center) + radius) / crown.radius;
    const inner = first === floret ? 1 : (center.distanceTo(first.center) + radius) / first.radius;
    const headLight = lerp(deep, 1, smooth(phase(outer, [1 - headCrease, 1])));
    const floretLight = lerp(shallow, 1, smooth(phase(inner, [1 - floretCrease, 1])));
    return headLight * floretLight;
}

/**
 * Bolting: a few florets on the outside of the head come into flower one after another. On each, its most exposed buds open,
 * the outermost first (the lowest on its stalk, as on every brassica's flower stalks), each on a lengthening stalk of its own.
 */
function chooseFlowers(crown, tips, rand) {
    const { head, timeline, colors } = BROCCOLI;
    // The florets that reach furthest out make up the outside of the head; the rest sit in its creases.
    const reach = floret => floret.center.distanceTo(crown.center) + floret.radius;
    const outside = [...tips].sort((a, b) => reach(b) - reach(a)).slice(0, Math.ceil(tips.length / 2));
    const bolting = [];
    while (bolting.length < head.flowerFlorets && outside.length > 0) {
        bolting.push(outside.splice(Math.floor(rand() * outside.length), 1)[0]);
    }
    const { flowerOpen, flowerCascade } = timeline;
    const lastStart = timeline.bolt[1] - flowerOpen - flowerCascade;
    bolting.forEach((floret, order) => {
        const start = lerp(timeline.bolt[0], lastStart, bolting.length > 1 ? order / (bolting.length - 1) : 0);
        const exposed = [...floret.buds]
            .sort((a, b) => b.light - a.light)
            .slice(0, Math.round(floret.buds.length * head.flowerShare))
            .sort((a, b) => b.rim - a.rim);
        exposed.forEach((bud, rank) => {
            // Brassica flowers turn partly upwards, to the light.
            const facing = bud.normal.clone().lerp(UP, head.flowerTurnUp);
            bud.flower = {
                threshold: start + flowerCascade * (exposed.length > 1 ? rank / (exposed.length - 1) : 0),
                turn: rand() * TAU,
                size: 0.8 + rand() * 0.4,
                color: pick(rand, colors.flower),
                facing: facing.lengthSq() > 1e-6 ? facing.normalize() : bud.normal.clone(),
            };
        });
    });
}

function buildHead(rand) {
    const { head } = BROCCOLI;
    const crown = { level: 0, parent: null, axis: UP.clone(), radius: head.radius, center: new THREE.Vector3(0, head.radius * head.lift, 0) };
    const { branches: florets, tips } = growGenerations({
        trunk: crown,
        generations: head.counts.length + 1,
        cap: MAX_FLORETS,
        spawn: (parent, level) => floretsOn(parent, level, rand),
    });
    // A very finely divided head keeps fewer buds on each floret, so it stays within its budget.
    const budsPerFloret = Math.min(head.buds, Math.floor(MAX_BUDS / tips.length));
    tips.forEach(floret => { floret.buds = budsOn(floret, budsPerFloret, rand); });
    const buds = tips.flatMap(floret => floret.buds);
    const stalked = florets.filter(floret => floret.level > 0);
    stalked.forEach(floret => {
        floret.core = floret.radius * perLevel(head.body, floret.level - 1);
        floret.light = creaseLight(floret.center, floret.core, floret, crown);
        // Its core is a dome turned along its axis.
        floret.coreTurn = new THREE.Quaternion().setFromUnitVectors(UP, floret.axis);
    });
    buds.forEach(bud => { bud.light = creaseLight(bud.floret.center.clone().add(bud.offset), bud.radius, bud.floret, crown); });
    chooseFlowers(crown, tips, rand);
    // Where each floret, its stalk and each bud are at the current growth (see layoutHead).
    florets.forEach(floret => {
        floret.now = floret.center.clone();
        floret.start = new THREE.Vector3();
        floret.end = new THREE.Vector3();
    });
    buds.forEach(bud => { bud.now = new THREE.Vector3(); });
    return { crown, stalked, buds, flowers: buds.filter(bud => bud.flower) };
}

/**
 * The head at this growth: it appears tiny and tight (florets crowded towards their parents' centres, buds swollen so it stays
 * closed), swells and loosens into separate florets, deepens in colour, and opens up a little more as it bolts.
 */
function headAt(growth) {
    const { head, timeline } = BROCCOLI;
    const grown = smooth(phase(growth, timeline.head));
    const loosen = 1 + head.boltLoosen * smooth(phase(growth, timeline.bolt));
    return {
        scale: grown,
        spread: head.young.map(young => lerp(young, 1, grown) * loosen),
        budSwell: 1 + head.budSwell * (1 - grown),
        ripen: smooth(phase(growth, timeline.ripen)),
    };
}

/** A flower's bud yellows just before it opens; `open` runs 0 → 1 as the petals spread. */
function flowerAt(flower, growth) {
    const { flowerOpen, flowerYellow } = BROCCOLI.timeline;
    return {
        yellow: smooth(phase(growth, [flower.threshold - flowerYellow, flower.threshold])),
        open: smooth(phase(growth, [flower.threshold, flower.threshold + flowerOpen])),
    };
}

/** Moves every floret, floret stalk and bud to where it is at this stage, in head space. */
function layoutHead(head, headNow) {
    const { radius, sink } = BROCCOLI.head;
    const { spread } = headNow;
    // The last spacing is the buds'; the florets' come before it.
    const budSpread = spread[spread.length - 1];
    head.stalked.forEach(floret => {
        const floretSpread = spread[Math.max(0, Math.min(floret.level - 1, spread.length - 2))];
        floret.now.copy(floret.parent.now).addScaledVector(floret.offset, floretSpread);
        // Its stalk runs from its parent's stalk (rim florets branch off lower) to just inside its own dome.
        floret.end.copy(floret.now).addScaledVector(floret.axis, -floret.radius * sink);
        if (floret.level === 1) floret.start.set(0, -floret.attach * radius, 0);
        else floret.start.lerpVectors(floret.parent.end, floret.parent.start, floret.attach);
    });
    head.buds.forEach(bud => bud.now.copy(bud.floret.now).addScaledVector(bud.offset, budSpread));
}

// ─── Broccoli in 2D ───
// A side view seen from a little above: the soil patch is a low mound, the head is tilted towards us so its dome shows.

function fillPolygon(g, points, color, { sx, sy }) {
    g.fillStyle = color;
    g.beginPath();
    points.forEach(([x, y], index) => (index ? g.lineTo(sx(x), sy(y)) : g.moveTo(sx(x), sy(y))));
    g.closePath();
    g.fill();
}

/** Where the 2D light comes from, as a unit vector: x right, y up, z towards us. */
const light2D = () => new THREE.Vector3(...BROCCOLI.look.light2D).normalize();

function buildSoil2D(rand) {
    const { soil, colors, look } = BROCCOLI;
    const clods = Array.from({ length: soil.clods + soil.pebbles }, (_, index) => {
        const pebble = index >= soil.clods;
        const angle = rand() * TAU;
        const reach = Math.sqrt(rand()) * 0.9;
        const [least, extra] = pebble ? soil.pebbleSize : soil.clodSize;
        return {
            x: Math.cos(angle) * reach * soil.radius,
            y: Math.sin(angle) * reach * soil.radius * look.soilRim2D,
            size: least + rand() * extra,
            squash: 0.45 + rand() * 0.3,
            color: pick(rand, pebble ? colors.pebbles : colors.clods),
            pebble,
        };
    }).sort((a, b) => b.y - a.y);   // the far ones first
    return { clods };
}

/**
 * The mound seen from a little above: every ring of its profile, from the foot up to the top's edge, is an ellipse, and together
 * they make its outline. One gradient fills them all, so they merge into one shape: the top lit, darkening down the front slope.
 */
function drawSoil2D(g, soil, stalkNow, frame) {
    const { soil: patch, colors, look } = BROCCOLI;
    const { sx, sy, scale } = frame;
    const top = patch.radius;
    const foot = patch.radius * patch.foot;
    const topRy = top * look.soilRim2D * scale;
    const back = sy(0) - topRy;
    const front = sy(-patch.depth) + foot * look.soilRim2D * scale;
    const topFront = clamp01(2 * topRy / Math.max(1e-6, front - back));
    const shade = g.createLinearGradient(0, back, 0, front);
    shade.addColorStop(0, colors.soilTop);
    shade.addColorStop(topFront, colors.soilTop);
    shade.addColorStop(lerp(topFront, 1, 0.4), colors.soil);
    shade.addColorStop(1, colors.soilDark);
    g.fillStyle = shade;
    for (let $_ = 0; $_ <= SOIL_SHOULDER_RINGS; $_++) {
        const { radius, height } = soilRing($_ / SOIL_SHOULDER_RINGS);
        g.beginPath();
        g.ellipse(sx(0), sy(height), radius * scale, radius * look.soilRim2D * scale, 0, 0, TAU);
        g.fill();
    }
    soil.clods.forEach(clod => {
        g.fillStyle = clod.color;
        g.beginPath();
        g.ellipse(sx(clod.x), sy(clod.y), clod.size * scale, clod.size * clod.squash * scale, 0, 0, TAU);
        g.fill();
        if (!clod.pebble) return;
        g.fillStyle = colors.pebbleShine;
        g.beginPath();
        g.ellipse(sx(clod.x - clod.size * 0.3), sy(clod.y + clod.size * clod.squash * 0.3), clod.size * 0.4 * scale, clod.size * 0.2 * scale, 0, 0, TAU);
        g.fill();
    });
    // The soil the seedling pushed aside.
    if (stalkNow.height <= 0) return;
    g.fillStyle = mixRgb(hexToRgb(colors.soil), hexToRgb(colors.soilDark), 0.6);
    g.beginPath();
    g.ellipse(sx(0), sy(0), (stalkNow.radius * 1.3 + 0.006 * easeOut(stalkNow.sprout)) * scale, (stalkNow.radius * 0.3 + 0.002) * scale, 0, 0, TAU);
    g.fill();
}

/** The stalk as one shape: its two edges square to its curve, shaded round from the light's side, with a rounded top. */
function drawStalk2D(g, curve, mirror, frame) {
    const { colors } = BROCCOLI;
    const { sx, sy, scale } = frame;
    const edge = sign => curve.map(point => {
        const angle = point.angle * mirror;
        return [point.h * mirror + sign * Math.cos(angle) * point.radius, point.y - sign * Math.sin(angle) * point.radius];
    });
    const base = curve[0];
    const shade = g.createLinearGradient(sx(-base.radius), 0, sx(base.radius), 0);
    shade.addColorStop(0, colors.stalkShade);
    shade.addColorStop(clamp01(0.5 + 0.5 * light2D().x), colors.stalk);
    shade.addColorStop(1, colors.stalkShade);
    fillPolygon(g, [...edge(-1), ...edge(1).reverse()], shade, frame);
    const top = curve[STALK_STEPS];
    g.beginPath();
    g.arc(sx(top.h * mirror), sy(top.y), top.radius * scale, 0, TAU);
    g.fill();
}

/** A seed leaf: a short stalk and a heart-shaped blade, notched at its far end. */
function drawSeedLeaf2D(g, x, y, angle, size, color, { sx, sy, scale }) {
    const { length: fullLength, width: fullWidth, petiole } = BROCCOLI.seedLeaves;
    const length = fullLength * size * scale;
    const width = fullWidth * size * scale;
    const stalkEnd = length * petiole;
    g.save();
    g.translate(sx(x), sy(y));
    // Canvas y points down: turn so that +x runs along the leaf.
    g.rotate(angle - Math.PI / 2);
    g.strokeStyle = color;
    g.fillStyle = color;
    g.lineWidth = Math.max(1, width * 0.12);
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(stalkEnd, 0);
    g.stroke();
    g.beginPath();
    g.moveTo(stalkEnd, 0);
    traceSeedBlade(g, length, width, stalkEnd, 0);
    g.fill();
    g.restore();
}

function drawSeedLeaves2D(g, node, mirror, seed, frame) {
    if (seed.size <= 0) return;
    const { colors } = BROCCOLI;
    const color = mixRgb(hexToRgb(colors.seedLeaf), hexToRgb(colors.seedLeafOld), seed.wither);
    [-1, 1].forEach(sideSign => drawSeedLeaf2D(g, node.h * mirror, node.y, node.angle * mirror + sideSign * seed.open, seed.size, color, frame));
}

/**
 * A true leaf: a long pale petiole and midrib, a lobed, wavy blade with its upper half catching the light, and pale veins.
 * Leaves pointing sideways show their full length but less of their face; leaves pointing at us or away are foreshortened.
 */
function drawLeaf2D(g, leaf, leafNow, node, mirror, frame) {
    const { leaves, colors, look } = BROCCOLI;
    const { sx, sy, scale } = frame;
    const across = Math.sin(leaf.azimuth);
    const towards = Math.cos(leaf.azimuth);
    const side = across >= 0 ? 1 : -1;
    const reach = 0.3 + 0.7 * Math.abs(across);
    const visible = (0.66 + 0.3 * Math.abs(towards)) * lerp(0.3, 1, Math.cos(leafNow.fold));
    const startX = node.h * mirror + side * node.radius * 0.8;
    const midrib = leafMidrib(leafNow, node.y).map(point => ({ u: point.u, x: startX + side * point.out * reach, y: node.y + point.up }));
    // The normal of the 2D midrib on the leaf's upper side.
    midrib.forEach((point, index) => {
        const next = midrib[Math.min(index + 1, LEAF_STEPS)];
        const prev = midrib[Math.max(index - 1, 0)];
        const length = Math.hypot(next.x - prev.x, next.y - prev.y) || 1;
        point.nx = -(next.y - prev.y) / length * side;
        point.ny = (next.x - prev.x) / length * side;
    });
    const blade = midrib.filter(point => point.u >= leaves.petiole);
    const edge = sign => blade.map(point => {
        const { width, wave } = bladeAt(leaf, leafNow, point.u);
        const reachOut = (width + wave * 0.5 * sign) * visible;
        return [point.x + sign * point.nx * reachOut, point.y + sign * point.ny * reachOut];
    });
    const upper = edge(1);
    const lower = edge(-1);

    // Leaves further back are darker.
    const [lowerShade, upperShade] = look.leafShade2D;
    const depthShade = lerp(look.depthShade2D, 1, (towards + 1) / 2);
    const grownRgb = mixArray(hexToRgb(colors.leafYoung), hexToRgb(leaf.color), leafNow.maturity);
    const rgb = mixArray(grownRgb, hexToRgb(colors.leafOld), leafNow.age);
    fillPolygon(g, [...upper, ...lower.reverse()], rgbString(rgb, lowerShade * depthShade), frame);
    fillPolygon(g, [...upper, ...blade.map(point => [point.x, point.y]).reverse()], rgbString(rgb, upperShade * depthShade), frame);

    // Veins: pale, angled towards the tip, on both halves.
    const veinColor = rgbString(mixArray(hexToRgb(colors.midrib), rgb, 0.35), depthShade);
    g.strokeStyle = veinColor;
    g.globalAlpha = 0.45;
    g.lineWidth = 1;
    g.beginPath();
    for (let index = 3; index < blade.length - 4; index += 3) {
        const from = blade[index];
        const to = blade[index + 3];
        [1, -1].forEach(sign => {
            const { width } = bladeAt(leaf, leafNow, to.u);
            g.moveTo(sx(from.x), sy(from.y));
            g.lineTo(sx(to.x + sign * to.nx * width * visible * 0.85), sy(to.y + sign * to.ny * width * visible * 0.85));
        });
    }
    g.stroke();
    g.globalAlpha = 1;

    // Petiole and midrib: thick at the stalk, tapering to the tip.
    g.strokeStyle = rgbString(mixArray(hexToRgb(colors.midrib), rgb, 0.4), depthShade);
    g.lineCap = 'round';
    const thickness = leaves.midrib * leafNow.length * 1.7 * scale;
    for (let $_ = 0; $_ < MIDRIB_PIECES; $_++) {
        const from = midrib[Math.round($_ / MIDRIB_PIECES * LEAF_STEPS * MIDRIB_REACH)];
        const to = midrib[Math.round(($_ + 1) / MIDRIB_PIECES * LEAF_STEPS * MIDRIB_REACH)];
        g.lineWidth = Math.max(0.6, thickness * (1 - 0.8 * from.u));
        g.beginPath();
        g.moveTo(sx(from.x), sy(from.y));
        g.lineTo(sx(to.x), sy(to.y));
        g.stroke();
    }
}

/**
 * A four-petal cross of a flower, as all brassicas have, with a gold heart. Seen at a slant it is foreshortened: squashed to
 * `squash` along `angle`, the way it faces.
 */
function drawCrossFlower2D(g, x, y, size, flower, { angle, squash }) {
    g.save();
    g.translate(x, y);
    g.rotate(angle);
    g.scale(squash, 1);
    g.fillStyle = flower.color;
    for (let $_ = 0; $_ < 4; $_++) {
        const petal = flower.turn + $_ * Math.PI / 2;
        g.beginPath();
        g.ellipse(Math.cos(petal) * size * 0.55, Math.sin(petal) * size * 0.55, size * 0.55, size * 0.38, petal, 0, TAU);
        g.fill();
    }
    g.fillStyle = BROCCOLI.colors.flowerHeart;
    g.beginPath();
    g.arc(0, 0, size * 0.22, 0, TAU);
    g.fill();
    g.restore();
}

/**
 * A floret's core: a ball lit from the light's side, cut off below where its dome ends and its stalks come in. That edge is a
 * circle round the floret's axis; seen at a slant, its front half is the lower half of an ellipse. `axis` is the floret's axis
 * on the canvas (x right, y down) and how much of it points at us (z).
 */
function drawCore2D(g, x, y, radius, axis, fill) {
    const { coreCap } = BROCCOLI.head;
    const slant = Math.hypot(axis.x, axis.y);
    g.save();
    if (slant > 0.01) {
        const [ux, uy] = [axis.x / slant, axis.y / slant];
        const rimAt = slant * Math.cos(coreCap) * radius;
        const rimWidth = Math.abs(Math.sin(coreCap)) * radius;
        const [ex, ey] = [x + ux * rimAt, y + uy * rimAt];
        const far = radius * 3;
        g.beginPath();
        // The rim's front half, from one side round below to the other…
        g.ellipse(ex, ey, Math.abs(axis.z) * rimWidth, rimWidth, Math.atan2(uy, ux), Math.PI / 2, Math.PI * 1.5);
        // …then everything on the dome's side of the rim.
        g.lineTo(ex + uy * far, ey - ux * far);
        g.lineTo(ex + uy * far + ux * far, ey - ux * far + uy * far);
        g.lineTo(ex - uy * far + ux * far, ey + ux * far + uy * far);
        g.lineTo(ex - uy * far, ey + ux * far);
        g.closePath();
        g.clip();
    }
    g.fillStyle = fill;
    g.beginPath();
    g.arc(x, y, radius, 0, TAU);
    g.fill();
    g.restore();
}

/**
 * Works out once per build what the 2D head needs: the floret stalks farthest first, each shaded by its depth; and every
 * floret's core, every bud and every flower in painting order, farthest first, with their light. Buds that face away are
 * always hidden, so they are left out.
 */
function prepareHead2D(head) {
    const { look, head: spec, colors } = BROCCOLI;
    const light = light2D();
    const tilt = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), look.headTilt2D);
    const tilted = vector => vector.clone().applyQuaternion(tilt);
    const depthOf = point => tilted(point).z;
    const stalkRgb = hexToRgb(colors.floretStalk);
    const stalks = head.stalked
        .map(floret => {
            const depth = depthOf(floret.center);
            const nearness = clamp01((depth / spec.radius + 1) / 2);
            return { floret, depth, color: rgbString(stalkRgb, lerp(look.depthShade2D, 1, nearness)) };
        })
        .sort((a, b) => a.depth - b.depth);
    const items = head.stalked.map(floret => ({ floret, depth: depthOf(floret.center), rgb: hexToRgb(floret.color), axis: tilted(floret.axis) }));
    head.buds.forEach(bud => {
        const normal = tilted(bud.normal);
        if (normal.z < -0.3) return;
        const center = bud.floret.center.clone().add(bud.offset);
        const lit = Math.max(0, normal.dot(light));
        items.push({ bud, depth: depthOf(center), rgb: hexToRgb(bud.color), shade: (0.5 + 0.75 * lit) * bud.light, glint: lit > 0.6 });
        if (!bud.flower) return;
        // Its flower, once open, stands just in front of it.
        const openFlower = center.addScaledVector(bud.normal, bud.radius + spec.flowerLift);
        items.push({ flowerOf: bud, depth: depthOf(openFlower), facing: tilted(bud.flower.facing) });
    });
    items.sort((a, b) => a.depth - b.depth);
    // Towards the light on the canvas (y down): where highlights sit on a ball.
    return { tilt, stalks, items, highlight: [light.x, -light.y] };
}

function drawHead2D(g, plant, growth, top, mirror, frame) {
    const headNow = headAt(growth);
    if (headNow.scale <= 0) return;
    const { head, head2D } = plant;
    const { colors, look, head: spec } = BROCCOLI;
    const { sx, sy, scale } = frame;
    layoutHead(head, headNow);
    const turn = top.angle * mirror;
    const [cosTurn, sinTurn] = [Math.cos(turn), Math.sin(turn)];
    // A direction in the tilted head, turned with the stalk's top: scene units, x right, y up.
    const turned = ({ x, y }) => [x * cosTurn + y * sinTurn, y * cosTurn - x * sinTurn];
    const tilted = new THREE.Vector3();
    // Head space to scene units: tilted towards us, leaning with the stalk's top, shrunk to the head's size, set on the stalk.
    const place = point => {
        const [x, y] = turned(tilted.copy(point).applyQuaternion(head2D.tilt));
        return [top.h * mirror + x * headNow.scale, top.y + y * headNow.scale];
    };
    const pixel = point => {
        const [x, y] = place(point);
        return [sx(x), sy(y)];
    };
    const headToPixels = headNow.scale * scale;

    // The floret stalks first, farthest first, each edged in shade: under the dome, the branching shows.
    const [edgeWidth, faceWidth] = look.floretStalk2D;
    head2D.stalks.forEach(({ floret, color }) => {
        const [x0, y0] = place(floret.start);
        const [x1, y1] = place(floret.end);
        const width = floret.radius * spec.stalkWidth * 2 * headNow.scale;
        const stalk = makeBranch2D(x0, y0, Math.atan2(y1 - y0, x1 - x0), Math.hypot(x1 - x0, y1 - y0), width, floret.level, 0);
        const style = { progressOf: () => 1, taper: spec.stalkTaper, sx, sy, scale };
        strokeBranches2D(g, [stalk], { ...style, thickness: edgeWidth, color: colors.stalkShade });
        strokeBranches2D(g, [stalk], { ...style, thickness: faceWidth, color });
    });

    // The dome shades the tops of its stalks: a shadow centred inside it, so only its lower half shows, fading down the stalks.
    const [darkness, shadowReach] = look.headShadow2D;
    const [shadowX, shadowY] = pixel(head.crown.center);
    const shadowRadius = spec.radius * shadowReach * headToPixels;
    g.save();
    g.translate(shadowX, shadowY - shadowRadius * 0.2);
    g.scale(1, 0.7);
    const shadow = g.createRadialGradient(0, 0, 0, 0, 0, shadowRadius);
    shadow.addColorStop(0, `rgba(0,0,0,${darkness})`);
    shadow.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = shadow;
    g.beginPath();
    g.arc(0, 0, shadowRadius, 0, TAU);
    g.fill();
    g.restore();

    // Floret cores, buds and flowers, farthest first.
    const youngRgb = hexToRgb(colors.budYoung);
    const boltRgb = hexToRgb(colors.budBolting);
    const [hx, hy] = head2D.highlight;
    const lifted = new THREE.Vector3();
    head2D.items.forEach(item => {
        if (item.floret) {
            const { floret } = item;
            const [x, y] = pixel(floret.now);
            const radius = floret.core * headToPixels;
            const ripe = mixArray(youngRgb, item.rgb, headNow.ripen);
            const ball = g.createRadialGradient(x + hx * radius * 0.45, y + hy * radius * 0.45, radius * 0.1, x, y, radius);
            ball.addColorStop(0, rgbString(ripe, 1.12 * floret.light));
            ball.addColorStop(1, rgbString(ripe, 0.42 * floret.light));
            const [ax, ay] = turned(item.axis);
            drawCore2D(g, x, y, radius, { x: ax, y: -ay, z: item.axis.z }, ball);
            return;
        }
        if (item.flowerOf) {
            const bud = item.flowerOf;
            const { open } = flowerAt(bud.flower, growth);
            if (open <= 0) return;
            const [bx, by] = pixel(bud.now);
            const [x, y] = pixel(lifted.copy(bud.now).addScaledVector(bud.normal, bud.radius + spec.flowerLift * open));
            // Its own little stalk, lengthening as it opens.
            g.strokeStyle = colors.floretStalk;
            g.lineWidth = Math.max(0.75, bud.radius * spec.pedicel * 2 * headToPixels);
            g.beginPath();
            g.moveTo(bx, by);
            g.lineTo(x, y);
            g.stroke();
            const [fx, fy] = turned(item.facing);
            drawCrossFlower2D(g, x, y, spec.flowerSize * bud.flower.size * open * headToPixels, bud.flower, {
                angle: Math.atan2(-fy, fx),
                squash: Math.max(look.flowerEdgeOn2D, Math.abs(item.facing.z)),
            });
            return;
        }
        const { bud } = item;
        const ripe = mixArray(youngRgb, item.rgb, headNow.ripen);
        const rgb = bud.flower ? mixArray(ripe, boltRgb, flowerAt(bud.flower, growth).yellow) : ripe;
        const [x, y] = pixel(bud.now);
        const radius = bud.radius * headNow.budSwell * headToPixels;
        g.fillStyle = rgbString(rgb, item.shade);
        g.beginPath();
        g.arc(x, y, radius, 0, TAU);
        g.fill();
        if (!item.glint || radius < 1.8) return;
        g.fillStyle = rgbString(rgb, item.shade * 1.45);
        g.beginPath();
        g.arc(x + hx * radius * 0.4, y + hy * radius * 0.4, radius * 0.38, 0, TAU);
        g.fill();
    });
}

function drawBroccoli2D(view, plant, growth) {
    const g = view.ctx;
    g.clearRect(0, 0, view.width, view.height);
    const frame = framing(view, BROCCOLI.look.frame2D);
    const stalkNow = stalkAt(growth);
    drawSoil2D(g, plant.soil, stalkNow, frame);
    if (stalkNow.height <= 0) return;
    const curve = stalkCurve(stalkNow);
    const { mirror } = plant;

    // Leaves behind the stalk, the stalk and seed leaves, leaves in front, then the head on top of it all.
    const leaves = plant.leaves
        .map(leaf => ({ leaf, leafNow: leafAt(leaf, growth) }))
        .filter(({ leafNow }) => leafNow.length > 0)
        .sort((a, b) => Math.cos(a.leaf.azimuth) - Math.cos(b.leaf.azimuth));
    const drawLeaf = ({ leaf, leafNow }) => drawLeaf2D(g, leaf, leafNow, leafNode(curve, stalkNow, leaf), mirror, frame);
    leaves.filter(({ leaf }) => Math.cos(leaf.azimuth) < 0).forEach(drawLeaf);
    drawStalk2D(g, curve, mirror, frame);
    drawSeedLeaves2D(g, alongStalk(curve, stalkNow, BROCCOLI.stalk.seedlingHeight), mirror, seedLeavesAt(growth, stalkNow), frame);
    leaves.filter(({ leaf }) => Math.cos(leaf.azimuth) >= 0).forEach(drawLeaf);
    drawHead2D(g, plant, growth, curve[STALK_STEPS], mirror, frame);
}

// ─── Broccoli in 3D ───

const TUBE_SIDES = 10;
// Across a blade, -1 to 1: denser near the midrib, so it shows as a narrow pale stripe.
const LEAF_COLUMNS = [-1, -0.72, -0.45, -0.22, -0.07, 0, 0.07, 0.22, 0.45, 0.72, 1];
// A touch of shadow beside the raised midrib, lighter towards the waxy edges.
const COLUMN_SHADE = LEAF_COLUMNS.map(v => (Math.abs(v) < 0.1 ? 0.88 : 0.9 + 0.16 * Math.abs(v)));

/**
 * A flat cross of four petals facing +y: a small raised heart, a ring where the heart meets the petals, and the petals' outline.
 * Vertex colours darken the heart; instance colours give the yellow.
 */
function makeFlowerGeometry() {
    const steps = 48;
    const heart = new THREE.Color(BROCCOLI.colors.flowerHeart);
    const positions = [0, 0.08, 0];
    const colors = [heart.r, heart.g, heart.b];
    // Three rings: the heart's edge, the petals' base, the petals' outline (tips curling up a little).
    const rings = [
        () => ({ reach: 0.14, lift: 0.05, color: heart }),
        () => ({ reach: 0.2, lift: 0.03, color: null }),
        angle => {
            const petal = Math.pow(Math.abs(Math.cos(2 * angle)), 0.6);
            return { reach: 0.25 + 0.75 * petal, lift: 0.15 * petal, color: null };
        },
    ];
    rings.forEach(ring => {
        for (let $_ = 0; $_ < steps; $_++) {
            const angle = $_ / steps * TAU;
            const { reach, lift, color } = ring(angle);
            positions.push(Math.cos(angle) * reach, lift, Math.sin(angle) * reach);
            colors.push(...(color ? [color.r, color.g, color.b] : [1, 1, 1]));
        }
    });
    const index = [];
    const at = (ring, step) => 1 + ring * steps + (step % steps);
    for (let $_ = 0; $_ < steps; $_++) {
        index.push(0, at(0, $_ + 1), at(0, $_));
        // Two triangles between each ring and the next.
        [0, 1].forEach(ring => {
            const [inner, innerNext] = [at(ring, $_), at(ring, $_ + 1)];
            const [outer, outerNext] = [at(ring + 1, $_), at(ring + 1, $_ + 1)];
            index.push(inner, innerNext, outerNext, inner, outerNext, outer);
        });
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geometry.setIndex(index);
    geometry.computeVertexNormals();
    return geometry;
}

/** A seed leaf one unit long and one wide: a short stalk and a heart notched at its far end, lying flat along +x, facing +y. */
function makeSeedLeafGeometry() {
    const { petiole } = BROCCOLI.seedLeaves;
    const shape = new THREE.Shape();
    shape.moveTo(0, -0.04);
    shape.lineTo(petiole, -0.04);
    traceSeedBlade(shape, 1, 1, petiole, 0.04);
    shape.lineTo(0, 0.04);
    return new THREE.ShapeGeometry(shape, 6).rotateX(-Math.PI / 2);
}

/** A floret's core: a dome open below, a little lumpy, like more buds deeper in. */
function makeCoreGeometry() {
    const { coreCap, coreLumps } = BROCCOLI.head;
    const geometry = new THREE.SphereGeometry(1, 24, 12, 0, TAU, 0, coreCap);
    const position = geometry.attributes.position;
    const point = new THREE.Vector3();
    for (let index = 0; index < position.count; index++) {
        point.fromBufferAttribute(position, index);
        // It depends only on where a vertex is, so the sphere's seam and pole stay closed.
        const lumps = Math.sin(11 * point.x + 1) * Math.sin(11 * point.y + 2) * Math.sin(11 * point.z + 3);
        point.multiplyScalar(1 + coreLumps * lumps);
        position.setXYZ(index, point.x, point.y, point.z);
    }
    geometry.computeVertexNormals();
    return geometry;
}

const budGeometry = new THREE.IcosahedronGeometry(1, 1);
const midribGeometry = unitStem(0.8, 5);
const pedicelGeometry = unitStem(0.7, 5);
const clodGeometry = new THREE.DodecahedronGeometry(1, 0);

/** instanced() that draws exactly `count` pieces: none at all for 0, instead of one stray piece at full size. */
function exactlyInstanced(geometry, material, count) {
    const mesh = instanced(geometry, material, count);
    mesh.count = count;
    return mesh;
}

const MATERIALS = {
    stalk: new THREE.MeshStandardMaterial({ roughness: 0.55, flatShading: true }),
    floretStalk: new THREE.MeshStandardMaterial({ roughness: 0.6, flatShading: true }),
    // Brassica leaves are waxy: a little shine.
    leaf: new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.5, flatShading: true }),
    midrib: new THREE.MeshStandardMaterial({ roughness: 0.55, flatShading: true }),
    seedLeaf: new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.6, flatShading: true }),
    // White, so each bud's and flower's own colour comes through per instance.
    bud: new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.7, flatShading: true }),
    // A floret's core is a smooth dome, open below: its inside shows from underneath.
    core: new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.75, side: THREE.DoubleSide }),
    flower: new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.55 }),
    soil: new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true }),
    clod: new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.95, flatShading: true }),
    ground: new THREE.MeshStandardMaterial({ roughness: 1 }),
};

/** The spec's colours onto the shared materials, so a rebuilt spec shows its own. */
function paintMaterials() {
    const { colors } = BROCCOLI;
    MATERIALS.stalk.color.set(colors.stalk);
    MATERIALS.floretStalk.color.set(colors.floretStalk);
    MATERIALS.midrib.color.set(colors.midrib);
    MATERIALS.ground.color.set(colors.ground);
}

/** A low mound of dug soil: a slightly domed, clumpy top, a rounded shoulder down to a wider foot, clods and pebbles, a dark floor. */
function buildSoil3D(rand) {
    const { soil, colors } = BROCCOLI;
    const topRadius = soil.radius;
    const footRadius = soil.radius * soil.foot;
    const topHeight = r => soil.crown * (1 - (r / topRadius) ** 2);
    // From the foot up over the shoulder and in across the top to the middle: in this order the lathe's faces look outwards.
    const profile = [];
    for (let $_ = 0; $_ < SOIL_SHOULDER_RINGS; $_++) {
        const { radius, height } = soilRing($_ / SOIL_SHOULDER_RINGS);
        profile.push(new THREE.Vector2(radius, height));
    }
    for (let $_ = SOIL_TOP_RINGS; $_ >= 0; $_--) {
        const r = topRadius * $_ / SOIL_TOP_RINGS;
        profile.push(new THREE.Vector2(r, topHeight(r)));
    }
    const mound = new THREE.LatheGeometry(profile, 40);
    const position = mound.attributes.position;
    const shades = new Float32Array(position.count * 3);
    const [top, side, foot] = [colors.soilTop, colors.soil, colors.soilDark].map(hex => new THREE.Color(hex));
    const phases = Array.from({ length: 8 }, () => rand() * TAU);
    // Seeded, smooth unevenness over the ground (0–1): three crossing waves. It depends only on where a vertex is, so the
    // vertices where the lathe closes, and those at its middle, always agree.
    const unevenness = (x, z, [a, b, c]) =>
        0.5 + (Math.sin(19 * x + 7 * z + phases[a]) + Math.sin(23 * z - 11 * x + phases[b]) + Math.sin(29 * x - 17 * z + phases[c])) / 6;
    for (let index = 0; index < position.count; index++) {
        const [x, y, z] = [position.getX(index), position.getY(index), position.getZ(index)];
        const r = Math.hypot(x, z);
        const angle = Math.atan2(z, x);
        // An uneven outline: whole waves round the mound, so the lathe's seam never shows.
        const outline = 1 + 0.05 * Math.sin(3 * angle + phases[0]) + 0.03 * Math.sin(7 * angle + phases[1]);
        const onTop = r <= topRadius + 1e-6;
        // A clumpy top, though not right round the stalk.
        const bump = onTop ? soil.bumps * (2 * unevenness(x, z, [2, 3, 4]) - 1) * clamp01(r / (topRadius * 0.25)) : 0;
        position.setXYZ(index, x * outline, y + bump, z * outline);
        const shade = onTop
            ? tint.copy(top).lerp(side, unevenness(x, z, [5, 6, 7]) * soil.mottle)
            : tint.copy(side).lerp(foot, (r - topRadius) / Math.max(1e-6, footRadius - topRadius));
        shade.toArray(shades, index * 3);
    }
    mound.setAttribute('color', new THREE.BufferAttribute(shades, 3));
    mound.computeVertexNormals();
    const moundMesh = new THREE.Mesh(mound, MATERIALS.soil);

    const count = soil.clods + soil.pebbles;
    const clods = exactlyInstanced(clodGeometry, MATERIALS.clod, count);
    for (let index = 0; index < count; index++) {
        const pebble = index >= soil.clods;
        const angle = rand() * TAU;
        const reach = (0.12 + Math.sqrt(rand()) * 0.8) * topRadius;
        const [least, extra] = pebble ? soil.pebbleSize : soil.clodSize;
        const size = least + rand() * extra;
        dummy.position.set(Math.cos(angle) * reach, topHeight(reach) + size * 0.2, Math.sin(angle) * reach);
        dummy.rotation.set(rand() * TAU, rand() * TAU, rand() * TAU);
        dummy.scale.set(size, size * (0.5 + rand() * 0.3), size);
        dummy.updateMatrix();
        clods.setMatrixAt(index, dummy.matrix);
        clods.setColorAt(index, tint.set(pick(rand, pebble ? colors.pebbles : colors.clods)));
    }
    dummy.rotation.set(0, 0, 0);

    const ground = new THREE.Mesh(new THREE.CircleGeometry(soil.ground, 48), MATERIALS.ground);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -soil.depth;
    const group = new THREE.Group();
    group.add(moundMesh, clods, ground);
    return { group, dispose: () => [mound, ground.geometry, clods].forEach($_ => $_.dispose()) };
}

/** The stalk as a tube: a ring of vertices at every point of its curve, rewritten as it grows, and a rounded cap on top. */
function makeTubeGeometry() {
    const rings = STALK_STEPS + 1;
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array((rings * TUBE_SIDES + 1) * 3), 3));
    const index = [];
    for (let ring = 0; ring < STALK_STEPS; ring++) {
        for (let $_ = 0; $_ < TUBE_SIDES; $_++) {
            const a = ring * TUBE_SIDES + $_;
            const b = ring * TUBE_SIDES + ($_ + 1) % TUBE_SIDES;
            index.push(a, a + TUBE_SIDES, b + TUBE_SIDES, a, b + TUBE_SIDES, b);
        }
    }
    const cap = rings * TUBE_SIDES;
    const top = STALK_STEPS * TUBE_SIDES;
    for (let $_ = 0; $_ < TUBE_SIDES; $_++) index.push(cap, top + ($_ + 1) % TUBE_SIDES, top + $_);
    geometry.setIndex(index);
    return geometry;
}

/** The stalk's curve lies in the upright plane at `azimuth`: h runs along (cos, 0, sin) of it. */
function updateTube(geometry, curve, azimuth) {
    const position = geometry.attributes.position;
    const [cosB, sinB] = [Math.cos(azimuth), Math.sin(azimuth)];
    curve.forEach((point, ring) => {
        const [sinA, cosA] = [Math.sin(point.angle), Math.cos(point.angle)];
        for (let $_ = 0; $_ < TUBE_SIDES; $_++) {
            const around = $_ / TUBE_SIDES * TAU;
            const [c, s] = [Math.cos(around) * point.radius, Math.sin(around) * point.radius];
            // c along the curve's normal in its plane, s across the plane.
            position.setXYZ(ring * TUBE_SIDES + $_,
                point.h * cosB + c * cosA * cosB - s * sinB,
                point.y - c * sinA,
                point.h * sinB + c * cosA * sinB + s * cosB);
        }
    });
    const top = curve[STALK_STEPS];
    const tip = top.radius * 0.5;
    position.setXYZ(curve.length * TUBE_SIDES,
        (top.h + Math.sin(top.angle) * tip) * cosB,
        top.y + Math.cos(top.angle) * tip,
        (top.h + Math.sin(top.angle) * tip) * sinB);
    position.needsUpdate = true;
}

/** All true leaves in one mesh: a grid per blade (rows along the midrib, columns across), rewritten as the leaves grow. */
function makeLeafGeometry(count) {
    const bladeFrom = Math.round(BROCCOLI.leaves.petiole * LEAF_STEPS);
    const rows = LEAF_STEPS - bladeFrom + 1;
    const columns = LEAF_COLUMNS.length;
    const perLeaf = rows * columns;
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * perLeaf * 3), 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(count * perLeaf * 3), 3));
    const index = [];
    for (let leaf = 0; leaf < count; leaf++) {
        for (let row = 0; row < rows - 1; row++) {
            for (let column = 0; column < columns - 1; column++) {
                const a = leaf * perLeaf + row * columns + column;
                index.push(a, a + 1, a + columns + 1, a, a + columns + 1, a + columns);
            }
        }
    }
    geometry.setIndex(index);
    return { geometry, bladeFrom, rows, perLeaf };
}

function updateLeaves3D(scene3D, leaves, curve, stalkNow, azimuth, growth) {
    const { leaves: spec, colors } = BROCCOLI;
    const { geometry, bladeFrom, rows, perLeaf } = scene3D.leafGeometry;
    const position = geometry.attributes.position;
    const color = geometry.attributes.color;
    const columns = LEAF_COLUMNS.length;
    const [cosB, sinB] = [Math.cos(azimuth), Math.sin(azimuth)];
    const blade = new THREE.Color();
    const rib = new THREE.Color();
    const pieces = [];
    leaves.forEach((leaf, leafIndex) => {
        const leafNow = leafAt(leaf, growth);
        const node = leafNode(curve, stalkNow, leaf);
        // The leaf's own upright plane: `out` from the stalk; `across` it runs level with the ground.
        const [outX, outZ] = [Math.cos(leaf.azimuth), Math.sin(leaf.azimuth)];
        const baseX = node.h * cosB + outX * node.radius * 0.8;
        const baseZ = node.h * sinB + outZ * node.radius * 0.8;
        const points = leafMidrib(leafNow, node.y);
        const at = point => new THREE.Vector3(baseX + outX * point.out, node.y + point.up, baseZ + outZ * point.out);
        blade.set(colors.leafYoung).lerp(tint.set(leaf.color), leafNow.maturity).lerp(tint.set(colors.leafOld), leafNow.age);
        rib.set(colors.midrib).lerp(blade, 0.25);
        for (let row = 0; row < rows; row++) {
            const point = points[bladeFrom + row];
            const { width, wave } = bladeAt(leaf, leafNow, point.u);
            // Where the blade has come down onto the soil it lies flat on it: no fold, no wave.
            const standing = smooth(phase(node.y + point.up, [spec.floor, spec.floor + spec.settle]));
            const fold = leafNow.fold * standing;
            const [flat, raised] = [Math.cos(fold), Math.sin(fold)];
            // The blade's face, square to the midrib within the leaf's plane.
            const [faceOut, faceUp] = [-Math.cos(point.angle), Math.sin(point.angle)];
            LEAF_COLUMNS.forEach((v, column) => {
                const sideways = v * width * flat;
                const lift = Math.pow(Math.abs(v), 1.5) * width * raised + wave * standing * v * v;
                const out = point.out + faceOut * lift;
                const vertex = leafIndex * perLeaf + row * columns + column;
                position.setXYZ(vertex, baseX + outX * out - outZ * sideways, node.y + point.up + faceUp * lift, baseZ + outZ * out + outX * sideways);
                const shade = v === 0 ? rib : tint.copy(blade).multiplyScalar(COLUMN_SHADE[column]);
                color.setXYZ(vertex, shade.r, shade.g, shade.b);
            });
        }
        // The petiole and midrib as round stems, thick at the stalk and tapering.
        for (let piece = 0; piece < MIDRIB_PIECES; piece++) {
            const from = points[Math.round(piece / MIDRIB_PIECES * LEAF_STEPS * MIDRIB_REACH)];
            const to = points[Math.round((piece + 1) / MIDRIB_PIECES * LEAF_STEPS * MIDRIB_REACH)];
            const start = at(from);
            const direction = at(to).sub(start);
            const length = direction.length();
            pieces.push(makeBranch3D(start, direction.normalize(), length, spec.midrib * leafNow.length * (1 - 0.75 * from.u), 0, 0));
        }
    });
    position.needsUpdate = true;
    color.needsUpdate = true;
    placeBranches3D(scene3D.midribMesh, pieces, branch => (branch.length > 0 ? 1 : 0), branch => branch.width);
}

function updateSeedLeaves3D(mesh, curve, stalkNow, azimuth, growth) {
    const { seedLeaves, stalk, colors } = BROCCOLI;
    const seed = seedLeavesAt(growth, stalkNow);
    const node = alongStalk(curve, stalkNow, stalk.seedlingHeight);
    const [cosB, sinB] = [Math.cos(azimuth), Math.sin(azimuth)];
    const across = new THREE.Vector3(-sinB, 0, cosB);
    const size = Math.max(seed.size, 0.00001);
    const basis = new THREE.Matrix4();
    // Both open in the stalk's plane, one to each side; while the seedling is hooked they hang down with it.
    [-1, 1].forEach((sign, index) => {
        const angle = node.angle + sign * seed.open;
        const along = new THREE.Vector3(Math.sin(angle) * cosB, Math.cos(angle), Math.sin(angle) * sinB);
        basis.makeBasis(along, new THREE.Vector3().crossVectors(across, along), across);
        dummy.quaternion.setFromRotationMatrix(basis);
        dummy.position.set(node.h * cosB, node.y, node.h * sinB);
        dummy.scale.set(seedLeaves.length * size, seedLeaves.length * size, seedLeaves.width * size);
        dummy.updateMatrix();
        mesh.setMatrixAt(index, dummy.matrix);
    });
    dummy.quaternion.identity();
    mesh.instanceMatrix.needsUpdate = true;
    MATERIALS.seedLeaf.color.set(colors.seedLeaf).lerp(tint.set(colors.seedLeafOld), seed.wither);
}

/** The head's group sits on the stalk's top, turned with it and scaled to the head's size; inside it, head space is used as it is. */
function updateHead3D(scene3D, head, curve, azimuth, growth) {
    const headNow = headAt(growth);
    const spec = BROCCOLI.head;
    const { headGroup, floretMesh, bodyMesh, budMesh, flowerMesh, pedicelMesh } = scene3D;
    headGroup.visible = headNow.scale > 0.0005;
    if (!headGroup.visible) return;
    const top = curve[STALK_STEPS];
    const [cosB, sinB] = [Math.cos(azimuth), Math.sin(azimuth)];
    headGroup.position.set(top.h * cosB, top.y, top.h * sinB);
    headGroup.quaternion.setFromUnitVectors(UP, new THREE.Vector3(Math.sin(top.angle) * cosB, Math.cos(top.angle), Math.sin(top.angle) * sinB));
    headGroup.scale.setScalar(headNow.scale);
    layoutHead(head, headNow);

    const stalks = head.stalked.map(floret => {
        const direction = floret.end.clone().sub(floret.start);
        const length = direction.length();
        return makeBranch3D(floret.start, direction.normalize(), length, floret.radius * spec.stalkWidth, floret.level, 0);
    });
    placeBranches3D(floretMesh, stalks, () => 1, branch => branch.width);

    // Each floret's solid core, a dome open below where its stalks come in: the head reads as packed domes.
    head.stalked.forEach((floret, index) => {
        dummy.position.copy(floret.now);
        dummy.quaternion.copy(floret.coreTurn);
        dummy.scale.setScalar(floret.core);
        dummy.updateMatrix();
        bodyMesh.setMatrixAt(index, dummy.matrix);
        bodyMesh.setColorAt(index, tint.copy(floret.youngColor).lerp(floret.ripeColor, headNow.ripen));
    });
    dummy.quaternion.identity();
    bodyMesh.instanceMatrix.needsUpdate = true;
    if (bodyMesh.instanceColor) bodyMesh.instanceColor.needsUpdate = true;

    head.buds.forEach((bud, index) => {
        let size = bud.radius * headNow.budSwell;
        tint.copy(bud.youngColor).lerp(bud.ripeColor, headNow.ripen);
        if (bud.flower) {
            const { yellow, open } = flowerAt(bud.flower, growth);
            tint.lerp(bud.boltColor, yellow);
            size *= 1 - 0.35 * open;
        }
        dummy.position.copy(bud.now);
        dummy.scale.setScalar(size);
        dummy.updateMatrix();
        budMesh.setMatrixAt(index, dummy.matrix);
        budMesh.setColorAt(index, tint);
    });
    budMesh.instanceMatrix.needsUpdate = true;
    if (budMesh.instanceColor) budMesh.instanceColor.needsUpdate = true;

    // Each flower stands out from its bud on its own stalk, which lengthens as it opens.
    const pedicels = head.flowers.map((bud, index) => {
        const { open } = flowerAt(bud.flower, growth);
        const reach = bud.radius + spec.flowerLift * open;
        dummy.position.copy(bud.now).addScaledVector(bud.normal, reach);
        dummy.quaternion.copy(bud.flower.quaternion);
        dummy.scale.setScalar(Math.max(open, 0.00001) * spec.flowerSize * bud.flower.size);
        dummy.updateMatrix();
        flowerMesh.setMatrixAt(index, dummy.matrix);
        return { ...makeBranch3D(bud.now, bud.normal, reach, bud.radius * spec.pedicel, 0, 0), open };
    });
    dummy.quaternion.identity();
    flowerMesh.instanceMatrix.needsUpdate = true;
    placeBranches3D(pedicelMesh, pedicels, pedicel => (pedicel.open > 0 ? 1 : 0), pedicel => pedicel.width);
}

class BroccoliView extends PlantView {
    constructor() {
        super('broccoli', BROCCOLI.look.stage);
        this.spec = BROCCOLI;
        this.scene3D = null;
    }

    build() {
        const rand2D = mulberry32(this.spec.seed);
        const head2D = buildHead(rand2D);
        this.plant2D = {
            // The 2D plant is drawn as it is or mirrored.
            mirror: rand2D() < 0.5 ? -1 : 1,
            leaves: buildLeaves(rand2D),
            head: head2D,
            head2D: prepareHead2D(head2D),
            soil: buildSoil2D(rand2D),
        };
        const rand3D = mulberry32(this.spec.seed + 1000);
        this.plant3D = { azimuth: rand3D() * TAU, leaves: buildLeaves(rand3D), head: buildHead(rand3D) };
        this.buildScene3D(mulberry32(this.spec.seed + 2000));
    }

    buildScene3D(rand) {
        if (this.scene3D) {
            this.stage.scene.remove(this.scene3D.group);
            this.scene3D.dispose();
        }
        const { leaves, head } = this.plant3D;
        const { colors, look, head: headSpec } = this.spec;
        paintMaterials();

        const tube = makeTubeGeometry();
        const stalkMesh = new THREE.Mesh(tube, MATERIALS.stalk);
        const leafGeometry = makeLeafGeometry(leaves.length);
        const leafMesh = new THREE.Mesh(leafGeometry.geometry, MATERIALS.leaf);
        // Both are rewritten as the plant grows, so their first bounds would cull them wrongly.
        stalkMesh.frustumCulled = false;
        leafMesh.frustumCulled = false;
        const midribMesh = exactlyInstanced(midribGeometry, MATERIALS.midrib, leaves.length * MIDRIB_PIECES);
        const seedLeafGeometry = makeSeedLeafGeometry();
        const seedLeafMesh = instanced(seedLeafGeometry, MATERIALS.seedLeaf, 2);
        const floretStalkGeometry = unitStem(headSpec.stalkTaper, 6);
        const floretMesh = exactlyInstanced(floretStalkGeometry, MATERIALS.floretStalk, head.stalked.length);
        const coreGeometry = makeCoreGeometry();
        const bodyMesh = exactlyInstanced(coreGeometry, MATERIALS.core, head.stalked.length);
        const budMesh = exactlyInstanced(budGeometry, MATERIALS.bud, head.buds.length);
        const flowerGeometry = makeFlowerGeometry();
        const flowerMesh = exactlyInstanced(flowerGeometry, MATERIALS.flower, head.flowers.length);
        const pedicelMesh = exactlyInstanced(pedicelGeometry, MATERIALS.floretStalk, head.flowers.length);

        // Bud and core colours only ever mix between these, with the light of the creases baked in; cores sit deeper, so darker.
        const bolting = new THREE.Color(colors.budBolting);
        head.stalked.forEach((floret, index) => {
            floret.youngColor = new THREE.Color(colors.budYoung).multiplyScalar(floret.light * look.coreShade);
            floret.ripeColor = new THREE.Color(floret.color).multiplyScalar(floret.light * look.coreShade);
            bodyMesh.setColorAt(index, floret.youngColor);
        });
        head.buds.forEach((bud, index) => {
            bud.youngColor = new THREE.Color(colors.budYoung).multiplyScalar(bud.light);
            bud.ripeColor = new THREE.Color(bud.color).multiplyScalar(bud.light);
            bud.boltColor = bolting.clone().multiplyScalar(lerp(0.6, 1, bud.light));
            budMesh.setColorAt(index, bud.youngColor);
        });
        // A flower faces partly up, each turned its own way.
        head.flowers.forEach((bud, index) => {
            bud.flower.quaternion = new THREE.Quaternion().setFromUnitVectors(UP, bud.flower.facing)
                .multiply(new THREE.Quaternion().setFromAxisAngle(UP, bud.flower.turn));
            flowerMesh.setColorAt(index, tint.set(bud.flower.color));
        });

        const headGroup = new THREE.Group();
        headGroup.add(floretMesh, bodyMesh, budMesh, pedicelMesh, flowerMesh);
        const soil = buildSoil3D(rand);
        const group = new THREE.Group();
        group.add(soil.group, stalkMesh, leafMesh, midribMesh, seedLeafMesh, headGroup);
        this.stage.scene.add(group);
        this.scene3D = {
            group, stalkMesh, leafGeometry, midribMesh, seedLeafMesh, headGroup, floretMesh, bodyMesh, budMesh, flowerMesh, pedicelMesh,
            dispose: () => {
                [tube, leafGeometry.geometry, seedLeafGeometry, floretStalkGeometry, coreGeometry, flowerGeometry,
                    midribMesh, seedLeafMesh, floretMesh, bodyMesh, budMesh, flowerMesh, pedicelMesh].forEach($_ => $_.dispose());
                soil.dispose();
            },
        };
    }

    draw2D(growth) {
        drawBroccoli2D(this.view2D, this.plant2D, growth);
    }

    update3D(growth) {
        const { leaves, head, azimuth } = this.plant3D;
        const stalkNow = stalkAt(growth);
        const curve = stalkCurve(stalkNow);
        this.scene3D.stalkMesh.visible = stalkNow.height > 0.0005;
        updateTube(this.scene3D.stalkMesh.geometry, curve, azimuth);
        updateSeedLeaves3D(this.scene3D.seedLeafMesh, curve, stalkNow, azimuth, growth);
        updateLeaves3D(this.scene3D, leaves, curve, stalkNow, azimuth, growth);
        updateHead3D(this.scene3D, head, curve, azimuth, growth);
    }

    stageLabel(growth) {
        const { timeline } = this.spec;
        if (growth >= timeline.bolt[0]) return { text: growth >= 1 ? 'Bolting: in flower 🌼' : 'Bolting', tone: 'gold' };
        if (phase(growth, timeline.head) >= timeline.headSeen) return { text: 'Heading', tone: 'green' };
        if (growth >= timeline.sprout[1]) return { text: 'Leafing', tone: 'green' };
        return { text: 'Sprouting', tone: 'green' };
    }

    describe() {
        const counts = plant => `${plant.leaves.length} leaves, ${plant.head.stalked.length} florets, ${plant.head.buds.length} buds, ${plant.head.flowers.length} flowers`;
        return `2D: ${counts(this.plant2D)} · 3D: ${counts(this.plant3D)}`;
    }
}

registerView(new BroccoliView());
}

// ===== mushroom =====
// ═══════════════════════════ Mushroom ═══════════════════════════
// A glowing magic mushroom at night. Glowing threads (mycelium) spread through the soil, knot together, push up a pin, the stem
// stretches while the cap is still a closed egg, the cap opens into a wide translucent dome with glowing gills and spots, smaller
// mushrooms sprout around it, and at fruition it glows its brightest and lets go of drifting spores.
{
    const SPEC = {
        seed: 23,

        // Growth timeline (the slider, 0 → 1)
        myceliumUntil: 0.34,  // the last thread has finished spreading by here
        knotFrom: 0.1,        // threads gather into a glowing knot just under the surface
        pinFrom: 0.17,        // the knot swells into a pin that pushes up
        matureAt: 0.88,       // the main mushroom's cap is fully open by here
        glowFrom: 0.55,       // from here the magic builds: brighter glow, halo, light on the ground
        sporesFrom: 0.8,      // spores drift up from the gills (animated)

        // One mushroom's own life, 0 (pin) → 1 (open cap); every mushroom follows it
        life: {
            formUntil: 0.42,  // the pin swells into a button (the closed egg) by here, pushing up out of the ground
            stalkFrom: 0.14,  // the stem stretches from here…
            stalkUntil: 0.7,  // …to its full length here
            openFrom: 0.5,    // the cap opens from egg to dome over this span
            openUntil: 1,     // …ending as a wide dome
        },

        stem: {
            height: 0.6,      // from the foot to the cap, at full size
            radius: 0.04,     // just under the cap
            taper: 0.35,      // how much wider the stem is low down than at the top
            bulb: 0.07,       // radius of the bulb at the foot
            embed: 0.06,      // how deep the foot sits in the soil
            lean: 0.08,       // sideways offset of the top, as a share of the height
            bow: 0.07,        // how much the stem bows on the way up
            buttonShare: 0.13, // share of the full length the stalk already has as a button
            ringAt: 0.84,     // where the ring (the torn veil) hangs, as a share of the length
            ringFlare: 1.9,   // how far the ring's skirt flares, times the stem radius
            ringLength: 0.055, // how far the skirt hangs down
        },
        cap: {
            radius: 0.31,     // dome radius when fully open
            height: 0.18,     // dome height when fully open
            eggRadius: 0.085, // the closed cap (egg) at full button size…
            eggHeight: 0.115, // …and its height
            eggCurl: 2.45,    // radians from the crown to the margin while closed: past 90° the margin tucks in under
            openCurl: 1.72,   // the same once open: a little past 90°, so the margin turns down
            wave: 0.035,      // wavy margin, as a share of the radius
            waves: 7,         // lobes around the margin
            tilt: 0.45,       // how much the cap follows the lean of the stem
            spots: 28,        // glowing veil remnants on the main cap (companions get fewer)
            spotSize: 0.024,  // spot radius on the main cap

            striae: 48,       // fine grooves round the margin of the open cap (none on the crown or the egg)
        },
        companions: {
            count: 4,               // smaller mushrooms round the main one
            distance: [0.2, 0.42],  // from the main stem
            size: [0.34, 0.6],      // times the main mushroom
            from: [0.3, 0.72],      // growth at which each one pins
            duration: [0.32, 0.5],  // growth one needs to open fully: the late ones are still buttons at the end
            spotShare: 0.5,         // their spots, as a share of the main cap's
            slots2D: [0.24, 0.47],  // 2D: how far left or right of the main stem they stand, nearest to furthest
            recede2D: 0.45,         // 2D: how much smaller the furthest back looks
        },
        mycelium: {
            strands: 16,      // threads leaving the spore
            forks: 2,         // threads at every fork
            levels: 5,        // generations from strand to finest thread
            maxThreads: 1500, // per view: a spec asking for more loses its finest generation evenly
            length: 0.13,     // length of a strand's first stretch
            lengthDecay: 0.8, // each generation this much shorter…
            width: 0.0055,    // …starting this wide…
            widthDecay: 0.65, // …and this much thinner each generation
            spread: 0.6,      // radians a fork turns away
            outward: 0.3,     // pull towards growing straight away from the centre
            dip: [0.05, 0.85], // 2D: radians below the horizontal a strand leaves at: they spread through the topsoil
            layer: 0.6,       // 2D: share of the cut's depth the threads stay in; deeper, they turn back and give up early
            links: 0.3,       // share of the finest tips that fuse with a neighbour, knitting the threads into a web
            linkReach: 0.07,  // how far a tip looks for a neighbour to fuse with
            kinks: 3,         // 3D: pieces per thread, each turning a little, so threads wander like the 2D ones
            kink: 0.25,       // 3D: radians each piece turns at most
        },
        ground: {
            radius: 0.5,      // reach of the low mound the mushroom stands on
            height: 0.05,     // mound height above the forest floor
            bumps: 0.012,     // unevenness of the surface
            moss: 150,        // moss cushions (3D)
            moss2D: 110,      // moss cushions on the floor behind the 2D cut…
            clumps2D: 10,     // …gathered round this many clumps…
            edgeMoss2D: 70,   // …and tufts along the cut's edge
            grass2D: 40,      // 2D: blades of grass and fallen needles among the moss
            pebbles: 14,      // on the floor and in the cut
            twigs: 7,         // fallen twigs on the floor
            grit: 320,        // 2D: grains in the cut
            roots: 4,         // 2D: old roots of trees out of sight, crossing the cut
            depth: 0.34,      // 2D: how deep the cut through the soil shows
            far: 0.16,        // 2D: how far the ground behind the cut rises on screen
            reach3D: 2.8,     // 3D: radius of the floor, which fades into the fog
            mossLift3D: 1.6,  // 3D: moss is drawn this much lighter than its colours, so it reads under the dim night light
        },
        spores: {
            count: 260,       // spores in the air at fruition
            size: [0.01, 0.028], // how big a spore's glow looks: 2D, 3D
            life: [4, 9],     // seconds a spore lives
            rise: 0.055,      // upward drift per second
            swirl: 0.05,      // radius of the slow spiral
        },
        glow: {
            capOpacity: [0.93, 0.74], // the cap turns more see-through as the magic builds
            cap: [0.25, 0.5],         // emissive strength from pin to fruition
            gills: [0.25, 1.3],       // …of the gills, scaled by how far the cap has opened
            stem: [0.25, 0.6],        // …of the stem, strongest just under the cap
            spots: [0.5, 1.05],       // …of the spots
            mycelium: [0.7, 1.3],     // …of the threads
            rim: [0.25, 0.55],        // edge glow: the ghostly outline
            ring: [0.04, 0.2],        // the ring: a pale membrane catching the gill light, not a lamp
            veil: 0.35,               // 3D: the closed egg's own pale glow, gone once the cap is open
            pool: 0.35,               // light the caps throw on the ground round their feet
            halo: 0.85,               // halo strength at fruition
            pulse: 0.1,               // how much the glow breathes at fruition…
            breathSpeed: 1.4,         // …and how fast (radians per second)
            waves: 0.75,              // light pulsing inwards along the threads at fruition…
            waveSpeed: 0.28,          // …in reaches of the threads per second
            // spread: how much each blur size adds, finest to widest; the widest ones would grey the whole night over.
            bloom: { strength: [0.45, 0.6], radius: 0, threshold: 0.4, spread: [1, 0.85, 0.5, 0.16, 0.03] },
            bloom2D: [0.012, 0.045],  // 2D: the two blur radii of the bloom, in scene units
            underside2D: 0.2,         // 2D: how much of the gills the side view shows from slightly below
        },
        view: {
            frame2D: { across: 1.62, up: 1.36, base: 0.36 },  // 2D: scene units that must fit across and up, soil shown below the foot
            target: [0, 0.38, 0],                             // 3D: where the camera looks…
            cameraAt: [0, 0.36, 1.95],                        // …and where it starts: low, so the glowing gills show
            fog: [2.4, 4.6],                                  // 3D: the floor fades into the night between these distances
        },
        colors: {
            night: '#04060d',          // the night sky overhead (both views)…
            nightLow: '#0a1530',       // …and just above the ground
            mist: '#2b5cb0',           // 2D: low mist over the floor
            soil: ['#261b22', '#0d090d'],  // the cut through the soil: top and deep
            humus: '#08060a',          // 2D: the dark band along the cut's top edge…
            edgeLight: '#7896c8',      // …and the faint moonlit line on it
            grit: '#96828c',           // 2D: light grains in the soil
            roots: '#5a4a52',          // 2D: old roots in the cut
            floor: '#10141d',          // the forest floor away from the mound (2D)
            floor3D: '#1a2532',        // …and in 3D, a little lighter so it reads under the night light
            soil3D: '#2c2630',         // 3D: bare soil round the foot
            moss: ['#1b3834', '#21443a', '#15302d', '#1f3b44'],
            grass: '#2a4a40',          // 2D: blades of grass and needles
            pebble: '#39404f',
            pebbleLight: '#aab9d7',    // 2D: the moonlit side of a pebble
            twig: '#2a2124',
            shadow: '#020308',         // 2D: the dark patch where a companion stands
            mycelium: '#6fe8ff',
            veil: '#d9ecff',           // the closed egg and the ring
            stem: '#c4dcff',
            stemGlow: '#4a9dff',
            stemDark: '#0a1020',       // 3D: the stem's glow low down, away from the gills
            crown: '#4b38d8',          // cap: violet-blue at the crown…
            cap: '#2f6bff',            // …blue…
            margin: '#7fdcff',         // …and cyan at the thin margin
            rim: '#8eeaff',            // the ghostly edge glow
            gills: '#16306a',          // gills: dark between…
            gillGlow: '#79f2ff',       // …glowing edges
            spots: '#d2f7ff',
            spores: '#a6f4ff',
            halo: '#3b86ff',
            light: '#58a8ff',          // the light the caps throw on the ground
        },
    };

    // ─── Shared math: the same numbers drive the 2D drawing and the 3D model ───

    const lerp = (from, to, t) => from + (to - from) * t;
    const between = (range, t) => lerp(range[0], range[1], t);
    const window01 = (value, from, until) => clamp01((value - from) / Math.max(1e-6, until - from));

    /** Smooth value noise along a line, seeded: the soil surface and anything else that wobbles. */
    function noise1D(seed) {
        const rand = mulberry32(seed);
        const lattice = Array.from({ length: 256 }, () => rand() * 2 - 1);
        return x => {
            const cell = Math.floor(x);
            const t = smooth(x - cell);
            return lerp(lattice[cell & 255], lattice[(cell + 1) & 255], t);
        };
    }

    /** The same over a plane: the 3D ground. */
    function noise2D(seed) {
        const rand = mulberry32(seed);
        const lattice = Array.from({ length: 256 * 256 }, () => rand() * 2 - 1);
        const at = (ix, iz) => lattice[(ix & 255) * 256 + (iz & 255)];
        return (x, z) => {
            const ix = Math.floor(x);
            const iz = Math.floor(z);
            const tx = smooth(x - ix);
            const tz = smooth(z - iz);
            return lerp(lerp(at(ix, iz), at(ix + 1, iz), tx), lerp(at(ix, iz + 1), at(ix + 1, iz + 1), tx), tz);
        };
    }
