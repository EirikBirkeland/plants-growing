        spread: 0.5,                // radians a branch turns away from its parent further out
        fanReach: 0.2,              // 3D: near the trunk a fork stands upright (one child rises); this far out it fans out sideways
        forkTwist: 0.6,             // 3D: a fork's plane, and each main limb's place round the trunk, vary by up to this in all (radians)
        arch: 0.09,                 // per generation, how far branches are pulled out towards the horizontal…
        archReach: 0.15,            // …fully so this far from the trunk; nearer the middle they keep rising and fill the top
        droopLimit: 0.3,            // radians that pull may take a twig below the horizontal
        crown: {                    // the dome every branch ends inside:
            radius: 0.5,            // how far out from the trunk (the branchlets' arcs carry the curtain about 0.12 further)…
            height: 1,              // …how high over the ground…
            shoulder: 0.45,         // …and how high its widest point is
            steer: 1.1,             // a branch that would grow out of it turns down, to at most this far (radians) below the level…
            shortest: 0.4,          // …and if still out, is cut back to the dome, keeping at least this share of its length
        },
        bend: 0.14,                 // how much a 2D branch bows
        skeletonEnd: 0.45,          // the last twig has finished growing by about here
        thickness: {
            start: 0.16,            // the sapling's stem, as a share of the grown trunk's width…
            fullAt: 0.85,           // …which it reaches by this growth
        },
        flare: {                    // root flare at the foot of the trunk:
            height: 0.05,           // how high…
            spread: 1.9,            // …how many trunk widths across at the lawn…
            curve: 2.5,             // …3D: how sharply it swells out near the lawn (higher hugs the trunk longer)
        },
        // ─ Hanging branchlets: the curtain ─
        strands: {
            fromLevel: 2,           // generations that carry the long branchlets; the ones below only grow a few short shoots
            perLength2D: 30,        // branchlets per unit of branch length in the side view…
            perLength3D: 46,        // …and in 3D…
            innerShare3D: 0.4,      // …where branches right by the trunk keep only this share of them…
            innerReach3D: 0.4,      // …rising to all of them this far out: the curtain is a shell round the crown, not a column
            attach: [0.25, 1],      // where along its branch a long branchlet hangs (share of the branch's length)…
            perTip: 3,              // …plus this many at every twig's tip…
            tipAttach: [0.9, 1],    // …this close to it
            juvenilePerLength: 14,  // short early shoots per unit of trunk and main limb; they leaf out at once…
            juvenileFromTrunk: 0.4, // …on the trunk only this far up it (share of its length)…
            juvenileFromLimb: 0.3,  // …on a main limb from here on
            juvenileDrop: [0.1, 0.22],  // how far those hang
            juvenileDelay: 0.005,   // growth between a shoot's spot on the stem growing and the shoot sprouting, at most
            juvenileGrowTime: 0.06, // growth an early shoot takes to reach its length
            juvenileSetOff: [0.7, 1.1], // radians an early shoot turns off its stem: they stand out sideways…
            juvenileLift: 0.1,      // …and hardly rise
            setOff: [0.15, 0.6],    // radians a long branchlet turns off its branch as it sets off, any way round…
            lift: 0.55,             // …then how steeply it rises: 0 not at all, 1 straight up
            bendLength: [0.03, 0.06],   // arc length over which a branchlet turns from setting off to hanging straight down
            lean: 0.05,             // radians, either way, a hanging branchlet may lean off the plumb line
            hem: 0.03,              // the longest branchlets end this high above the ground…
            hemJitter: 0.1,         // …give or take this much
            shortShare: 0.2,        // share that stops higher up, for a layered fringe instead of a cut edge…
            shortStop: [0.35, 0.75],    // …somewhere this far (share) of the way from where it hangs down to the hem
            maxLength: 1.1,         // no branchlet is longer than this
            window: { halfWidth: 0.1, hem: 0.2 },   // 2D: in front of the trunk the curtain stops higher, so the trunk shows
            width: 0.0035,          // thickness where it leaves its branch…
            taper: 0.5,             // …3D: thinning to this share of it at the tip
            farWidth2D: 0.7,        // 2D: the back layer is drawn this much thinner than the front one…
            thinnest2D: 0.9,        // …but no line thinner than this (pixels)
            delay: [0.01, 0.08],    // growth between a branchlet's spot on its branch growing and the branchlet sprouting
            growTime: 0.42,         // growth a branchlet takes to reach its full length (a late one hurries, to be full by 1)
        },
        leaves: {
            spacing: 0.012,         // arc length between leaves along a branchlet…
            spacing2D: 0.014,       // …in the side view, which paints every leaf one by one (fewer draw faster)
            length: 0.034,          // a slender lance…
            width: 0.0052,          // …this wide…
            widest: 0.4,            // …at this share of its length
            angle: 0.3,             // radians a leaf points away from its branchlet…
            hang: 0.3,              // …before its weight turns it this share of the way towards straight down
            twist: 1.2,             // 3D: radians a leaf may turn about its midrib; it faces out of the curtain give or take this
            fold: 0.5,              // 3D: how far its two halves fold back along the midrib (in half-widths)
            firstFlush: 0.65,       // share of leaves that open right behind the growing tip…
            lag: 0.01,              // …this much growth after it passes; the rest fill in later…
            to: 0.95,               // …until the curtain is full by here
            unfold: 0.05,           // growth one leaf takes to open
            mature: 0.22,           // growth over which a leaf turns from fresh yellow-green to green (a late one hurries)
        },
        sway: {                     // 3D only: a breeze in the curtain
            amplitude: 0.04,        // swing per unit of hang, squared
            speed: 0.9,             // radians per second
            ripple: [3.7, 2.9],     // waves per unit across the crown (x, z), so neighbours swing a little out of step
            cross: 0.55,            // the swing across the wind, as a share of the swing along it
            gust: 0.21,             // how fast the breeze comes and goes (radians per second)…
            lull: 0.2,              // …dropping to this share of its swing between gusts
        },
        // ─ The ground: a round slab of lawn with a pond at its edge ─
        ground: {
            radius: 0.7,            // the lawn slab, wider than the curtain
            depth: 0.045,           // the slab's soil edge
            squash: 0.12,           // 2D: how flat the lawn's ellipse is in the side view
            pond: {
                angle: 0.55,        // its centre: the angle round the trunk…
                distance: 0.47,     // …and how far out
                rx: 0.19,           // its radii
                rz: 0.13,
                bank: 0.02,         // the muddy rim round it
                margin: 0.02,       // no grass this close to it
            },
            tufts2D: 150,           // grass tufts in the side view (three blades each)…
            tufts3D: 520,           // …and in 3D
            tuftSpread: 0.015,      // how far a tuft's blades stand apart
            bladeHeight: [0.018, 0.042],    // grass blades, shortest to tallest
            shade: {                // the canopy's shade on the lawn:
                radius: 0.58,       // how far it reaches…
                darkness: 0.4,      // …how dark in the middle…
                falloff: { at: 0.6, keep: 0.7 },    // …still `keep` as dark `at` this share of the radius, then fading out
                from: 0.3,          // it deepens from this growth…
                to: 0.95,           // …to here
            },
        },
        frame2D: { across: 1.7, up: 1.26, base: 0.15, headroom: 0.04 },    // scene units the 2D view must show (see framing()),
                                                                            // and at least `headroom` over the crown's top
        stage3D: { target: [0, 0.42, 0], cameraAt: [0, 0.64, 2.2] },   // 3D camera: where it looks and where it starts
        // The colours below are the true ones, lit by the 3D view's lights; the 2D view paints its own light with these.
        sunlit: [1, 1.16, 1.32],                // brightness from the bottom of the curtain to its sunlit top (2D: in bands)
        depthShade2D: [0.5, 0.66, 0.84, 1],     // 2D: brightness of the curtain's depth layers, back to front (any number)
        depthShade3D: [0.85, 1.3],              // 3D: brightness deep inside the curtain and on its outside (a factor on
                                                // linear light: it takes about 1.3 to brighten as much as the 2D's paint)
        bark2D: {                               // 2D: what makes the trunk and limbs look round: a dark band…
            shade: { offset: 0.45, share: 0.5 },    // …`offset` half-widths off the middle towards the shaded lower right, `share` of the width…
            light: { offset: -0.55, share: 0.14 },  // …and a thin lit one on the other side
        },
        stages: [                   // the header's stage label from each growth on
            { from: 0, text: 'Sapling', tone: '' },
            { from: 0.14, text: 'Spreading', tone: '' },
            { from: 0.36, text: 'Weeping', tone: 'green' },
            { from: 0.92, text: 'Full curtain', tone: 'green' },
        ],
        colors: {
            bark: '#5d4e42',        // grey-brown willow bark
            barkDark: '#3f342c',    // 2D: the shaded side of trunk and limbs…
            barkLight: '#7d6a5a',   // …and the lit side
            strand: '#74833a',      // young branchlets: a light olive, so the bare growing tips show
            leafFresh: '#9ccc58',   // a leaf just out
            leaf: ['#3f8a3a', '#357c33', '#4b9645'],   // grown leaves, a few shades
            turf: '#2f4d27',        // the lawn itself
            grass: ['#3f6e31', '#4c8039', '#365f2b'],  // grass tufts
            soil: '#3d2f24',        // the slab's edge
            bank: '#4a3d2d',        // muddy rim of the pond
            water: '#2b5a74',       // the pond
            waterLight: '#80b6d2',  // glints on the water (2D)
            shade: '#000000',       // the canopy's shade on the lawn
        },
    };

    // ─── Timing: everything is a pure function of growth ───

    const lerp = (from, to, t) => from + (to - from) * t;
    const within = (rand, [low, high]) => low + (high - low) * rand();
    /** The inverse of easeOut(): how far through its time a growth is when it has covered `share` of its way. */
    const easeOutInverse = share => 1 - Math.cbrt(1 - clamp01(share));

    /** Reads `list` (values spread evenly from 0 to 1) at `t`, with straight lines in between. */
    function sampleList(list, t) {
        if (list.length === 1) return list[0];
        const at = clamp01(t) * (list.length - 1);
        const index = Math.min(list.length - 2, Math.floor(at));
        return lerp(list[index], list[index + 1], at - index);
    }

    const growDurationOf = spec => spec.skeletonEnd / spec.levels;
    const limbProgress = (branch, growDur, growth) => easeOut(clamp01((growth - branch.birth) / growDur));
    /** The growth at which a growing branch's tip passes `t` of its length (the inverse of limbProgress). */
    const limbReaches = (branch, growDur, t) => branch.birth + growDur * easeOutInverse(t);
    const girthAt = (spec, growth) => lerp(spec.thickness.start, 1, smooth(clamp01(growth / spec.thickness.fullAt)));
    // A branchlet grows like a limb: fast as it sprouts, so the curtain drops soon after its branch, then slowly to its hem.
    const strandLengthAt = (strand, growth) => strand.length * easeOut(clamp01((growth - strand.birth) / strand.growTime));
    const leafOpenAt = (leaf, spec, growth) => smooth(clamp01((growth - leaf.start) / spec.leaves.unfold));
    /** How far a leaf has turned from fresh to grown. A late one turns faster, so every leaf has its grown colour by 1. */
    const leafMaturityAt = (leaf, spec, growth) => smooth(clamp01((growth - leaf.start) / Math.min(spec.leaves.mature, 1 - leaf.start)));
    const shadeAt = (spec, growth) => {
        const { from, to, darkness } = spec.ground.shade;
        return darkness * smooth(clamp01((growth - from) / (to - from)));
    };

    function stageOf(spec, growth) {
        return spec.stages.filter(stage => growth >= stage.from).pop() ?? spec.stages[0];
    }

    // ─── The crown's dome: every branch ends inside it ───

    /** How high the dome reaches `r` from the trunk: nothing beyond its radius, as wide as it gets below its shoulder. */
    function crownTopAt(crown, r) {
        if (r > crown.radius) return -Infinity;
        return crown.shoulder + (crown.height - crown.shoulder) * Math.sqrt(1 - (r / crown.radius) ** 2);
    }

    const insideCrown = (crown, { r, y }) => y <= crownTopAt(crown, r);

    /**
     * Keeps a new branch inside the crown. It rises `rise` radians above the level (below it when negative), and endAt(rise,
     * length) says where it would end, as { r, y }. Returns the steepest rise, down to crown.steer below the level, that keeps
     * its end inside; if even that pokes out, the branch is also cut back to the dome (keeping crown.shortest of its length).
     */
    function fitCrown(crown, rise, length, endAt) {
        const STEPS = 12;
        const lowest = Math.min(rise, -crown.steer);
        for (let step = 0; step <= STEPS; step++) {
            const tried = lerp(rise, lowest, step / STEPS);
            if (insideCrown(crown, endAt(tried, length))) return { rise: tried, length };
        }
        // Halve the gap between a share that fits and one that doesn't.
        let fits = crown.shortest;
        let tooLong = 1;
        for (let $_ = 0; $_ < STEPS; $_++) {
            const share = (fits + tooLong) / 2;
            if (insideCrown(crown, endAt(lowest, length * share))) fits = share;
            else tooLong = share;
        }
        return { rise: lowest, length: length * fits };
    }

    // ─── Shared by both views: where branchlets hang and when they grow ───

    const PATH_STEP = 0.004;      // arc length between the computed points of a branchlet's curve
    const MIN_STRAND = 0.05;      // even the shortest branchlet is this long
    const MIN_GROW_TIME = 0.05;   // even the last branchlet to sprout takes this much growth to grow

    /** How much of its starting angle a branchlet keeps `u` bend-lengths along: all of it at first, then giving way. */
    const droopAt = u => Math.exp(-u * u / (1 + u));

    /**
     * The curve a hanging branchlet follows: it sets off `theta0` radians from straight down, towards `heading` (a horizontal
     * unit vector [x, z]), turns over within about `bendLength`, then hangs down at `thetaEnd` off the plumb line (a little
     * either way) until its tip is at `stopY` or it is `maxLength` long. Returns points every PATH_STEP along it:
     * { x, y, z, s (arc length), theta }.
     */
    function hangingPath([x, y, z], heading, theta0, thetaEnd, bendLength, stopY, maxLength) {
        const thetaAt = s => thetaEnd + (theta0 - thetaEnd) * droopAt(s / bendLength);
        const points = [{ x, y, z, s: 0, theta: theta0 }];
        for (let s = PATH_STEP; s <= maxLength; s += PATH_STEP) {
            const theta = thetaAt(s - PATH_STEP / 2);
            const outwards = Math.sin(theta) * PATH_STEP;
            x += heading[0] * outwards;
            z += heading[1] * outwards;
            y -= Math.cos(theta) * PATH_STEP;
            points.push({ x, y, z, s, theta: thetaAt(s) });
            if (y <= stopY && s >= MIN_STRAND) break;
        }
        return points;
    }

    /** Cuts a path where it first comes down to `y` (but never shorter than MIN_STRAND). */
    function cutPathAt(path, y) {
        const index = path.findIndex(point => point.y <= y && point.s >= MIN_STRAND);
        return index < 0 ? path : path.slice(0, index + 1);
    }

    /** Keeps just enough of a fine path to draw it in straight pieces: a point wherever it has turned `maxTurn` or run `maxRun`. */
    function simplifyPath(path, maxTurn, maxRun) {
        const kept = [path[0]];
        for (let index = 1; index < path.length - 1; index++) {
            const last = kept[kept.length - 1];
            const point = path[index];
            if (Math.abs(point.theta - last.theta) >= maxTurn || point.s - last.s >= maxRun) kept.push(point);
        }
        kept.push(path[path.length - 1]);
        return kept;
    }

    /**
     * Where a branch carries branchlets (shares of its length): long ones from strands.fromLevel on, a few short early shoots
     * on the trunk and main limbs. keepShare(t) is the chance a long one at `t` is kept, so a view can thin them out.
     */
    function attachmentsOf(spec, branch, isTip, perLength, rand, keepShare) {
        const { strands } = spec;
        if (branch.level < strands.fromLevel) {
            // The trunk only sprouts high up, the limbs all along but right by the fork.
            const lowest = branch.level === 0 ? strands.juvenileFromTrunk : strands.juvenileFromLimb;
            const count = Math.round(branch.length * strands.juvenilePerLength * within(rand, [0.6, 1.4]));
            return Array.from({ length: count }, () => ({ t: within(rand, [lowest, 1]), juvenile: true }));
        }
        const along = Math.round(branch.length * perLength * within(rand, [0.7, 1.3]));
        const atTip = isTip ? strands.perTip : 0;
        const spots = [
            ...Array.from({ length: along }, () => within(rand, strands.attach)),
            ...Array.from({ length: atTip }, () => within(rand, strands.tipAttach)),
        ];
        return spots.filter(t => rand() < keepShare(t)).map(t => ({ t, juvenile: false }));
    }

    /** How low a branchlet hangs: almost to the ground, some stopping short; an early shoot stays short. */
    function stopHeightFor(spec, rand, attachY, juvenile) {
        const { strands } = spec;
        if (juvenile) return Math.max(strands.hem, attachY - within(rand, strands.juvenileDrop));
        const hem = strands.hem + rand() * strands.hemJitter;
        if (rand() < strands.shortShare) return lerp(attachY, hem, within(rand, strands.shortStop));
        return hem;
    }

    /**
     * When a branchlet sprouts and how long it takes to grow: a little after its spot on the branch has grown, so the curtain
     * starts to fall while the limbs are still reaching out. Every one is full length in time for the leaves at its tip to
     * open by growth 1; a late one grows faster to make it.
     */
    function strandTiming(spec, rand, ready, juvenile) {
        const { strands, leaves } = spec;
        const finish = 1 - leaves.unfold - leaves.lag;
        const delay = juvenile ? rand() * strands.juvenileDelay : within(rand, strands.delay);
        const birth = Math.min(ready + delay, finish - MIN_GROW_TIME);
        const planned = juvenile ? strands.juvenileGrowTime : strands.growTime;
        return { birth, growTime: Math.min(planned, finish - birth) };
    }

    /** One hanging branchlet's curve from where it leaves its branch: direction [x, y, z] (unit) and the way it hangs. */
    function strandPath(spec, rand, start, dir, heading, stopY, juvenile) {
        const { strands } = spec;
        const theta0 = Math.acos(Math.min(1, Math.max(-1, -dir[1])));
        const thetaEnd = (rand() * 2 - 1) * strands.lean;
        const maxLength = juvenile ? strands.juvenileDrop[1] * 2 : strands.maxLength;
        return hangingPath(start, heading, theta0, thetaEnd, within(rand, strands.bendLength), stopY, maxLength);
    }

    /**
     * Leaves along a branchlet's fine path, `spacing` apart. Some open right behind the growing tip (on an early shoot, all
     * of them), the rest fill in at random until leaves.to; all have opened by growth 1. place(point, index, start) makes the
     * view's own leaf.
     */
    function planLeaves(spec, rand, strand, path, spacing, place) {
        const { leaves } = spec;
        const latest = 1 - leaves.unfold;
        const flush = strand.juvenile ? 1 : leaves.firstFlush;
        const list = [];
        let s = spacing * within(rand, [0.3, 1]);
        for (let index = 0; s < strand.length - PATH_STEP; index++) {
            const reached = strand.birth + strand.growTime * easeOutInverse(s / strand.length) + leaves.lag;
            const start = rand() < flush ? reached : lerp(reached, Math.max(reached, leaves.to), rand());
            const point = path[Math.min(path.length - 1, Math.round(s / PATH_STEP))];
            list.push(place(point, index, Math.min(latest, start)));
            s += spacing * within(rand, [0.75, 1.25]);
        }
        return list;
    }

    // ─── The lawn, shared by both views ───

    /** Where the pond's middle lies on the lawn. */
    function pondCentre(ground) {
        const { pond } = ground;
        return { x: Math.cos(pond.angle) * pond.distance, z: Math.sin(pond.angle) * pond.distance };
    }

    function inPond(ground, x, z, margin) {
        const { pond } = ground;
        const centre = pondCentre(ground);
        return ((x - centre.x) / (pond.rx + margin)) ** 2 + ((z - centre.z) / (pond.rz + margin)) ** 2 < 1;
    }

    /** Grass tufts anywhere on the lawn but the pond and the foot of the trunk: where each stands, and its colour (an index). */
    function scatterTufts(spec, rand, count) {
        const { ground } = spec;
        const tufts = [];
        for (let $_ = 0; $_ < count; $_++) {
            const a = rand() * TAU;
            const r = ground.radius * 0.97 * Math.sqrt(rand());
            const x = Math.cos(a) * r;
            const z = Math.sin(a) * r;
            if (r < spec.trunkWidth || inPond(ground, x, z, ground.pond.margin)) continue;
            tufts.push({ x, z, color: Math.floor(rand() * spec.colors.grass.length) });
        }
        return tufts;
    }

    // ─── Willow in 2D ───

    const MATURITY_STEPS = 8;     // 2D leaf colours from fresh to grown, so leaves of one colour share one fill

    /** Depth layers from the middle on hang in front of the trunk, the rest behind it. */
    const inFront = (layer, layerCount) => layer >= layerCount / 2;

    function tangentOnBranch(branch, t) {
        const { cx, cy, ex, ey } = controlAndEnd(branch);
        const dx = 2 * (1 - t) * (cx - branch.x) + 2 * t * (ex - cx);
        const dy = 2 * (1 - t) * (cy - branch.y) + 2 * t * (ey - cy);
        const length = Math.hypot(dx, dy) || 1;
        return [dx / length, dy / length];
    }

    /** How hard the willow habit pulls a branch at `distance` from the trunk out towards the horizontal. */
    const archPull = (spec, level, distance) => Math.min(0.8, spec.arch * level) * smooth(clamp01(distance / spec.archReach));

    /** Willow habit: each generation leans further out from the trunk towards the horizontal, which rounds the crown. */
    function archOut2D(spec, angle, x, level) {
        // Out is away from the trunk; right over it, the way the branch already leans.
        let outwards;
        if (Math.abs(x) > 0.03) outwards = x > 0 ? 0 : Math.PI;
        else outwards = Math.cos(angle) >= 0 ? 0 : Math.PI;
        // atan2 hands out -π…π, so a twig just below the level on the left arrives as about -2.7, not 3.6: measure it from
        // `outwards` the short way round, or the pull swings it round through straight down.
        const offset = Math.atan2(Math.sin(angle - outwards), Math.cos(angle - outwards));
        const pulled = outwards + offset * (1 - archPull(spec, level, Math.abs(x)));
        return Math.min(Math.PI + spec.droopLimit, Math.max(-spec.droopLimit, pulled));
    }

    /** fitCrown() for a 2D branch from (x, y) at `angle`: it keeps to the side it heads for and only turns down. */
    function fitCrown2D(crown, x, y, angle, length) {
        // One pointing straight up turns down on its own side of the trunk.
        let side = Math.sign(Math.cos(angle));
        if (Math.abs(Math.cos(angle)) < 1e-6) side = x >= 0 ? 1 : -1;
        const rise = Math.atan2(Math.sin(angle), Math.abs(Math.cos(angle)));
        const endAt = (tried, along) => ({ r: Math.abs(x + side * Math.cos(tried) * along), y: y + Math.sin(tried) * along });
        const fitted = fitCrown(crown, rise, length, endAt);
        return { angle: side > 0 ? fitted.rise : Math.PI - fitted.rise, length: fitted.length };
    }

    /** Main limbs off the trunk, branches per fork further out; now and then a fork has one less. */
    function childCount(spec, level, limbs, rand) {
        if (level === 0) return limbs;
        return spec.forks - (spec.forks > 1 && rand() < 0.2 ? 1 : 0);
    }

    function buildSkeleton2D(spec, rand) {
        const growDur = growDurationOf(spec);

        // Main limbs fan out over the trunk, from one side to the other; forks further out turn either way off their parent.
        function angleOf(level, endAngle, index, count) {
            if (level === 0) {
                // The middle one (of an odd number) is the leader.
                const across = count === 1 ? 0 : index / (count - 1) * 2 - 1;
                const tilt = across === 0 ? (rand() * 2 - 1) * spec.leaderTilt : across * within(rand, spec.limbTilt);
                return Math.PI / 2 - tilt + (rand() - 0.5) * 0.15;
            }
            const across = count === 1 ? (rand() < 0.5 ? -1 : 1) * 0.5 : index / (count - 1) * 2 - 1;
            return endAngle + across * spec.spread * within(rand, [0.8, 1.2]) + (rand() - 0.5) * 0.2;
        }

        // Trunk and limbs wander either way; further out branches arch over, bowing up and then down.
        function bendOf(level, angle) {
            if (level <= 1) return spec.bend * (rand() < 0.5 ? -1 : 1) * within(rand, [0.4, 1.2]);
            return spec.bend * (Math.cos(angle) >= 0 ? 1 : -1) * within(rand, [0.5, 1.3]);
        }

        function spawn(branch, level) {
            const { cx, cy, ex, ey } = controlAndEnd(branch);
            const endAngle = Math.atan2(ey - cy, ex - cx);
            const birth = branch.birth + growDur * (1 + rand() * 0.12);
            const count = childCount(spec, level, spec.limbs2D, rand);
            return Array.from({ length: count }, (_, index) => {
                const habit = archOut2D(spec, angleOf(level, endAngle, index, count), ex, level + 1);
                const planned = branch.length * spec.lengthDecay * within(rand, [0.85, 1.15]);
                const { angle, length } = fitCrown2D(spec.crown, ex, ey, habit, planned);
                return makeBranch2D(ex, ey, angle, length, branch.width * spec.widthDecay, level + 1, birth, bendOf(level + 1, angle));
            });
        }

        const trunkAngle = Math.PI / 2 + (rand() - 0.5) * 2 * spec.trunkLean;
        const trunk = makeBranch2D(0, 0, trunkAngle, spec.trunkLength, spec.trunkWidth, 0, 0, bendOf(0, trunkAngle));
        const skeleton = growGenerations({ trunk, generations: spec.levels, cap: 4000, spawn });
        return { ...skeleton, growDur };
    }

    /** One 2D branchlet: its curve, simplified for drawing, its depth layer (behind or in front of the trunk) and its leaves. */
    function makeStrand2D(spec, rand, branch, t, juvenile, growDur) {
        const { strands, leaves } = spec;
        const [x, y] = pointOnBranch(branch, t);
        const [tx, ty] = tangentOnBranch(branch, t);
        // It turns off its branch to one side, rises a little, then gravity takes over.
        const turn = (rand() < 0.5 ? -1 : 1) * within(rand, juvenile ? strands.juvenileSetOff : strands.setOff);
        const lift = juvenile ? strands.juvenileLift : strands.lift;
        let dx = (tx * Math.cos(turn) - ty * Math.sin(turn)) * (1 - lift);
        let dy = (tx * Math.sin(turn) + ty * Math.cos(turn)) * (1 - lift) + lift;
        const norm = Math.hypot(dx, dy) || 1;
        dx /= norm;
        dy /= norm;
        const side = Math.abs(dx) > 0.05 ? Math.sign(dx) : (rand() < 0.5 ? -1 : 1);
        // Early shoots hang close round the stem, just behind or in front; the curtain is all round it, near and far.
        const layerCount = spec.depthShade2D.length;
        const nearStem = Math.floor(layerCount / 2) - 1 + Math.floor(rand() * 2);
        const layer = juvenile ? Math.min(layerCount - 1, Math.max(0, nearStem)) : Math.floor(rand() * layerCount);
        const stopY = stopHeightFor(spec, rand, y, juvenile);
        const { birth, growTime } = strandTiming(spec, rand, limbReaches(branch, growDur, t), juvenile);
        let path = strandPath(spec, rand, [x, y, 0], [dx, dy, 0], [side, 0], stopY, juvenile);
        // In front of the trunk the curtain stops higher, so the trunk shows through the opening.
        if (!juvenile && inFront(layer, layerCount) && Math.abs(path[path.length - 1].x) < strands.window.halfWidth) {
            path = cutPathAt(path, strands.window.hem + rand() * 0.08);
        }

        const strand = {
            points: simplifyPath(path, 0.12, 0.05).map(({ x, y, s }) => ({ x, y, s })),
            length: path[path.length - 1].s,
            birth,
            growTime,
            juvenile,
            layer,
            leaves: [],
        };
        strand.leaves = planLeaves(spec, rand, strand, path, leaves.spacing2D, (point, index, start) => {
            // Leaves point away from the branchlet, to either side in turn, then their weight turns them partly downwards.
            const turn = (index % 2 === 0 ? 1 : -1) * leaves.angle * within(rand, [0.7, 1.3]);
            const ax = side * Math.sin(point.theta);
            const ay = -Math.cos(point.theta);
            const dx = (ax * Math.cos(turn) - ay * Math.sin(turn)) * (1 - leaves.hang);
            const dy = (ax * Math.sin(turn) + ay * Math.cos(turn)) * (1 - leaves.hang) - leaves.hang;
            const length = Math.hypot(dx, dy) || 1;
            return {
                x: point.x,
                y: point.y,
                dx: dx / length,
                dy: dy / length,
                size: within(rand, [0.75, 1.2]),
                start,
                shade: Math.floor(rand() * spec.colors.leaf.length),
                dither: rand(),     // blurs the line between two light bands (see buildWillow2D)
                band: 0,            // its light band: set once the whole crown is known
            };
        });
        return strand;
    }

    /** The lawn's grass tufts (three blades each) and the pond's glints, split into what stands behind and in front of the tree. */
    function buildGround2D(spec, rand) {
        const { ground } = spec;
        const blades = scatterTufts(spec, rand, ground.tufts2D).flatMap(tuft => Array.from({ length: 3 }, () => ({
            x: tuft.x + (rand() - 0.5) * ground.tuftSpread,
            y: -tuft.z * ground.squash,
            height: within(rand, ground.bladeHeight),
            lean: (rand() - 0.5) * 0.6,
            color: tuft.color,
            front: tuft.z > 0,
        })));
        const { pond } = ground;
        const glints = Array.from({ length: 4 }, () => ({
            x: (rand() - 0.5) * pond.rx * 1.1,
            y: (rand() - 0.5) * pond.rz * ground.squash * 1.1,
            length: pond.rx * within(rand, [0.15, 0.4]),
        }));
        return { back: blades.filter(blade => !blade.front), front: blades.filter(blade => blade.front), glints };
    }

    /** 2D colours, built once per build: palette.leaf[layer][band][shade][step] runs from fresh to grown in MATURITY_STEPS. */
    function palette2D(spec) {
        const { colors } = spec;
        const fresh = hexToRgb(colors.leafFresh);
        const toned = (rgb, factor) => `rgb(${rgb.map(channel => Math.min(255, Math.round(channel * factor))).join(',')})`;
        const ripening = (grown, brightness) => Array.from({ length: MATURITY_STEPS }, (_, step) => {
            const t = step / (MATURITY_STEPS - 1);
            return toned(fresh.map((channel, index) => lerp(channel, grown[index], t)), brightness);
        });
        return {
            strand: spec.depthShade2D.map(depth => toned(hexToRgb(colors.strand), depth)),
            leaf: spec.depthShade2D.map(depth => spec.sunlit.map(light => colors.leaf.map(hex => ripening(hexToRgb(hex), depth * light)))),
        };
    }

    /** The highest point the grown 2D willow reaches: limbs, branchlets and leaf tips. */
    function topOf2D(spec, branches, strands, leaves) {
        let top = 0;
        branches.forEach(branch => {
            for (let step = 0; step <= 10; step++) {
                top = Math.max(top, pointOnBranch(branch, step / 10)[1] + branch.width / 2);
            }
        });
        strands.forEach(strand => strand.points.forEach(point => { top = Math.max(top, point.y); }));
        leaves.forEach(leaf => { top = Math.max(top, leaf.y + Math.max(0, leaf.dy) * spec.leaves.length * leaf.size); });
        return top;
    }

    function buildWillow2D(spec) {
        const rand = mulberry32(spec.seed);
        const skeleton = buildSkeleton2D(spec, rand);
        const tips = new Set(skeleton.tips);
        const strands = skeleton.branches.flatMap(branch =>
            attachmentsOf(spec, branch, tips.has(branch), spec.strands.perLength2D, rand, () => 1)
                .map(({ t, juvenile }) => makeStrand2D(spec, rand, branch, t, juvenile, skeleton.growDur)));
        // Each leaf's light band: how high up the crown it hangs (the top catches the most light), blurred by its own dither
        // so the curtain shows no steps where one band meets the next.
        const leaves = strands.flatMap(strand => strand.leaves);
        const crownTop = leaves.reduce((top, leaf) => Math.max(top, leaf.y), 0.01);
        const bands = spec.sunlit.length;
        leaves.forEach(leaf => {
            leaf.band = Math.min(bands - 1, Math.max(0, Math.floor(leaf.y / crownTop * bands + leaf.dither - 0.5)));
        });
        return {
            ...skeleton,
            strands,
            layers: spec.depthShade2D.map((_, layer) => strands.filter(strand => strand.layer === layer)),
            leafCount: leaves.length,
            top: topOf2D(spec, skeleton.branches, strands, leaves),
            ground: buildGround2D(spec, rand),
            palette: palette2D(spec),
        };
    }

    // ─── Drawing in 2D ───

    function drawGrass2D(g, blades, spec, { scale, sx, sy }) {
        g.lineCap = 'round';
        g.lineWidth = Math.max(1, 0.0035 * scale);
        spec.colors.grass.forEach((color, colorIndex) => {
            g.strokeStyle = color;
            g.beginPath();
            blades.forEach(blade => {
                if (blade.color !== colorIndex) return;
                const tipX = blade.x + blade.lean * blade.height;
                g.moveTo(sx(blade.x), sy(blade.y));
                g.quadraticCurveTo(sx(blade.x), sy(blade.y + blade.height * 0.6), sx(tipX), sy(blade.y + blade.height));
            });
            g.stroke();
        });
    }

    /** The lawn slab seen from a little above: soil edge, lawn, the pond and the grass behind the tree. */
    function drawGround2D(g, plant, spec, growth, frame) {
        const { scale, sx, sy } = frame;
        const { ground, colors } = spec;
        const rx = ground.radius * scale;
        const ry = ground.radius * ground.squash * scale;
        g.fillStyle = colors.soil;
        g.beginPath();
        g.ellipse(sx(0), sy(-ground.depth), rx, ry, 0, 0, TAU);
        g.fill();
        g.fillRect(sx(-ground.radius), sy(0), rx * 2, ground.depth * scale);
        g.fillStyle = colors.turf;
        g.beginPath();
        g.ellipse(sx(0), sy(0), rx, ry, 0, 0, TAU);
        g.fill();

        // The pond: further back (larger z) is higher up in the side view.
        const { pond } = ground;
        const centre = pondCentre(ground);
        const px = centre.x;
        const py = -centre.z * ground.squash;
        g.fillStyle = colors.bank;
        g.beginPath();
        g.ellipse(sx(px), sy(py), (pond.rx + pond.bank) * scale, (pond.rz + pond.bank) * ground.squash * scale, 0, 0, TAU);
        g.fill();
        g.fillStyle = colors.water;
        g.beginPath();
        g.ellipse(sx(px), sy(py), pond.rx * scale, pond.rz * ground.squash * scale, 0, 0, TAU);
        g.fill();
        g.strokeStyle = colors.waterLight;
        g.lineWidth = Math.max(1, 0.003 * scale);
        g.lineCap = 'round';
        g.beginPath();
        plant.ground.glints.forEach(glint => {
            g.moveTo(sx(px + glint.x - glint.length / 2), sy(py + glint.y));
            g.lineTo(sx(px + glint.x + glint.length / 2), sy(py + glint.y));
        });
        g.stroke();

        drawShade2D(g, spec, growth, frame);
        drawGrass2D(g, plant.ground.back, spec, frame);
    }

    /** The curtain's shade on the lawn: a soft dark pool that deepens as the canopy fills. */
    function drawShade2D(g, spec, growth, { scale, sx, sy }) {
        const darkness = shadeAt(spec, growth);
        if (darkness <= 0) return;
        const { shade } = spec.ground;
        const rgb = hexToRgb(spec.colors.shade).join(',');
        const tone = alpha => `rgba(${rgb},${alpha.toFixed(3)})`;
        const radius = shade.radius * scale;
        const pool = g.createRadialGradient(0, 0, 0, 0, 0, radius);
        pool.addColorStop(0, tone(darkness));
        pool.addColorStop(shade.falloff.at, tone(darkness * shade.falloff.keep));
        pool.addColorStop(1, tone(0));
        // Drawn as a circle in a squashed frame, which makes it lie flat on the lawn.
        g.save();
        g.translate(sx(0), sy(0));
        g.scale(1, spec.ground.squash);
        g.fillStyle = pool;
        g.beginPath();
        g.arc(0, 0, radius, 0, TAU);
        g.fill();
        g.restore();
    }

    function traceStrand2D(g, strand, length, sx, sy) {
        const { points } = strand;
        g.moveTo(sx(points[0].x), sy(points[0].y));
        for (let index = 1; index < points.length; index++) {
            const point = points[index];
            if (point.s <= length) {
                g.lineTo(sx(point.x), sy(point.y));
                continue;
            }
            // The growing tip: part of the way to the next point.
            const previous = points[index - 1];
            const t = (length - previous.s) / (point.s - previous.s);
            g.lineTo(sx(lerp(previous.x, point.x, t)), sy(lerp(previous.y, point.y, t)));
            return;
        }
    }

    /**
     * A slender pointed leaf from (x, y) in canvas pixels, `length` along (dx, dy) (canvas directions). Each side curves
     * towards a point `bulge` off the midrib at `widest` of its length, which makes the leaf `bulge` wide in all.
     */
    function traceLeaf2D(g, x, y, dx, dy, length, bulge, widest) {
        const tipX = x + dx * length;
        const tipY = y + dy * length;
        const midX = x + dx * length * widest;
        const midY = y + dy * length * widest;
        g.moveTo(x, y);
        g.quadraticCurveTo(midX - dy * bulge, midY + dx * bulge, tipX, tipY);
        g.quadraticCurveTo(midX + dy * bulge, midY - dx * bulge, x, y);
    }

    /** One depth layer of the curtain: its bare branchlets in one stroke, then its leaves, one fill per colour. */
    function drawStrandLayer2D(g, plant, layer, spec, growth, { scale, sx, sy }) {
        const { strands: strandSpec, leaves: leafSpec } = spec;
        const strands = plant.layers[layer];
        const lengths = strands.map(strand => strandLengthAt(strand, growth));
        // Further back, thinner (and darker, see palette2D).
        const nearness = plant.layers.length > 1 ? layer / (plant.layers.length - 1) : 1;
        g.lineCap = 'round';
        g.lineJoin = 'round';
        g.strokeStyle = plant.palette.strand[layer];
        g.lineWidth = Math.max(strandSpec.thinnest2D, strandSpec.width * scale * lerp(strandSpec.farWidth2D, 1, nearness));
        g.beginPath();
        strands.forEach((strand, index) => {
            if (lengths[index] > 0) traceStrand2D(g, strand, lengths[index], sx, sy);
        });
        g.stroke();

        // Leaves of one colour go into one path. The buckets are nested like the palette, so flattening both the same way
        // lines each colour up with its leaves.
        const colors = plant.palette.leaf[layer];
        const buckets = colors.map(band => band.map(shade => shade.map(() => [])));
        strands.forEach(strand => strand.leaves.forEach(leaf => {
            if (growth <= leaf.start) return;
            const step = Math.round(leafMaturityAt(leaf, spec, growth) * (MATURITY_STEPS - 1));
            buckets[leaf.band][leaf.shade][step].push(leaf);
        }));
        const fills = colors.flat(2);
        buckets.flat(2).forEach((leaves, index) => {
            if (!leaves.length) return;
            g.fillStyle = fills[index];
            g.beginPath();
            leaves.forEach(leaf => {
                const open = leafOpenAt(leaf, spec, growth) * leaf.size;
                // Canvas y runs down, hence the minus on dy.
                traceLeaf2D(g, sx(leaf.x), sy(leaf.y), leaf.dx, -leaf.dy, leafSpec.length * open * scale, leafSpec.width * open * scale, leafSpec.widest);
            });
            g.fill();
        });
    }

    /** A root flare where the trunk meets the lawn. */
    function drawRootFlare2D(g, plant, spec, growth, { sx, sy }) {
        const trunk = plant.branches[0];
        const grown = limbProgress(trunk, plant.growDur, growth);
        if (grown <= 0) return;
        const half = spec.trunkWidth / 2 * girthAt(spec, growth);
        const height = Math.min(spec.flare.height, trunk.length * grown);
        // It swells out as the stem gets going, so it doesn't appear at full width.
        const foot = half * (1 + (spec.flare.spread - 1) * smooth(clamp01(grown * 4)));
        g.fillStyle = spec.colors.bark;
        g.beginPath();
        // Its foot a hair below the lawn's middle line, so it sits in the lawn rather than on it.
        g.moveTo(sx(-foot), sy(-0.004));
        g.quadraticCurveTo(sx(-half), sy(0), sx(-half * 0.95), sy(height));
        g.lineTo(sx(half * 0.95), sy(height));
        g.quadraticCurveTo(sx(half), sy(0), sx(foot), sy(-0.004));
        g.closePath();
        g.fill();
    }

    /**
     * One band of `color` along every thick branch, `offset` half-widths off its middle towards the side away from the light
     * (lower right; a negative offset is the lit side) and `share` of its width wide. A dark band and a thin light one make
     * the trunk and limbs look round.
     */
    function shadeBranches2D(g, plant, spec, growth, color, { offset, share }, { scale, sx, sy }) {
        const thickness = girthAt(spec, growth);
        g.strokeStyle = color;
        g.lineCap = 'round';
        plant.branches.forEach(branch => {
            const progress = limbProgress(branch, plant.growDur, growth);
            const half = branch.width / 2 * thickness;
            if (progress <= 0 || half * scale < 2.5) return;
            const steps = 8;
            for (let step = 0; step < steps; step++) {
                const t0 = progress * step / steps;
                const t1 = progress * (step + 1) / steps;
                const [x0, y0] = pointOnBranch(branch, t0);
                const [x1, y1] = pointOnBranch(branch, t1);
                const [tx, ty] = tangentOnBranch(branch, (t0 + t1) / 2);
                // The normal on the shaded (lower right) side.
                const flip = tx + ty >= 0 ? 1 : -1;
                const width = half * (1 - (1 - spec.widthDecay) * t0);
                const nx = ty * flip * width * offset;
                const ny = -tx * flip * width * offset;
                g.lineWidth = Math.max(0.5, width * 2 * share * scale);
                g.beginPath();
                g.moveTo(sx(x0 + nx), sy(y0 + ny));
                g.lineTo(sx(x1 + nx), sy(y1 + ny));
                g.stroke();
            }
        });
    }

    function drawWillow2D(view, plant, spec, growth) {
        const g = view.ctx;
        g.clearRect(0, 0, view.width, view.height);
        // However tall this seed's crown grows, it stays in view: a taller one is drawn a little smaller.
        const { up, base, headroom } = spec.frame2D;
        const frame = framing(view, { ...spec.frame2D, up: Math.max(up, plant.top + headroom + base) });
        const { scale, sx, sy } = frame;
        const layerCount = plant.layers.length;
        const drawLayers = front => plant.layers.forEach((_, layer) => {
            if (inFront(layer, layerCount) === front) drawStrandLayer2D(g, plant, layer, spec, growth, frame);
        });

        drawGround2D(g, plant, spec, growth, frame);
        // The back half of the curtain, the tree, then the front half: the curtain hangs all round the trunk.
        drawLayers(false);
        drawRootFlare2D(g, plant, spec, growth, frame);
        strokeBranches2D(g, plant.branches, {
            progressOf: branch => limbProgress(branch, plant.growDur, growth),
            thickness: girthAt(spec, growth),
            taper: spec.widthDecay,
            color: spec.colors.bark,
            sx, sy, scale,
        });
        shadeBranches2D(g, plant, spec, growth, spec.colors.barkDark, spec.bark2D.shade, frame);
        shadeBranches2D(g, plant, spec, growth, spec.colors.barkLight, spec.bark2D.light, frame);
        drawLayers(true);
        drawGrass2D(g, plant.ground.front, spec, frame);
    }

    // ─── Willow in 3D ───

    /** The level way out from the trunk at `at`; right over the trunk, the way `dir` leans; failing that, along x. */
    function outwardOf(at, dir) {
        const out = new THREE.Vector3(at.x, 0, at.z);
        if (out.lengthSq() < 0.03 * 0.03) out.set(dir.x, 0, dir.z);
        if (out.lengthSq() < 1e-8) out.set(1, 0, 0);
        return out.normalize();
    }

    /** The level way across a branch, round the trunk: square to the branch, or for an upright one, to the way out. */
    function sidewaysOf(dir, at) {
        const across = new THREE.Vector3().crossVectors(dir, UP);
        if (across.lengthSq() < 0.01) across.crossVectors(outwardOf(at, dir), UP);
        // Exactly square to the branch, so splay() can turn the branch towards it.
        return across.addScaledVector(dir, -across.dot(dir)).normalize();
    }

    /** The most upward way square to a branch (for an upright branch, which has none, the way across it). */
    function risingOf(dir, at) {
        const rising = UP.clone().addScaledVector(dir, -dir.y);
        if (rising.lengthSq() < 0.01) return sidewaysOf(dir, at);
        return rising.normalize();
    }

    /**
     * Willow habit in 3D: each generation is pulled further towards the horizontal. It keeps its own heading, so a fan keeps
     * its width; one heading back towards the trunk is pulled straight out instead.
     */
    function archOut3D(spec, dir, at, level) {
        const outward = outwardOf(at, dir);
        const heading = new THREE.Vector3(dir.x, 0, dir.z);
        const target = heading.lengthSq() > 1e-8 && heading.dot(outward) > 0 ? heading.normalize() : outward;
        const pulled = dir.clone().lerp(target, archPull(spec, level, Math.hypot(at.x, at.z))).normalize();
        const lowest = -Math.sin(spec.droopLimit);
        if (pulled.y < lowest) {
            const flat = new THREE.Vector3(pulled.x, 0, pulled.z).normalize().multiplyScalar(Math.cos(spec.droopLimit));
            pulled.set(flat.x, lowest, flat.z);
        }
        return pulled;
    }

    /** fitCrown() for a 3D branch from `start` along `dir`: it keeps its heading round the trunk and only turns down. */
    function fitCrown3D(crown, start, dir, length) {
        const flat = Math.hypot(dir.x, dir.z);
        const heading = flat > 1e-4 ? new THREE.Vector3(dir.x / flat, 0, dir.z / flat) : outwardOf(start, dir);
        const rise = Math.atan2(dir.y, flat);
        const endAt = (tried, along) => {
            const out = Math.cos(tried) * along;
            return { r: Math.hypot(start.x + heading.x * out, start.z + heading.z * out), y: start.y + Math.sin(tried) * along };
        };
        const fitted = fitCrown(crown, rise, length, endAt);
        return { dir: heading.multiplyScalar(Math.cos(fitted.rise)).setY(Math.sin(fitted.rise)), length: fitted.length };
    }

    function buildSkeleton3D(spec, rand) {
        const growDur = growDurationOf(spec);

        // Off the trunk, the first limb is the leader and the others lean out evenly all round it.
        function limbDirections(trunk, count) {
            const firstAzimuth = rand() * TAU;
            const hasLeader = count > 2;
            const around = hasLeader ? count - 1 : count;
            return Array.from({ length: count }, (_, index) => {
                const azimuth = firstAzimuth + index * TAU / around + (rand() - 0.5) * spec.forkTwist;
                const isLeader = hasLeader && index === 0;
                const tilt = isLeader ? rand() * spec.leaderTilt : within(rand, spec.limbTilt);
                return splay(trunk.dir, tilt, azimuth);
            });
        }

        // Near the middle a fork stands upright: one child rises to fill the top of the dome, the other leans out. Further out
        // it fans out sideways, round the trunk, so each limb fills its own sector of the crown (forks in random planes leave
        // whole sectors empty).
        function forkDirections(branch, count) {
            const fanned = smooth(clamp01(Math.hypot(branch.end.x, branch.end.z) / spec.fanReach));
            const split = risingOf(branch.dir, branch.end).lerp(sidewaysOf(branch.dir, branch.end), fanned).normalize();
            // The same way as splay()'s azimuth round the branch.
            const { u, v } = basisOf(branch.dir);
            const splitAzimuth = Math.atan2(split.dot(v), split.dot(u));
            return Array.from({ length: count }, (_, index) => {
                const share = count === 1 ? (rand() < 0.5 ? -1 : 1) * 0.5 : index / (count - 1) * 2 - 1;
                const azimuth = splitAzimuth + (share < 0 ? Math.PI : 0) + (rand() - 0.5) * spec.forkTwist;
                return splay(branch.dir, Math.abs(share) * spec.spread * within(rand, [0.7, 1.3]), azimuth);
            });
        }

        function spawn(branch, level) {
            const count = childCount(spec, level, spec.limbs3D, rand);
            const birth = branch.birth + growDur * (1 + rand() * 0.12);
            const directions = level === 0 ? limbDirections(branch, count) : forkDirections(branch, count);
            return directions.map(direction => {
                const habit = archOut3D(spec, direction, branch.end, level + 1);
                const planned = branch.length * spec.lengthDecay * within(rand, [0.85, 1.15]);
                const { dir, length } = fitCrown3D(spec.crown, branch.end, habit, planned);
                return makeBranch3D(branch.end, dir, length, branch.width * spec.widthDecay, level + 1, birth);
            });
        }

        const lean = spec.trunkLean;
        const trunkDir = new THREE.Vector3((rand() - 0.5) * 2 * lean, 1, (rand() - 0.5) * 2 * lean).normalize();
        const trunk = makeBranch3D(new THREE.Vector3(), trunkDir, spec.trunkLength, spec.trunkWidth, 0, 0);
        const skeleton = growGenerations({ trunk, generations: spec.levels, cap: 4000, spawn });
        return { ...skeleton, growDur };
    }

    /** One 3D branchlet: a chain of short straight pieces along its curve (shaped like branches, for placeBranches3D) and its leaves. */
    function makeStrand3D(spec, rand, branch, t, juvenile, growDur) {
        const { strands, leaves } = spec;
        const start = branch.start.clone().addScaledVector(branch.dir, branch.length * t);
        // It turns off its branch any way round, rises a little, then gravity takes over.
        const lift = juvenile ? strands.juvenileLift : strands.lift;
        const setOff = splay(branch.dir, within(rand, juvenile ? strands.juvenileSetOff : strands.setOff), rand() * TAU);
        const dir = setOff.multiplyScalar(1 - lift).addScaledVector(UP, lift).normalize();
        const heading = new THREE.Vector3(dir.x, 0, dir.z);
        if (heading.lengthSq() < 1e-4) heading.set(start.x, 0, start.z);
        if (heading.lengthSq() < 1e-8) {
            const azimuth = rand() * TAU;
            heading.set(Math.cos(azimuth), 0, Math.sin(azimuth));
        }
        heading.normalize();
        const stopY = stopHeightFor(spec, rand, start.y, juvenile);
        const { birth, growTime } = strandTiming(spec, rand, limbReaches(branch, growDur, t), juvenile);
        const path = strandPath(spec, rand, start.toArray(), dir.toArray(), [heading.x, heading.z], stopY, juvenile);
        const length = path[path.length - 1].s;
        const strand = { length, birth, growTime, juvenile, pieces: [], leaves: [] };

        // Pieces between the kept points, thinning towards the tip.
        const kept = simplifyPath(path, 0.16, 0.07);
        for (let index = 0; index < kept.length - 1; index++) {
            const from = new THREE.Vector3(kept[index].x, kept[index].y, kept[index].z);
            const to = new THREE.Vector3(kept[index + 1].x, kept[index + 1].y, kept[index + 1].z);
            const span = from.distanceTo(to);
            if (span < 1e-6) continue;
            const width = strands.width * lerp(1, strands.taper, kept[index].s / length);
            const piece = makeBranch3D(from, to.sub(from).divideScalar(span), span, width, 0, birth);
            piece.s = kept[index].s;
            piece.strand = strand;
            strand.pieces.push(piece);
        }

        // Leaves spiral round the branchlet (the golden angle apart), pointing away from it and partly down under their own
        // weight, their blades turned to face out of the curtain: seen from outside they show their face rather than their edge.
        strand.leaves = planLeaves(spec, rand, strand, path, leaves.spacing, (point, index, start) => {
            const along = new THREE.Vector3(heading.x * Math.sin(point.theta), -Math.cos(point.theta), heading.z * Math.sin(point.theta));
            const axis = splay(along, leaves.angle * within(rand, [0.7, 1.3]), index * 2.4 + rand() * 0.6)
                .multiplyScalar(1 - leaves.hang)
                .addScaledVector(UP, -leaves.hang);
            if (axis.lengthSq() < 1e-6) axis.copy(along);
            axis.normalize();
            const outwards = new THREE.Vector3(point.x, 0, point.z);
            if (outwards.lengthSq() < 1e-4) outwards.copy(heading);
            const side = new THREE.Vector3().crossVectors(axis, outwards.normalize());
            if (side.lengthSq() < 1e-6) side.copy(basisOf(axis).u);
            side.normalize().applyAxisAngle(axis, (rand() - 0.5) * leaves.twist);
            const facing = new THREE.Vector3().crossVectors(side, axis);
            return {
                position: new THREE.Vector3(point.x, point.y, point.z),
                quaternion: new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(side, axis, facing)),
                s: point.s,
                size: within(rand, [0.75, 1.2]),
                start,
                grown: new THREE.Color(pick(rand, spec.colors.leaf)).multiplyScalar(within(rand, [0.85, 1.1])),
                light: 1,       // set once the whole crown is known (see lightLeaves3D)
            };
        });
        return strand;
    }

    /**
     * Light in the 3D crown, worked out once per build: leaves high up and on the outside of the curtain catch the sun, those
     * low down and deep inside it less (as the 2D view's light bands and depth layers do).
     */
    function lightLeaves3D(spec, leaves) {
        const SECTORS = 12;     // how finely the crown's outline round the trunk is measured
        const sectorOf = ({ x, z }) => Math.floor((Math.atan2(z, x) / TAU + 1) % 1 * SECTORS) % SECTORS;
        const outermost = Array(SECTORS).fill(0.01);
        let top = 0.01;
        leaves.forEach(({ position }) => {
            const sector = sectorOf(position);
            outermost[sector] = Math.max(outermost[sector], Math.hypot(position.x, position.z));
            top = Math.max(top, position.y);
        });
        const [deepInside, onOutside] = spec.depthShade3D;
        leaves.forEach(leaf => {
            const { position } = leaf;
            const outside = smooth(clamp01(Math.hypot(position.x, position.z) / outermost[sectorOf(position)]));
            leaf.light = sampleList(spec.sunlit, position.y / top) * lerp(deepInside, onOutside, outside);
        });
    }

    function buildWillow3D(spec) {
        const rand = mulberry32(spec.seed + 1000);
        const skeleton = buildSkeleton3D(spec, rand);
        const tips = new Set(skeleton.tips);
        const { strands: strandSpec } = spec;
        const strands = skeleton.branches.flatMap(branch => {
            // Branches near the trunk carry fewer long branchlets, so the curtain is a shell rather than a solid column.
            const keepShare = t => {
                const at = branch.start.clone().addScaledVector(branch.dir, branch.length * t);
                return lerp(strandSpec.innerShare3D, 1, smooth(clamp01(Math.hypot(at.x, at.z) / strandSpec.innerReach3D)));
            };
            return attachmentsOf(spec, branch, tips.has(branch), strandSpec.perLength3D, rand, keepShare)
                .map(({ t, juvenile }) => makeStrand3D(spec, rand, branch, t, juvenile, skeleton.growDur));
        });
        const leaves = strands.flatMap(strand => strand.leaves);
        lightLeaves3D(spec, leaves);
        return {
            ...skeleton,
            strands,
            pieces: strands.flatMap(strand => strand.pieces),
            leaves,
            leafCount: leaves.length,
        };
    }

    /** The root flare: 1 high, the trunk's radius (1) at the top, swelling out to `spread` times that where it meets the lawn. */
    function flareGeometry({ spread, curve }) {
        const profile = Array.from({ length: 7 }, (_, index) => {
            const height = index / 6;
            return new THREE.Vector2(0.95 + (spread - 0.95) * Math.pow(1 - height, curve), height);
        });
        return new THREE.LatheGeometry(profile, 14);
    }

    /** A slender leaf, 1 long up +y and 1 wide each side, folded back along its midrib so its halves catch the light apart. */
    function leafGeometry({ widest, fold }) {
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute([
            0, 0, 0,                // stalk end
            1, widest, -fold,       // right edge
            0, 1, 0,                // tip
            -1, widest, -fold,      // left edge
        ], 3));
        geometry.setIndex([0, 1, 2, 0, 2, 3]);
        geometry.computeVertexNormals();
        return geometry;
    }

    // The breeze: a vertex shader nudge, so swaying costs one uniform per frame instead of rewriting thousands of instances.
    // aSway says how far below its attachment each piece hangs (arc length at its foot, and its length); leaves hang at one point.
    const SWAY_DECLARATIONS = `
attribute vec2 aSway;
uniform float uSwayTime;
uniform float uSwayAmount;
uniform vec2 uSwayRipple;
uniform float uSwayCross;`;
    const SWAY_PROJECTION = `
vec4 mvPosition = vec4( transformed, 1.0 );
#ifdef USE_INSTANCING
    mvPosition = instanceMatrix * mvPosition;
#endif
// The further down a branchlet a point hangs, the further it swings; neighbours swing a little out of step.
float hang = aSway.x + aSway.y * position.y;
float swing = uSwayAmount * hang * hang;
float phase = uSwayTime + dot( mvPosition.xz, uSwayRipple );
mvPosition.x += swing * sin( phase );
// Across the wind on a slightly different beat, so the two drift in and out of step.
mvPosition.z += swing * uSwayCross * sin( 0.83 * phase + 1.9 );
mvPosition = modelViewMatrix * mvPosition;
gl_Position = projectionMatrix * mvPosition;`;

    function withSway(material, uniforms) {
        material.onBeforeCompile = shader => {
            Object.assign(shader.uniforms, uniforms);
            shader.vertexShader = shader.vertexShader
                .replace('#include <common>', `#include <common>${SWAY_DECLARATIONS}`)
                .replace('#include <project_vertex>', SWAY_PROJECTION);
        };
        material.customProgramCacheKey = () => 'willow-sway';
        return material;
    }

    /**
     * A flat disc for the canopy's shade, its alpha in vertex colours: opaque in the middle, still `keep` `at` this share of
     * the radius (as the 2D view's gradient), clear at the rim.
     */
    function shadeGeometry(radius, { at, keep }) {
        const SEGMENTS = 48;
        const positions = [0, 0, 0];
        const colors = [1, 1, 1, 1];
        [[at * radius, keep], [radius, 0]].forEach(([ringRadius, alpha]) => {
            for (let index = 0; index < SEGMENTS; index++) {
                const angle = index / SEGMENTS * TAU;
                positions.push(Math.cos(angle) * ringRadius, 0, Math.sin(angle) * ringRadius);
                colors.push(1, 1, 1, alpha);
            }
        });
        // A fan from the middle to the inner ring, then a band out to the rim; wound to face up.
        const indices = [];
        for (let index = 0; index < SEGMENTS; index++) {
            const next = (index + 1) % SEGMENTS;
            const inner = 1 + index;
            const innerNext = 1 + next;
            const outer = 1 + SEGMENTS + index;
            const outerNext = 1 + SEGMENTS + next;
            indices.push(0, innerNext, inner, inner, innerNext, outerNext, inner, outerNext, outer);
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 4));
        geometry.setIndex(indices);
        return geometry;
    }

    /** The lawn slab with its pond and grass tufts. */
    function buildBase3D(spec, rand, materials) {
        const { ground, colors } = spec;
        const group = new THREE.Group();
        // Cylinder groups: side, top, bottom.
        const slab = new THREE.Mesh(new THREE.CylinderGeometry(ground.radius, ground.radius * 0.96, ground.depth, 64), [materials.soil, materials.turf, materials.soil]);
        slab.position.y = -ground.depth / 2;

        const { pond } = ground;
        const centre = pondCentre(ground);
        const flatDisc = (material, rx, rz, y) => {
            const disc = new THREE.Mesh(new THREE.CircleGeometry(1, 48), material);
            disc.rotation.x = -Math.PI / 2;
            disc.scale.set(rx, rz, 1);
            disc.position.set(centre.x, y, centre.z);
            return disc;
        };
        const bank = flatDisc(materials.bank, pond.rx + pond.bank, pond.rz + pond.bank, 0.0012);
        const water = flatDisc(materials.water, pond.rx, pond.rz, 0.0024);

        const blades = scatterTufts(spec, rand, ground.tufts3D).flatMap(tuft => {
            const color = new THREE.Color(colors.grass[tuft.color]);
            return Array.from({ length: 3 }, () => ({
                position: new THREE.Vector3(tuft.x + (rand() - 0.5) * ground.tuftSpread, 0, tuft.z + (rand() - 0.5) * ground.tuftSpread),
                quaternion: new THREE.Quaternion().setFromEuler(new THREE.Euler((rand() - 0.5) * 0.7, rand() * TAU, (rand() - 0.5) * 0.7, 'YXZ')),
                height: within(rand, ground.bladeHeight),
                color,
            }));
        });
        const grass = instanced(new THREE.ConeGeometry(1, 1, 3).translate(0, 0.5, 0), materials.grass, blades.length);
        blades.forEach((blade, index) => {
            dummy.position.copy(blade.position);
            dummy.quaternion.copy(blade.quaternion);
            dummy.scale.set(0.0032, blade.height, 0.0032);
            dummy.updateMatrix();
            grass.setMatrixAt(index, dummy.matrix);
            grass.setColorAt(index, blade.color);
        });
        dummy.quaternion.identity();
        // Over the pond too: water under the curtain is in its shade as well.
        const shade = new THREE.Mesh(shadeGeometry(ground.shade.radius, ground.shade.falloff), materials.shade);
        shade.position.y = 0.0036;
        group.add(slab, bank, water, grass, shade);
        return group;
    }

    class WillowView extends PlantView {
        constructor() {
            super('willow', WILLOW.stage3D);
            this.spec = WILLOW;
            this.scene3D = null;
            this.swayClock = 0;
            this.sway = {
                uSwayTime: { value: 0 },
                uSwayAmount: { value: 0 },
                uSwayRipple: { value: new THREE.Vector2() },
                uSwayCross: { value: 0 },
            };
            // Materials live as long as the view (they take the spec's colours at every build); geometry is rebuilt with the plant.
            this.materials = {
                bark: new THREE.MeshStandardMaterial({ roughness: 0.95, flatShading: true }),
                strand: withSway(new THREE.MeshStandardMaterial({ roughness: 0.85 }), this.sway),
                // White, so each leaf's and grass blade's own colour comes through per instance.
                leaf: withSway(new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.7, flatShading: true, side: THREE.DoubleSide }), this.sway),
                grass: new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.9, flatShading: true }),
                turf: new THREE.MeshStandardMaterial({ roughness: 1 }),
                soil: new THREE.MeshStandardMaterial({ roughness: 1, flatShading: true }),
                bank: new THREE.MeshStandardMaterial({ roughness: 1 }),
                water: new THREE.MeshStandardMaterial({ roughness: 0.15, metalness: 0.1 }),
                shade: new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0, depthWrite: false }),
            };
        }

        build() {
            const { sway } = this.spec;
            this.sway.uSwayRipple.value.set(...sway.ripple);
            this.sway.uSwayCross.value = sway.cross;
            this.plant2D = buildWillow2D(this.spec);
            this.plant3D = buildWillow3D(this.spec);
            this.buildScene3D(this.plant3D);
        }

        buildScene3D(plant) {
            if (this.scene3D) {
                this.stage.scene.remove(this.scene3D.group);
                // Free every geometry and instance buffer of the old plant; the materials stay.
                this.scene3D.group.traverse(object => {
                    if (!object.isMesh) return;
                    object.geometry.dispose();
                    if (object.isInstancedMesh) object.dispose();
                });
            }
            const { spec, materials } = this;
            ['bark', 'strand', 'turf', 'soil', 'bank', 'water', 'shade'].forEach(name => materials[name].color.set(spec.colors[name]));
            const branchMesh = instanced(unitStem(spec.widthDecay, 8), materials.bark, plant.branches.length);
            // A ball at every fork, so thick limbs don't show a gap where they leave their parent.
            const knuckleMesh = instanced(new THREE.IcosahedronGeometry(1, 1), materials.bark, plant.branches.length);
            const flare = new THREE.Mesh(flareGeometry(spec.flare), materials.bark);

            // Each branchlet piece and leaf carries how far below its attachment it hangs, for the breeze.
            const pieceGeometry = unitStem(0.7, 5);
            pieceGeometry.setAttribute('aSway', new THREE.InstancedBufferAttribute(new Float32Array(plant.pieces.flatMap(piece => [piece.s, piece.length])), 2));
            const pieceMesh = instanced(pieceGeometry, materials.strand, plant.pieces.length);
            const leafShape = leafGeometry(spec.leaves);
            leafShape.setAttribute('aSway', new THREE.InstancedBufferAttribute(new Float32Array(plant.leaves.flatMap(leaf => [leaf.s, 0])), 2));
            const leafMesh = instanced(leafShape, materials.leaf, plant.leaves.length);
            plant.leaves.forEach((leaf, index) => leafMesh.setColorAt(index, leaf.grown));

            const group = new THREE.Group();
            group.add(buildBase3D(spec, mulberry32(spec.seed + 2000), materials), flare, branchMesh, knuckleMesh, pieceMesh, leafMesh);
            this.stage.scene.add(group);
            this.scene3D = { group, flare, branchMesh, knuckleMesh, pieceMesh, leafMesh, fresh: new THREE.Color(spec.colors.leafFresh) };
        }

        draw2D(growth) {
            drawWillow2D(this.view2D, this.plant2D, this.spec, growth);
        }

        update3D(growth) {
            const { spec, plant3D: plant } = this;
            const { flare, branchMesh, knuckleMesh, pieceMesh, leafMesh, fresh } = this.scene3D;
            const thickness = girthAt(spec, growth);
            const progressOf = branch => limbProgress(branch, plant.growDur, growth);
            placeBranches3D(branchMesh, plant.branches, progressOf, branch => branch.width / 2 * thickness);

            // Knuckles swell in as their branch sets off; the trunk has none.
            plant.branches.forEach((branch, index) => {
                const radius = branch.level === 0 ? 0 : branch.width / 2 * thickness * smooth(clamp01(progressOf(branch) * 4));
                dummy.position.copy(branch.start);
                dummy.scale.setScalar(Math.max(radius, 0.00001));
                dummy.updateMatrix();
                knuckleMesh.setMatrixAt(index, dummy.matrix);
            });
            knuckleMesh.instanceMatrix.needsUpdate = true;

            this.materials.shade.opacity = shadeAt(spec, growth);

            // The root flare swells in with the trunk, so it doesn't appear at full width.
            const trunkGrown = progressOf(plant.branches[0]);
            const trunkRadius = spec.trunkWidth / 2 * thickness * smooth(clamp01(trunkGrown * 4));
            flare.scale.set(trunkRadius, Math.max(0.00001, Math.min(spec.flare.height, plant.branches[0].length * trunkGrown)), trunkRadius);
            flare.visible = trunkGrown > 0;

            // Branchlets grow down their fixed curve: each piece is as grown as the branchlet's length has passed it.
            placeBranches3D(pieceMesh, plant.pieces,
                piece => clamp01((strandLengthAt(piece.strand, growth) - piece.s) / piece.length),
                piece => piece.width / 2);

            const { length: leafLength, width: leafWidth } = spec.leaves;
            plant.leaves.forEach((leaf, index) => {
                const open = Math.max(leafOpenAt(leaf, spec, growth) * leaf.size, 0.00001);
                dummy.position.copy(leaf.position);
                dummy.quaternion.copy(leaf.quaternion);
                dummy.scale.set(leafWidth / 2 * open, leafLength * open, leafWidth / 2 * open);
                dummy.updateMatrix();
                leafMesh.setMatrixAt(index, dummy.matrix);
                leafMesh.setColorAt(index, tint.copy(fresh).lerp(leaf.grown, leafMaturityAt(leaf, spec, growth)).multiplyScalar(leaf.light));
            });
            leafMesh.instanceMatrix.needsUpdate = true;
            leafMesh.instanceColor.needsUpdate = true;
            dummy.quaternion.identity();
        }

        animate(dt) {
            const { amplitude, speed, gust, lull } = this.spec.sway;
            this.swayClock += dt;
            this.sway.uSwayTime.value = this.swayClock * speed;
            // The breeze comes and goes.
            const strength = (1 + Math.sin(this.swayClock * gust)) / 2;
            this.sway.uSwayAmount.value = amplitude * lerp(lull, 1, strength);
        }

        stageLabel(growth) {
            const { text, tone } = stageOf(this.spec, growth);
            return { text, tone };
        }

        describe() {
            const count = plant => `${plant.branches.length} limbs, ${plant.strands.length} branchlets, ${plant.leafCount} leaves`;
            return `2D: ${count(this.plant2D)} · 3D: ${count(this.plant3D)}`;
        }
    }

    registerView(new WillowView());
}


// ═══════════════════════════ Page ═══════════════════════════

let activeKey = 'bonsai';
let growth = 0;
let playing = false;
let lastTick = null;
// Each plant's growth and play state, kept while the page is open. A plant shown for the first time starts at 0%.
const savedStates = {};

const activeView = () => VIEWS[activeKey];

/** Seed and counts of the plant on show. */
function showViewInfo() {
    const view = activeView();
    $('seedValue').textContent = `seed ${view.spec.seed}`;
    $('counts').textContent = view.describe();
}

/** Shows one plant's screen and controls; the tab buttons, screens and control groups all carry data-view. */
function showView(key) {
    if (!VIEWS[key]) return;
    if (!VIEWS[key].built) VIEWS[key].rebuild();
    savedStates[activeKey] = { growth, playing };
    const saved = savedStates[key] ?? { growth: 0, playing: false };
    growth = saved.growth;
    setPlaying(saved.playing);
    $('growth').value = String(growth * 100);
    activeKey = key;
    document.querySelectorAll('[data-view]').forEach($_ => {
        if ($_.classList.contains('tab')) $_.classList.toggle('active', $_.dataset.view === key);
        else $_.hidden = $_.dataset.view !== key;
    });
    VIEWS[key].drawnGrowth = null;
    showViewInfo();
}

function setPlaying(on) {
    playing = on;
    $('play').textContent = on ? '⏸ Pause' : '▶ Play';
}

function showGrowth() {
    $('growthValue').textContent = `${(growth * 100).toFixed(1)}%`;
    const { text, tone } = activeView().stageLabel(growth);
    $('stage').className = tone;
    $('stage').textContent = text;
}

document.querySelectorAll('.tab').forEach($_ => { $_.onclick = () => showView($_.dataset.view); });
// Play from the end starts over.
$('play').onclick = () => {
    if (!playing && growth >= 1) growth = 0;
    setPlaying(!playing);
};
$('growth').oninput = () => { growth = Number($('growth').value) / 100; };
$('reseed').onclick = () => {
    const view = activeView();
    view.spec.seed = Math.floor(Math.random() * 100000);
    view.rebuild();
    showViewInfo();
};

function frame(now) {
    // Seconds since the last frame, capped so a backgrounded tab doesn't jump the plant forward when it comes back.
    const dt = lastTick === null ? 0 : Math.min(0.1, (now - lastTick) / 1000);
    lastTick = now;
    if (playing) {
        // 1× = 1% per second.
        growth = Math.min(1, growth + dt * Number($('speed').value) / 100);
        $('growth').value = String(growth * 100);
        if (growth >= 1) setPlaying(false);
    }
    showGrowth();
    activeView().render(growth, dt);
    requestAnimationFrame(frame);
}

showView('bonsai');
requestAnimationFrame(frame);
</script>
