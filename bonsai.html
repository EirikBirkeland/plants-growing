        const clods = keep(instanced(keep(new THREE.IcosahedronGeometry(1, 0)), clodMaterial, clodCount));
        clods.count = clodCount;
        const clodColors = [colors.soilLight, colors.soilDark, colors.soil];
        for (let index = 0; index < clodCount; index++) {
            const angle = rand() * TAU;
            const reach = spec.soilRadius * (0.15 + Math.sqrt(rand()) * 0.68);
            const size = 0.006 + rand() * 0.011;
            // On the mound's surface, which slopes down a little from the stem to the rim.
            dummy.position.set(Math.cos(angle) * reach, -0.008 * reach / (spec.soilRadius * 0.86) + size * 0.2, Math.sin(angle) * reach);
            dummy.rotation.set(rand() * TAU, rand() * TAU, 0);
            dummy.scale.set(size, size * 0.6, size);
            dummy.updateMatrix();
            clods.setMatrixAt(index, dummy.matrix);
            clods.setColorAt(index, tint.set(pick(rand, clodColors)));
        }
        dummy.rotation.set(0, 0, 0);

        const root = new THREE.Group();
        root.add(ground, soil, clods, stem, petioles, leaves, cotyledons, head);
        this.stage.scene.add(root);
        this.parts = {
            root, head, stem, petioles, leaves, cotyledons, florets, petals, bracts, floretPlaces, floretRadius, discMaterial, disposables,
            palette: {
                discYoung: new THREE.Color(colors.discYoung),
                disc: new THREE.Color(colors.disc),
                closed: new THREE.Color(colors.floretClosed),
                pollen: new THREE.Color(colors.pollen),
                seed: new THREE.Color(colors.seed),
                ripe: new THREE.Color(colors.ripe),
                cotyledon: new THREE.Color(colors.cotyledon),
                withered: new THREE.Color(colors.withered),
            },
        };
    }

    draw2D(growth) {
        drawSunflower2D(this.view2D, this.spec, this.plant, this.decor2D, this.rows, growth);
    }

    update3D(growth) {
        const spec = this.spec;
        const plant = this.plant;
        const parts = this.parts;
        const stem = stemAt(plant, spec, growth, this.bends3D);

        // The stem: one straight piece per step, a touch longer so the joints don't show where it bends.
        const segments = stem.dirs.map((dir, index) => makeBranch3D(stem.points[index], dir, stem.step * 1.08, stem.radii[index], 0, 0));
        placeBranches3D(parts.stem, segments, () => (stem.length > 1e-4 ? 1 : 0), segment => segment.width);

        // Leaves on their stalks, at their node's azimuth; a leaf that hasn't started is hidden with its stalk.
        plant.leaves.forEach((leaf, index) => {
            const pose = leafPose(spec, leaf, growth);
            if (pose.grow <= 0) {
                parts.leaves.setMatrixAt(index, HIDDEN);
                parts.petioles.setMatrixAt(index, HIDDEN);
                return;
            }
            const node = alongStem(stem, stem.nodeAt[leaf.node]);
            const size = leaf.size * pose.grow;
            const out = new THREE.Vector3(Math.cos(leaf.azimuth), 0, Math.sin(leaf.azimuth));
            const stalkDir = out.clone().multiplyScalar(Math.cos(pose.stalk)).addScaledVector(UP, Math.sin(pose.stalk));
            const start = node.point.clone().addScaledVector(out, node.radius * 0.7);
            const stalkLength = size * spec.petiole;
            const along = out.clone().multiplyScalar(Math.cos(pose.elevation)).addScaledVector(UP, Math.sin(pose.elevation));
            // Grown blades tip about their midrib towards the light.
            const across = new THREE.Vector3(-Math.sin(leaf.azimuth), 0, Math.cos(leaf.azimuth))
                .applyAxisAngle(along, leaf.roll * pose.mature);
            const normal = new THREE.Vector3().crossVectors(across, along);
            partMatrix.makeBasis(across.multiplyScalar(size * spec.leafWidth), along.multiplyScalar(size), normal.multiplyScalar(size))
                .setPosition(start.clone().addScaledVector(stalkDir, stalkLength));
            parts.leaves.setMatrixAt(index, partMatrix);
            // The stalk: a thin stem from the node out to the blade's base.
            const stalk = makeBranch3D(start, stalkDir, stalkLength, node.radius * 0.3, 0, 0);
            partScale.set(stalk.width, stalk.length, stalk.width);
            parts.petioles.setMatrixAt(index, partMatrix.compose(stalk.start, stalk.quaternion, partScale));
        });
        parts.leaves.instanceMatrix.needsUpdate = true;
        parts.petioles.instanceMatrix.needsUpdate = true;

        this.updateCotyledons(stem, growth);
        this.updateHead(stem, growth);
    }

    /** The seed leaves open sideways from the top of the hypocotyl, square to the hook they came up in. */
    updateCotyledons(stem, growth) {
        const spec = this.spec;
        const { cotyledons, palette } = this.parts;
        const size = cotyledonSize(spec, growth);
        const node = alongStem(stem, stem.hypocotyl);
        const sideways = new THREE.Vector3(Math.cos(this.plant.cotyledonAzimuth), 0, Math.sin(this.plant.cotyledonAzimuth));
        sideways.addScaledVector(node.dir, -sideways.dot(node.dir)).normalize();
        const across = new THREE.Vector3().crossVectors(node.dir, sideways).normalize();
        const spread = cotyledonSpread(spec, growth);
        tint.copy(palette.cotyledon).lerp(palette.withered, cotyledonWither(spec, growth));
        [-1, 1].forEach((sign, index) => {
            cotyledons.setColorAt(index, tint);
            if (size <= 0 || stem.length <= 0) {
                cotyledons.setMatrixAt(index, HIDDEN);
                return;
            }
            const along = node.dir.clone().multiplyScalar(Math.cos(spread)).addScaledVector(sideways, sign * Math.sin(spread));
            const normal = new THREE.Vector3().crossVectors(across, along);
            partMatrix.makeBasis(across.clone().multiplyScalar(size * 0.52), along.multiplyScalar(size), normal.multiplyScalar(size))
                .setPosition(node.point);
            cotyledons.setMatrixAt(index, partMatrix);
        });
        cotyledons.instanceMatrix.needsUpdate = true;
        cotyledons.instanceColor.needsUpdate = true;
    }

    /** The head rides on the stem's tip, turned and sized by growth; its parts move in head units inside it. */
    updateHead(stem, growth) {
        const spec = this.spec;
        const plant = this.plant;
        const { head, florets, petals, bracts, floretPlaces, floretRadius, discMaterial, palette } = this.parts;
        const size = headSizeAt(spec, growth);
        head.visible = size > 0.002;
        head.position.copy(stem.tip);
        headQuaternion(spec, growth, plant.yaw, head.quaternion);
        head.scale.set(1, 1, headStretchAt(spec, growth)).multiplyScalar(Math.max(size, 1e-5));
        discMaterial.color.copy(palette.discYoung).lerp(palette.disc, discDarkness(spec, growth));

        // Florets: closed cushions; on opening they swell and stand up gold with pollen, then settle and darken to seed.
        plant.florets.forEach((floret, index) => {
            const stage = floretStage(spec, floret, growth);
            const wide = floretRadius * floretWidth(stage);
            partScale.set(wide, wide, floretRadius * (0.7 + 0.9 * stage.open - 0.6 * stage.brown));
            partMatrix.compose(floretPlaces[index].position, floretPlaces[index].quaternion, partScale);
            florets.setMatrixAt(index, partMatrix);
            tint.copy(palette.closed).lerp(palette.pollen, stage.open).lerp(palette.seed, stage.brown).lerp(palette.ripe, stage.dark)
                .multiplyScalar(floret.shade);
            florets.setColorAt(index, tint);
        });
        florets.instanceMatrix.needsUpdate = true;
        florets.instanceColor.needsUpdate = true;

        plant.petals.forEach((petal, index) => {
            const stage = petalStage(spec, petal, growth);
            if (stage.length <= 0.002) {
                petals.setMatrixAt(index, HIDDEN);
                return;
            }
            const base = petalSeat(spec, petal);
            const frame = rimFrame(petal.angle, base.radius, base.w, stage.spread, petal.twist);
            const width = petal.width * lerp(0.45, 1, stage.length);
            petals.setMatrixAt(index, rimPartMatrix(partMatrix, frame, width, petal.length * stage.length));
        });
        petals.instanceMatrix.needsUpdate = true;

        plant.bracts.forEach((bract, index) => {
            const base = bractSeat(spec, bract);
            const stage = bractStage(spec, bract, growth);
            const frame = rimFrame(bract.angle, base.radius, base.w, stage.spread, bract.twist);
            bracts.setMatrixAt(index, rimPartMatrix(partMatrix, frame, bract.width * Math.sqrt(stage.size), bract.length * stage.size));
        });
        bracts.instanceMatrix.needsUpdate = true;
    }

    stageLabel(growth) {
        if (growth >= 1) return { text: 'Full bloom 🌻', tone: 'gold' };
        if (growth >= this.spec.openFrom) return { text: 'Blooming', tone: 'gold' };
        if (growth >= this.spec.budFrom) return { text: 'Budding', tone: 'green' };
        return { text: 'Seedling', tone: 'green' };
    }

    describe() {
        const { florets, petals, leaves } = this.plant;
        const [few, many] = this.spirals;
        return `${florets.length} florets in ${few} and ${many} spirals, ${petals.length} petals, ${leaves.length} leaves`;
    }
}

registerView(new SunflowerView());
}

// ===== bamboo =====
{
// ═══════════════════════════ Bamboo ═══════════════════════════
// A grove of Phyllostachys. Shoots break the ground one after another, the thickest first, and telescope upwards internode by
// internode, the lowest finishing first. Their sheaths dry and drop, the upper nodes branch in pairs and leaf out in drooping
// sprays. Bamboo never thickens: a culm comes out of the ground as wide as it will ever be and only gets taller.

const BAMBOO = {
    seed: 23,
    culms2D: 7,                 // culms in the side view
    culms3D: 13,                // culms in the 3D grove
    // ─ The grove
    groveWidth2D: 0.78,         // 2D: the culm bases spread across this width, an even slot each...
    slotJitter2D: 0.8,          // ...wandering by up to this share of a slot, so some come up in pairs and some alone...
    minGap2D: 0.045,            // ...never closer together than this
    groveDepth2D: 0.095,        // 2D: the backmost culm stands this much higher on the ground than the frontmost
    depthFade: 0.34,            // 2D: how far the backmost culm fades into the background (0 = not at all)
    groveRadius: 0.4,           // 3D: the culm bases stand scattered over a rhizome mat this wide (radius)...
    spacing: 0.09,              // ...never closer together than this
    // ─ Culms
    height: [0.5, 1.0],         // the shortest and the tallest culm of every grove
    heightByCentre: 0.5,        // how much the tall culms gather in the middle of the grove (0 = heights at random)
    heightJitter: 0.06,         // a culm's height wanders by up to this share either way
    radius: [0.0095, 0.018],    // culm radius at the base, for the shortest and the tallest...
    radiusJitter: 0.1,          // ...wandering by up to this share either way
    internodes: [8, 13],        // internodes on the shortest and on the tallest culm
    internodeBase: 0.4,         // the lowest internode, as a share of the longest: they lengthen up to the peak...
    internodePeak: 0.4,         // ...this far up the culm...
    internodeTop: 0.6,          // ...and shorten again to this share at the top
    taper: 0.5,                 // a culm narrows gently towards this share of its base radius at the top...
    whipFrom: 0.8,              // ...but from this share of its height up it narrows fast, into a whip...
    whipTip: 0.12,              // ...ending this thin, as a share of its base radius
    lean: [0.02, 0.12],         // radians a culm leans out from the middle of the grove, the outer ones most
    leanWander: 0.9,            // 3D: radians the way a culm leans wanders off straight out from the middle
    arch: 0.6,                  // share of the lean that is a bow (upright at the base, curving out at the top), not a tilt
    culmGloss: 0.3,             // the lit stripe down a culm, this much lighter
    culmShade: 0.32,            // the shaded edge, this much darker
    yellowShare: 0.25,          // the first-born culms, this share of the grove, turn a little yellower at the end...
    yellowMax: 0.4,             // ...at most this far towards colors.culmOld
    // ─ Shoots and sheaths
    shootHeight: 0.1,           // the tallest culm's shoot at full size, before it starts to telescope (smaller culms' less)
    shootWidth: 1.7,            // a shoot is this many times as wide as its culm, thick with sheaths, until the culm telescopes
    spearKeep: 0.35,            // at full height the shoot opens, and a slim green spear this share of its height stays on top
    sheathLength: 0.75,         // a culm sheath, as a share of its internode
    sheathWidth: 1.14,          // sheath radius, as a multiple of the culm's; a telescoping shoot slims to this too
    sheathSwing: 0.6,           // radians a sheath swings out from the culm as it peels off and drops
    fallenSheaths: 4,           // the lowest sheaths of every culm stay on the ground once they have dropped
    // ─ Branches and leaves
    branchFrom: 0.5,            // nodes above this share of the culm branch
    branchLength: 0.21,         // the longest branch, low in the crown of the tallest culm...
    crownTaper: 0.6,            // ...the branches shortening by this share up to the top node
    branchAngle: 0.8,           // radians a node's main branch leans out from the culm
    secondBranch: 0.6,          // Phyllostachys branches in pairs: the second is this share of the first, in length and lean
    pairSpread: 0.55,           // 3D: radians round the culm between the two branches of a pair
    topTuft: { tilt: 0.7, shares: [0.6, 0.55] }, // the top node's two short branches: radians out from the culm, length shares
    branchArch: 0.12,           // 2D: how much a branch bows up and droops at the tip under its leaves
    branchWidth: 0.3,           // branch radius, as a share of the culm's at its node
    twigs: [2, 3],              // twigs along every branch...
    twigSpan: [0.35, 0.85],     // ...spread over this stretch of it, off alternate sides...
    twigAngle: [0.45, 0.8],     // ...leaving it at this many radians
    twigLength: 0.45,           // a twig, as a share of its branch
    twigWidth: 0.6,             // a twig's width, as a share of its branch's
    sprayLeaves: [3, 6],        // leaves in a spray, at every twig tip and branch end
    sprayFrom: 0.4,             // a spray starts to unroll once its twig is this far through its growing time, riding its tip
    leafLength: [0.055, 0.085], // narrow, lance-shaped leaves
    leafWidth: 0.15,            // leaf width as a share of its length
    leafRolled: 0.15,           // a new leaf comes out rolled up, this share of its full width
    leafFan: 1.6,               // radians a spray fans across
    leafDroop: 0.95,            // how far the leaves hang (0 = straight out along the twig)
    leafRise: 0.3,              // the steepest a leaf may point upwards (rise over run): bamboo leaves hang
    leafGloss: 0.16,            // the half of a leaf facing the sky, this much lighter
    leafFreshness: 0.5,         // a new leaf is this far towards colors.leafFresh, until it darkens
    // ─ Ground
    groundRadius: 0.55,         // 3D: the earth patch...
    groundRim: 0.022,           // ...its edge sloping down this far to the floor
    mound: 0.012,               // 3D: the patch rises this much in the middle
    floorRadius: 0.8,           // 3D: the dark floor round the patch
    groundWidth2D: 0.62,        // 2D: half the width of the earth patch...
    groundTilt2D: 0.16,         // ...seen from low down, an ellipse this flat
    litter2D: 60,               // old fallen leaves on the ground in 2D...
    litter3D: 170,              // ...and in 3D
    // ─ When things happen (growth 0–1)
    timeline: {
        emerge: [0.02, 0.28],   // the shoots break the ground one after another in this window, the thickest first...
        emergeJitter: 0.1,      // ...each but the first up to this share of the window late
        rise: 0.07,             // a shoot pushes up to its full size over this much growth...
        telescope: 0.3,         // ...then its internodes extend, bottom first, the top one done this much later
        internodeShare: 0.3,    // share of that span every internode spends extending: overlaps keep it smooth
        sheathHold: 0.04,       // a sheath stays on for this long after its internode has finished...
        sheathFall: 0.07,       // ...then peels off and drops over this long
        spearOpen: 0.05,        // at full height the shoot tip opens into its green spear over this long
        branchDelay: 0.02,      // at full height, the top node branches this much later...
        nodeStagger: 0.012,     // ...and every node further down this much after the one above it
        branchGrow: 0.09,       // a branch reaches full length over this long...
        twigGrow: 0.6,          // ...a twig over this share of that
        leafGrow: 0.07,         // a leaf unrolls to full size over this long
        mature: 0.15,           // fresh pale internodes and lime leaves darken to their final colours over this long
        yellowing: [0.75, 1],   // the first-born culms turn a little yellower in this window
    },
    colors: {
        culm: '#4f8f34',        // a mature culm
        culmOld: '#a8a248',     // what the first-born culms turn towards
        culmFresh: '#a2d27c',   // a freshly extended internode, still dusted with white bloom
        node: '#c8d398',        // the pale waxy band at every node
        nodeRidge: '#355d24',   // the ridge of the node itself
        sheath: '#74482a',      // shoots and culm sheaths: a rich red-brown, darker than the litter
        sheathDry: '#c4a56a',   // a sheath drying as it peels off
        sheathSpot: '#2c1a0e',  // the dark mottling on sheaths
        sheathFallen: '#8a6a42', // a dropped sheath on the ground, a little darker than the litter
        branch: '#6c8d3b',      // branches and twigs
        leaf: ['#3c8737', '#4b9840', '#5aa647', '#33772f'], // leaf greens, one picked per leaf
        leafFresh: '#acd86c',   // a new leaf, before it darkens
        earth: '#3a2a1c',       // the soil
        earthRim: '#2a1f15',    // the soil's edge (2D) and the collar round a culm's foot
        floor: '#12161f',       // 3D: the floor the patch lies on
        litter: ['#a08d64', '#837352', '#b5a478', '#6a5d44'], // old leaves on the ground: pale, greyed straw
        background: '#1a1f2b',  // 2D: the panel, which the back culms fade into
    },
};

// 2D scene units that must fit the canvas at the least (a grove whose crowns reach further gets more room, see frameOf2D),
// and the 3D camera: the grove is taller than the bonsai, and the front edge of its earth patch stays in view.
const FRAME_2D = { across: 1.42, up: 1.3, base: 0.15, margin: 0.03 };
const STAGE_3D = { target: [0, 0.45, 0], cameraAt: [0, 0.75, 2.35] };
// Leaves ripen one by one. Drawing them in small steps of ripeness keeps the 2D fills few, and one step is too small to see.
const RIPENESS_STEPS = 12;

const lerp = (from, to, t) => from + (to - from) * t;
const within = (rand, [low, high]) => low + (high - low) * rand();
/** 1, give or take up to `share`. */
const wander = (rand, share) => 1 + (rand() * 2 - 1) * share;
const median = values => [...values].sort((a, b) => a - b)[Math.floor(values.length / 2)];
/** 0 before `from`, 1 once `span` has passed, linear in between; a zero span is a plain step. */
const progressBetween = (growth, from, span) => (span > 0 ? clamp01((growth - from) / span) : (growth >= from ? 1 : 0));
/** Colours darkening to their final shade over timeline.mature after `from`, always complete at growth 1. */
function ripeness(growth, from) {
    const start = Math.min(from, 0.98);
    return smooth(progressBetween(growth, start, Math.min(BAMBOO.timeline.mature, 1 - start)));
}
const yellowingAt = growth => smooth(progressBetween(growth, BAMBOO.timeline.yellowing[0], BAMBOO.timeline.yellowing[1] - BAMBOO.timeline.yellowing[0]));
const branchProgress = (branch, growth) => easeOut(progressBetween(growth, branch.birth, branch.grow));
const leafSize = (leaf, growth) => smooth(progressBetween(growth, leaf.birth, BAMBOO.timeline.leafGrow));
// A new leaf comes out rolled up like a needle and opens a little after it starts to lengthen.
const leafUnroll = (leaf, growth) => lerp(BAMBOO.leafRolled, 1, smooth(progressBetween(growth, leaf.birth + BAMBOO.timeline.leafGrow * 0.3, BAMBOO.timeline.leafGrow * 0.7)));
/** A leaf comes out lime and darkens to its own green once it is full-grown: 0 still lime, 1 done. */
const leafRipeness = (leaf, growth) => ripeness(growth, leaf.birth + BAMBOO.timeline.leafGrow);
/** A node's waxy band and ridge show once the internode below has stretched. */
const nodeShown = extension => smooth(clamp01((extension - 0.3) / 0.5));

// ─── One culm, in 2D and 3D alike ───

/** Internode lengths up a culm: short at the base, longest a little below the middle, shorter again towards the top. */
function internodeLengths(count, height) {
    const { internodeBase, internodePeak, internodeTop } = BAMBOO;
    const shares = Array.from({ length: count }, (_, index) => {
        const at = (index + 0.5) / count;
        if (at < internodePeak) return lerp(internodeBase, 1, Math.sin(at / internodePeak * Math.PI / 2));
        return lerp(1, internodeTop, Math.pow((at - internodePeak) / (1 - internodePeak), 1.5));
    });
    const total = shares.reduce((sum, share) => sum + share, 0);
    return shares.map(share => share / total * height);
}

/** A culm's radius `along` units up from its base: bamboo tapers only gently, until its top narrows into a whip. */
function radiusAt(culm, along) {
    const { taper, whipFrom, whipTip } = BAMBOO;
    const share = clamp01(along / culm.height);
    const gentle = 1 - (1 - taper) * Math.pow(share, 1.2);
    return culm.radius * lerp(gentle, whipTip, smooth(progressBetween(share, whipFrom, 1 - whipFrom)));
}

/** A culm's size before it is stretched to the grove: partly how near the middle it stands, partly chance. */
const rawSize = (centred, rand) => lerp(rand(), centred, BAMBOO.heightByCentre);

/** Stretches raw sizes so every grove's shortest culm is 0 and its tallest 1: each grove spans the spec's whole height range. */
function stretchSizes(raws) {
    const low = Math.min(...raws);
    const high = Math.max(...raws);
    return raws.map(raw => (high > low ? (raw - low) / (high - low) : 1));
}

/** What every culm has, from its size: 0 is the grove's shortest, 1 its tallest. */
function culmShape(size, rand) {
    const height = lerp(...BAMBOO.height, size) * wander(rand, BAMBOO.heightJitter);
    const count = Math.round(lerp(...BAMBOO.internodes, size));
    const lengths = internodeLengths(count, height);
    // How far up the culm each node sits once it is fully grown, from the base (node 0) to the top (node `count`).
    const nodes = [0];
    lengths.forEach(length => nodes.push(nodes[nodes.length - 1] + length));
    return {
        size, height, count, lengths, nodes,
        radius: lerp(...BAMBOO.radius, size) * wander(rand, BAMBOO.radiusJitter),
        shootHeight: BAMBOO.shootHeight * (0.55 + 0.45 * size),
        // The side the lowest sheath opens to and the lowest branches go; it swaps at every node.
        side: rand() < 0.5 ? 1 : -1,
    };
}

/** When each part of one culm grows, from the growth at which its shoot breaks the ground. */
function culmTimeline(birth, count) {
    const { rise, telescope, internodeShare, sheathHold } = BAMBOO.timeline;
    const telescopeFrom = birth + rise;
    const span = telescope * internodeShare;
    const internodes = Array.from({ length: count }, (_, index) => {
        const start = telescopeFrom + (telescope - span) * index / Math.max(1, count - 1);
        return { start, end: start + span, sheathOff: start + span + sheathHold };
    });
    return { birth, telescopeFrom, fullHeight: telescopeFrom + telescope, internodes };
}

/**
 * The shoots break the ground thickest first (as in a real grove), spread over the emergence window. The first-born are the
 * oldest culms, so they are the ones that turn a little yellower at the end.
 */
function scheduleCulms(culms, rand) {
    const [from, to] = BAMBOO.timeline.emerge;
    const { emergeJitter } = BAMBOO.timeline;
    const bySize = [...culms].sort((a, b) => b.size - a.size);
    bySize.forEach((culm, rank) => {
        const share = rank / Math.max(1, bySize.length - 1);
        // The first shoot comes up right at the start of the window, in both views alike.
        const late = rank === 0 ? 0 : rand() * emergeJitter;
        culm.timeline = culmTimeline(lerp(from, to, clamp01(share * (1 - emergeJitter) + late)), culm.count);
        culm.yellow = rank < bySize.length * BAMBOO.yellowShare ? BAMBOO.yellowMax * (0.6 + rand() * 0.4) : 0;
    });
}

/** A node branches once its culm is at full height: the top node first, every node below a little later. */
const branchBirth = (culm, node) =>
    culm.timeline.fullHeight + BAMBOO.timeline.branchDelay + (culm.count - node) * BAMBOO.timeline.nodeStagger;

/** The growth at which a dropped sheath has landed on the ground. */
const fallenProgress = (culm, index, growth) =>
    smooth(progressBetween(growth, culm.timeline.internodes[index].sheathOff + BAMBOO.timeline.sheathFall * 0.5, BAMBOO.timeline.sheathFall * 0.6));

/**
 * One culm at `growth`, as distances up the culm: how far each internode has extended, where each node is, the sheathed shoot
 * tip and every sheath. 2D and 3D only differ in where those distances end up.
 */
function culmState(culm, growth) {
    const { timeline } = culm;
    const { rise, spearOpen, sheathFall } = BAMBOO.timeline;
    const extension = timeline.internodes.map(({ start, end }) => smooth(progressBetween(growth, start, end - start)));
    const along = [0];
    culm.lengths.forEach((length, index) => along.push(along[index] + length * extension[index]));
    const top = along[culm.count];

    // The shoot tip: a fat cone of sheaths that pushes up to full size; as soon as the culm telescopes under it, it slims to
    // the width of the sheaths below, so shoot and culm make one spear, widest at the base. At full height it opens and a
    // slim green spear stays at the heart of the top tuft.
    const risen = easeOut(progressBetween(growth, timeline.birth, rise));
    const opened = smooth(progressBetween(growth, timeline.fullHeight, spearOpen));
    const tipHeight = culm.shootHeight * risen * lerp(1, 0.5, top / culm.height) * lerp(1, BAMBOO.spearKeep, opened);
    const slimmed = smooth(clamp01(top / culm.lengths[0]));
    const sheathed = radiusAt(culm, top) * lerp(BAMBOO.shootWidth, BAMBOO.sheathWidth, slimmed) * Math.pow(risen, 0.6);
    const tipRadius = lerp(sheathed, radiusAt(culm, top), opened);

    // A sheath wraps the base of its internode from the moment it starts to extend, never reaching past the shoot tip,
    // and peels off a little after the internode is done.
    const sheaths = timeline.internodes.map(({ sheathOff }, index) => {
        const unfolded = smooth(clamp01(extension[index] * 4));
        const length = Math.min(culm.lengths[index] * BAMBOO.sheathLength * unfolded, top + tipHeight * 0.25 - along[index]);
        return { length: Math.max(0, length), peel: smooth(progressBetween(growth, sheathOff, sheathFall)) };
    });
    return { extension, along, top, risen, opened, tipHeight, tipRadius, sheaths };
}

/** Growth at which each named stage begins, once most of the grove has got there; the grove once its last leaf is full-grown. */
function stagesOf(groves) {
    const culms = groves.flatMap(grove => grove.culms);
    return {
        shootingUp: median(culms.map(culm => culm.timeline.telescopeFrom)) + 0.03,
        branching: median(culms.map(culm => branchBirth(culm, culm.count))),
        grove: Math.max(...culms.map(culm => culm.leafDone)),
    };
}

// ─── The crown, in 2D and 3D alike: what grows where and when; each view gives it its own directions ───

/** The lowest node that branches: only the upper part of a culm does. */
const firstCrownNode = culm => Math.ceil(culm.count * BAMBOO.branchFrom);

/**
 * The branches at one node: a pair, the second shorter and steeper, or at the top node a short tuft. Each has a length
 * (shorter up the crown), a width, how far it leans out from the culm (`tilt`, radians) and when it grows.
 */
function nodeBranches(culm, node, rand) {
    const firstNode = firstCrownNode(culm);
    const upper = (node - firstNode) / Math.max(1, culm.count - firstNode);
    const length = BAMBOO.branchLength * (0.5 + 0.5 * culm.size) * (1 - BAMBOO.crownTaper * upper) * (0.85 + rand() * 0.3);
    const width = 2 * radiusAt(culm, culm.nodes[node]) * BAMBOO.branchWidth;
    const pair = node === culm.count
        ? BAMBOO.topTuft.shares.map(share => ({ share, tilt: BAMBOO.topTuft.tilt }))
        : [{ share: 1, tilt: BAMBOO.branchAngle }, { share: BAMBOO.secondBranch, tilt: BAMBOO.branchAngle * BAMBOO.secondBranch }];
    return pair.map(({ share, tilt }, index) => ({
        length: length * share,
        width: width * Math.sqrt(share),
        tilt: tilt * (0.85 + rand() * 0.3),
        birth: branchBirth(culm, node) + index * 0.01,
        grow: BAMBOO.timeline.branchGrow,
    }));
}

/** The twigs along a branch: where along it each one starts, how long and wide it is, and when it grows. */
function twigPlans(parent, rand) {
    const count = Math.round(within(rand, BAMBOO.twigs));
    return Array.from({ length: count }, (_, index) => {
        const at = lerp(...BAMBOO.twigSpan, (index + 0.5) / count);
        return {
            index, at,
            length: parent.length * BAMBOO.twigLength * (1 - 0.3 * at) * (0.8 + rand() * 0.4),
            width: parent.width * BAMBOO.twigWidth,
            // A twig starts once its branch has grown past it.
            birth: parent.birth + parent.grow * at,
            grow: parent.grow * BAMBOO.timeline.twigGrow,
        };
    });
}

/** When the spray at the tip of a branch or twig starts to unroll: while it is still growing, riding its tip. */
const sprayBirth = branch => branch.birth + branch.grow * BAMBOO.sprayFrom;

/** The spec's colours as [r, g, b] (lists stay lists), for mixing in 2D. */
function rgbPalette() {
    const toRgb = value => Array.isArray(value) ? value.map(hexToRgb) : hexToRgb(value);
    return Object.fromEntries(Object.entries(BAMBOO.colors).map(([name, value]) => [name, toRgb(value)]));
}
const blend = (from, to, t) => from.map((channel, index) => channel + (to[index] - channel) * t);
const WHITE = [255, 255, 255];
const BLACK = [0, 0, 0];

// ─── Bamboo in 2D ───

/** The direction a 2D branch (or culm) runs in at t (0–1): the derivative of its curve. */
function angleOnBranch(branch, t) {
    const { cx, cy, ex, ey } = controlAndEnd(branch);
    const dx = 2 * (1 - t) * (cx - branch.x) + 2 * t * (ex - cx);
    const dy = 2 * (1 - t) * (cy - branch.y) + 2 * t * (ey - cy);
    return Math.atan2(dy, dx);
}

/** Twigs along a 2D branch, off alternate sides. */
function twigs2D(parent, rand) {
    const firstSide = rand() < 0.5 ? 1 : -1;
    return twigPlans(parent, rand).map(({ index, at, length, width, birth, grow }) => {
        const [x, y] = pointOnBranch(parent, at);
        const side = index % 2 === 0 ? firstSide : -firstSide;
        const twig = makeBranch2D(x, y, angleOnBranch(parent, at) + side * within(rand, BAMBOO.twigAngle), length, width, 2, birth);
        twig.grow = grow;
        return twig;
    });
}

/** A spray of leaves fanned out from the tip of a branch or twig, hanging down. */
function spray2D(culm, branch, rand) {
    const count = Math.round(within(rand, BAMBOO.sprayLeaves));
    const size = (0.75 + 0.25 * culm.size) * (0.9 + 0.1 * culm.depth);
    const angle = angleOnBranch(branch, 1);
    const twigSide = Math.cos(angle) >= 0 ? 1 : -1;
    const steepest = Math.atan(BAMBOO.leafRise);
    for (let $_ = 0; $_ < count; $_++) {
        const fan = count === 1 ? 0 : $_ / (count - 1) - 0.5;
        const turned = angle + fan * BAMBOO.leafFan + (rand() - 0.5) * 0.3;
        // Hanging: every leaf turns down on its own side of the twig, so even one fanned straight up ends up drooping.
        const droop = BAMBOO.leafDroop * (0.7 + rand() * 0.6);
        const side = Math.abs(Math.cos(turned)) > 1e-3 ? Math.sign(Math.cos(turned)) : twigSide;
        const elevation = Math.asin(Math.sin(turned));
        const hung = Math.min(steepest, elevation - droop * 0.5 * (elevation + Math.PI / 2));
        culm.leaves.push({
            branch,
            angle: side > 0 ? hung : Math.PI - hung,
            length: within(rand, BAMBOO.leafLength) * size,
            tone: Math.floor(rand() * BAMBOO.colors.leaf.length),
            birth: sprayBirth(branch) + rand() * 0.025,
        });
    }
}

/** Branch pairs at the upper nodes (a short tuft at the top one), twigs along every branch, a spray at every tip. */
function growCrown2D(culm, rand) {
    culm.branches = [];
    culm.leaves = [];
    for (let node = firstCrownNode(culm); node <= culm.count; node++) {
        const t = culm.nodes[node] / culm.height;
        const [x, y] = pointOnBranch(culm.path, t);
        const culmAngle = angleOnBranch(culm.path, t);
        // Both branches of a node leave on the same side, the second one steeper; the side swaps from node to node.
        // The top node's tuft splits, one branch each way.
        const side = (node % 2 === 0 ? 1 : -1) * culm.side;
        nodeBranches(culm, node, rand).forEach(({ length, width, tilt, birth, grow }, index) => {
            const turn = node === culm.count ? (index === 0 ? tilt : -tilt) : -side * tilt;
            const angle = culmAngle + turn;
            // Bowed upwards whichever way it points, so the tip droops under its leaves.
            const bow = BAMBOO.branchArch * (Math.cos(angle) >= 0 ? 1 : -1);
            const branch = makeBranch2D(x, y, angle, length, width * culm.widthScale, 1, birth, bow);
            branch.grow = grow;
            const { branches, tips } = growGenerations({ trunk: branch, generations: 2, cap: 64, spawn: parent => twigs2D(parent, rand) });
            culm.branches.push(...branches);
            [branch, ...tips].forEach(end => spray2D(culm, end, rand));
        });
    }
    culm.leafDone = Math.max(...culm.leaves.map(leaf => leaf.birth)) + BAMBOO.timeline.leafGrow;
    // By tone, and oldest first within a tone: leaves at the same step of ripeness then come in runs that share one fill.
    culm.leavesByTone = BAMBOO.colors.leaf.map((_, tone) => culm.leaves.filter(leaf => leaf.tone === tone).sort((a, b) => a.birth - b.birth));
}

/** The mottling on every sheath and on the shoot, and the lowest sheaths' places on the ground once they drop. */
function dressCulm2D(culm, rand) {
    culm.sheathSpots = culm.lengths.map(() => Array.from({ length: 3 }, () => ({ u: 0.15 + rand() * 0.65, v: (rand() - 0.5) * 1.4 })));
    culm.tipSpots = Array.from({ length: 5 }, () => {
        const u = 0.08 + rand() * 0.5;
        return { u, v: (rand() - 0.5) * 1.3 * (1 - u) };
    });
    culm.fallen = Array.from({ length: Math.min(BAMBOO.fallenSheaths, culm.count) }, (_, index) => ({
        index,
        x: culm.path.x + (rand() < 0.5 ? -1 : 1) * (0.03 + rand() * 0.07),
        y: culm.path.y + (rand() - 0.5) * 0.025,
        angle: (rand() - 0.5) * 0.6 + (rand() < 0.5 ? 0 : Math.PI),
        length: culm.lengths[index] * BAMBOO.sheathLength,
    }));
}

/** The culm bases across the 2D grove: an even slot each, wandering within it, nudged apart where two came too close. */
function spreadBases2D(rand) {
    const count = BAMBOO.culms2D;
    const slot = BAMBOO.groveWidth2D / count;
    const xs = Array.from({ length: count }, (_, index) => {
        const middle = (index + 0.5) * slot - BAMBOO.groveWidth2D / 2;
        return middle + (rand() - 0.5) * BAMBOO.slotJitter2D * slot;
    });
    for (let $_ = 1; $_ < count; $_++) xs[$_] = Math.max(xs[$_], xs[$_ - 1] + BAMBOO.minGap2D);
    return xs;
}

/** The 2D framing: FRAME_2D at the least, more where this grove's full-grown crowns reach further, so none runs off the canvas. */
function frameOf2D(culms) {
    let top = 0;
    let side = BAMBOO.groundWidth2D;
    culms.forEach(culm => {
        const [x, y] = pointOnBranch(culm.path, 1);
        // The shoot tip on a culm just at full height, before it opens.
        top = Math.max(top, y + culm.shootHeight * 0.5);
        side = Math.max(side, Math.abs(x));
        culm.leaves.forEach(leaf => {
            const { ex, ey } = controlAndEnd(leaf.branch);
            top = Math.max(top, ey + Math.max(0, Math.sin(leaf.angle)) * leaf.length);
            side = Math.max(side, Math.abs(ex + Math.cos(leaf.angle) * leaf.length));
        });
    });
    const { across, up, base, margin } = FRAME_2D;
    return { across: Math.max(across, 2 * (side + margin)), up: Math.max(up, top + base + margin), base };
}

function buildGrove2D() {
    const rand = mulberry32(BAMBOO.seed);
    const half = BAMBOO.groveWidth2D / 2;
    const xs = spreadBases2D(rand);
    const sizes = stretchSizes(xs.map(x => rawSize(1 - Math.min(1, Math.abs(x) / half), rand)));
    const culms = xs.map((x, index) => {
        const culm = culmShape(sizes[index], rand);
        culm.depth = rand();                                // 0 at the back of the grove, 1 at the front
        culm.widthScale = 0.8 + 0.2 * culm.depth;           // the ones further back look a little thinner...
        culm.fade = (1 - culm.depth) * BAMBOO.depthFade;    // ...and fade into the panel
        // Lean out from the middle, the outer culms most. The bow keeps the base upright and curves the top out.
        const lean = within(rand, BAMBOO.lean) * Math.max(-1, Math.min(1, x / half * 1.4)) + (rand() - 0.5) * 0.03;
        const baseY = (0.5 - culm.depth) * BAMBOO.groveDepth2D;
        culm.path = makeBranch2D(x, baseY, Math.PI / 2 - lean, culm.height, culm.radius, 0, 0, Math.tan(lean * BAMBOO.arch) / 2);
        return culm;
    });
    scheduleCulms(culms, rand);
    culms.forEach(culm => {
        growCrown2D(culm, rand);
        dressCulm2D(culm, rand);
    });
    const litter = Array.from({ length: BAMBOO.litter2D }, () => {
        const turn = rand() * TAU;
        const reach = Math.sqrt(rand()) * 0.92;
        return {
            x: Math.cos(turn) * reach * BAMBOO.groundWidth2D,
            y: Math.sin(turn) * reach * BAMBOO.groundWidth2D * BAMBOO.groundTilt2D,
            // Lying flat and seen almost edge-on: mostly sideways.
            angle: (rand() - 0.5) * 0.7 + (rand() < 0.5 ? 0 : Math.PI),
            length: within(rand, BAMBOO.leafLength) * 0.9,
            tone: Math.floor(rand() * BAMBOO.colors.litter.length),
        };
    });
    // Back to front, so the front culms paint over the ones behind.
    culms.sort((a, b) => a.depth - b.depth);
    return {
        culms,
        frame: frameOf2D(culms),
        litterByTone: BAMBOO.colors.litter.map((_, tone) => litter.filter(leaf => leaf.tone === tone)),
    };
}

/** Adds a lance-shaped leaf to the current path: both halves, or with side ±1 only the half on that side of the midrib. */
function leafPath2D(g, { sx, sy }, x, y, angle, length, width, side = 0) {
    const dx = Math.cos(angle);
    const dy = Math.sin(angle);
    // Control points 30% along: the leaf is widest before its middle and runs out into a long point.
    const midX = x + dx * length * 0.3;
    const midY = y + dy * length * 0.3;
    const nx = -dy * width;
    const ny = dx * width;
    const tipX = sx(x + dx * length);
    const tipY = sy(y + dy * length);
    g.moveTo(sx(x), sy(y));
    if (side === 0) {
        g.quadraticCurveTo(sx(midX + nx), sy(midY + ny), tipX, tipY);
        g.quadraticCurveTo(sx(midX - nx), sy(midY - ny), sx(x), sy(y));
    } else {
        g.quadraticCurveTo(sx(midX + nx * side), sy(midY + ny * side), tipX, tipY);
        g.lineTo(sx(x), sy(y));
    }
    g.closePath();
}

/** Fills the band of a culm segment between two offsets across it (+1 is its left edge, −1 its right), in pixels. */
function band2D(g, [x0, y0], [x1, y1], w0, w1, from, to) {
    const length = Math.hypot(x1 - x0, y1 - y0) || 1;
    // Left of the way the segment runs, on screen (where y runs down).
    const lx = (y1 - y0) / length;
    const ly = -(x1 - x0) / length;
    g.beginPath();
    g.moveTo(x0 + lx * w0 * from, y0 + ly * w0 * from);
    g.lineTo(x1 + lx * w1 * from, y1 + ly * w1 * from);
    g.lineTo(x1 + lx * w1 * to, y1 + ly * w1 * to);
    g.lineTo(x0 + lx * w0 * to, y0 + ly * w0 * to);
    g.closePath();
    g.fill();
}

/** A culm's local frame at `along`: (u, v) → pixels, u up the culm and v across it to the left, both in scene units. */
function culmFrame2D(culm, along, { sx, sy }) {
    const t = along / culm.height;
    const [bx, by] = pointOnBranch(culm.path, t);
    const angle = angleOnBranch(culm.path, t);
    const ux = Math.cos(angle);
    const uy = Math.sin(angle);
    return (u, v) => [sx(bx + ux * u - uy * v), sy(by + uy * u + ux * v)];
}

/**
 * A sheath at the base of its internode: brown and mottled. When it goes, it dries, swings out a little to its open side and
 * drops down the culm, curling up smaller as it falls.
 */
function drawSheath2D(g, frame, culm, state, index, paint, palette) {
    const { length, peel } = state.sheaths[index];
    const width = radiusAt(culm, state.along[index]) * culm.widthScale * BAMBOO.sheathWidth;
    // Falling, ever faster, from its node to the ground.
    const at = culmFrame2D(culm, state.along[index] * (1 - peel * peel), frame);
    const side = (index % 2 === 0 ? 1 : -1) * culm.side;
    // It hinges at the foot of its open side.
    const swing = side * peel * BAMBOO.sheathSwing;
    const keep = 1 - peel;
    const hinge = side * width;
    const place = (u, v) => {
        const dv = v - hinge;
        return at((u * Math.cos(swing) - dv * Math.sin(swing)) * keep, (u * Math.sin(swing) + dv * Math.cos(swing)) * keep + hinge);
    };
    // The outline with its open side up (+v), mirrored by `side`: a sleeve with a slanting top and a narrow reflexed blade.
    const outline = [[0, -1], [0.8, -0.92], [0.9, -0.15], [1.3, 0.6], [0.97, 0.45], [1, 0.92], [0, 1]];
    g.fillStyle = paint(blend(palette.sheath, palette.sheathDry, peel));
    g.beginPath();
    outline.forEach(([u, v], corner) => {
        const [px, py] = place(u * length, v * width * side);
        if (corner === 0) g.moveTo(px, py);
        else g.lineTo(px, py);
    });
    g.closePath();
    g.fill();
    // Spots grow with the sheath as it unfolds and shrink with it as it goes.
    const unfolded = clamp01(length / (culm.lengths[index] * BAMBOO.sheathLength));
    const spot = width * 0.16 * keep * unfolded * frame.scale;
    if (spot < 0.4) return;
    g.fillStyle = paint(blend(palette.sheathSpot, palette.sheathDry, peel * 0.6));
    g.beginPath();
    culm.sheathSpots[index].forEach(({ u, v }) => {
        const [px, py] = place(u * length, v * width);
        g.moveTo(px + spot, py);
        g.arc(px, py, spot, 0, TAU);
    });
    g.fill();
}

/** The shoot tip: a spear of overlapping sheaths sitting on the culm's top node; once it opens, a slim green spear. */
function drawTip2D(g, frame, culm, state, paint, palette) {
    const at = culmFrame2D(culm, state.top, frame);
    const radius = state.tipRadius * culm.widthScale;
    const height = state.tipHeight;
    const body = blend(palette.sheath, palette.leafFresh, state.opened);
    g.fillStyle = paint(body);
    g.beginPath();
    g.moveTo(...at(0, radius));
    g.quadraticCurveTo(...at(height * 0.45, radius * 0.95), ...at(height, 0));
    g.quadraticCurveTo(...at(height * 0.45, -radius * 0.95), ...at(0, -radius));
    g.closePath();
    g.fill();
    // The lit flank, and the edge of the outer sheath wrapping round (only where there is room to see it).
    g.fillStyle = paint(blend(body, WHITE, 0.18));
    g.beginPath();
    g.moveTo(...at(0, radius * 0.8));
    g.quadraticCurveTo(...at(height * 0.45, radius * 0.75), ...at(height, 0));
    g.quadraticCurveTo(...at(height * 0.4, radius * 0.3), ...at(0, radius * 0.25));
    g.closePath();
    g.fill();
    const pixels = radius * frame.scale;
    if (pixels < 2) return;
    g.strokeStyle = paint(blend(body, BLACK, 0.35));
    g.lineWidth = Math.max(1, pixels * 0.16);
    g.beginPath();
    g.moveTo(...at(0, radius * 0.9));
    g.quadraticCurveTo(...at(height * 0.35, -radius * 0.25), ...at(height * 0.72, -radius * 0.18));
    g.stroke();
    const spot = pixels * 0.14 * (1 - state.opened);
    if (spot < 0.4) return;
    g.fillStyle = paint(palette.sheathSpot);
    g.beginPath();
    culm.tipSpots.forEach(({ u, v }) => {
        const [px, py] = at(u * height, v * radius);
        g.moveTo(px + spot, py);
        g.arc(px, py, spot, 0, TAU);
    });
    g.fill();
}

function drawCulm2D(g, frame, culm, palette, growth) {
    const state = culmState(culm, growth);
    if (state.risen <= 0) return;
    const { sx, sy, scale } = frame;
    const paint = rgb => mixRgb(rgb, palette.background, culm.fade);
    const points = state.along.map(along => {
        const [x, y] = pointOnBranch(culm.path, along / culm.height);
        return [sx(x), sy(y)];
    });
    const widthAt = along => radiusAt(culm, along) * culm.widthScale * scale;
    const mature = blend(palette.culm, palette.culmOld, culm.yellow * yellowingAt(growth));

    // The soil the shoot pushed aside: a dark collar round its foot.
    g.fillStyle = paint(palette.earthRim);
    g.beginPath();
    g.ellipse(points[0][0], points[0][1], culm.radius * scale * 2.4 * state.risen, culm.radius * scale * 0.55 * state.risen, 0, 0, TAU);
    g.fill();

    // Internodes: the body, a lit stripe and a shaded edge; fresh pale green, darkening as each one matures.
    // They extend in order, so the first one that hasn't started ends the culm.
    for (let index = 0; index < culm.count && state.extension[index] > 0; index++) {
        const color = blend(palette.culmFresh, mature, ripeness(growth, culm.timeline.internodes[index].end));
        const w0 = widthAt(state.along[index]);
        const w1 = widthAt(state.along[index + 1]);
        [[-1, 1, color], [0.2, 0.68, blend(color, WHITE, BAMBOO.culmGloss)], [-1, -0.55, blend(color, BLACK, BAMBOO.culmShade)]]
            .forEach(([from, to, shade]) => {
                g.fillStyle = paint(shade);
                band2D(g, points[index], points[index + 1], w0, w1, from, to);
            });
    }

    // Nodes, once the internode below has stretched: a pale waxy band just under each, and the ridge across it.
    g.lineCap = 'round';
    for (let node = 1; node < culm.count; node++) {
        const shown = nodeShown(state.extension[node - 1]);
        if (shown <= 0) break;
        const [x, y] = points[node];
        const [px, py] = points[node - 1];
        const gap = Math.hypot(x - px, y - py) || 1;
        const ux = (x - px) / gap;
        const uy = (y - py) / gap;
        const w = widthAt(state.along[node]);
        const band = Math.min(w * 1.1, gap * 0.3) * shown;
        g.fillStyle = paint(blend(palette.node, mature, 0.35));
        band2D(g, [x - ux * band, y - uy * band], [x, y], w * 1.02, w * 1.02, -1, 1);
        const reach = w * 1.12 * shown;
        g.strokeStyle = paint(palette.nodeRidge);
        g.lineWidth = Math.max(1, w * 0.32);
        g.beginPath();
        g.moveTo(x + uy * reach, y - ux * reach);
        g.lineTo(x - uy * reach, y + ux * reach);
        g.stroke();
    }

    state.sheaths.forEach((sheath, index) => {
        if (sheath.length > 0 && sheath.peel < 1) drawSheath2D(g, frame, culm, state, index, paint, palette);
    });
    if (state.tipHeight > 0) drawTip2D(g, frame, culm, state, paint, palette);
}

function drawCrown2D(g, frame, culm, palette, growth) {
    const paint = rgb => mixRgb(rgb, palette.background, culm.fade);
    strokeBranches2D(g, culm.branches, {
        progressOf: branch => branchProgress(branch, growth),
        thickness: 1,
        taper: 0.5,
        color: paint(palette.branch),
        sx: frame.sx, sy: frame.sy, scale: frame.scale,
    });
    // Leaves by colour, whole and then the half facing the sky a shade lighter. Every leaf rides the tip of its twig while
    // that grows, and comes out lime, darkening once it is full-grown: within a tone, a run of leaves at the same step of
    // ripeness shares one fill.
    culm.leavesByTone.forEach((leaves, tone) => {
        [false, true].forEach(lit => {
            let step = null;
            leaves.forEach(leaf => {
                const size = leafSize(leaf, growth);
                if (size <= 0) return;
                const leafStep = Math.round(leafRipeness(leaf, growth) * RIPENESS_STEPS);
                if (leafStep !== step) {
                    if (step !== null) g.fill();
                    step = leafStep;
                    const color = blend(palette.leaf[tone], palette.leafFresh, BAMBOO.leafFreshness * (1 - step / RIPENESS_STEPS));
                    g.fillStyle = paint(lit ? blend(color, WHITE, BAMBOO.leafGloss) : color);
                    g.beginPath();
                }
                const [x, y] = pointOnBranch(leaf.branch, branchProgress(leaf.branch, growth));
                const length = leaf.length * size;
                const width = length * BAMBOO.leafWidth * leafUnroll(leaf, growth);
                const skySide = Math.cos(leaf.angle) >= 0 ? 1 : -1;
                leafPath2D(g, frame, x, y, leaf.angle, length, width, lit ? skySide : 0);
            });
            if (step !== null) g.fill();
        });
    });
}

function drawGround2D(g, frame, grove, palette, growth) {
    const { sx, sy, scale } = frame;
    const radius = BAMBOO.groundWidth2D * scale;
    // The earth patch, an ellipse seen from low down, its rim fading into the panel.
    g.save();
    g.translate(sx(0), sy(0));
    g.scale(1, BAMBOO.groundTilt2D);
    const soil = g.createRadialGradient(0, 0, 0, 0, 0, radius);
    soil.addColorStop(0, BAMBOO.colors.earth);
    soil.addColorStop(0.7, BAMBOO.colors.earth);
    soil.addColorStop(0.92, BAMBOO.colors.earthRim);
    soil.addColorStop(1, `rgba(${palette.earthRim.join(',')},0)`);
    g.fillStyle = soil;
    g.beginPath();
    g.arc(0, 0, radius, 0, TAU);
    g.fill();
    g.restore();
    // Old leaves lying about, seen nearly edge-on.
    grove.litterByTone.forEach((leaves, tone) => {
        g.fillStyle = BAMBOO.colors.litter[tone];
        g.beginPath();
        leaves.forEach(leaf => leafPath2D(g, frame, leaf.x, leaf.y, leaf.angle, leaf.length, leaf.length * BAMBOO.leafWidth * 0.7));
        g.fill();
    });
    // Sheaths that have dropped, curled up at the foot of their culm and seen from the side: long and narrow, the darker
    // hollow showing on their upper half.
    const shades = [[BAMBOO.colors.sheathFallen, false], [mixRgb(palette.sheathFallen, palette.sheathSpot, 0.3), true]];
    shades.forEach(([color, hollow]) => {
        g.fillStyle = color;
        g.beginPath();
        grove.culms.forEach(culm => culm.fallen.forEach(sheath => {
            const size = fallenProgress(culm, sheath.index, growth);
            if (size <= 0) return;
            const upper = Math.cos(sheath.angle) >= 0 ? 1 : -1;
            leafPath2D(g, frame, sheath.x, sheath.y, sheath.angle, sheath.length * size, sheath.length * 0.13 * size, hollow ? upper : 0);
        }));
        g.fill();
    });
}

function drawGrove2D(view, grove, palette, growth) {
    const g = view.ctx;
    g.clearRect(0, 0, view.width, view.height);
    const frame = framing(view, grove.frame);
    drawGround2D(g, frame, grove, palette, growth);
    grove.culms.forEach(culm => {
        drawCulm2D(g, frame, culm, palette, growth);
        drawCrown2D(g, frame, culm, palette, growth);
    });
}

// ─── Bamboo in 3D ───

/**
 * A lance-shaped leaf along +y (base at the origin, length 1, width 1 at its widest) facing +z, curving down towards its tip
 * and folded along the midrib: `fold` is how far the midrib stands up per unit of half-width, before the instance's scale.
 */
function makeLeafGeometry(fold) {
    // [distance along the leaf, half-width as a share of the widest]
    const sections = [[0, 0.16], [0.08, 0.5], [0.25, 0.94], [0.4, 1], [0.6, 0.8], [0.8, 0.44], [1, 0]];
    const positions = [];
    sections.forEach(([along, share]) => {
        const half = share * 0.5;
        const sag = -0.14 * along * along;
        positions.push(-half, along, sag, 0, along, sag + half * fold, half, along, sag);
    });
    const index = [];
    for (let row = 0; row < sections.length - 1; row++) {
        const here = row * 3;
        const next = here + 3;
        index.push(here, here + 1, next, here + 1, next + 1, next, here + 1, here + 2, next + 1, here + 2, next + 2, next + 1);
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setIndex(index);
    geometry.computeVertexNormals();
    return geometry;
}

/**
 * The shoot tip: a cone of sheaths, mottled like the 2D one. Its vertex colours darken every few facets, row by row, and
 * multiply the instance colour, so the spots follow the tip from brown to green.
 */
function makeTipGeometry() {
    const geometry = new THREE.ConeGeometry(1, 1, 9, 4).translate(0, 0.5, 0).toNonIndexed();
    const shades = new Float32Array(geometry.attributes.position.count * 3).fill(1);
    for (let face = 0; face < shades.length / 9; face++) {
        if (face % 5 === 2 || face % 7 === 4) shades.fill(0.45, face * 9, face * 9 + 9);
    }
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(shades, 3));
    return geometry;
}

const culmGeometry = unitStem(0.97, 10);
// A node: a ring lying round the culm (the torus turned so its axis is the culm's).
const ringGeometry = new THREE.TorusGeometry(1, 0.13, 4, 14).rotateX(Math.PI / 2);
// A sheath: a sleeve wrapped most of the way round, open towards +x, so it can peel away that way.
const sheathGeometry = new THREE.CylinderGeometry(0.8, 1, 1, 10, 1, true, Math.PI * 0.7, Math.PI * 1.6).translate(0, 0.5, 0);
const tipGeometry = makeTipGeometry();
const twigGeometry = unitStem(0.5, 5);
// A leaf is scaled to leafWidth of its length across, so its fold is set against that to stay a gentle one (about 17°)...
const leafGeometry = makeLeafGeometry(0.3 * BAMBOO.leafWidth);
// ...an old leaf on the ground is dry and curled up far more...
const LITTER_FOLD = 0.2;
const litterGeometry = makeLeafGeometry(LITTER_FOLD);
// ...and a fallen sheath is about as wide as it is long, so the plain fold is a gentle one again.
const SHEATH_FOLD = 0.3;
const fallenGeometry = makeLeafGeometry(SHEATH_FOLD);
/** Litter and fallen sheaths lie face down, hollow up: lifted by their fold's depth, their midrib just touches the soil. */
const restingLift = (fold, length) => 0.5 * fold * length + 0.002;
// White, so every colour comes from the spec, per instance.
const culmMaterial = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.42 });
const ringMaterial = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.6 });
const sheathMaterial = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.9, flatShading: true, side: THREE.DoubleSide });
const tipMaterial = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.9, flatShading: true, vertexColors: true });
const branchMaterial = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.7, flatShading: true });
const leafMaterial = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.65, flatShading: true, side: THREE.DoubleSide });

const HIDDEN = new THREE.Matrix4().makeScale(0.00001, 0.00001, 0.00001);
const Z_AXIS = new THREE.Vector3(0, 0, 1);
const leafBasis = new THREE.Matrix4();

/** Turns a leaf (or anything flat along +y) to point along `dir` with its face up, then rolls it about its own length. */
function leafQuaternion(dir, roll) {
    const side = new THREE.Vector3().crossVectors(dir, UP);
    if (side.lengthSq() < 1e-6) side.set(1, 0, 0);
    side.normalize();
    const face = new THREE.Vector3().crossVectors(side, dir).normalize();
    const quaternion = new THREE.Quaternion().setFromRotationMatrix(leafBasis.makeBasis(side, dir, face));
    return quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(UP, roll));
}

/** The earth patch's height at a distance from its middle: a low mound. */
const groundHeight = reach => BAMBOO.mound * Math.pow(Math.max(0, 1 - Math.pow(reach / BAMBOO.groundRadius, 2)), 2);

/** Culm bases scattered over the rhizome mat, never closer than BAMBOO.spacing (relaxed bit by bit if they don't fit). */
function scatterBases(rand) {
    const bases = [];
    let spacing = BAMBOO.spacing;
    for (let tries = 1; bases.length < BAMBOO.culms3D; tries++) {
        if (tries % 200 === 0) spacing *= 0.85;
        const turn = rand() * TAU;
        const reach = Math.sqrt(rand()) * BAMBOO.groveRadius;
        const base = new THREE.Vector3(Math.cos(turn) * reach, 0, Math.sin(turn) * reach);
        if (bases.every(other => other.distanceTo(base) >= spacing)) bases.push(base);
    }
    return bases;
}

/** Twigs along a 3D branch, off alternate sides, spreading out more than up. */
function twigs3D(parent, rand) {
    const firstAzimuth = rand() * TAU;
    return twigPlans(parent, rand).map(({ index, at, length, width, birth, grow }) => {
        const dir = splay(parent.dir, within(rand, BAMBOO.twigAngle), firstAzimuth + index * Math.PI + (rand() - 0.5) * 0.6);
        dir.y *= 0.6;
        dir.normalize();
        const start = parent.start.clone().addScaledVector(parent.dir, parent.length * at);
        const twig = makeBranch3D(start, dir, length, width, 2, birth);
        twig.grow = grow;
        return twig;
    });
}

/** A spray of leaves round the tip of a branch or twig, fanned out and hanging down. */
function spray3D(grove, culm, branch, rand) {
    const count = Math.round(within(rand, BAMBOO.sprayLeaves));
    const firstAzimuth = rand() * TAU;
    const size = 0.75 + 0.25 * culm.size;
    for (let $_ = 0; $_ < count; $_++) {
        const azimuth = firstAzimuth + $_ * TAU / count + (rand() - 0.5) * 0.5;
        const leafDir = splay(branch.dir, BAMBOO.leafFan / 2 * (0.5 + rand() * 0.6), azimuth);
        leafDir.y -= BAMBOO.leafDroop * (0.7 + rand() * 0.6);
        leafDir.y = Math.min(leafDir.y, BAMBOO.leafRise * Math.hypot(leafDir.x, leafDir.z));
        leafDir.normalize();
        grove.leaves.push({
            culm, branch,
            quaternion: leafQuaternion(leafDir, (rand() - 0.5) * 0.8),
            length: within(rand, BAMBOO.leafLength) * size,
            color: new THREE.Color(pick(rand, BAMBOO.colors.leaf)),
            birth: sprayBirth(branch) + rand() * 0.025,
        });
    }
}

/** Branch pairs at the upper nodes (a short tuft at the top one), twigs, sprays; and the sheaths that will lie at its foot. */
function growCrown3D(grove, culm, rand) {
    const leavesBefore = grove.leaves.length;
    for (let node = firstCrownNode(culm); node <= culm.count; node++) {
        const t = culm.nodes[node] / culm.height;
        const at = culm.curve.getPoint(t);
        const along = culm.curve.getTangent(t);
        // Both branches of a node on one side, a little apart round the culm, the side swapping from node to node; the top
        // node's tuft splits, one branch each way.
        const azimuth = culm.firstAzimuth + node * Math.PI + (rand() - 0.5) * 0.7;
        nodeBranches(culm, node, rand).forEach(({ length, width, tilt, birth, grow }, index) => {
            const turn = node === culm.count ? index * Math.PI : (index - 0.5) * BAMBOO.pairSpread;
            const branch = makeBranch3D(at.clone(), splay(along, tilt, azimuth + turn), length, width, 1, birth);
            branch.grow = grow;
            const { branches, tips } = growGenerations({ trunk: branch, generations: 2, cap: 64, spawn: parent => twigs3D(parent, rand) });
            grove.branches.push(...branches);
            [branch, ...tips].forEach(end => spray3D(grove, culm, end, rand));
        });
    }
    culm.leafDone = Math.max(...grove.leaves.slice(leavesBefore).map(leaf => leaf.birth)) + BAMBOO.timeline.leafGrow;

    // The lowest sheaths, once dropped, lie curled (hollow side up) on the ground round the foot of the culm.
    const foot = culm.curve.v0;
    culm.lengths.slice(0, BAMBOO.fallenSheaths).forEach((length, index) => {
        const turn = rand() * TAU;
        const reach = culm.radius * 2 + 0.02 + rand() * 0.06;
        const at = new THREE.Vector3(foot.x + Math.cos(turn) * reach, 0, foot.z + Math.sin(turn) * reach);
        at.y = groundHeight(Math.hypot(at.x, at.z));
        const heading = rand() * TAU;
        grove.fallen.push({
            culm, index, at,
            quaternion: leafQuaternion(new THREE.Vector3(Math.cos(heading), 0, Math.sin(heading)), Math.PI + (rand() - 0.5) * 0.6),
            // Half unrolled: wider than the culm, narrower than its girth.
            width: culm.radius * BAMBOO.sheathWidth * 2.6,
            length: length * BAMBOO.sheathLength,
        });
    });
}

function buildGrove3D() {
    const rand = mulberry32(BAMBOO.seed + 1000);
    const grove = { culms: [], branches: [], leaves: [], fallen: [] };
    const bases = scatterBases(rand);
    const outers = bases.map(base => Math.min(1, Math.hypot(base.x, base.z) / BAMBOO.groveRadius));
    const sizes = stretchSizes(outers.map(outer => rawSize(1 - outer, rand)));
    grove.culms = bases.map((base, index) => {
        const reach = Math.hypot(base.x, base.z);
        const outer = outers[index];
        const culm = culmShape(sizes[index], rand);
        // Sunk a little, so the culm comes up out of the soil.
        base.y = groundHeight(reach) - 0.004;
        // Lean away from the middle of the grove (any way, for a culm in the middle), the outer ones most, each wandering
        // off that line so they don't all fan out like cut stems in a vase.
        const heading = (reach > 0.02 ? Math.atan2(base.z, base.x) : rand() * TAU) + (rand() * 2 - 1) * BAMBOO.leanWander;
        const lean = within(rand, BAMBOO.lean) * (0.35 + 0.65 * outer);
        const out = new THREE.Vector3(Math.cos(heading), 0, Math.sin(heading));
        const rise = culm.height * Math.cos(lean);
        const spread = culm.height * Math.sin(lean);
        const end = base.clone().addScaledVector(UP, rise).addScaledVector(out, spread);
        // The control point keeps the base upright by the arch's share, so the culm curves out towards its top.
        const control = base.clone().addScaledVector(UP, rise / 2).addScaledVector(out, spread / 2 * (1 - BAMBOO.arch));
        culm.curve = new THREE.QuadraticBezierCurve3(base, control, end);
        culm.firstAzimuth = rand() * TAU;
        return culm;
    });
    scheduleCulms(grove.culms, rand);
    grove.culms.forEach(culm => growCrown3D(grove, culm, rand));
    grove.litter = Array.from({ length: BAMBOO.litter3D }, () => {
        const turn = rand() * TAU;
        const reach = Math.sqrt(rand()) * BAMBOO.groundRadius * 0.9;
        const heading = rand() * TAU;
        const length = within(rand, BAMBOO.leafLength) * 0.9;
        return {
            at: new THREE.Vector3(Math.cos(turn) * reach, groundHeight(reach) + restingLift(LITTER_FOLD, length), Math.sin(turn) * reach),
            // Lying flat, face down, so the tip curls up off the ground.
            quaternion: leafQuaternion(new THREE.Vector3(Math.cos(heading), 0, Math.sin(heading)), Math.PI + (rand() - 0.5) * 0.6),
            length,
            color: new THREE.Color(pick(rand, BAMBOO.colors.litter)),
        };
    });
    return grove;
}

/**
 * The earth patch, a faceted low mound with a wobbly outline, and one more ring of facets round it: its edge, sloping down to
 * a dark floor (like the bonsai's), so the patch has some body seen from low down.
 */
function makeGround(rand) {
    const radius = BAMBOO.groundRadius;
    const rings = 6;
    const geometry = new THREE.RingGeometry(0.001, radius * (rings + 1) / rings, 48, rings + 1).rotateX(-Math.PI / 2);
    const phases = [rand() * TAU, rand() * TAU, rand() * TAU];
    const position = geometry.attributes.position;
    for (let $_ = 0; $_ < position.count; $_++) {
        const x = position.getX($_);
        const z = position.getZ($_);
        const reach = Math.hypot(x, z);
        const turn = Math.atan2(z, x);
        const share = Math.min(1, reach / radius);
        // Smooth functions of the angle only, so the ring's seam (two vertices in one place) stays closed.
        const wobble = 1 + share * (0.04 * Math.sin(3 * turn + phases[0]) + 0.025 * Math.sin(5 * turn + phases[1]) + 0.015 * Math.sin(11 * turn + phases[2]));
        const bump = 0.0025 * share * Math.sin(17 * turn + reach * 40);
        const edge = BAMBOO.groundRim * clamp01((reach / radius - 1) * rings);
        position.setXYZ($_, x * wobble, groundHeight(reach) + bump - edge, z * wobble);
    }
    geometry.computeVertexNormals();
    const patch = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: BAMBOO.colors.earth, roughness: 1, flatShading: true }));
    const floor = new THREE.Mesh(new THREE.CircleGeometry(BAMBOO.floorRadius, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: BAMBOO.colors.floor, roughness: 1 }));
    floor.position.y = -BAMBOO.groundRim - 0.002;
    return [patch, floor];
}

// Scratch objects for writing instances. Every function that uses one sets it first and never holds on to it.
const scratch = {
    start: new THREE.Vector3(),
    end: new THREE.Vector3(),
    direction: new THREE.Vector3(),
    facing: new THREE.Quaternion(),
    spin: new THREE.Quaternion(),
    swing: new THREE.Quaternion(),
    mature: new THREE.Color(),
};

class BambooView extends PlantView {
    constructor() {
        super('bamboo', STAGE_3D);
        this.spec = BAMBOO;
        this.scene3D = null;
    }

    build() {
        this.palette = rgbPalette();
        this.grove2D = buildGrove2D();
        this.grove3D = buildGrove3D();
        this.stages = stagesOf([this.grove2D, this.grove3D]);
        this.buildScene3D(this.grove3D);
    }

    buildScene3D(grove) {
        if (this.scene3D) {
            this.stage.scene.remove(this.scene3D.group);
            Object.values(this.scene3D.meshes).forEach($_ => $_.dispose());
            this.scene3D.ground.forEach($_ => {
                $_.geometry.dispose();
                $_.material.dispose();
            });
        }
        const internodes = grove.culms.reduce((sum, culm) => sum + culm.count, 0);
        const meshes = {
            culm: instanced(culmGeometry, culmMaterial, internodes),
            ring: instanced(ringGeometry, ringMaterial, internodes),
            sheath: instanced(sheathGeometry, sheathMaterial, internodes),
            // Two per culm: the shoot's spear and the outer sheath wrapped round its lower part.
            tip: instanced(tipGeometry, tipMaterial, grove.culms.length * 2),
            fallen: instanced(fallenGeometry, leafMaterial, grove.fallen.length),
            branch: instanced(twigGeometry, branchMaterial, grove.branches.length),
            leaf: instanced(leafGeometry, leafMaterial, grove.leaves.length),
            litter: instanced(litterGeometry, leafMaterial, grove.litter.length),
        };
        const colors = Object.fromEntries(Object.entries(BAMBOO.colors)
            .filter(([, value]) => typeof value === 'string')
            .map(([name, value]) => [name, new THREE.Color(value)]));
        colors.sheathDark = colors.sheath.clone().lerp(colors.sheathSpot, 0.35);

        // Nothing shows until update3D places it; colours that never change are set once here.
        Object.values(meshes).forEach(mesh => {
            for (let $_ = 0; $_ < mesh.count; $_++) mesh.setMatrixAt($_, HIDDEN);
        });
        for (let $_ = 0; $_ < internodes; $_++) {
            meshes.culm.setColorAt($_, colors.culmFresh);
            meshes.ring.setColorAt($_, colors.node);
            meshes.sheath.setColorAt($_, colors.sheath);
        }
        grove.culms.forEach((_, index) => {
            meshes.tip.setColorAt(index * 2, colors.sheath);
            meshes.tip.setColorAt(index * 2 + 1, colors.sheathDark);
        });
        grove.fallen.forEach((_, index) => meshes.fallen.setColorAt(index, colors.sheathFallen));
        grove.branches.forEach((_, index) => meshes.branch.setColorAt(index, colors.branch));
        grove.leaves.forEach((leaf, index) => meshes.leaf.setColorAt(index, leaf.color));
        // The litter never moves.
        grove.litter.forEach((leaf, index) => {
            dummy.position.copy(leaf.at);
            dummy.quaternion.copy(leaf.quaternion);
            dummy.scale.set(leaf.length * BAMBOO.leafWidth, leaf.length, leaf.length);
            dummy.updateMatrix();
            meshes.litter.setMatrixAt(index, dummy.matrix);
            meshes.litter.setColorAt(index, leaf.color);
        });
        dummy.quaternion.identity();

        const ground = makeGround(mulberry32(BAMBOO.seed + 2000));
        const group = new THREE.Group();
        group.add(...ground, ...Object.values(meshes));
        this.stage.scene.add(group);
        this.scene3D = { grove, group, meshes, ground, colors };
    }

    draw2D(growth) {
        drawGrove2D(this.view2D, this.grove2D, this.palette, growth);
    }

    /** One internode of a culm, the node ring at its top and its sheath, at instance `slot`. */
    placeInternode3D(culm, state, index, slot, growth) {
        const { meshes, colors } = this.scene3D;
        const { start, end, direction, facing, spin, swing, mature } = scratch;
        if (state.extension[index] <= 0) {
            [meshes.culm, meshes.ring, meshes.sheath].forEach(mesh => mesh.setMatrixAt(slot, HIDDEN));
            return;
        }
        const from = state.along[index];
        const to = state.along[index + 1];
        culm.curve.getPoint(from / culm.height, start);
        culm.curve.getPoint(to / culm.height, end);
        direction.subVectors(end, start);
        const length = direction.length();
        if (length > 1e-6) direction.divideScalar(length);
        else culm.curve.getTangent(from / culm.height, direction);
        facing.setFromUnitVectors(UP, direction);

        const radius = radiusAt(culm, from);
        dummy.position.copy(start);
        dummy.quaternion.copy(facing);
        dummy.scale.set(radius, Math.max(length, 0.00001), radius);
        dummy.updateMatrix();
        meshes.culm.setMatrixAt(slot, dummy.matrix);
        meshes.culm.setColorAt(slot, tint.copy(colors.culmFresh).lerp(mature, ripeness(growth, culm.timeline.internodes[index].end)));

        // The node at its top shows once the internode has stretched; the culm's top has none.
        const shown = index < culm.count - 1 ? nodeShown(state.extension[index]) : 0;
        if (shown > 0) {
            dummy.position.copy(end);
            dummy.scale.setScalar(radiusAt(culm, to) * 1.06 * shown);
            dummy.updateMatrix();
            meshes.ring.setMatrixAt(slot, dummy.matrix);
        } else {
            meshes.ring.setMatrixAt(slot, HIDDEN);
        }

        // The sheath opens on alternate sides up the culm. When it goes, it swings out that way, shrinks and drops down the
        // culm, ever faster, towards the ground.
        const { length: sheathLength, peel } = state.sheaths[index];
        const keep = 1 - peel;
        if (sheathLength > 0.00001 && keep > 0) {
            culm.curve.getPoint(from * (1 - peel * peel) / culm.height, start);
            dummy.position.copy(start);
            dummy.quaternion.copy(facing)
                .multiply(spin.setFromAxisAngle(UP, culm.firstAzimuth + index * Math.PI))
                .multiply(swing.setFromAxisAngle(Z_AXIS, -peel * BAMBOO.sheathSwing));
            const sheathRadius = radius * BAMBOO.sheathWidth * keep;
            dummy.scale.set(sheathRadius, sheathLength * (0.4 + 0.6 * keep), sheathRadius);
            dummy.updateMatrix();
            meshes.sheath.setMatrixAt(slot, dummy.matrix);
            meshes.sheath.setColorAt(slot, tint.copy(colors.sheath).lerp(colors.sheathDry, peel));
        } else {
            meshes.sheath.setMatrixAt(slot, HIDDEN);
        }
    }

    /**
     * The shoot tip on top of the culm, with its outer sheath turned a little so the layers show. Once the tip opens it turns
     * green and the outer sheath falls away.
     */
    placeTip3D(culm, state, culmIndex) {
        const { meshes, colors } = this.scene3D;
        const { start, direction, facing, spin } = scratch;
        const { tip } = meshes;
        if (state.tipHeight <= 0.00001) {
            tip.setMatrixAt(culmIndex * 2, HIDDEN);
            tip.setMatrixAt(culmIndex * 2 + 1, HIDDEN);
            return;
        }
        const t = state.top / culm.height;
        culm.curve.getPoint(t, start);
        culm.curve.getTangent(t, direction);
        facing.setFromUnitVectors(UP, direction);
        dummy.position.copy(start);
        dummy.quaternion.copy(facing);
        dummy.scale.set(state.tipRadius, state.tipHeight, state.tipRadius);
        dummy.updateMatrix();
        tip.setMatrixAt(culmIndex * 2, dummy.matrix);
        tip.setColorAt(culmIndex * 2, tint.copy(colors.sheath).lerp(colors.leafFresh, state.opened));
        const outer = 1 - state.opened;
        if (outer > 0) {
            dummy.quaternion.multiply(spin.setFromAxisAngle(UP, 0.35));
            dummy.scale.set(state.tipRadius * 1.12 * outer, state.tipHeight * 0.7 * outer, state.tipRadius * 1.12 * outer);
            dummy.updateMatrix();
            tip.setMatrixAt(culmIndex * 2 + 1, dummy.matrix);
        } else {
            tip.setMatrixAt(culmIndex * 2 + 1, HIDDEN);
        }
    }

    update3D(growth) {
        const { grove, meshes, colors } = this.scene3D;
        let slot = 0;
        grove.culms.forEach((culm, culmIndex) => {
            const state = culmState(culm, growth);
            scratch.mature.copy(colors.culm).lerp(colors.culmOld, culm.yellow * yellowingAt(growth));
            for (let $_ = 0; $_ < culm.count; $_++) this.placeInternode3D(culm, state, $_, slot + $_, growth);
            this.placeTip3D(culm, state, culmIndex);
            slot += culm.count;
        });

        grove.fallen.forEach((sheath, index) => {
            const size = fallenProgress(sheath.culm, sheath.index, growth);
            if (size <= 0) {
                meshes.fallen.setMatrixAt(index, HIDDEN);
                return;
            }
            dummy.position.copy(sheath.at);
            dummy.position.y += restingLift(SHEATH_FOLD, sheath.length * size);
            dummy.quaternion.copy(sheath.quaternion);
            dummy.scale.set(sheath.width * size, sheath.length * size, sheath.length * size);
            dummy.updateMatrix();
            meshes.fallen.setMatrixAt(index, dummy.matrix);
        });

        placeBranches3D(meshes.branch, grove.branches, branch => branchProgress(branch, growth),
            branch => branch.width / 2 * Math.min(1, 0.05 + branchProgress(branch, growth) * 4));

        // Every leaf rides the tip of its twig while that grows, and comes out lime, darkening once it is full-grown.
        grove.leaves.forEach((leaf, index) => {
            const size = leafSize(leaf, growth);
            if (size <= 0) {
                meshes.leaf.setMatrixAt(index, HIDDEN);
                return;
            }
            const { branch } = leaf;
            const length = leaf.length * size;
            dummy.position.copy(branch.start).addScaledVector(branch.dir, branch.length * branchProgress(branch, growth));
            dummy.quaternion.copy(leaf.quaternion);
            dummy.scale.set(length * BAMBOO.leafWidth * leafUnroll(leaf, growth), length, length);
            dummy.updateMatrix();
            meshes.leaf.setMatrixAt(index, dummy.matrix);
            meshes.leaf.setColorAt(index, tint.copy(leaf.color).lerp(colors.leafFresh, BAMBOO.leafFreshness * (1 - leafRipeness(leaf, growth))));
        });
        dummy.quaternion.identity();

        // Only what was rewritten above goes to the GPU again (placeBranches3D marks its own); the litter and the colours
        // that never change went up with the meshes.
        [meshes.culm, meshes.ring, meshes.sheath, meshes.tip, meshes.fallen, meshes.leaf].forEach(mesh => {
            mesh.instanceMatrix.needsUpdate = true;
        });
        [meshes.culm, meshes.sheath, meshes.tip, meshes.leaf].forEach(mesh => {
            if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
        });
    }

    stageLabel(growth) {
        if (growth >= this.stages.grove) return { text: 'Grove 🎋', tone: 'green' };
        if (growth >= this.stages.branching) return { text: 'Branching', tone: 'green' };
        if (growth >= this.stages.shootingUp) return { text: 'Shooting up', tone: 'green' };
        return { text: 'Shoots', tone: 'green' };
    }

    describe() {
        const leaves2D = this.grove2D.culms.reduce((sum, culm) => sum + culm.leaves.length, 0);
        const internodes3D = this.grove3D.culms.reduce((sum, culm) => sum + culm.count, 0);
        const { culms, branches, leaves } = this.grove3D;
        return `2D: ${this.grove2D.culms.length} culms, ${leaves2D} leaves · 3D: ${culms.length} culms, ${internodes3D} internodes, ${branches.length} branches, ${leaves.length} leaves`;
    }
}

registerView(new BambooView());
}

// ===== willow =====
// ═══════════════════════════ Willow ═══════════════════════════
// A weeping willow (Salix babylonica). The trunk and limbs are the shared branching skeleton, kept inside a dome: a branch that
// would grow out of it turns down along it, as a willow's outer branches do. Every hanging branchlet is its own chain that
// grows along one fixed curve, so the part already grown never moves: it sets off up and out from its branch soon after that
// spot has grown, turns over and falls straight down, almost to the ground. Leaves follow the growing tips, then fill in.
{
    const WILLOW = {
        seed: 23,
        // ─ Trunk and limbs: the shared branching skeleton ─
        trunkLength: 0.3,           // ground to the first fork
        trunkWidth: 0.085,          // at the base, once fully grown
        trunkLean: 0.06,            // radians the trunk may lean off the vertical
        limbs2D: 3,                 // main limbs off the trunk in the side view…
        limbs3D: 6,                 // …and all round it in 3D (one of them the leader)
        forks: 2,                   // branches at every fork further out
        levels: 5,                  // generations from trunk to twig
        lengthDecay: 0.78,          // each generation this much shorter…
        widthDecay: 0.6,            // …and this much thinner
        limbTilt: [0.25, 0.6],      // radians the main limbs lean off the vertical, least to most…
        leaderTilt: 0.15,           // …except the leader, which carries on almost straight up and fills the top of the dome
