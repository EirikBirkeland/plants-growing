    /** Height of the mound at distance `r` from the mushroom: 0 under its foot, sinking to -height further out. */
    const moundAt = (ground, r) => ground.height * (Math.exp(-2.2 * (r / ground.radius) ** 2) - 1);
    // Bumps fade out under the foot, so the mushroom always stands at height 0.
    const bumpsNear = r => 1 - Math.exp(-((r / 0.1) ** 2));

    /** Global growth → the main mushroom's own life (0 = pin, 1 = open). */
    const mainAge = (spec, growth) => window01(growth, spec.pinFrom, spec.matureAt);
    /** How magical it is: 0 before glowFrom, 1 at fruition. */
    const magicAt = (spec, growth) => smooth(window01(growth, spec.glowFrom, 1));
    /** Overall glow: a faint shine while the mushroom forms, the full glow at fruition. */
    const glowAt = (spec, growth) => 0.3 * smooth(window01(growth, spec.pinFrom, spec.glowFrom)) + 0.7 * magicAt(spec, growth);
    /** Share of the spores that are out: none before sporesFrom, all at fruition. */
    const sporesAt = (spec, growth) => smooth(window01(growth, spec.sporesFrom, 1));
    const growthOfAge = (spec, age) => lerp(spec.pinFrom, spec.matureAt, age);

    /**
     * One mushroom at one moment of its life: stem and cap dimensions in scene units, for both views.
     * `age` runs 0 → 1 over its own life, `size` scales it (1 for the main mushroom), `shape` holds its own quirks.
     */
    function mushroomState(spec, age, size, shape) {
        const { life, stem, cap } = spec;
        const form = easeOut(window01(age, 0, life.formUntil));
        const stretch = smooth(window01(age, life.stalkFrom, life.stalkUntil));
        const open = smooth(window01(age, life.openFrom, life.openUntil));
        // The cap opens fast at first, then slowly flattens: ease the shape, not just the size.
        const spreadOut = easeOut(open);
        const s = size * form;
        const length = stem.height * size * shape.stem * (stem.buttonShare * form + (1 - stem.buttonShare) * stretch);
        const radius = stem.radius * s * (0.85 + 0.15 * shape.stem);
        const a = lerp(cap.eggRadius * s, cap.radius * size * shape.cap, spreadOut);
        const b = lerp(cap.eggHeight * s, cap.height * size * shape.cap * shape.flat, spreadOut);
        const curl = lerp(cap.eggCurl, cap.openCurl, smooth(open));
        // The ellipse's centre sits above the stem top so the margin meets the stem while closed.
        const centre = lerp(-Math.cos(cap.eggCurl) * cap.eggHeight * s * 0.62, 0.02 * b, spreadOut);
        return {
            form, open, size,
            visible: form > 0.002,
            // The pin pushes up out of the ground: while it swells it is still partly buried.
            sink: (1 - form) * (cap.eggHeight + stem.embed) * size,
            length,
            radius,
            taper: stem.taper,
            bulb: stem.bulb * s,
            embed: stem.embed * s,
            lean: stem.lean * shape.lean,
            bow: stem.bow * shape.bow,
            ring: smooth(window01(open, 0.05, 0.55)),
            cap: {
                a, b, curl, centre,
                rim: a * Math.sin(curl),              // margin radius
                rimY: centre + b * Math.cos(curl),    // margin height above the stem top
                wave: cap.wave * spreadOut,
            },
        };
    }

    /** Radius of the stem `along` (0 at the foot, 1 at the cap): rounded foot, bulb, taper, a slight flare under the cap. */
    function stemRadiusAt(state, along) {
        const s = along * state.length;
        const bulbReach = Math.max(1e-5, state.bulb * 1.15);
        const bulb = state.bulb * Math.exp(-(((s - state.bulb * 0.45) / bulbReach) ** 2));
        const shaft = state.radius * (1 + state.taper * (1 - along)) + state.radius * 0.18 * smooth(window01(along, 0.88, 1));
        const foot = Math.sqrt(clamp01(s / Math.max(1e-5, state.bulb * 0.5)));
        return Math.max(shaft, bulb) * (0.25 + 0.75 * foot);
    }

    /** The stem's centre line in its own lean plane: x sideways, y up, from the foot (0, -embed). */
    function stemCurve(state) {
        const foot = [0, -state.embed];
        const top = [state.lean * state.length, -state.embed + state.length];
        const control = [(foot[0] + top[0]) / 2 + state.bow * state.length, (foot[1] + top[1]) / 2];
        return { foot, control, top };
    }
    function curvePoint({ foot, control, top }, t) {
        const u = 1 - t;
        return [u * u * foot[0] + 2 * u * t * control[0] + t * t * top[0], u * u * foot[1] + 2 * u * t * control[1] + t * t * top[1]];
    }
    function curveTangent({ foot, control, top }, t) {
        const dx = 2 * (1 - t) * (control[0] - foot[0]) + 2 * t * (top[0] - control[0]);
        const dy = 2 * (1 - t) * (control[1] - foot[1]) + 2 * t * (top[1] - control[1]);
        const length = Math.hypot(dx, dy) || 1;
        return [dx / length, dy / length];
    }

    /** A point on the cap's top surface: `along` 0 at the crown → 1 at the margin, `around` an angle; local to the stem top. */
    function capPoint(cap, along, around, wavePhase, waves) {
        const theta = along * cap.curl;
        const wave = 1 + cap.wave * Math.sin(waves * around + wavePhase) * along * along;
        const across = cap.a * Math.sin(theta) * wave;
        return { x: across * Math.cos(around), y: cap.centre + cap.b * Math.cos(theta), z: across * Math.sin(around), theta };
    }
    /** Outward normal of the cap's ellipsoid at `theta`, `around`. */
    function capNormal(cap, theta, around) {
        const nx = Math.sin(theta) * Math.cos(around) / Math.max(1e-6, cap.a);
        const ny = Math.cos(theta) / Math.max(1e-6, cap.b);
        const nz = Math.sin(theta) * Math.sin(around) / Math.max(1e-6, cap.a);
        const length = Math.hypot(nx, ny, nz) || 1;
        return { x: nx / length, y: ny / length, z: nz / length };
    }

    /**
     * The companions: smaller mushrooms that sprout later around the main one, from the same threads. Shared by both views:
     * 3D stands them at (distance, azimuth); 2D at x = distance·cos(azimuth), further back by |sin(azimuth)|.
     */
    function makeCompanions(spec, rand) {
        const { count, distance, size, from, duration } = spec.companions;
        const firstAzimuth = rand() * TAU;
        return Array.from({ length: count }, (_, index) => {
            // Even-ish spacing around the main stem, so they don't pile up on one side.
            const azimuth = firstAzimuth + index * TAU / count + (rand() - 0.5) * 0.8;
            const order = index / Math.max(1, count - 1);
            return {
                azimuth,
                distance: between(distance, rand()),
                size: between(size, 1 - order * 0.6 - rand() * 0.4),
                from: between(from, order * 0.85 + rand() * 0.15),
                duration: between(duration, rand()),
                shape: {
                    stem: 0.8 + rand() * 0.6,
                    cap: 0.85 + rand() * 0.3,
                    flat: 0.9 + rand() * 0.3,
                    lean: 1 + rand() * 1.5,
                    bow: (rand() - 0.5) * 2,
                },
                leanAzimuth: azimuth + (rand() - 0.5) * 0.9,  // they lean away from the main mushroom
                wavePhase: rand() * TAU,
            };
        });
    }
    const companionAge = (companion, growth) => window01(growth, companion.from, companion.from + companion.duration);

    /** Spots: veil remnants on the cap, as (along, around); they crack apart and spread as the cap opens. */
    function makeSpots(count, rand) {
        return Array.from({ length: count }, () => ({
            along: 0.12 + Math.sqrt(rand()) * 0.68,
            around: rand() * TAU,
            size: 0.6 + rand() * 0.6,
            delay: rand() * 0.35,
        }));
    }
    const spotProgress = (spot, open) => smooth(window01(open, 0.08 + spot.delay, 0.45 + spot.delay));

    const css = (rgb, alpha = 1) => `rgba(${rgb.map(Math.round).join(',')},${clamp01(alpha).toFixed(3)})`;
    const rgba = (hex, alpha) => css(hexToRgb(hex), alpha);
    const mixHex = (from, to, t) => mixRgb(hexToRgb(from), hexToRgb(to), clamp01(t));
    // Shortest turn from one angle towards another.
    const turnTowards = (from, to, t) => from + ((((to - from + Math.PI) % TAU) + TAU) % TAU - Math.PI) * t;

    /** Where the `index`th of `forks` threads at a fork turns: spread from one side to the other; a lone one picks a side. */
    const forkSide = (index, forks, rand) => forks === 1 ? (rand() < 0.5 ? -0.5 : 0.5) : index / (forks - 1) * 2 - 1;

    /** How big the bright bead on a growing thread's tip is: it swells in as the thread starts and fades out as it finishes. */
    const tipBead = progress => smooth(window01(progress, 0, 0.12)) * (1 - smooth(window01(progress, 0.55, 1)));

    /**
     * Where two thread tips grow close, a share of them fuse (as real hyphae do), so the threads knit into a web rather than a
     * tree. `endOf(tip)` gives a tip's end as [x, y]. Returns the pairs to join; each tip fuses once at most.
     */
    function pairTips(tips, endOf, rand, { links, linkReach }) {
        const used = new Set();
        const pairs = [];
        tips.forEach(tip => {
            if (used.has(tip) || rand() >= links) return;
            const [x, y] = endOf(tip);
            let nearest = null;
            let nearestDistance = linkReach;
            tips.forEach(other => {
                if (other === tip || used.has(other)) return;
                const [ox, oy] = endOf(other);
                const distance = Math.hypot(ox - x, oy - y);
                // Tips right on top of each other are siblings at their fork: nothing to bridge.
                if (distance > 0.008 && distance < nearestDistance) {
                    nearest = other;
                    nearestDistance = distance;
                }
            });
            if (!nearest) return;
            used.add(tip);
            used.add(nearest);
            pairs.push([tip, nearest]);
        });
        return pairs;
    }

    /** The finest threads, whose tips may fuse: the last two generations. */
    const fusingTips = (branches, levels) => branches.filter(branch => branch.level >= levels - 2);

    /**
     * Drifting spores, shared by both views. Each one drops from under a cap, drifts out past the margin, then floats up in a
     * slow spiral and fades. Positions are offsets from its cap's gills; each view adds its own cap position.
     */
    class SporeCloud {
        constructor(spec) {
            this.spec = spec;
            this.rand = mulberry32(spec.seed + 77);
            this.spores = Array.from({ length: spec.spores.count }, () => this.respawn({}, null, true));
        }

        /** A new life for `spore`, from a cap picked by `weights` (cap area that is open), at a random age when scattering. */
        respawn(spore, weights, scatter) {
            const rand = this.rand;
            spore.life = between(this.spec.spores.life, rand());
            spore.age = scatter ? rand() * spore.life : 0;
            spore.source = weights ? pickWeighted(weights, rand()) : 0;
            spore.reach = 0.25 + 0.6 * Math.sqrt(rand());
            spore.around = rand() * TAU;
            spore.spin = (rand() < 0.5 ? -1 : 1) * (0.25 + rand() * 0.45);
            spore.drift = 0.6 + rand() * 0.8;
            spore.spread = 0.95 + rand() * rand() * 1.4;
            spore.sway = rand() * TAU;
            spore.bright = 0.45 + rand() * 0.55;
            return spore;
        }

        step(dt, weights) {
            this.spores.forEach(spore => {
                spore.age += dt;
                if (spore.age >= spore.life) this.respawn(spore, weights, false);
            });
        }

        /** Offset of a spore from its cap's gills for a cap of radius `rim`, and its brightness (0–1), into `out`. */
        place(spore, rim, out) {
            const { rise, swirl } = this.spec.spores;
            const t = spore.age;
            const outwards = smooth(Math.min(1, t / 2.2));
            const radius = rim * (spore.reach + (spore.spread - spore.reach) * outwards) + swirl * Math.min(1, t / 3) + 0.01 * t;
            const angle = spore.around + spore.spin * t * 0.5;
            // A slow sideways sway, as if carried by the night air.
            const sway = swirl * 0.6 * Math.sin(spore.sway + t * 0.7) * Math.min(1, t / 2);
            out.x = Math.cos(angle) * radius + sway;
            out.z = Math.sin(angle) * radius;
            out.y = -0.04 * smooth(Math.min(1, t / 1.6)) + rise * spore.drift * Math.max(0, t - 1.2);
            out.alpha = spore.bright * smooth(Math.min(1, t / 0.7)) * smooth(Math.min(1, (spore.life - t) / 1.6));
            return out;
        }
    }

    function pickWeighted(weights, roll) {
        const total = weights.reduce((sum, weight) => sum + weight, 0);
        if (total <= 0) return 0;
        let left = roll * total;
        const index = weights.findIndex(weight => (left -= weight) < 0);
        return index < 0 ? weights.length - 1 : index;
    }

    /** Which caps give spores now: open caps, by area. Main mushroom first, then the companions, in both views. */
    function sporeWeights(spec, growth, companions) {
        const main = mushroomState(spec, mainAge(spec, growth), 1, MAIN_SHAPE);
        const states = [main, ...companions.map(companion => mushroomState(spec, companionAge(companion, growth), companion.size, companion.shape))];
        return states.map(state => smooth(window01(state.open, 0.4, 0.9)) * state.cap.a * state.cap.a);
    }

    const MAIN_SHAPE = { stem: 1, cap: 1, flat: 1, lean: 1, bow: 1 };

    // ─── Mushroom in 2D ───
    // A side view of a cut through the forest floor: soil with glowing threads below, the mushrooms on top, seen from a little
    // below so the gills show under the caps.

    /** A soft glowing dot, drawn once per colour and stamped wherever something small glows. */
    function makeGlowSprite(hex, size = 64) {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const g = canvas.getContext('2d');
        const gradient = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.16, rgba(hex, 0.95));
        gradient.addColorStop(0.42, rgba(hex, 0.28));
        gradient.addColorStop(1, rgba(hex, 0));
        g.fillStyle = gradient;
        g.fillRect(0, 0, size, size);
        return canvas;
    }

    /** An offscreen canvas matching the view (times `ratio`), drawn on in the view's CSS pixels. */
    function fitLayer(layer, view, ratio) {
        const width = Math.max(1, Math.round(view.width * ratio));
        const height = Math.max(1, Math.round(view.height * ratio));
        const canvas = layer?.canvas ?? document.createElement('canvas');
        if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
        }
        const g = layer?.g ?? canvas.getContext('2d');
        // Resizing a canvas resets its transform, so it is set every time.
        g.setTransform(width / Math.max(1, view.width), 0, 0, height / Math.max(1, view.height), 0, 0);
        return { canvas, g };
    }

    /**
     * Glowing threads through the soil: strands spread sideways through the topsoil from the spore, fork, and where tips meet
     * they fuse, so the threads become a web rather than a root system.
     */
    function buildMycelium2D(spec, rand, surfaceY, knot) {
        const mycelium = spec.mycelium;
        const growDur = spec.myceliumUntil / mycelium.levels;
        const deepest = -mycelium.layer * spec.ground.depth;

        function thread(x, y, angle, length, width, level, birth) {
            let reach = length;
            let heading = angle;
            // Below the topsoil a thread turns back towards the level, wobbling, and gives up sooner: no flat floor of ends.
            if (y + Math.sin(heading) * reach < deepest) {
                const slightlyUp = Math.cos(heading) >= 0 ? 0.15 : Math.PI - 0.15;
                heading = turnTowards(heading, slightlyUp, 0.6 + 0.3 * rand()) + (rand() - 0.5) * 0.3;
                reach *= 0.45 + 0.35 * rand();
            }
            // Where a thread would break the surface it turns to run just under it instead.
            const ex = x + Math.cos(heading) * reach;
            const ey = Math.min(y + Math.sin(heading) * reach, surfaceY(ex) - 0.014);
            return makeBranch2D(x, y, Math.atan2(ey - y, ex - x), Math.hypot(ex - x, ey - y), width, level, birth, (rand() - 0.5) * 0.4);
        }

        function spawn(branch, level) {
            const { ex, ey } = controlAndEnd(branch);
            // Mycelium spreads through the topsoil more than down into it: the pull outwards is flattened.
            const away = Math.atan2((ey - knot.y) * 0.4, ex - knot.x);
            const birth = branch.birth + growDur * (0.85 + rand() * 0.3);
            return Array.from({ length: mycelium.forks }, (_, index) => {
                const side = forkSide(index, mycelium.forks, rand);
                const angle = turnTowards(branch.angle + side * mycelium.spread * (0.6 + rand() * 0.6), away, mycelium.outward);
                const length = branch.length * mycelium.lengthDecay * (0.8 + rand() * 0.4);
                return thread(ex, ey, angle, length, branch.width * mycelium.widthDecay, level + 1, birth);
            });
        }

        // Strands leave the knot to both sides, a little below the level: they spread through the topsoil, not down into it.
        const perSide = [Math.ceil(mycelium.strands / 2), Math.floor(mycelium.strands / 2)];
        const strands = Array.from({ length: mycelium.strands }, (_, index) => {
            const side = index % 2;
            const rank = Math.floor(index / 2);
            const dip = between(mycelium.dip, (rank + rand()) / perSide[side]);
            const angle = side === 0 ? -dip : Math.PI + dip;
            // Each starts from somewhere on the knot, so they don't all pile up on one bright point.
            const x = knot.x + Math.cos(angle) * 0.02;
            const y = knot.y + Math.sin(angle) * 0.012;
            return thread(x, y, angle, mycelium.length * (0.8 + rand() * 0.4), mycelium.width, 0, rand() * growDur * 0.5);
        });
        const cap = Math.max(1, Math.floor(mycelium.maxThreads / Math.max(1, mycelium.strands)));
        const grown = strands.map(trunk => growGenerations({ trunk, generations: mycelium.levels, cap, spawn }));
        const branches = grown.flatMap($_ => $_.branches);

        // Fusing tips: a short thread bridges each pair once both have finished growing.
        const endOf = branch => {
            const { ex, ey } = controlAndEnd(branch);
            return [ex, ey];
        };
        const pairs = pairTips(fusingTips(branches, mycelium.levels), endOf, rand, mycelium);
        const links = pairs.slice(0, Math.max(0, mycelium.maxThreads - branches.length)).map(([from, to]) => {
            const [x, y] = endOf(from);
            const [tx, ty] = endOf(to);
            const birth = Math.max(from.birth, to.birth) + growDur;
            const width = Math.min(from.width, to.width) * mycelium.widthDecay;
            const bend = (rand() - 0.5) * 0.6;
            return makeBranch2D(x, y, Math.atan2(ty - y, tx - x), Math.hypot(tx - x, ty - y), width, mycelium.levels, birth, bend);
        });
        const all = [...branches, ...links];
        return {
            branches: all,
            // Drawn in three passes: strands and first forks bright, finer threads faint, the thicker ones also blooming.
            strands: all.filter(branch => branch.level <= 1),
            fine: all.filter(branch => branch.level > 1),
            glowing: all.filter(branch => branch.level <= 3),
            growDur,
            doneAt: Math.max(...all.map(branch => branch.birth)) + growDur,
            capped: grown.some($_ => $_.capped),
        };
    }

    /** Everything in 2D that only changes with the seed: surface, threads, soil grit, pebbles, moss, litter. */
    function buildScene2D(spec, companions) {
        const rand = mulberry32(spec.seed);
        const { ground } = spec;
        const wobble = noise1D(spec.seed + 5);
        const surfaceY = x => moundAt(ground, Math.abs(x)) + wobble(x * 9 + 3) * ground.bumps * bumpsNear(Math.abs(x));
        const knot = { x: 0, y: -0.035 };
        const mycelium = buildMycelium2D(spec, rand, surfaceY, knot);
        const inSoil = () => {
            const x = (rand() * 2 - 1) * 1.3;
            return { x, y: surfaceY(x) - 0.01 - rand() * (ground.depth + 0.2) };
        };
        const grit = Array.from({ length: ground.grit }, () => ({ ...inSoil(), r: 0.0015 + rand() * 0.004, light: rand() }));
        const pebbles = Array.from({ length: ground.pebbles }, () => ({
            ...inSoil(),
            r: 0.01 + rand() * 0.022,
            squash: 0.55 + rand() * 0.3,
            turn: (rand() - 0.5) * 0.8,
        }));
        // Old roots from trees out of sight: dark curves that give the soil some depth.
        const roots = Array.from({ length: ground.roots }, () => {
            const start = inSoil();
            const angle = (rand() - 0.5) * 0.8 + (start.x > 0 ? Math.PI : 0);
            return makeBranch2D(start.x, start.y, angle, 0.4 + rand() * 0.5, 0.006 + rand() * 0.008, 0, 0, (rand() - 0.5) * 0.5);
        });

        // On the floor behind the cut: `back` 0 at the cut's edge, 1 at the far end of what shows.
        const onFloor = () => ({ x: (rand() * 2 - 1) * 1.3, back: Math.pow(rand(), 0.7) });
        // Moss grows in clumps: cushions gather round a few centres, bigger and overlapping near the middle of a clump.
        // Clumps keep off the far edge, where the floor fades into the night and they would float.
        const clumps = Array.from({ length: Math.max(1, ground.clumps2D) }, () => ({ ...onFloor(), back: 0.8 * Math.pow(rand(), 0.8) }));
        const roughlyNormal = () => (rand() + rand() + rand() - 1.5) / 1.5;
        const nearClump = () => {
            const clump = pick(rand, clumps);
            const offset = roughlyNormal();
            return { x: clump.x + offset * 0.13, back: clamp01(clump.back + roughlyNormal() * 0.06), middle: 1 - Math.abs(offset) };
        };
        const moss = Array.from({ length: ground.moss2D }, () => {
            const at = nearClump();
            return { ...at, r: (0.01 + rand() * 0.018) * (0.6 + 0.8 * at.middle), squash: 0.4 + rand() * 0.3, color: pick(rand, spec.colors.moss) };
        }).sort((a, b) => b.back - a.back);
        const grass = Array.from({ length: ground.grass2D }, () => ({ ...nearClump(), length: 0.015 + rand() * 0.03, lean: (rand() - 0.5) * 1.2 }));
        const edgeMoss = Array.from({ length: ground.edgeMoss2D }, () => ({
            x: (rand() * 2 - 1) * 1.3,
            r: 0.008 + rand() * 0.018,
            color: pick(rand, spec.colors.moss),
        }));
        const twigs = Array.from({ length: ground.twigs }, () => ({ ...onFloor(), length: 0.08 + rand() * 0.16, turn: (rand() - 0.5) * 0.5 }));

        const placed = placeCompanions2D(spec, companions, rand);
        const spots = makeSpots(spec.cap.spots, rand);
        placed.forEach(entry => { entry.spots = makeSpots(Math.round(spec.cap.spots * spec.companions.spotShare), rand); });
        return { surfaceY, knot, mycelium, grit, pebbles, roots, moss, grass, edgeMoss, twigs, placed, spots, wavePhase: rand() * TAU };
    }

    /**
     * The companions on the floor behind the cut. Ranked left to right by where they stand round the main stem, each gets its
     * own slot, so no two end up at the same x with one cap hiding the other; further round to the side is further back.
     */
    function placeCompanions2D(spec, companions, rand) {
        const { slots2D, recede2D, distance } = spec.companions;
        const ranked = companions
            .map((companion, index) => ({ companion, index, cos: Math.cos(companion.azimuth) }))
            .sort((a, b) => a.cos - b.cos);
        // Half go left and half right; an odd one out goes to the side it stands on in 3D.
        const leftCount = Math.floor(ranked.length / 2) + (ranked.length % 2 === 1 && ranked[Math.floor(ranked.length / 2)].cos < 0 ? 1 : 0);
        const sides = [ranked.slice(0, leftCount).reverse(), ranked.slice(leftCount)];
        const placed = [];
        sides.forEach((side, sideIndex) => {
            const sign = sideIndex === 0 ? -1 : 1;
            let previous = null;
            // Inside out, so each one can be nudged clear of its neighbour nearer the main stem.
            side.forEach((entry, order) => {
                const { companion } = entry;
                const back = Math.abs(Math.sin(companion.azimuth)) * companion.distance / distance[1];
                const k = 1 - recede2D * back;
                const capRadius = spec.cap.radius * companion.size * companion.shape.cap * k;
                let x = between(slots2D, side.length > 1 ? order / (side.length - 1) : 0.4) + (rand() - 0.5) * 0.06;
                if (previous) x = Math.max(x, previous.x + 0.8 * (previous.capRadius + capRadius));
                previous = { x, capRadius };
                placed.push({
                    companion,
                    index: entry.index,
                    x: sign * x,
                    back,
                    k,
                    // They lean away from the main mushroom.
                    lean: sign * Math.max(0.3, Math.abs(Math.cos(companion.leanAzimuth))),
                });
            });
        });
        return placed.sort((a, b) => b.back - a.back);
    }

    /** The floor behind the cut rises a little on screen as it recedes. */
    const farFloorY = (scene, spec, x) => scene.surfaceY(x) * 0.3 + spec.ground.far;
    const floorY = (scene, spec, x, back) => lerp(scene.surfaceY(x), farFloorY(scene, spec, x), back);

    /** Points along a line across the whole view, from left to right, `heightAt(x)` high. */
    function acrossView(halfWidth, heightAt) {
        return Array.from({ length: 81 }, (_, index) => {
            const x = -halfWidth + index / 80 * halfWidth * 2;
            return [x, heightAt(x)];
        });
    }

    /** The soil surface from one side to the other, `offset` above it: an open line for the edge, or the top of the cut. */
    function traceEdge(g, scene, frame, halfWidth, offset) {
        g.beginPath();
        tracePolyline(g, acrossView(halfWidth, x => scene.surfaceY(x) + offset), ([x, y]) => [frame.sx(x), frame.sy(y)]);
    }

    function traceSoil(g, scene, frame, halfWidth, bottom) {
        traceEdge(g, scene, frame, halfWidth, 0);
        g.lineTo(frame.sx(halfWidth), frame.sy(bottom));
        g.lineTo(frame.sx(-halfWidth), frame.sy(bottom));
        g.closePath();
    }

    /** Night sky, the moss-covered floor behind the cut and the cut through the soil: painted once per size and seed. */
    function paintBackdrop(g, view, scene, spec, frame) {
        const { sx, sy, scale } = frame;
        const { colors, ground } = spec;
        const toPixel = ([x, y]) => [sx(x), sy(y)];
        const halfWidth = view.width / 2 / Math.max(1e-6, scale) + 0.05;
        const bottom = -ground.depth - view.height / Math.max(1e-6, scale);

        const sky = g.createLinearGradient(0, 0, 0, sy(0));
        sky.addColorStop(0, colors.night);
        sky.addColorStop(1, colors.nightLow);
        g.fillStyle = sky;
        g.fillRect(0, 0, view.width, view.height);

        // The floor behind the cut, fading into the dark where it recedes.
        const floor = g.createLinearGradient(0, sy(ground.far), 0, sy(-ground.height));
        floor.addColorStop(0, rgba(colors.floor, 0));
        floor.addColorStop(0.5, rgba(colors.floor, 0.95));
        floor.addColorStop(1, rgba(colors.floor, 1));
        g.fillStyle = floor;
        g.beginPath();
        tracePolyline(g, acrossView(halfWidth, x => farFloorY(scene, spec, x)), toPixel);
        tracePolyline(g, acrossView(halfWidth, scene.surfaceY).reverse(), toPixel, false);
        g.closePath();
        g.fill();

        // Twigs, moss cushions and a few blades of grass on the floor, the far ones smaller and darker.
        scene.twigs.forEach(twig => {
            const y = floorY(scene, spec, twig.x, twig.back);
            const shrink = 1 - 0.5 * twig.back;
            g.strokeStyle = mixHex(colors.twig, colors.floor, twig.back * 0.7);
            g.lineWidth = Math.max(1, 0.006 * shrink * scale);
            g.beginPath();
            g.moveTo(sx(twig.x), sy(y));
            g.lineTo(sx(twig.x + Math.cos(twig.turn) * twig.length * shrink), sy(y + Math.sin(twig.turn) * twig.length * 0.15 * shrink));
            g.stroke();
        });
        scene.moss.forEach(cushion => {
            const shrink = 1 - 0.5 * cushion.back;
            const r = cushion.r * shrink;
            const x = sx(cushion.x);
            const y = sy(floorY(scene, spec, cushion.x, cushion.back));
            g.fillStyle = mixHex(cushion.color, colors.floor, cushion.back * 0.6);
            g.beginPath();
            g.ellipse(x, y, r * scale, r * cushion.squash * scale, 0, Math.PI, TAU);
            g.fill();
        });
        g.lineWidth = 1;
        g.lineCap = 'round';
        scene.grass.forEach(blade => {
            const shrink = 1 - 0.5 * blade.back;
            const y = floorY(scene, spec, blade.x, blade.back);
            const length = blade.length * shrink;
            g.strokeStyle = mixHex(colors.grass, colors.floor, blade.back * 0.6);
            g.beginPath();
            g.moveTo(sx(blade.x), sy(y));
            g.quadraticCurveTo(sx(blade.x), sy(y + length * 0.6), sx(blade.x + Math.sin(blade.lean) * length), sy(y + Math.cos(blade.lean) * length));
            g.stroke();
        });

        // Low mist over the floor.
        const mist = g.createLinearGradient(0, sy(0.42), 0, sy(-0.02));
        mist.addColorStop(0, rgba(colors.mist, 0));
        mist.addColorStop(0.6, rgba(colors.mist, 0.13));
        mist.addColorStop(1, rgba(colors.mist, 0.04));
        g.fillStyle = mist;
        g.fillRect(0, sy(0.42), view.width, sy(-0.02) - sy(0.42));

        // The cut: soil, lighter at the top, with grit, pebbles and old roots.
        const soil = g.createLinearGradient(0, sy(0), 0, sy(-ground.depth));
        soil.addColorStop(0, colors.soil[0]);
        soil.addColorStop(1, colors.soil[1]);
        g.save();
        traceSoil(g, scene, frame, halfWidth, bottom);
        g.fillStyle = soil;
        g.fill();
        g.clip();
        const rootColor = mixHex(colors.soil[0], colors.roots, 0.35);
        strokeBranches2D(g, scene.roots, { progressOf: () => 1, thickness: 1, taper: 0.35, color: rootColor, sx, sy, scale });
        const lightGrain = rgba(colors.grit, 0.22);
        const darkGrain = rgba(colors.night, 0.35);
        scene.grit.forEach(grain => {
            g.fillStyle = grain.light > 0.55 ? lightGrain : darkGrain;
            g.fillRect(sx(grain.x), sy(grain.y), Math.max(1, grain.r * scale), Math.max(1, grain.r * scale));
        });
        scene.pebbles.forEach(pebble => {
            const across = pebble.r * scale;
            const tall = pebble.r * pebble.squash * scale;
            g.fillStyle = mixHex(colors.pebble, colors.soil[1], 0.35);
            g.beginPath();
            g.ellipse(sx(pebble.x), sy(pebble.y), across, tall, pebble.turn, 0, TAU);
            g.fill();
            g.fillStyle = rgba(colors.pebbleLight, 0.12);
            g.beginPath();
            g.ellipse(sx(pebble.x - pebble.r * 0.25), sy(pebble.y) - tall * 0.3, across * 0.5, tall * 0.4, pebble.turn, 0, TAU);
            g.fill();
        });
        g.restore();

        // The cut's top edge: a dark band of humus, a faint moonlit line, moss hanging over it.
        g.lineJoin = 'round';
        g.strokeStyle = rgba(colors.humus, 0.55);
        g.lineWidth = Math.max(1, 0.014 * scale);
        traceEdge(g, scene, frame, halfWidth, -0.007);
        g.stroke();
        g.strokeStyle = rgba(colors.edgeLight, 0.18);
        g.lineWidth = 1;
        traceEdge(g, scene, frame, halfWidth, 0);
        g.stroke();
        scene.edgeMoss.forEach(tuft => {
            g.fillStyle = tuft.color;
            g.beginPath();
            g.ellipse(sx(tuft.x), sy(scene.surfaceY(tuft.x)), tuft.r * scale, tuft.r * 0.55 * scale, 0, Math.PI, TAU);
            g.fill();
        });
    }

    /**
     * Where everything of one 2D mushroom goes, in its own units (foot at 0, 0): stem outline, cap tilt, cap silhouette and the
     * ellipse of its margin as seen from a little below. `at` places it: foot position, how much of its lean shows, size.
     */
    function layoutMushroom2D(state, at, spec, wavePhase) {
        const below = spec.glow.underside2D;
        const curve = stemCurve(state);
        [curve.foot, curve.control, curve.top].forEach(point => { point[0] *= at.lean; });
        const steps = 20;
        const left = [];
        const right = [];
        for (let $_ = 0; $_ <= steps; $_++) {
            const t = $_ / steps;
            const [cx, cy] = curvePoint(curve, t);
            const [tx, ty] = curveTangent(curve, t);
            const r = stemRadiusAt(state, t);
            left.push([cx - ty * r, cy + tx * r]);
            right.push([cx + ty * r, cy - tx * r]);
        }
        const [tx, ty] = curveTangent(curve, 1);
        const tilt = -Math.atan2(tx, ty) * spec.cap.tilt;
        const apex = curve.top;
        // A point of the cap (x sideways, y up, z towards the viewer) → mushroom units, tilted with the stem.
        const fromCap = (x, y, z = 0) => {
            const screenY = y + z * below;
            return [apex[0] + x * Math.cos(tilt) - screenY * Math.sin(tilt), apex[1] + x * Math.sin(tilt) + screenY * Math.cos(tilt)];
        };
        const cap = state.cap;
        const waves = spec.cap.waves;
        // Silhouette: left margin, over the crown, to the right margin.
        const silhouette = [];
        for (let $_ = 0; $_ <= 16; $_++) {
            const p = capPoint(cap, 1 - $_ / 16, Math.PI, wavePhase, waves);
            silhouette.push(fromCap(p.x, p.y));
        }
        for (let $_ = 1; $_ <= 16; $_++) {
            const p = capPoint(cap, $_ / 16, 0, wavePhase, waves);
            silhouette.push(fromCap(p.x, p.y));
        }
        // The margin all round: angle 0 is the right edge, a quarter turn the near side (higher on screen, seen from below).
        const margin = Array.from({ length: 49 }, (_, index) => {
            const around = index / 48 * TAU;
            const p = capPoint(cap, 1, around, wavePhase, waves);
            return { around, at: fromCap(p.x, p.y, p.z) };
        });
        const stemTop = stemRadiusAt(state, 1) * 0.92;
        return {
            at, curve, left, right, tilt, apex, fromCap, silhouette, margin, stemTop, below,
            gillCentre: fromCap(0, cap.rimY),
            domeCentre: fromCap(0, cap.centre + cap.b * 0.35),
        };
    }

    /** Mushroom units → canvas pixels. */
    const pixelOf = (layout, frame) => ([x, y]) => [frame.sx(layout.at.x + x * layout.at.k), frame.sy(layout.at.y + y * layout.at.k)];
    /** Mushroom units → scene units. */
    const sceneOf = (layout, [x, y]) => [layout.at.x + x * layout.at.k, layout.at.y + y * layout.at.k];

    const rgbOf = (hex, toward, t) => {
        const from = hexToRgb(hex);
        const to = hexToRgb(toward);
        return from.map((channel, index) => channel + (to[index] - channel) * clamp01(t));
    };

    function tracePolyline(g, points, toPixel, startNew = true) {
        points.forEach((point, index) => {
            const [x, y] = toPixel(point);
            if (index === 0 && startNew) g.moveTo(x, y);
            else g.lineTo(x, y);
        });
    }

    /**
     * What every part of one 2D mushroom needs: canvas pixels, its size in pixels, colours that sink into the night with
     * distance, points on its cap and the outlines it traces.
     */
    function mushroomPainter(layout, state, look, frame, spec) {
        const { colors } = spec;
        const px = pixelOf(layout, frame);
        const night = hexToRgb(colors.night);
        // Mushrooms further back sink into the dark.
        const tone = (hex, alpha, toward = hex, t = 0) => {
            const rgb = rgbOf(hex, toward, t).map((channel, index) => channel + (night[index] - channel) * look.fade);
            return css(rgb, alpha);
        };
        const capAt = (along, around) => capPoint(state.cap, along, around, look.wavePhase, spec.cap.waves);
        const nearMargin = layout.margin.filter($_ => $_.around <= Math.PI + 1e-6).map($_ => $_.at);

        const traceMargin = ctx => {
            ctx.beginPath();
            tracePolyline(ctx, layout.margin.map($_ => $_.at), px);
            ctx.closePath();
        };
        const traceDome = ctx => {
            ctx.beginPath();
            tracePolyline(ctx, layout.silhouette, px);
            tracePolyline(ctx, nearMargin, px, false);
            ctx.closePath();
        };
        const traceStem = ctx => {
            ctx.beginPath();
            tracePolyline(ctx, layout.left, px);
            // Over the top along the near half of the stem's top, which bows up a little seen from below.
            const [cx, cy] = px([layout.apex[0], layout.apex[1] + layout.stemTop * layout.below * 2]);
            const [rx, ry] = px(layout.right[layout.right.length - 1]);
            ctx.quadraticCurveTo(cx, cy, rx, ry);
            tracePolyline(ctx, layout.right.slice(0, -1).reverse(), px, false);
            const [fx, fy] = px([layout.curve.foot[0], layout.curve.foot[1] - state.bulb * 0.5]);
            const [lx, ly] = px(layout.left[0]);
            ctx.quadraticCurveTo(fx, fy, lx, ly);
            ctx.closePath();
        };
        return {
            spec, colors, layout, state, look, px, tone, capAt, nearMargin, traceMargin, traceDome, traceStem,
            k: layout.at.k * frame.scale,
            gillCentre: px(layout.gillCentre),
        };
    }

    /** Gills: the underside, as a flat ellipse, with lines from the stem to the margin; a veil covers them while closed. */
    function drawGills2D(g, paint) {
        const { colors, layout, state, look, px, tone, capAt, k } = paint;
        const open = state.open;
        g.fillStyle = tone(colors.veil, 0.96, colors.gills, open);
        paint.traceMargin(g);
        g.fill();
        g.globalCompositeOperation = 'lighter';
        if (open > 0.02) {
            g.strokeStyle = tone(colors.gillGlow, (0.12 + 0.5 * look.glow) * open);
            g.lineWidth = 1;
            g.beginPath();
            for (let $_ = 0; $_ < look.gills; $_++) {
                const around = ($_ + 0.5) / look.gills * TAU;
                const edge = capAt(1, around);
                // Every other gill is a short one that starts part-way out.
                const from = $_ % 2 === 0 ? 0 : 0.45;
                const inner = [layout.stemTop * Math.cos(around), 0, layout.stemTop * Math.sin(around)];
                g.moveTo(...px(layout.fromCap(lerp(inner[0], edge.x, from), lerp(0, edge.y, from), lerp(inner[2], edge.z, from))));
                g.lineTo(...px(layout.fromCap(edge.x * 0.97, edge.y, edge.z * 0.97)));
            }
            g.stroke();
        }
        const [gx, gy] = paint.gillCentre;
        const shine = g.createRadialGradient(gx, gy, 0, gx, gy, Math.max(1, state.cap.rim * k));
        shine.addColorStop(0, tone(colors.gillGlow, 0.55 * look.glow * open));
        shine.addColorStop(1, tone(colors.gillGlow, 0));
        g.fillStyle = shine;
        paint.traceMargin(g);
        g.fill();
        g.globalCompositeOperation = 'source-over';
    }

    /** Stem: pale and a little see-through, rounded by its shading, lit softly from under the cap. */
    function drawStem2D(g, paint) {
        const { colors, layout, look, px, tone } = paint;
        const mid = Math.floor(layout.left.length / 2);
        const across = g.createLinearGradient(...px(layout.left[mid]), ...px(layout.right[mid]));
        across.addColorStop(0, tone(colors.stem, 0.95, colors.night, 0.6));
        across.addColorStop(0.38, tone(colors.stem, 0.95));
        across.addColorStop(0.62, tone(colors.stem, 0.95, colors.night, 0.15));
        across.addColorStop(1, tone(colors.stem, 0.95, colors.night, 0.65));
        g.fillStyle = across;
        paint.traceStem(g);
        g.fill();
        g.globalCompositeOperation = 'lighter';
        // Only a little light on top of the pale stem, or its top burns out to a flat white bar.
        const along = g.createLinearGradient(...px(layout.apex), ...px(layout.curve.foot));
        along.addColorStop(0, tone(colors.stemGlow, 0.12 * look.glow));
        along.addColorStop(0.45, tone(colors.stemGlow, 0.07 * look.glow));
        along.addColorStop(1, tone(colors.stemGlow, 0.04 * look.glow));
        g.fillStyle = along;
        paint.traceStem(g);
        g.fill();
        // A few fibres along the stem.
        g.strokeStyle = tone(colors.stem, 0.1);
        g.lineWidth = 1;
        g.beginPath();
        [0.28, 0.5, 0.7].forEach(share => {
            const fibre = layout.left.slice(3, -2).map((point, index) => {
                const other = layout.right[index + 3];
                return [lerp(point[0], other[0], share), lerp(point[1], other[1], share)];
            });
            tracePolyline(g, fibre, px);
        });
        g.stroke();
        g.globalCompositeOperation = 'source-over';
    }

    /** The ring: what is left of the veil once the cap tears free, hanging as a little skirt. */
    function drawRing2D(g, paint) {
        const { spec, colors, layout, state, look, px, tone } = paint;
        if (state.ring <= 0.01) return;
        const [cx, cy] = curvePoint(layout.curve, spec.stem.ringAt);
        const r = stemRadiusAt(state, spec.stem.ringAt);
        const hang = spec.stem.ringLength * state.size * state.ring;
        const flare = r * lerp(1.05, spec.stem.ringFlare, state.ring);
        const at = (x, y) => px([x, y]);
        g.beginPath();
        g.moveTo(...at(cx - r, cy));
        g.quadraticCurveTo(...at(cx - flare * 0.95, cy - hang * 0.35), ...at(cx - flare, cy - hang));
        const scallops = 5;
        for (let $_ = 0; $_ < scallops; $_++) {
            const x0 = cx - flare + 2 * flare * $_ / scallops;
            const x1 = x0 + 2 * flare / scallops;
            g.quadraticCurveTo(...at((x0 + x1) / 2, cy - hang * 1.3), ...at(x1, cy - hang));
        }
        g.quadraticCurveTo(...at(cx + flare * 0.95, cy - hang * 0.35), ...at(cx + r, cy));
        g.closePath();
        const skirt = g.createLinearGradient(...at(cx, cy), ...at(cx, cy - hang));
        skirt.addColorStop(0, tone(colors.veil, 0.9, colors.night, 0.4));
        skirt.addColorStop(1, tone(colors.veil, 0.85));
        g.fillStyle = skirt;
        g.fill();
        g.globalCompositeOperation = 'lighter';
        g.strokeStyle = tone(colors.rim, 0.35 * look.glow);
        g.lineWidth = 1;
        g.stroke();
        g.globalCompositeOperation = 'source-over';
    }

    /** Cap: violet at the crown, blue, cyan at the thin margin, lit through from the gills; the egg is still wrapped in its veil. */
    function drawCap2D(g, paint) {
        const { spec, colors, layout, state, look, px, tone, capAt, k } = paint;
        const { cap, open } = state;
        const egg = (1 - open) * (1 - open);
        const body = g.createLinearGradient(...px(layout.fromCap(0, cap.centre + cap.b)), ...px(layout.fromCap(0, cap.rimY)));
        body.addColorStop(0, tone(colors.crown, look.opacity, colors.veil, egg * 0.6));
        body.addColorStop(0.55, tone(colors.cap, look.opacity, colors.veil, egg * 0.55));
        body.addColorStop(1, tone(colors.margin, look.opacity, colors.veil, egg * 0.45));
        g.fillStyle = body;
        paint.traceDome(g);
        g.fill();

        g.save();
        paint.traceDome(g);
        g.clip();
        g.globalCompositeOperation = 'lighter';
        // Light from the gills shining up through the flesh.
        const [gx, gy] = paint.gillCentre;
        const reach = Math.max(1, (cap.a + cap.b) * k);
        const inner = g.createRadialGradient(gx, gy, 0, gx, gy, reach);
        inner.addColorStop(0, tone(colors.margin, 0.3 * look.glow));
        inner.addColorStop(0.5, tone(colors.cap, 0.14 * look.glow));
        inner.addColorStop(1, tone(colors.cap, 0));
        g.fillStyle = inner;
        g.fillRect(gx - reach, gy - reach, reach * 2, reach * 2);
        // Fine grooves near the margin of the open cap, on the near side; the crown and the egg are smooth.
        const grooves = smooth(window01(open, 0.5, 1));
        const nearHalf = Math.round(spec.cap.striae / 2);
        if (grooves > 0.01 && nearHalf > 0) {
            g.strokeStyle = tone(colors.margin, (0.1 + 0.2 * look.glow) * grooves);
            g.lineWidth = 1;
            g.beginPath();
            for (let $_ = 0; $_ < nearHalf; $_++) {
                const around = ($_ + 0.5) / nearHalf * Math.PI;
                const groove = Array.from({ length: 4 }, (_, step) => {
                    const p = capAt(0.75 + step / 3 * 0.25, around);
                    return layout.fromCap(p.x, p.y, p.z);
                });
                tracePolyline(g, groove, px);
            }
            g.stroke();
        }
        // A soft sheen near the crown.
        const [hx, hy] = px(layout.fromCap(-cap.a * 0.35, cap.centre + cap.b * 0.72));
        const sheenR = Math.max(1, cap.a * 0.45 * k);
        const sheen = g.createRadialGradient(hx, hy, 0, hx, hy, sheenR);
        sheen.addColorStop(0, `rgba(255,255,255,${(0.16 * (1 - look.fade)).toFixed(3)})`);
        sheen.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = sheen;
        g.fillRect(hx - sheenR, hy - sheenR, sheenR * 2, sheenR * 2);
        g.restore();

        // The ghostly outline, and the near margin catching the light from the gills.
        g.globalCompositeOperation = 'lighter';
        g.lineWidth = Math.max(1, 0.006 * k);
        g.strokeStyle = tone(colors.rim, look.rim);
        g.beginPath();
        tracePolyline(g, layout.silhouette, px);
        g.stroke();
        g.strokeStyle = tone(colors.gillGlow, 0.5 * look.glow * open);
        g.beginPath();
        tracePolyline(g, paint.nearMargin, px);
        g.stroke();
        g.globalCompositeOperation = 'source-over';
    }

    /** Spots: flat discs on the dome, foreshortened as they turn away; they crack apart as the cap opens. Returns their glows. */
    function drawSpots2D(g, paint) {
        const { spec, colors, layout, state, look, px, tone, capAt, k } = paint;
        const spotGlow = [];
        g.fillStyle = tone(colors.spots, 0.5 + 0.45 * look.glow);
        look.spots.forEach(spot => {
            const grown = spotProgress(spot, state.open);
            if (grown <= 0.01) return;
            const p = capAt(spot.along, spot.around);
            const normal = capNormal(state.cap, p.theta, spot.around);
            const facing = (normal.z - normal.y * layout.below) / Math.hypot(1, layout.below);
            if (facing <= 0.08) return;
            const [x, y] = px(layout.fromCap(p.x, p.y, p.z));
            const size = spec.cap.spotSize * spot.size * state.size * grown * k;
            const turn = -(Math.atan2(normal.y, normal.x) + layout.tilt);
            g.beginPath();
            g.ellipse(x, y, Math.max(0.3, size * facing), Math.max(0.3, size), turn, 0, TAU);
            g.fill();
            spotGlow.push([x, y, size * 1.7 * (0.6 + 0.4 * facing)]);
        });
        g.globalCompositeOperation = 'lighter';
        g.globalAlpha = clamp01(0.2 + 0.35 * look.glow) * (1 - look.fade);
        spotGlow.forEach(([x, y, size]) => g.drawImage(look.sprite, x - size, y - size, size * 2, size * 2));
        g.globalAlpha = 1;
        g.globalCompositeOperation = 'source-over';
        return spotGlow;
    }

    /** What blooms: cap, gills, stem and spots, onto the glow layer. */
    function paintGlow2D(glow, paint, spotGlow) {
        const { colors, state, look, tone } = paint;
        glow.globalCompositeOperation = 'lighter';
        glow.fillStyle = tone(colors.cap, 0.12 * look.glow);
        paint.traceDome(glow);
        glow.fill();
        glow.fillStyle = tone(colors.gillGlow, 0.6 * look.glow * state.open);
        paint.traceMargin(glow);
        glow.fill();
        // The stem stands in front of the far gills: their glow must not bloom over it.
        glow.globalCompositeOperation = 'destination-out';
        glow.fillStyle = 'rgba(0,0,0,0.85)';
        paint.traceStem(glow);
        glow.fill();
        glow.globalCompositeOperation = 'lighter';
        glow.fillStyle = tone(colors.stemGlow, 0.08 * look.glow);
        paint.traceStem(glow);
        glow.fill();
        glow.globalAlpha = clamp01(0.6 * look.glow) * (1 - look.fade);
        spotGlow.forEach(([x, y, size]) => glow.drawImage(look.sprite, x - size * 1.5, y - size * 1.5, size * 3, size * 3));
        glow.globalAlpha = 1;
    }

    /**
     * One 2D mushroom: gills under the cap, the stem in front of the far gills, the ring, then the see-through cap with its
     * spots. Glowing parts are also painted onto `glow`, the layer that is blurred into the bloom.
     */
    function drawMushroom2D(g, glow, layout, state, look, frame, spec) {
        const paint = mushroomPainter(layout, state, look, frame, spec);
        // A mushroom on the floor behind the cut: whatever is below the floor is in the ground.
        const planted = layout.at.planted;
        if (planted) {
            const groundLine = frame.sy(layout.at.ground - 0.003);
            [g, glow].forEach(ctx => {
                ctx.save();
                ctx.beginPath();
                ctx.rect(-1e4, -1e4, 2e4, groundLine + 1e4);
                ctx.clip();
            });
        }
        drawGills2D(g, paint);
        drawStem2D(g, paint);
        drawRing2D(g, paint);
        drawCap2D(g, paint);
        const spotGlow = drawSpots2D(g, paint);
        paintGlow2D(glow, paint, spotGlow);
        if (planted) [g, glow].forEach(ctx => ctx.restore());
    }

    /**
     * The threads in the cut: strands and their first forks bright, the fine ones fainter, so where they cross they add up to
     * cyan rather than white; the thicker ones also go onto the glow layer. Everything is added, so threads stroked once at
     * full `brightness` and copied at a lower one look the same as stroked at that one.
     */
    function strokeThreads(g, glow, mycelium, spec, frame, progressOf, brightness) {
        const { sx, sy, scale } = frame;
        const { colors } = spec;
        const style = { progressOf, thickness: 1, taper: spec.mycelium.widthDecay, sx, sy, scale };
        strokeBranches2D(g, mycelium.strands, { ...style, color: rgba(colors.mycelium, 0.6 * brightness) });
        strokeBranches2D(g, mycelium.fine, { ...style, color: rgba(colors.mycelium, 0.2 * brightness) });
        strokeBranches2D(glow, mycelium.glowing, { ...style, thickness: 2.4, color: rgba(colors.mycelium, 0.25 * brightness) });
    }

    /**
     * Once the last thread has grown, the threads only change brightness: they are stroked once into their own layers and
     * copied from there, which spares a few thousand strokes per repaint. Returns false while they are still growing.
     */
    function copyGrownThreads(g, glow, layers, view, scene, spec, frame, growth, brightness) {
        const mycelium = scene.mycelium;
        if (growth < mycelium.doneAt) return false;
        const plate = layers.plate.canvas;
        const size = `${plate.width}x${plate.height}`;
        if (layers.threadsOf !== scene || layers.threadsSize !== size) {
            const ratio = plate.width / view.width;
            layers.threads = fitLayer(layers.threads, view, ratio);
            layers.threadGlow = fitLayer(layers.threadGlow, view, layers.glow.canvas.width / view.width);
            [layers.threads.g, layers.threadGlow.g].forEach(ctx => {
                ctx.clearRect(0, 0, view.width, view.height);
                ctx.globalCompositeOperation = 'lighter';
            });
            strokeThreads(layers.threads.g, layers.threadGlow.g, mycelium, spec, frame, () => 1, 1);
            layers.threadsOf = scene;
            layers.threadsSize = size;
        }
        g.globalAlpha = brightness;
        g.drawImage(layers.threads.canvas, 0, 0, view.width, view.height);
        g.globalAlpha = 1;
        glow.globalAlpha = brightness;
        glow.drawImage(layers.threadGlow.canvas, 0, 0, view.width, view.height);
        glow.globalAlpha = 1;
        return true;
    }

    /**
     * Light on the floor round each foot and a halo round each cap, behind everything else. Both are soft, so they are
     * painted into a small layer and scaled up in one go: big gradient fills cost per pixel.
     */
    function paintSoftLight2D(g, layers, view, frame, entries, spec, growth) {
        const { sx, sy, scale } = frame;
        const { colors } = spec;
        const glowLevel = glowAt(spec, growth);
        const magic = magicAt(spec, growth);
        const soft = layers.softLight.g;
        soft.globalCompositeOperation = 'source-over';
        soft.clearRect(0, 0, view.width, view.height);
        soft.globalCompositeOperation = 'lighter';
        let anyLight = false;
        entries.forEach(({ state, at, layout }) => {
            const strength = glowLevel * state.form * (1 - at.fade);
            if (strength <= 0.005) return;
            anyLight = true;
            const poolR = (0.1 + state.cap.a * 1.3) * at.k * scale;
            soft.save();
            soft.translate(sx(at.x), sy(at.ground));
            soft.scale(1, 0.22);
            const pool = soft.createRadialGradient(0, 0, 0, 0, 0, poolR);
            pool.addColorStop(0, rgba(colors.light, spec.glow.pool * strength));
            pool.addColorStop(1, rgba(colors.light, 0));
            soft.fillStyle = pool;
            soft.fillRect(-poolR, -poolR, poolR * 2, poolR * 2);
            soft.restore();

            const haloStrength = spec.glow.halo * (0.2 * glowLevel + 0.8 * magic) * (0.3 + 0.7 * state.open) * (1 - at.fade);
            if (haloStrength <= 0.005) return;
            const [hx, hy] = sceneOf(layout, layout.domeCentre);
            const haloR = (state.cap.a * 2.6 + 0.05) * at.k * scale;
            const halo = soft.createRadialGradient(sx(hx), sy(hy), 0, sx(hx), sy(hy), haloR);
            halo.addColorStop(0, rgba(colors.halo, 0.32 * haloStrength));
            halo.addColorStop(0.4, rgba(colors.halo, 0.1 * haloStrength));
            halo.addColorStop(1, rgba(colors.halo, 0));
            soft.fillStyle = halo;
            soft.fillRect(sx(hx) - haloR, sy(hy) - haloR, haloR * 2, haloR * 2);
        });
        if (!anyLight) return;
        g.globalCompositeOperation = 'lighter';
        g.drawImage(layers.softLight.canvas, 0, 0, view.width, view.height);
        g.globalCompositeOperation = 'source-over';
    }

    /**
     * Bloom: the glow layer blurred at two sizes and added on top. Each blur goes into a smaller layer, as a blur costs per
     * pixel (a canvas filter's length is in that layer's own pixels, so the radius is scaled to them); the wide one is added
     * into the near one, so only one layer is scaled up onto the picture.
     */
    function addBloom2D(g, layers, view, spec, scale) {
        const [nearBlur, wideBlur] = spec.glow.bloom2D;
        const [nearStrength, wideStrength] = [0.85, 0.75];
        const blurInto = (layer, radius) => {
            const pixels = layer.canvas.width / view.width;
            layer.g.globalCompositeOperation = 'source-over';
            layer.g.globalAlpha = 1;
            layer.g.clearRect(0, 0, view.width, view.height);
            layer.g.filter = `blur(${Math.max(1, radius * scale * pixels).toFixed(1)}px)`;
            layer.g.drawImage(layers.glow.canvas, 0, 0, view.width, view.height);
            layer.g.filter = 'none';
        };
        blurInto(layers.bloomNear, nearBlur);
        blurInto(layers.bloomWide, wideBlur);
        layers.bloomNear.g.globalCompositeOperation = 'lighter';
        layers.bloomNear.g.globalAlpha = wideStrength / nearStrength;
        layers.bloomNear.g.drawImage(layers.bloomWide.canvas, 0, 0, view.width, view.height);
        layers.bloomNear.g.globalAlpha = 1;
        g.save();
        g.globalCompositeOperation = 'lighter';
        g.globalAlpha = nearStrength;
        g.drawImage(layers.bloomNear.canvas, 0, 0, view.width, view.height);
        g.restore();
    }

    /**
     * The whole 2D picture at one growth, except what moves by itself (spores, pulses): painted onto the plate, which the
     * view copies to the screen every frame. Returns where each cap's gills are, for the spores.
     */
    function paintScene2D(layers, view, frame, scene, spec, growth, sprites) {
        const g = layers.plate.g;
        const glow = layers.glow.g;
        const { sx, sy, scale } = frame;
        const { colors } = spec;
        g.globalCompositeOperation = 'source-over';
        g.globalAlpha = 1;
        g.drawImage(layers.backdrop.canvas, 0, 0, view.width, view.height);
        glow.globalCompositeOperation = 'source-over';
        glow.clearRect(0, 0, view.width, view.height);

        const glowLevel = glowAt(spec, growth);
        const magic = magicAt(spec, growth);
        const look = {
            glow: glowLevel,
            opacity: between(spec.glow.capOpacity, magic),
            rim: clamp01(between(spec.glow.rim, glowLevel) / 2),
            sprite: sprites.spot,
        };

        // Back to front: companions on the floor behind the cut, then the main mushroom standing in the cut. A pin that is
        // still swelling sits partly in the ground.
        const companionGills = Math.round(spec.cap.gills * spec.companions.spotShare);
        const companions = scene.placed.map(entry => {
            const { companion, k } = entry;
            const state = mushroomState(spec, companionAge(companion, growth), companion.size, companion.shape);
            const ground = floorY(scene, spec, entry.x, entry.back * 0.85);
            return {
                source: entry.index + 1,
                state,
                at: { x: entry.x, ground, y: ground - state.sink * k, lean: entry.lean, k, fade: 0.45 * entry.back, planted: true },
                spots: entry.spots,
                wavePhase: companion.wavePhase,
                gills: companionGills,
            };
        });
        const mainState = mushroomState(spec, mainAge(spec, growth), 1, MAIN_SHAPE);
        const main = {
            source: 0,
            state: mainState,
            at: { x: 0, ground: 0, y: -mainState.sink, lean: 1, k: 1, fade: 0 },
            spots: scene.spots,
            wavePhase: scene.wavePhase,
            gills: spec.cap.gills,
        };
        const entries = [...companions, main].filter(entry => entry.state.visible);
        entries.forEach(entry => { entry.layout = layoutMushroom2D(entry.state, entry.at, spec, entry.wavePhase); });

        paintSoftLight2D(g, layers, view, frame, entries, spec, growth);

        const shadow = hexToRgb(colors.shadow);
        entries.forEach(entry => {
            if (entry.at.planted) {
                // A soft dark patch where it stands, so it sits in the moss rather than on it.
                const width = (entry.state.bulb * 2.4 + 0.012) * entry.at.k * scale;
                g.save();
                g.translate(sx(entry.at.x), sy(entry.at.ground));
                g.scale(1, 0.3);
                const patch = g.createRadialGradient(0, 0, 0, 0, 0, width);
                patch.addColorStop(0, css(shadow, 0.4));
                patch.addColorStop(1, css(shadow, 0));
                g.fillStyle = patch;
                g.fillRect(-width, -width, width * 2, width * 2);
                g.restore();
            }
            const own = { ...look, fade: entry.at.fade, spots: entry.spots, wavePhase: entry.wavePhase, gills: entry.gills };
            drawMushroom2D(g, glow, entry.layout, entry.state, own, frame, spec);
        });

        // In the cut: darken what is buried, then the glowing threads on top.
        const halfWidth = view.width / 2 / Math.max(1e-6, scale) + 0.05;
        g.save();
        traceSoil(g, scene, frame, halfWidth, -spec.ground.depth - view.height / Math.max(1e-6, scale));
        g.clip();
        g.fillStyle = rgba(colors.soil[1], 0.5);
        g.fillRect(0, 0, view.width, view.height);
        g.globalCompositeOperation = 'lighter';
        glow.globalCompositeOperation = 'lighter';
        const { branches, growDur } = scene.mycelium;
        const progressOf = branch => easeOut(clamp01((growth - branch.birth) / growDur));
        const threadAlpha = clamp01(between(spec.glow.mycelium, glowLevel) / spec.glow.mycelium[1]);
        const brightness = (1 + threadAlpha) / 2;
        if (!copyGrownThreads(g, glow, layers, view, scene, spec, frame, growth, brightness)) {
            strokeThreads(g, glow, scene.mycelium, spec, frame, progressOf, brightness);
            // Growing tips shine brightest.
            branches.forEach(branch => {
                const progress = progressOf(branch);
                const bead = tipBead(progress);
                if (bead <= 0.001) return;
                const [x, y] = pointOnBranch(branch, progress);
                const size = (0.01 + branch.width * 1.5) * scale * bead;
                g.drawImage(sprites.thread, sx(x) - size, sy(y) - size, size * 2, size * 2);
            });
        }
        // The spore it all started from, swelling into the knot that becomes the pin.
        const knot = smooth(window01(growth, spec.knotFrom, spec.pinFrom + 0.1));
        const knotR = (0.012 + 0.05 * knot + 0.03 * glowLevel) * scale;
        const [kx, ky] = [sx(scene.knot.x), sy(scene.knot.y)];
        const knotGlow = g.createRadialGradient(kx, ky, 0, kx, ky, knotR);
        knotGlow.addColorStop(0, rgba(colors.mycelium, 0.6 + 0.3 * knot));
        knotGlow.addColorStop(0.35, rgba(colors.mycelium, 0.18 + 0.25 * knot));
        knotGlow.addColorStop(1, rgba(colors.mycelium, 0));
        g.fillStyle = knotGlow;
        g.fillRect(kx - knotR, ky - knotR, knotR * 2, knotR * 2);
        g.restore();

        addBloom2D(g, layers, view, spec, scale);

        // Where the spores come from: each cap's gills, by source (main first, then companions in spec order).
        const anchors = [];
        entries.forEach(entry => {
            const [x, y] = sceneOf(entry.layout, entry.layout.gillCentre);
            // The spores' whole offset is scaled by k when drawn, so the rim goes in unscaled.
            anchors[entry.source] = { x, y, rim: entry.state.cap.rim, k: entry.at.k, fade: entry.at.fade };
        });
        return anchors;
    }

    // ─── Mushroom in 3D ───

    /** Like `instanced`, but draws exactly `count` pieces: none at all when a spec asks for none. */
    function instancedExactly(geometry, material, count) {
        const mesh = instanced(geometry, material, count);
        mesh.count = count;
        return mesh;
    }

    /** A canvas texture drawn by `paint(g, width, height)`, mapped with v running down the canvas. */
    function paintedTexture(width, height, paint) {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        paint(canvas.getContext('2d'), width, height);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.flipY = false;
        texture.wrapS = THREE.RepeatWrapping;
        return texture;
    }

    // A soft white dot: halos, spores, the knot. Tinted by each material's colour.
    const glowDot = paintedTexture(128, 128, (g, size) => {
        const gradient = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.2, 'rgba(255,255,255,0.55)');
        gradient.addColorStop(0.5, 'rgba(255,255,255,0.14)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = gradient;
        g.fillRect(0, 0, size, size);
    });

    /** The cap's glow: violet crown, blue, cyan margin, with fine grooves near the margin only (v runs crown → margin). */
    const capTexture = (colors, striae) => paintedTexture(512, 128, (g, width, height) => {
        const body = g.createLinearGradient(0, 0, 0, height);
        // Seen from the side the dome shows mostly its lower half, so the blue reaches far down and the cyan stays at the margin.
        body.addColorStop(0, colors.crown);
        body.addColorStop(0.35, mixHex(colors.crown, colors.cap, 0.6));
        body.addColorStop(0.75, colors.cap);
        body.addColorStop(1, colors.margin);
        g.fillStyle = body;
        g.fillRect(0, 0, width, height);
        const grooves = g.createLinearGradient(0, height * 0.7, 0, height);
        grooves.addColorStop(0, rgba(colors.margin, 0));
        grooves.addColorStop(1, rgba(colors.margin, 0.3));
        g.fillStyle = grooves;
        for (let $_ = 0; $_ < striae; $_++) g.fillRect($_ / striae * width, height * 0.7, 1.5, height * 0.3);
    });

    /** Gills seen from below: long ones reach the stem (v = 0), shorter ones fill in towards the margin (v = 1). */
    const gillTexture = (colors, gills) => paintedTexture(2048, 64, (g, width, height) => {
        g.fillStyle = colors.gills;
        g.fillRect(0, 0, width, height);
        g.fillStyle = colors.gillGlow;
        const total = gills * 4;
        for (let $_ = 0; $_ < total; $_++) {
            const from = $_ % 4 === 0 ? 0 : $_ % 2 === 0 ? 0.4 : 0.7;
            g.fillRect($_ / total * width, from * height, Math.max(1, width / total * 0.45), height * (1 - from));
        }
    });

    /** The stem's glow: strongest just under the cap (v = 1), still a faint shine at the foot, with faint fibres. */
    const stemTexture = colors => paintedTexture(256, 128, (g, width, height) => {
        const body = g.createLinearGradient(0, 0, 0, height);
        body.addColorStop(0, mixHex(colors.stemGlow, colors.stemDark, 0.65));
        body.addColorStop(0.6, mixHex(colors.stemGlow, colors.stemDark, 0.4));
        body.addColorStop(1, colors.stemGlow);
        g.fillStyle = body;
        g.fillRect(0, 0, width, height);
        g.fillStyle = 'rgba(255,255,255,0.08)';
        for (let $_ = 0; $_ < 40; $_++) g.fillRect($_ / 40 * width, 0, 1, height);
    });

    /**
     * Adds a ghostly rim: surfaces glow where they turn away from the eye, the way thin translucent flesh catches light at
     * its edges. Also a plain glow that the emissive map does not tint: the closed egg's pale veil. Strengths and colours live
     * in material.userData.rim and can change every frame.
     */
    function withRim(material, color, veil = '#ffffff') {
        const rim = {
            rimColor: { value: new THREE.Color(color) },
            rimStrength: { value: 0 },
            veilColor: { value: new THREE.Color(veil) },
            veilGlow: { value: 0 },
        };
        material.userData.rim = rim;
        material.onBeforeCompile = shader => {
            Object.assign(shader.uniforms, rim);
            shader.fragmentShader = shader.fragmentShader
                .replace('#include <common>', [
                    '#include <common>',
                    'uniform vec3 rimColor;',
                    'uniform float rimStrength;',
                    'uniform vec3 veilColor;',
                    'uniform float veilGlow;',
                ].join('\n'))
                .replace('#include <emissivemap_fragment>', [
                    '#include <emissivemap_fragment>',
                    'float rimFacing = 1.0 - abs( dot( normal, normalize( vViewPosition ) ) );',
                    'totalEmissiveRadiance += rimColor * rimStrength * rimFacing * rimFacing + veilColor * veilGlow;',
                ].join('\n'));
        };
        return material;
    }

    /**
     * Light the caps throw on the ground: a soft pool round each foot, added to the material's own glow so it shows on the
     * floor, the moss and the pebbles alike. `pools` holds, per mushroom, (x, z, radius, strength), changed every frame.
     */
    function withPools(material, pools, color) {
        const uniforms = { poolColor: { value: new THREE.Color(color) }, pools: { value: pools } };
        material.defines = { ...material.defines, POOLS: pools.length };
        material.onBeforeCompile = shader => {
            Object.assign(shader.uniforms, uniforms);
            shader.vertexShader = shader.vertexShader
                .replace('#include <common>', '#include <common>\nvarying vec2 vPoolXZ;')
                .replace('#include <project_vertex>', [
                    '#include <project_vertex>',
                    'vec4 poolWorld = vec4( transformed, 1.0 );',
                    '#ifdef USE_INSTANCING',
                    '    poolWorld = instanceMatrix * poolWorld;',
                    '#endif',
                    'vPoolXZ = ( modelMatrix * poolWorld ).xz;',
                ].join('\n'));
            shader.fragmentShader = shader.fragmentShader
                .replace('#include <common>', '#include <common>\nvarying vec2 vPoolXZ;\nuniform vec3 poolColor;\nuniform vec4 pools[ POOLS ];')
                .replace('#include <emissivemap_fragment>', [
                    '#include <emissivemap_fragment>',
                    'for ( int i = 0; i < POOLS; i ++ ) {',
                    '    vec2 fromFoot = vPoolXZ - pools[ i ].xy;',
                    '    float reach = max( 1e-3, pools[ i ].z );',
                    '    totalEmissiveRadiance += poolColor * pools[ i ].w * exp( - dot( fromFoot, fromFoot ) / ( reach * reach ) );',
                    '}',
                ].join('\n'));
        };
        return material;
    }

    /** A grid of (rows + 1) × (columns + 1) vertices whose positions and normals are rewritten as the mushroom grows. */
    function makeGrid(rows, columns, faceOut) {
        const geometry = new THREE.BufferGeometry();
        const count = (rows + 1) * (columns + 1);
        geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
        geometry.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
        const uv = new Float32Array(count * 2);
        for (let row = 0; row <= rows; row++) {
            for (let column = 0; column <= columns; column++) {
                const index = row * (columns + 1) + column;
                uv[index * 2] = column / columns;
                uv[index * 2 + 1] = row / rows;
            }
        }
        geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
        const indices = [];
        for (let row = 0; row < rows; row++) {
            for (let column = 0; column < columns; column++) {
                const a = row * (columns + 1) + column;
                const b = a + columns + 1;
                // Winding decides which side is the front: rows running up the stem vs. down from the crown.
                if (faceOut) indices.push(a, b, a + 1, b, b + 1, a + 1);
                else indices.push(a, a + 1, b, b, a + 1, b + 1);
            }
        }
        geometry.setIndex(indices);
        geometry.userData = { rows, columns };
        return geometry;
    }

    function finishGrid(geometry) {
        geometry.attributes.position.needsUpdate = true;
        geometry.attributes.normal.needsUpdate = true;
    }

    /** The stem in its lean plane (x towards the lean, y up, z across): rings along the curve, normals tilted on the bulb. */
    function writeStem(geometry, state) {
        const { rows, columns } = geometry.userData;
        const position = geometry.attributes.position.array;
        const normal = geometry.attributes.normal.array;
        const curve = stemCurve(state);
        for (let row = 0; row <= rows; row++) {
            const t = row / rows;
            const [cx, cy] = curvePoint(curve, t);
            const [tx, ty] = curveTangent(curve, t);
            const r = stemRadiusAt(state, t);
            const t0 = Math.max(0, t - 0.02);
            const t1 = Math.min(1, t + 0.02);
            const slope = (stemRadiusAt(state, t1) - stemRadiusAt(state, t0)) / Math.max(1e-6, (t1 - t0) * state.length);
            for (let column = 0; column <= columns; column++) {
                const around = column / columns * TAU;
                const out = [ty * Math.cos(around), -tx * Math.cos(around), Math.sin(around)];
                const at = (row * (columns + 1) + column) * 3;
                position[at] = cx + out[0] * r;
                position[at + 1] = cy + out[1] * r;
                position[at + 2] = out[2] * r;
                const n = [out[0] - tx * slope, out[1] - ty * slope, out[2]];
                const length = Math.hypot(...n) || 1;
                normal[at] = n[0] / length;
                normal[at + 1] = n[1] / length;
                normal[at + 2] = n[2] / length;
            }
        }
        finishGrid(geometry);
    }

    /** The cap's top surface, crown to margin, in the cap's own frame (origin at the stem top). */
    function writeCap(geometry, cap, wavePhase, waves) {
        const { rows, columns } = geometry.userData;
        const position = geometry.attributes.position.array;
        const normal = geometry.attributes.normal.array;
        for (let row = 0; row <= rows; row++) {
            for (let column = 0; column <= columns; column++) {
                const around = column / columns * TAU;
                const p = capPoint(cap, row / rows, around, wavePhase, waves);
                const n = capNormal(cap, p.theta, around);
                const at = (row * (columns + 1) + column) * 3;
                position[at] = p.x;
                position[at + 1] = p.y;
                position[at + 2] = p.z;
                normal[at] = n.x;
                normal[at + 1] = n.y;
                normal[at + 2] = n.z;
            }
        }
        finishGrid(geometry);
    }

    /** The underside from the stem out to the margin, slightly arched; gills come from its texture. */
    function writeGills(geometry, state, wavePhase, waves) {
        const { rows, columns } = geometry.userData;
        const position = geometry.attributes.position.array;
        const normal = geometry.attributes.normal.array;
        const cap = state.cap;
        // From the very centre, so the disc closes over the stem's open top instead of showing down the tube.
        const inner = 0;
        const arch = 0.12 * cap.b * state.open;
        for (let row = 0; row <= rows; row++) {
            const s = row / rows;
            for (let column = 0; column <= columns; column++) {
                const around = column / columns * TAU;
                const edge = capPoint(cap, 1, around, wavePhase, waves);
                const reach = lerp(inner, Math.hypot(edge.x, edge.z) * 0.995, s);
                const at = (row * (columns + 1) + column) * 3;
                position[at] = Math.cos(around) * reach;
                position[at + 1] = lerp(0, cap.rimY, s) + arch * Math.sin(Math.PI * s);
                position[at + 2] = Math.sin(around) * reach;
                normal[at] = 0;
                normal[at + 1] = -1;
                normal[at + 2] = 0;
            }
        }
        finishGrid(geometry);
    }

    /** The ring's skirt: radius 1 at the top flaring to `flare` at a scalloped hem, one unit down. Scaled per mushroom. */
    function makeSkirtGeometry(flare) {
        const geometry = makeGrid(4, 32, true);
        const position = geometry.attributes.position.array;
        for (let row = 0; row <= 4; row++) {
            const t = 1 - row / 4;   // row 0 is the hem, row 4 the top
            for (let column = 0; column <= 32; column++) {
                const around = column / 32 * TAU;
                const hem = 1 + 0.12 * Math.max(0, Math.sin(around * 8)) * (1 - row / 4);
                const radius = lerp(1, flare, Math.pow(t, 0.8));
                const at = (row * 33 + column) * 3;
                position[at] = Math.cos(around) * radius;
                position[at + 1] = -t * hem;
                position[at + 2] = Math.sin(around) * radius;
            }
        }
        geometry.computeVertexNormals();
        return geometry;
    }

    /** Height of the 3D ground: the mound, small bumps away from the foot, gentle swells further out. */
    function groundShape(spec) {
        const bumps = noise2D(spec.seed + 9);
        const swells = noise2D(spec.seed + 13);
        const { ground } = spec;
        return (x, z) => {
            const r = Math.hypot(x, z);
            return moundAt(ground, r)
                + bumps(x * 7 + 50, z * 7 + 50) * ground.bumps * bumpsNear(r)
                + swells(x * 1.4 + 20, z * 1.4 + 20) * 0.035 * smooth(window01(r, ground.radius, ground.radius * 2.5));
        };
    }

    /** A round forest floor, finer near the middle, bare soil round the foot and moss further out, fading into the night. */
    function buildGroundGeometry(spec, heightAt) {
        const rings = 40;
        const sides = 80;
        const { colors, ground } = spec;
        const reach = ground.reach3D;
        const patches = noise2D(spec.seed + 17);
        const shades = noise2D(spec.seed + 19);
        const soil = new THREE.Color(colors.soil3D);
        const floor = new THREE.Color(colors.floor3D);
        const moss = colors.moss.map(hex => new THREE.Color(hex).multiplyScalar(ground.mossLift3D));
        const color = new THREE.Color();
        const positions = [];
        const tints = [];
        for (let ring = 0; ring <= rings; ring++) {
            const r = reach * Math.pow(ring / rings, 1.8);
            for (let side = 0; side < sides; side++) {
                const angle = (side + (ring % 2) * 0.5) / sides * TAU;
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                positions.push(x, heightAt(x, z), z);
                const mossy = smooth(window01(patches(x * 5 + 7, z * 5 + 7), -0.15, 0.3)) * smooth(window01(r, 0.08, 0.32));
                const shadeAt = clamp01(shades(x * 9 + 3, z * 9 + 3) * 0.5 + 0.5);
                const shade = moss[Math.min(moss.length - 1, Math.floor(shadeAt * moss.length))];
                color.copy(soil).lerp(shade, mossy);
                color.lerp(floor, 0.75 * smooth(window01(r, ground.radius * 0.9, ground.radius * 2.4)));
                tints.push(color.r, color.g, color.b);
            }
        }
        const indices = [];
        for (let ring = 0; ring < rings; ring++) {
            for (let side = 0; side < sides; side++) {
                const a = ring * sides + side;
                const b = ring * sides + (side + 1) % sides;
                const c = (ring + 1) * sides + side;
                const d = (ring + 1) * sides + (side + 1) % sides;
                indices.push(a, b, c, b, d, c);
            }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(tints, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
    }

    /** Moss cushions, pebbles and twigs on the floor: instanced, placed once per seed. */
