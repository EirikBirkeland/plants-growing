<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Growth demo</title>
<style>
  :root { --page:#141821; --panel:#1a1f2b; --border:#2a3040; --ink:#e8ecf1; --muted:#8a94a6; --accent:#4ea1ff; --bloom:#f29abb; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--page); color: var(--ink); font: 13px/1.45 system-ui, sans-serif; }
  header { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  h1 { font-size: 15px; margin: 0 8px 0 0; }
  h2 { font-size: 12px; font-weight: 500; color: var(--muted); margin: 0; padding: 8px 12px; }
  button, select { background: rgba(78,161,255,.15); color: var(--ink); border: 1px solid var(--accent); border-radius: 5px; padding: 5px 12px; font: inherit; cursor: pointer; }
  button:hover { background: rgba(78,161,255,.3); }
  .tab.active { background: rgba(78,161,255,.45); }
  input[type=range] { accent-color: var(--accent); }
  #growth { width: 280px; }
  output { min-width: 20px; font-variant-numeric: tabular-nums; }
  #growthValue { min-width: 48px; }
  label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  #stage { color: var(--muted); }
  #stage.pink { color: var(--bloom); }
  #stage.green { color: #7fd36b; }
  #stage.cyan { color: #6fe3ff; }
  #stage.gold { color: #f2c94c; }
  #seedValue, #counts { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
  section { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  section > canvas, section > .view3d { flex: 1; min-height: 0; width: 100%; display: block; }
  /* Screens and control groups are switched with the hidden attribute; without this, main's display: grid would win. */
  [hidden] { display: none !important; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <div class="row">
    <h1>Growth demo</h1>
    <button class="tab" data-view="bonsai">🌸 Bonsai</button>
    <button class="tab" data-view="broccoli">🥦 Broccoli</button>
    <button class="tab" data-view="mushroom">🍄 Mushroom</button>
    <button class="tab" data-view="fern">🌿 Fern</button>
    <button class="tab" data-view="palm">🌴 Palm</button>
    <button class="tab" data-view="sunflower">🌻 Sunflower</button>
    <button class="tab" data-view="bamboo">🎋 Bamboo</button>
    <button class="tab" data-view="willow">🌳 Willow</button>
  </div>
  <div class="row">
    <button id="play">▶ Play</button>
    <select id="speed" title="1× = 1% per second">
      <option value="1">1×</option>
      <option value="2">2×</option>
      <option value="5">5×</option>
      <option value="10" selected>10×</option>
      <option value="20">20×</option>
    </select>

    <span id="stage"></span>
  </div>
  <div class="row">
    <span class="row" data-view="bonsai">
      <label title="Main limbs off the trunk">Boughs <input id="boughs" type="range" min="1" max="8" step="1"><output id="boughsValue"></output></label>
      <label title="Branches at every fork further out">Branches per fork <input id="forks" type="range" min="1" max="4" step="1"><output id="forksValue"></output></label>
      <label title="Generations from trunk to twig: more levels, finer detail">Levels <input id="levels" type="range" min="3" max="8" step="1"><output id="levelsValue"></output></label>
      <label title="Cards: each piece is a flat picture of a whole cluster of flowers, the way games draw foliage">Blossoms
        <select id="blossomMode"><option value="single">Single flowers</option><option value="cards">Blossom cards</option></select>
      </label>
    </span>
    <button id="reseed" title="Same spec, different seed">🎲 New seed</button>
    <span id="seedValue"></span>
    <span id="counts"></span>
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ═══════════════════════════ Shared ═══════════════════════════
// Everything the plants have in common. Scene units throughout: a plant's base sits at (0, 0) and it is roughly one unit tall.

const TAU = Math.PI * 2;
const UP = new THREE.Vector3(0, 1, 0);

const clamp01 = v => Math.min(1, Math.max(0, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const smooth = t => t * t * (3 - 2 * t);
const pick = (rand, list) => list[Math.floor(rand() * list.length)];
const $ = id => document.getElementById(id);

/** Seeded random numbers, so a seed always gives the same plant. */
function mulberry32(seed) {
    return function () {
        seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

const hexToRgb = hex => [1, 3, 5].map(at => parseInt(hex.slice(at, at + 2), 16));
const mixRgb = (from, to, t) => `rgb(${from.map((channel, index) => Math.round(channel + (to[index] - channel) * t)).join(',')})`;

/** Two directions square to `dir` and to each other: the plane a child turns in. */
function basisOf(dir) {
    const helper = Math.abs(dir.y) < 0.9 ? UP : new THREE.Vector3(1, 0, 0);
    const u = new THREE.Vector3().crossVectors(dir, helper).normalize();
    const v = new THREE.Vector3().crossVectors(dir, u).normalize();
    return { u, v };
}

/** Turns `dir` away by `tilt`, towards the side given by `azimuth`. */
function splay(dir, tilt, azimuth) {
    const { u, v } = basisOf(dir);
    const side = u.multiplyScalar(Math.cos(azimuth)).add(v.multiplyScalar(Math.sin(azimuth)));
    return dir.clone().multiplyScalar(Math.cos(tilt)).add(side.multiplyScalar(Math.sin(tilt))).normalize();
}

// ─── Branching skeletons: the bones of anything that forks ───
// A 2D branch is { x, y, angle, length, bend, width, level, birth }: a curve from (x, y) leaving at `angle`, bowed sideways by
// `bend` (0 = straight). A 3D branch is { start, dir, length, width, level, birth, end, quaternion }. `birth` is the growth at
// which the branch starts to grow.

const makeBranch2D = (x, y, angle, length, width, level, birth, bend = 0) => ({ x, y, angle, length, width, level, birth, bend });

const makeBranch3D = (start, dir, length, width, level, birth) => ({
    start, dir, length, width, level, birth,
    end: start.clone().addScaledVector(dir, length),
    quaternion: new THREE.Quaternion().setFromUnitVectors(UP, dir),
});

function controlAndEnd(branch) {
    const { x, y, angle, length, bend } = branch;
    const ex = x + Math.cos(angle) * length;
    const ey = y + Math.sin(angle) * length;
    // The control point is the midpoint pushed sideways, which gives the curve.
    const cx = (x + ex) / 2 - Math.sin(angle) * bend * length;
    const cy = (y + ey) / 2 + Math.cos(angle) * bend * length;
    return { cx, cy, ex, ey };
}

function pointOnBranch(branch, t) {
    const { cx, cy, ex, ey } = controlAndEnd(branch);
    const u = 1 - t;
    return [u * u * branch.x + 2 * u * t * cx + t * t * ex, u * u * branch.y + 2 * u * t * cy + t * t * ey];
}

/**
 * Grows a skeleton one generation at a time, so a plant that hits `cap` loses its last generation evenly instead of one side.
 * spawn(branch, level) returns a branch's children; onFork(branch, level) runs for every branch that got children.
 * Returns every branch, the outermost generation (the tips) and whether the cap cut it short.
 */
function growGenerations({ trunk, generations, cap, spawn, onFork = () => {} }) {
    const branches = [trunk];
    let tips = [trunk];
    let capped = false;
    for (let level = 0; level < generations - 1; level++) {
        const children = tips.flatMap(branch => spawn(branch, level));
        if (branches.length + children.length > cap) {
            capped = true;
            break;
        }
        tips.forEach(branch => onFork(branch, level));
        branches.push(...children);
        tips = children;
    }
    return { branches, tips, capped };
}

/**
 * Strokes 2D branches: short straight pieces along each curve, each a little thinner, tapering to `taper` of the branch's width.
 * progressOf(branch) says how much of it has grown (0–1); thickness scales every width.
 */
function strokeBranches2D(g, branches, { progressOf, thickness, taper, color, sx, sy, scale }) {
    g.lineCap = 'round';
    g.strokeStyle = color;
    branches.forEach(branch => {
        const progress = progressOf(branch);
        if (progress <= 0) return;
        const endWidth = branch.width * taper;
        // Curves need more pieces near the trunk; straight branches only need enough to taper.
        const steps = branch.bend === 0 ? 3 : branch.level <= 1 ? 10 : branch.level <= 3 ? 5 : 3;
        for (let $_ = 0; $_ < steps; $_++) {
            const t0 = progress * $_ / steps;
            const t1 = progress * ($_ + 1) / steps;
            const [x0, y0] = pointOnBranch(branch, t0);
            const [x1, y1] = pointOnBranch(branch, t1);
            g.lineWidth = Math.max(1, (branch.width + (endWidth - branch.width) * t0) * thickness * scale);
            g.beginPath();
            g.moveTo(sx(x0), sy(y0));
            g.lineTo(sx(x1), sy(y1));
            g.stroke();
        }
    });
}

// One reusable transform and colour for writing instance matrices and colours.
const dummy = new THREE.Object3D();
const tint = new THREE.Color();

/** One instanced mesh per kind of piece: thousands of pieces, one draw call. */
function instanced(geometry, material, count) {
    const mesh = new THREE.InstancedMesh(geometry, material, Math.max(1, count));
    // Instances move as the plant grows, so the mesh's own bounds would cull them wrongly.
    mesh.frustumCulled = false;
    return mesh;
}

/** A unit cylinder with its base at the origin, narrowing to `taper` at the top: scaling y grows it from the base. */
const unitStem = (taper, segments = 7) => new THREE.CylinderGeometry(taper, 1, 1, segments).translate(0, 0.5, 0);

/**
 * Places instanced stems: each grows from its start along its direction, `progressOf(branch)` of its length, `radiusOf(branch)`
 * wide; a branch that hasn't started is hidden. Leaves `dummy` unrotated for whoever writes instances next.
 */
function placeBranches3D(mesh, branches, progressOf, radiusOf) {
    branches.forEach((branch, index) => {
        const progress = progressOf(branch);
        const radius = progress > 0 ? radiusOf(branch) : 0.00001;
        dummy.position.copy(branch.start);
        dummy.quaternion.copy(branch.quaternion);
        dummy.scale.set(radius, branch.length * Math.max(progress, 0.00001), radius);
        dummy.updateMatrix();
        mesh.setMatrixAt(index, dummy.matrix);
    });
    mesh.instanceMatrix.needsUpdate = true;
    dummy.quaternion.identity();
}

/** Keeps a 2D canvas's pixels matched to its box and the screen's pixel ratio; onResize runs after each change. */
function fitCanvas(canvas, onResize) {
    const view = { ctx: canvas.getContext('2d'), width: 0, height: 0 };
    new ResizeObserver(() => {
        const dpr = window.devicePixelRatio || 1;
        view.width = canvas.clientWidth;
        view.height = canvas.clientHeight;
        canvas.width = view.width * dpr;
        canvas.height = view.height * dpr;
        view.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        onResize();
    }).observe(canvas);
    return view;
}

/** Scene units to canvas pixels: `across` × `up` units must fit, and the plant's base sits `base` units above the bottom edge. */
function framing(view, { across = 1.55, up = 1.3, base = 0.2 } = {}) {
    const scale = Math.min(view.height / up, view.width / across);
    const ox = view.width / 2;
    const oy = view.height - base * scale;
    return { scale, sx: x => ox + x * scale, sy: y => oy - y * scale };
}

/**
 * A 3D view in `holder`: renderer, scene, lights and a slowly turning camera you can drag.
 * night: dim blue moonlight instead of daylight, for scenes that make their own light.
 * stage.render() draws one frame; a view may replace it (post-processing) and set stage.onResize(width, height).
 */
function makeStage(holder, { background = '#1a1f2b', target = [0, 0.36, 0], cameraAt = [0, 0.6, 2], night = false } = {}) {
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    holder.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(background);
    const light = night
        ? { sky: '#2a3a6a', ground: '#0a0d14', hemi: 0.35, sunColor: '#8fb2ff', sun: 0.5, fill: 0.3 }
        : { sky: '#e8eeff', ground: '#6a5848', hemi: 1.3, sunColor: '#ffffff', sun: 1.76, fill: 1.1 };
    // The ground colour is light bounced up from below; dark here leaves every underside black.
    scene.add(new THREE.HemisphereLight(light.sky, light.ground, light.hemi));
    const sun = new THREE.DirectionalLight(light.sunColor, light.sun);
    sun.position.set(1.2, 2, 1);
    scene.add(sun);

    const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 20);
    camera.position.set(...cameraAt);
    // A fill light riding on the camera: whichever side you look at is lit, also while the plant turns.
    const fill = new THREE.DirectionalLight('#fff4e8', light.fill);
    fill.position.set(0, 0.3, 1);
    camera.add(fill);
    scene.add(camera);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(...target);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;

    const stage = { renderer, scene, camera, controls, onResize: null, render: () => renderer.render(scene, camera) };
    new ResizeObserver(() => {
        const { clientWidth: w, clientHeight: h } = holder;
        renderer.setSize(w, h);
        camera.aspect = w / Math.max(1, h);
        camera.updateProjectionMatrix();
        stage.onResize?.(w, h);
    }).observe(holder);
    return stage;
}

/**
 * One plant on its own screen: a 2D canvas and a 3D stage, found by key as `${key}2d` and `${key}3d`, redrawn when the growth
 * changes. A subclass sets this.spec (with a seed) and fills in:
 *   build()              regrow the plant from this.spec
 *   draw2D(growth)       paint this.view2D.ctx
 *   update3D(growth)     move this.stage's meshes
 *   animate(dt, growth)  optional, every frame: motion that doesn't wait for growth to change
 *   stageLabel(growth)   { text, tone }: tone is '', 'pink', 'green', 'cyan' or 'gold'
 *   describe()           a line of counts for the header
 * The page builds a plant the first time its tab is opened.
 */
class PlantView {
    constructor(key, stageOptions) {
        this.key = key;
        this.spec = { seed: 1 };
        this.built = false;
        this.drawnGrowth = null;
        this.view2D = fitCanvas($(`${key}2d`), () => { this.drawnGrowth = null; });
        this.stage = makeStage($(`${key}3d`), stageOptions);
    }

    rebuild() {
        this.build();
        this.built = true;
        this.drawnGrowth = null;
    }

    build() {}
    draw2D(growth) {}
    update3D(growth) {}
    animate(dt, growth) {}
    stageLabel(growth) { return { text: '', tone: '' }; }
    describe() { return ''; }

    render(growth, dt) {
        // Only repaint the plant when something changed; the 3D view still renders every frame for the slow turn.
        if (growth !== this.drawnGrowth) {
            this.draw2D(growth);
            this.update3D(growth);
            this.drawnGrowth = growth;
        }
        this.animate(dt, growth);
        this.stage.controls.update();
        this.stage.render();
    }
}

const VIEWS = {};
function registerView(view) {
    VIEWS[view.key] = view;
    return view;
}

// ═══════════════════════════ Bonsai ═══════════════════════════

// One spec drives both trees. A spec like this is all a generator (or another model) has to produce to get a new tree.
const SPEC = {
    seed: 7,
    boughs: 2,            // main limbs off the trunk
    forks: 2,             // branches at every fork further out
    levels: 6,            // generations from trunk to twig
    trunkLength: 0.28,
    trunkWidth: 0.06,
    lengthDecay: 0.74,    // each generation this much shorter…
    widthDecay: 0.66,     // …and this much thinner
    spread: 0.62,         // radians a child turns away from its parent
    bend: 0.2,            // how much a 2D branch curves
    growthEnd: 0.62,      // the last branch has finished growing by about here
    foliageFrom: 0.35,
    blossomFrom: 0.70,
    colors: {
        bark: '#4e3843',
        leaf: ['#3d7a37', '#4c8f44', '#5aa350'],
        // What the foliage pads turn into once the tree blooms.
        canopy: ['#f2a7c3', '#f6bcd2', '#eb98b8'],
        blossom: ['#f7b6cd', '#f29abb', '#fbd0e0', '#fde6ee'],
        pot: '#2f5f80',
        potRim: '#3a7096',
        soil: '#3a2a1d',
    },
};

const PAD_SQUASH = 0.62;    // foliage pads are flat clouds, not balls
const PAD_GROW = 0.15;      // growth a pad takes to reach full size
const BLOSSOM_OPEN = 0.03;  // growth a single blossom takes to open
const MID_PADS_FROM = 2;    // forks from this generation on carry their own cluster
// Big settings multiply fast (8 boughs × 4 per fork over 8 levels is 32,000 branches), so the tree stops forking at this many.
const MAX_BRANCHES = 6000;
// Blossoms per full-size pad, and the most per tree; past the cap every pad gets proportionally fewer.
const BLOSSOMS = { flat: { perPad: 16, cap: 3000 }, solid: { perPad: 40, cap: 14000 } };
// Blossom cards: each shows a whole cluster, so far fewer are needed for a fuller crown.
const CARDS = { flat: { perPad: 5, cap: 1500 }, solid: { perPad: 7, cap: 5000 } };

/** How far along one branch is: 0 before its turn, 1 once grown. */
const branchProgress = (branch, growDur, growth) => easeOut(clamp01((growth - branch.birth) / growDur));
const padProgress = (pad, growth) => smooth(clamp01((growth - pad.start) / PAD_GROW));
const blossomProgress = (blossom, growth) => smooth(clamp01((growth - blossom.threshold) / BLOSSOM_OPEN));
// Trunk and branches keep thickening while the tree grows, then stay put.
const thicknessAt = growth => 0.35 + 0.65 * smooth(clamp01(growth / SPEC.growthEnd));
// How far the foliage has turned from green to pink: 0 at the start of blossoming, 1 just before full bloom.
const bloomAt = growth => smooth(clamp01((growth - SPEC.blossomFrom) / (0.95 - SPEC.blossomFrom)));

/** When each generation starts: one after the other, with a little jitter so the tree doesn't grow in lockstep. */
const growDurationOf = () => SPEC.growthEnd / SPEC.levels;
const childBirth = (birth, growDur, rand) => birth + growDur * (1 + rand() * 0.12);
// Pads are sized by the twigs, so more levels give more, smaller pads instead of one swollen crown.
const twigLength = () => SPEC.trunkLength * Math.pow(SPEC.lengthDecay, SPEC.levels - 1);
// Clusters at the inner forks are smaller than the ones at the tips.
const padSizeFor = level => Math.min(0.9, 0.45 + 0.1 * level);

/** Boughs off the trunk, branches per fork further out; now and then a fork has one less, so the tree doesn't look combed. */
function childCount(level, rand) {
    if (level === 0) return SPEC.boughs;
    const thinned = SPEC.forks > 1 && rand() < 0.2;
    return SPEC.forks - (thinned ? 1 : 0);
}

/** The tree's skeleton plus its foliage pads: one at every fork from MID_PADS_FROM on, a full-size one at every tip. */
function growTree(trunk, spawn, padAt) {
    const pads = [];
    const { branches, tips, capped } = growGenerations({
        trunk,
        generations: SPEC.levels,
        cap: MAX_BRANCHES,
        spawn,
        onFork: (branch, level) => {
            if (level >= MID_PADS_FROM) pads.push(padAt(branch, padSizeFor(level)));
        },
    });
    tips.forEach(branch => pads.push(padAt(branch, 1)));
    return { branches, pads, capped };
}

/** Hands out blossoms (or cards) by pad area into pad[field], scaled down when the tree would pass the cap. */
function scatterOnPads(pads, field, { perPad, cap }, rand, make) {
    const wanted = pads.reduce((sum, pad) => sum + perPad * pad.weight, 0);
    const factor = Math.min(1, cap / Math.max(1, wanted));
    pads.forEach(pad => {
        const count = Math.max(1, Math.round(perPad * pad.weight * factor));
        pad[field] = Array.from({ length: count }, () => make(pad, rand));
    });
}

/** A five-petal flower with a yellow heart, on any 2D context. */
function drawFlower(g, x, y, size, color, turn) {
    g.fillStyle = color;
    for (let $_ = 0; $_ < 5; $_++) {
        const a = turn + $_ * TAU / 5;
        g.beginPath();
        g.ellipse(x + Math.cos(a) * size, y + Math.sin(a) * size, size, size * 0.75, a, 0, TAU);
        g.fill();
    }
    g.fillStyle = '#ffd56b';
    g.beginPath();
    g.arc(x, y, size * 0.45, 0, TAU);
    g.fill();
}

/** The picture on every blossom card: a loose cluster of flowers on a transparent background, fuller in the middle. Drawn once. */
function makeCardCanvas() {
    const size = 256;
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const g = canvas.getContext('2d');
    const rand = mulberry32(4242);
    const flowers = Array.from({ length: 28 }, () => {
        const a = rand() * TAU;
        const reach = Math.sqrt(rand()) * size * 0.36;
        return {
            x: size / 2 + Math.cos(a) * reach,
            y: size / 2 + Math.sin(a) * reach,
            r: size * (0.03 + rand() * 0.03) * (1.15 - reach / size),
            color: pick(rand, SPEC.colors.blossom),
            turn: rand() * TAU,
        };
    });
    // Smaller ones last, so they sit on top like flowers in front.
    flowers.sort((a, b) => b.r - a.r).forEach(flower => drawFlower(g, flower.x, flower.y, flower.r, flower.color, flower.turn));
    return canvas;
}
const cardCanvas = makeCardCanvas();

const newBlossom = (rand, extra) => ({
    threshold: SPEC.blossomFrom + rand() * (0.97 - SPEC.blossomFrom),
    color: pick(rand, SPEC.colors.blossom),
    ...extra,
});

// ─── Bonsai in 2D ───

// Bonsai habit: branches spread sideways but never droop below the horizontal.
const keepAboveHorizontal = angle => Math.min(Math.PI - 0.15, Math.max(0.15, angle));

/** Angle offsets for `count` children, fanned out evenly across ±width. */
function fanOffsets(count, width, rand) {
    if (count === 1) return [(rand() < 0.5 ? -1 : 1) * width * (0.3 + rand() * 0.5)];
    return Array.from({ length: count }, (_, index) =>
        (index / (count - 1) * 2 - 1) * width * (0.8 + rand() * 0.4) + (rand() - 0.5) * 0.15);
}

/** A bonsai branch bows a random way, by a random share of SPEC.bend. */
const makeBonsaiBranch2D = (x, y, angle, length, width, level, birth, rand) =>
    makeBranch2D(x, y, angle, length, width, level, birth, SPEC.bend * (rand() < 0.5 ? -1 : 1) * (0.4 + rand() * 0.8));

function buildTree2D() {
    const rand = mulberry32(SPEC.seed);
    const growDur = growDurationOf();

    function spawn(branch, level) {
        const { cx, cy, ex, ey } = controlAndEnd(branch);
        const endAngle = Math.atan2(ey - cy, ex - cx);
        // Boughs fan out wider than the forks further up.
        const width = SPEC.spread * (level === 0 ? 1.3 : 1);
        const birth = childBirth(branch.birth, growDur, rand);
        return fanOffsets(childCount(level, rand), width, rand).map(offset => makeBonsaiBranch2D(
            ex, ey,
            keepAboveHorizontal(endAngle + offset),
            branch.length * SPEC.lengthDecay * (0.85 + rand() * 0.3),
            branch.width * SPEC.widthDecay,
            level + 1,
            birth,
            rand,
        ));
    }

    function padAt(branch, size) {
        const { ex, ey } = controlAndEnd(branch);
        const radius = twigLength() * (0.8 + rand() * 0.4) * size;
        const puffs = Array.from({ length: 5 }, () => ({
            dx: (rand() - 0.5) * radius * 1.6,
            dy: (rand() - 0.3) * radius * 0.7,
            r: radius * (0.45 + rand() * 0.35),
            leaf: hexToRgb(pick(rand, SPEC.colors.leaf)),
            bloom: hexToRgb(pick(rand, SPEC.colors.canopy)),
        })).sort((a, b) => a.dy - b.dy);
        return { x: ex, y: ey + radius * 0.2, weight: size * size, start: Math.max(SPEC.foliageFrom, branch.birth + growDur - 0.08), puffs, blossoms: [] };
    }

    // Blossoms are scattered across a puff, at full pad size; they shrink and grow with the pad.
    function blossom(pad, rand) {
        const puff = pick(rand, pad.puffs);
        const a = rand() * TAU;
        const reach = puff.r * Math.sqrt(rand()) * 0.95;
        return newBlossom(rand, { dx: puff.dx + Math.cos(a) * reach, dy: puff.dy + Math.sin(a) * reach * PAD_SQUASH, turn: rand() * TAU });
    }

    // A card sits on a puff like a blossom, turned to its own angle, a little bigger or smaller than the next.
    function card(pad, rand) {
        const placed = blossom(pad, rand);
        return { ...placed, angle: rand() * TAU, size: 0.8 + rand() * 0.5 };
    }

    const trunk = makeBonsaiBranch2D(0, 0, Math.PI / 2 + (rand() - 0.5) * 0.3, SPEC.trunkLength, SPEC.trunkWidth, 0, 0, rand);
    const tree = growTree(trunk, spawn, padAt);
    scatterOnPads(tree.pads, 'blossoms', BLOSSOMS.flat, rand, blossom);
    scatterOnPads(tree.pads, 'cards', CARDS.flat, rand, card);
    return { ...tree, growDur };
}

function drawPot2D(g, sx, sy, scale) {
    g.fillStyle = SPEC.colors.pot;
    g.beginPath();
    g.moveTo(sx(-0.22), sy(-0.025));
    g.lineTo(sx(0.22), sy(-0.025));
    g.lineTo(sx(0.17), sy(-0.15));
    g.lineTo(sx(-0.17), sy(-0.15));
    g.closePath();
    g.fill();
    g.fillStyle = SPEC.colors.potRim;
    g.fillRect(sx(-0.24), sy(0), 0.48 * scale, 0.028 * scale);
    g.fillStyle = SPEC.colors.soil;
    g.beginPath();
    g.ellipse(sx(0), sy(0.004), 0.2 * scale, 0.012 * scale, 0, 0, TAU);
    g.fill();
}

function drawBlossom2D(g, x, y, size, blossom) {
    // Too small to see petals: one dot does the same job for a fraction of the work.
    if (size < 1.6) {
        g.fillStyle = blossom.color;
        g.beginPath();
        g.arc(x, y, size * 1.6, 0, TAU);
        g.fill();
        return;
    }
    drawFlower(g, x, y, size, blossom.color, blossom.turn);
}

function drawCard2D(g, x, y, size, card) {
    g.save();
    g.translate(x, y);
    g.rotate(card.angle);
    g.drawImage(cardCanvas, -size / 2, -size / 2, size, size);
    g.restore();
}

function drawTree2D(view, tree, growth, blossomMode) {
    const g = view.ctx;
    g.clearRect(0, 0, view.width, view.height);
    const { scale, sx, sy } = framing(view);

    drawPot2D(g, sx, sy, scale);
    strokeBranches2D(g, tree.branches, {
        progressOf: branch => branchProgress(branch, tree.growDur, growth),
        thickness: thicknessAt(growth),
        taper: SPEC.widthDecay,
        color: SPEC.colors.bark,
        sx, sy, scale,
    });

    // All foliage first, then all blossoms, so no pad hides another pad's flowers.
    const bloom = bloomAt(growth);
    tree.pads.forEach(pad => {
        const size = padProgress(pad, growth);
        if (size <= 0) return;
        pad.puffs.forEach(puff => {
            g.fillStyle = mixRgb(puff.leaf, puff.bloom, bloom);
            g.beginPath();
            g.ellipse(sx(pad.x + puff.dx * size), sy(pad.y + puff.dy * size), puff.r * size * scale, puff.r * size * PAD_SQUASH * scale, 0, 0, TAU);
            g.fill();
        });
    });
    const petal = twigLength() * 0.075 * scale;
    const cardSize = twigLength() * 1.1 * scale;
    tree.pads.forEach(pad => {
        const size = padProgress(pad, growth);
        if (blossomMode === 'cards') {
            pad.cards.forEach(card => {
                const open = blossomProgress(card, growth);
                if (open <= 0) return;
                drawCard2D(g, sx(pad.x + card.dx * size), sy(pad.y + card.dy * size), cardSize * card.size * open, card);
            });
            return;
        }
        pad.blossoms.forEach(blossom => {
            const open = blossomProgress(blossom, growth);
            if (open <= 0) return;
            drawBlossom2D(g, sx(pad.x + blossom.dx * size), sy(pad.y + blossom.dy * size), petal * open, blossom);
        });
    });
}

// ─── Bonsai in 3D ───

/** splay with the bonsai habit, as in 2D: lean outwards, never droop below the horizontal. */
function turnedDirection(dir, tilt, azimuth) {
    const turned = splay(dir, tilt, azimuth);
    turned.y = Math.max(0.08, turned.y * 0.8);
    return turned.normalize();
}

function buildTree3D() {
    const rand = mulberry32(SPEC.seed + 1000);
    const growDur = growDurationOf();

    function spawn(branch, level) {
        const count = childCount(level, rand);
        const firstAzimuth = rand() * TAU;
        const birth = childBirth(branch.birth, growDur, rand);
        // Children spaced evenly around the parent, each nudged a little; boughs lean out further than forks.
        return Array.from({ length: count }, (_, index) => {
            const azimuth = firstAzimuth + index * TAU / count + (rand() - 0.5) * 0.5;
            const tilt = SPEC.spread * (level === 0 ? 0.9 + rand() * 0.3 : 0.55 + rand() * 0.6);
            return makeBranch3D(
                branch.end,
                turnedDirection(branch.dir, tilt, azimuth),
                branch.length * SPEC.lengthDecay * (0.85 + rand() * 0.3),
                branch.width * SPEC.widthDecay,
                level + 1,
                birth,
            );
        });
    }

    function padAt(branch, size) {
        const radius = twigLength() * (0.8 + rand() * 0.4) * size;
        const puffs = Array.from({ length: 5 }, () => ({
            offset: new THREE.Vector3((rand() - 0.5) * radius * 1.6, (rand() - 0.3) * radius * 0.6, (rand() - 0.5) * radius * 1.6),
            r: radius * (0.45 + rand() * 0.35),
            leafColor: new THREE.Color(pick(rand, SPEC.colors.leaf)),
            bloomColor: new THREE.Color(pick(rand, SPEC.colors.canopy)),
        }));
        return {
            center: branch.end.clone().add(new THREE.Vector3(0, radius * 0.25, 0)),
            weight: size * size,
            start: Math.max(SPEC.foliageFrom, branch.birth + growDur - 0.08),
            puffs,
            blossoms: [],
        };
    }

    // A point on a puff's surface, mostly the upper half and a little way down the sides, squashed like the puff.
    function blossom(pad, rand) {
        const puff = pick(rand, pad.puffs);
        const theta = rand() * TAU;
        const phi = Math.acos(1 - rand() * 1.3);
        const onSurface = new THREE.Vector3(Math.sin(phi) * Math.cos(theta), Math.cos(phi) * PAD_SQUASH, Math.sin(phi) * Math.sin(theta)).multiplyScalar(puff.r);
        return newBlossom(rand, { local: puff.offset.clone().add(onSurface) });
    }

    // A card sits on a puff like a blossom, at a random tilt, with a faint tint so neighbouring cards don't look identical.
    function card(pad, rand) {
        const placed = blossom(pad, rand);
        return {
            ...placed,
            quaternion: new THREE.Quaternion().setFromEuler(new THREE.Euler(rand() * TAU, rand() * TAU, rand() * TAU)),
            size: 0.8 + rand() * 0.5,
            tint: new THREE.Color(pick(rand, ['#ffffff', '#fff0f6', '#ffe1ec'])),
        };
    }

    const trunkDir = new THREE.Vector3((rand() - 0.5) * 0.25, 1, (rand() - 0.5) * 0.25).normalize();
    const trunk = makeBranch3D(new THREE.Vector3(0, 0, 0), trunkDir, SPEC.trunkLength, SPEC.trunkWidth, 0, 0);
    const tree = growTree(trunk, spawn, padAt);
    scatterOnPads(tree.pads, 'blossoms', BLOSSOMS.solid, rand, blossom);
    scatterOnPads(tree.pads, 'cards', CARDS.solid, rand, card);
    return { ...tree, growDur };
}

const branchGeometry = unitStem(SPEC.widthDecay);
const puffGeometry = new THREE.IcosahedronGeometry(1, 1);
const blossomGeometry = new THREE.IcosahedronGeometry(1, 0);
const barkMaterial = new THREE.MeshStandardMaterial({ color: SPEC.colors.bark, roughness: 0.9, flatShading: true });
// White, so each puff's and blossom's own colour comes through per instance.
const puffMaterial = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.85, flatShading: true });
const blossomMaterial = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.6, flatShading: true });
// Cards: a square carrying the cluster picture. Alpha test cuts out the transparent background without any sorting.
const cardGeometry = new THREE.PlaneGeometry(1, 1);
const cardTexture = new THREE.CanvasTexture(cardCanvas);
cardTexture.colorSpace = THREE.SRGBColorSpace;
const cardMaterial = new THREE.MeshStandardMaterial({ map: cardTexture, alphaTest: 0.4, side: THREE.DoubleSide, roughness: 0.8 });

const countOnPads = (tree, field) => tree.pads.reduce((sum, pad) => sum + pad[field].length, 0);

class BonsaiView extends PlantView {
    constructor() {
        super('bonsai');
        this.spec = SPEC;
        this.blossomMode = 'single';
        this.scene3D = null;

        // The pot never changes, so it's built once.
        const potMaterial = new THREE.MeshStandardMaterial({ color: SPEC.colors.pot, roughness: 0.4, flatShading: true });
        const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.17, 0.13, 8), potMaterial);
        pot.position.y = -0.09;
        const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.235, 0.235, 0.028, 8), new THREE.MeshStandardMaterial({ color: SPEC.colors.potRim, roughness: 0.4, flatShading: true }));
        rim.position.y = -0.014;
        const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.215, 0.215, 0.01, 24), new THREE.MeshStandardMaterial({ color: SPEC.colors.soil, roughness: 1 }));
        soil.position.y = 0.001;
        const ground = new THREE.Mesh(new THREE.CircleGeometry(0.8, 48), new THREE.MeshStandardMaterial({ color: '#12161f', roughness: 1 }));
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.155;
        this.stage.scene.add(pot, rim, soil, ground);
    }

    build() {
        this.tree2D = buildTree2D();
        this.tree3D = buildTree3D();
        this.buildScene3D(this.tree3D);
    }

    buildScene3D(tree) {
        if (this.scene3D) {
            this.stage.scene.remove(this.scene3D.group);
            [this.scene3D.branchMesh, this.scene3D.puffMesh, this.scene3D.blossomMesh, this.scene3D.cardMesh].forEach($_ => $_.dispose());
        }
        const puffs = tree.pads.flatMap(pad => pad.puffs.map(puff => ({ pad, puff })));
        const blossoms = tree.pads.flatMap(pad => pad.blossoms.map(blossom => ({ pad, blossom })));
        const cards = tree.pads.flatMap(pad => pad.cards.map(card => ({ pad, card })));
        const branchMesh = instanced(branchGeometry, barkMaterial, tree.branches.length);
        const puffMesh = instanced(puffGeometry, puffMaterial, puffs.length);
        const blossomMesh = instanced(blossomGeometry, blossomMaterial, blossoms.length);
        const cardMesh = instanced(cardGeometry, cardMaterial, cards.length);
        puffs.forEach(({ puff }, index) => puffMesh.setColorAt(index, puff.leafColor));
        blossoms.forEach(({ blossom }, index) => blossomMesh.setColorAt(index, tint.set(blossom.color)));
        cards.forEach(({ card }, index) => cardMesh.setColorAt(index, card.tint));
        const group = new THREE.Group();
        group.add(branchMesh, puffMesh, blossomMesh, cardMesh);
        this.stage.scene.add(group);
        this.scene3D = { tree, group, puffs, blossoms, cards, branchMesh, puffMesh, blossomMesh, cardMesh };
    }

    draw2D(growth) {
        drawTree2D(this.view2D, this.tree2D, growth, this.blossomMode);
    }

    update3D(growth) {
        const { tree, branchMesh, puffMesh, blossomMesh, cardMesh } = this.scene3D;
        const thickness = thicknessAt(growth);
        placeBranches3D(branchMesh, tree.branches, branch => branchProgress(branch, tree.growDur, growth), branch => branch.width / 2 * thickness);

        // Puffs and blossoms are never rotated.
        const bloom = bloomAt(growth);
        this.scene3D.puffs.forEach(({ pad, puff }, index) => {
            const size = padProgress(pad, growth);
            dummy.position.copy(pad.center).addScaledVector(puff.offset, size);
            dummy.scale.set(puff.r * size + 0.00001, puff.r * size * PAD_SQUASH + 0.00001, puff.r * size + 0.00001);
            dummy.updateMatrix();
            puffMesh.setMatrixAt(index, dummy.matrix);
            puffMesh.setColorAt(index, tint.copy(puff.leafColor).lerp(puff.bloomColor, bloom));
        });
        puffMesh.instanceMatrix.needsUpdate = true;
        puffMesh.instanceColor.needsUpdate = true;

        // Only the blossom kind on show is moved; the other is hidden.
        const cardsShown = this.blossomMode === 'cards';
        blossomMesh.visible = !cardsShown;
        cardMesh.visible = cardsShown;
        if (cardsShown) {
            const cardSize = twigLength() * 1.2;
            this.scene3D.cards.forEach(({ pad, card }, index) => {
                const open = blossomProgress(card, growth);
                dummy.position.copy(pad.center).addScaledVector(card.local, padProgress(pad, growth));
                dummy.quaternion.copy(card.quaternion);
                dummy.scale.setScalar(Math.max(open, 0.00001) * cardSize * card.size);
                dummy.updateMatrix();
                cardMesh.setMatrixAt(index, dummy.matrix);
            });
            cardMesh.instanceMatrix.needsUpdate = true;
            dummy.quaternion.identity();
            return;
        }
        const blossomSize = twigLength() * 0.17;
        this.scene3D.blossoms.forEach(({ pad, blossom }, index) => {
            const open = blossomProgress(blossom, growth);
            dummy.position.copy(pad.center).addScaledVector(blossom.local, padProgress(pad, growth));
            dummy.scale.setScalar(Math.max(open, 0.00001) * blossomSize);
            dummy.updateMatrix();
            blossomMesh.setMatrixAt(index, dummy.matrix);
        });
        blossomMesh.instanceMatrix.needsUpdate = true;
    }

    stageLabel(growth) {
        if (growth >= 1) return { text: 'In full bloom 🌸', tone: 'pink' };
        if (growth >= SPEC.blossomFrom) return { text: 'Blossoming', tone: 'pink' };
        return { text: 'Growing', tone: '' };
    }

    describe() {
        const capped = this.tree2D.capped || this.tree3D.capped ? ` · capped at ${MAX_BRANCHES} branches` : '';
        const describe = tree => `${tree.branches.length} branches, ${countOnPads(tree, 'blossoms')} flowers or ${countOnPads(tree, 'cards')} cards`;
        return `2D: ${describe(this.tree2D)} · 3D: ${describe(this.tree3D)}${capped}`;
    }
}

const bonsai = registerView(new BonsaiView());

$('blossomMode').onchange = () => {
    bonsai.blossomMode = $('blossomMode').value;
    bonsai.drawnGrowth = null;
};

// Shape sliders: each sets its SPEC field and regrows the tree at the current growth.
['boughs', 'forks', 'levels'].forEach(key => {
    const slider = $(key);
    slider.value = String(SPEC[key]);
    $(`${key}Value`).textContent = String(SPEC[key]);
    slider.oninput = () => {
        SPEC[key] = Number(slider.value);
        $(`${key}Value`).textContent = slider.value;
        bonsai.rebuild();
        showViewInfo();
    };
});

{
// ═══════════════════════════ Broccoli ═══════════════════════════
// Brassica oleracea, Italica group. A seed sends up two heart-shaped seed leaves; waxy blue-green leaves with wavy edges form a
// loose rosette around a thick pale stalk; then the head forms on top: a dome of florets, each a smaller stalk carrying a smaller
// dome of florets, down to bead-like buds, every generation laid out on a golden-angle spiral. Left unharvested it bolts: here and
// there a floret on the outside of the head comes into flower, its outermost buds first, small four-petal yellow flowers on stalks.

const BROCCOLI = {
    seed: 11,
    stalk: {
        seedlingHeight: 0.055,    // the seedling's stem; the seed leaves stay at this height while the stalk rises past them
        leafZone: 0.3,            // the stalk between the seed leaves and the highest leaf, once every internode has stretched
        neck: 0.15,               // the bare stalk between the highest leaf and the head; it stretches while the head grows
        radius: 0.044,            // at the soil, fully grown
        topRadius: 0.04,          // just under the head
        apexRadius: 0.35,         // before the head forms, the stalk tapers to this share of its base towards its growing tip
        flare: 0.25,              // it widens this much where it meets the soil
        lean: 0.06,               // radians it leans off vertical by the top
        seedlingRadius: 0.006,    // the seedling's thin stem, before the stalk thickens
        hook: 2.6,                // radians the seedling is bent over as it breaks the soil…
        straighten: [0.2, 0.85],  // …and the share of the sprouting span over which it straightens
    },
    seedLeaves: {
        length: 0.042,            // stalk to notch
        width: 0.038,             // across the heart
        petiole: 0.34,            // share of the length that is stalk
        grow: [0, 0.83],          // share of the sprouting span over which they grow to full size…
        unfold: [0.35, 0.9],      // …and over which they spread open
        folded: 0.12,             // radians off vertical while still folded together
        open: 1.2,                // radians off vertical once fully open
        witherDroop: 0.45,        // radians they sag further as they wither
    },
    leaves: {

        length: 0.56,             // the biggest leaf, stalk to tip
        sizes: [0.42, 1, 0.6],    // the first leaf, the biggest, the youngest under the head, as shares of `length`
        biggestAt: 0.45,          // where along the sequence the biggest leaf grows (0 = first, 1 = youngest)
        width: 0.58,              // blade width / leaf length: brassica blades are broad
        youngWidth: 0.55,         // a leaf just out of the bud is this share as broad, for its length, as a grown one
        petiole: 0.24,            // share of the leaf that is bare stalk
        lobes: 2,                 // small ear-like lobes on each side, low on the blade: the brassica habit
        lobeSize: 0.3,            // their reach / the blade's half width

        droop: [0.85, 0.45],      // more bend towards the tip: lowest, highest

        midrib: 0.012,            // petiole and midrib thickness / leaf length

        settle: 0.03,             // a blade flattens out over this height above the soil as it comes to lie on it
        oldShare: 0.4,            // the oldest leaves, this share of them, yellow at the very end…
        oldYellow: 0.45,          // …this far towards colors.leafOld at most
    },
    head: {

        lift: 0.06,               // the dome's centre sits this share of its radius above the stalk's top
        counts: [13, 13],         // florets per generation: branches off the stalk, then florets on each (Fibonacci numbers)
        buds: 21,                 // bead-like buds on each floret of the last generation
        capAngle: [1.3, 1.42],    // radians from a dome's axis to its outermost floret, per generation

        budOverlap: 1.15,         // the same for the buds

        attachSpan: [0.3, 0.6],   // how far down its parent's stalk a rim floret branches off: share of the head radius, then of the parent's stalk
        stalkWidth: 0.24,         // a floret's stalk radius / its dome radius

        body: [0.66, 0.74],       // a floret's solid core / its dome radius, per generation: its own florets and buds bulge out of it
        coreCap: 1.9,             // radians from a floret's axis to the lower edge of its core: a dome, open below where its stalks come in
        coreLumps: 0.06,          // the 3D core is this lumpy (share of its radius), like more buds deeper in
        young: [0.6, 0.7, 0.8],   // spacing of each floret generation, then of the buds, while the head is young and tight (1 = grown)
        budSwell: 0.4,            // young buds are this much fatter, so the tight head stays closed
        boltLoosen: 0.06,         // the head opens up this much as it bolts
        flowerFlorets: 8,         // florets that bolt, all on the outside of the head
        flowerShare: 0.3,         // share of a bolting floret's buds that open: its most exposed ones
        flowerSize: 0.015,        // flower radius, fully open
        flowerLift: 0.02,         // an open flower stands this far out from its bud on its lengthening stalk (head units)
        flowerTurnUp: 0.5,        // flowers turn this far from facing straight out of their bud towards facing up
        pedicel: 0.22,            // a flower's stalk radius / its bud's radius
    },
    soil: {
        radius: 0.46,             // the patch of dug garden soil: its flat top
        foot: 1.25,               // its foot / its top: a low mound with a rounded shoulder
        depth: 0.045,             // from the top's edge down to the floor
        crown: 0.008,             // the middle of the top rises this much
        bumps: 0.004,             // the top is clumpy: bumps this high
        mottle: 0.6,              // its colour varies this far from colors.soilTop towards colors.soil
        clods: 40,                // small clods of earth on top…
        pebbles: 7,               // …and a few pebbles
        clodSize: [0.005, 0.01],  // a clod's radius: at least, plus up to
        pebbleSize: [0.007, 0.009],
        ground: 0.7,              // the dark floor around it, radius
    },
    timeline: {
        sprout: [0.02, 0.15],     // the seedling breaks the soil, straightens and opens its seed leaves
        leaves: [0.1, 0.4],       // the first true leaf starts at the tip of the stalk … the last one starts
        leafGrow: 0.2,            // growth one leaf, and the stalk below it, take to reach full size
        neck: [0.55, 0.85],       // the stalk under the head stretches, lifting it clear of the leaves
        thicken: [0.12, 0.85],    // the stalk thickens
        seedLeavesWither: [0.3, 0.55],   // the seed leaves yellow, droop and shrivel away under the rosette
        head: [0.42, 0.85],       // the head appears … is full size
        headSeen: 0.15,           // share of the head's span by which it is big enough to see: the stage label says Heading
        ripen: [0.44, 0.8],       // buds deepen from pale yellow-green to rich green
        bolt: [0.86, 0.99],       // the bolting florets come into flower one after another in this span
        flowerCascade: 0.04,      // growth from a bolting floret's first flower opening to its last
        flowerOpen: 0.03,         // growth one flower takes to open
        flowerYellow: 0.05,       // a bud turns yellow over this much growth before it opens
        age: [0.75, 1],           // the oldest leaves yellow a little
    },
    look: {
        stage: { target: [0, 0.28, 0], cameraAt: [0, 0.85, 1.95] },   // the 3D camera
        frame2D: { across: 1.32, up: 1.08, base: 0.16 },              // the 2D view: scene units that must fit, soil line height
        headTilt2D: 0.35,         // radians the 2D view looks down onto the head, so its dome shows
        soilRim2D: 0.14,          // the 2D soil patch seen from a little above: its depth / its width
        light2D: [-0.45, 0.8, 0.45],  // where the 2D head and stalk are lit from: x right, y up, z towards us
        crease: [0.58, 0.8],      // light left deep in the creases between florets, then between florets on a floret…
        creaseDepth: [0.2, 0.28], // …and how deep those creases reach: share of the head's radius, then of a floret's
        coreShade: 0.65,          // a floret's core sits deeper than its buds: this much darker in 3D
        floretStalk2D: [0.9, 0.64],   // the 2D floret stalks' dark edge and pale face, as shares of their width: gaps show between them
        headShadow2D: [0.6, 0.95],    // the shade the 2D dome casts on its stalks: darkness, reach (share of the head's radius)
        leafShade2D: [0.78, 1.06],    // the 2D blade's lower half, and its upper half that catches the light
        depthShade2D: 0.68,       // 2D leaves and floret stalks at the back are this much darker
        flowerEdgeOn2D: 0.3,      // a 2D flower seen edge-on still shows this share of its width
    },
    colors: {
        soil: '#3d2c1f',
        soilTop: '#4f3a29',
        soilDark: '#241a12',
        clods: ['#4a3626', '#3a2a1d', '#5a432f'],
        pebbles: ['#6e665c', '#857b6e', '#5d554c'],
        pebbleShine: 'rgba(255,255,255,0.18)',
        ground: '#12161f',
        stalk: '#b5d08f',
        stalkShade: '#7f9f62',
        floretStalk: '#a9c987',
        seedLeaf: '#86bf52',
        seedLeafOld: '#c9b65a',
        leafYoung: '#7eab5b',
        leaf: ['#5a8a78', '#4f806e', '#63927f'],   // glaucous blue-green: waxy brassica leaves
        leafOld: '#a7a35a',
        midrib: '#c3d6b4',
        budYoung: '#bfd172',
        bud: ['#3a7d4c', '#357343', '#438a55', '#387852'],
        budBolting: '#c9cc4e',
        flower: ['#f6d63c', '#f9e25d', '#f1c92b'],
