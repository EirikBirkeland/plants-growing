        const rim = rimAt(Math.atan2(position.getZ(index), position.getX(index)));
        position.setX(index, position.getX(index) * rim);
        position.setZ(index, position.getZ(index) * rim);
    }
    geometry.computeVertexNormals();
    geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(position.count * 3), 3));
    return geometry;
}
const moundGeometry = makeMoundGeometry();

/** Colours the mound from the spec: soil, melting into the ground colour over its outer rim, so it has no hard edge. */
function paintMound(geometry) {
    const position = geometry.attributes.position;
    const colour = geometry.attributes.color;
    const soil = new THREE.Color(FERN.colors.soil);
    const ground = new THREE.Color(FERN.colors.ground);
    for (let index = 0; index < position.count; index++) {
        // On the unit dome the height tells how far out a vertex lies: the top is the middle, height 0 is the rim.
        const outward = Math.sqrt(Math.max(0, 1 - position.getY(index) ** 2));
        tint.copy(soil).lerp(ground, smooth(ramp(outward, 1 - MOUND.fade, 1)));
        colour.setXYZ(index, tint.r, tint.g, tint.b);
    }
    colour.needsUpdate = true;
}

// White materials, so each instance's own colour comes through.
const leafletMaterial = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.7, flatShading: true, side: THREE.DoubleSide });
const floorMaterial = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.95, flatShading: true });
const litterMaterial = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.9, flatShading: true, side: THREE.DoubleSide });
const costaMaterial = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.75 });
const tubeMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.75 });
const moundMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 });

/**
 * An instanced mesh that draws exactly `count` pieces (none when empty) and has a colour per piece from the start.
 * instanced() keeps at least one slot, and an unwritten slot is a full-size piece at the origin, so draw only what is written.
 */
function instancedExactly(geometry, material, count) {
    const mesh = instanced(geometry, material, count);
    mesh.count = count;
    mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(Math.max(1, count) * 3).fill(1), 3);
    return mesh;
}

// A frond's pieces are placed by the frames the frond model gives them (three axes), not by rotations.
const pose = new THREE.Matrix4();
const poseScale = new THREE.Vector3();
const HIDDEN = new THREE.Matrix4().makeScale(0, 0, 0);

/** Writes piece `index` at `position`, its x, y and z along the given axes, each scaled. */
function setPose(mesh, index, position, xAxis, yAxis, zAxis, xScale, yScale, zScale) {
    pose.makeBasis(xAxis, yAxis, zAxis).scale(poseScale.set(xScale, yScale, zScale)).setPosition(position);
    mesh.setMatrixAt(index, pose);
}

function buildFern3D() {
    const rand = mulberry32(FERN.seed + 1000);
    const fronds = makeFronds(FERN.fronds, RACHIS_NODES.solid, rand);
    const [innerRoot, outerRoot] = FERN.crown.roots;
    let leaflets = 0;
    let costae = 0;
    fronds.forEach((frond, order) => {
        const azimuth = order * GOLDEN_ANGLE + (rand() - 0.5) * 0.3;
        frond.out = new THREE.Vector3(Math.cos(azimuth), 0, Math.sin(azimuth));
        frond.across = new THREE.Vector3(-Math.sin(azimuth), 0, Math.cos(azimuth));
        // The first fronds leave from the rim of the crown, the last from its heart: the vase is open at its foot.
        frond.root = frond.out.clone().multiplyScalar(lerp(outerRoot, innerRoot, order / Math.max(1, fronds.length - 1)));
        frond.foot = frond.root.clone();
        frond.leaf = new THREE.Color(pick(rand, FERN.colors.leaf));
        frond.pinnae.forEach(pinna => {
            leaflets += pinna.pinnules * 2 + 1;
            costae += pinna.pinnules;
        });
    });
    return { fronds, leaflets, costae };
}

/** One merged tube for every midrib: rings of TUBE_SIDES vertices, rewritten as the fronds grow. */
function makeTubeGeometry(frondCount, rings) {
    const vertices = frondCount * rings * TUBE_SIDES;
    const geometry = new THREE.BufferGeometry();
    ['position', 'normal', 'color'].forEach(name => geometry.setAttribute(name, new THREE.BufferAttribute(new Float32Array(vertices * 3), 3)));
    const index = [];
    for (let frond = 0; frond < frondCount; frond++) {
        for (let ring = 0; ring < rings - 1; ring++) {
            for (let side = 0; side < TUBE_SIDES; side++) {
                const a = (frond * rings + ring) * TUBE_SIDES + side;
                const b = (frond * rings + ring) * TUBE_SIDES + (side + 1) % TUBE_SIDES;
                index.push(a, b, b + TUBE_SIDES, a, b + TUBE_SIDES, a + TUBE_SIDES);
            }
        }
    }
    geometry.setIndex(index);
    return geometry;
}

const TUBE_RING = Array.from({ length: TUBE_SIDES }, (_, side) => [Math.cos(side / TUBE_SIDES * TAU), Math.sin(side / TUBE_SIDES * TAU)]);
const ringColour = new THREE.Color();
const grownColour = new THREE.Color();

/**
 * Rewrites one frond's rings of the midrib tube from its laid-out curve. Each ring is an ellipse, `breadth` times wider across
 * the frond than through it: round where grown, a fat flat knob where the blade is still rolled up.
 */
function writeTube(geometry, frondIndex, frond, curve, palette) {
    const positions = geometry.attributes.position.array;
    const normals = geometry.attributes.normal.array;
    const colours = geometry.attributes.color.array;
    const rings = curve.u.length;
    const { out, across, foot } = frond;
    for (let ring = 0; ring < rings; ring++) {
        const sin = Math.sin(curve.angle[ring]);
        const cos = Math.cos(curve.angle[ring]);
        const radius = curve.width[ring] / 2;
        const breadth = curve.breadth[ring];
        const cx = foot.x + out.x * curve.x[ring];
        const cy = foot.y + curve.y[ring];
        const cz = foot.z + out.z * curve.x[ring];
        // The ring's axes: toward the midrib's upper (inner) side, and across the frond.
        const ax = -out.x * sin;
        const ay = cos;
        const az = -out.z * sin;
        grownColour.copy(palette.stipe).lerp(palette.rachis, greening(curve.u[ring]));
        ringColour.copy(palette.crozier).lerp(grownColour, curve.ripe[ring]);
        for (let side = 0; side < TUBE_SIDES; side++) {
            const [c, s] = TUBE_RING[side];
            const at = ((frondIndex * rings + ring) * TUBE_SIDES + side) * 3;
            positions[at] = cx + (ax * c + across.x * s * breadth) * radius;
            positions[at + 1] = cy + ay * c * radius;
            positions[at + 2] = cz + (az * c + across.z * s * breadth) * radius;
            // An ellipse's normal leans the other way: toward its flat faces.
            const normalLength = Math.hypot(c, s / breadth);
            normals[at] = (ax * c + across.x * s / breadth) / normalLength;
            normals[at + 1] = ay * c / normalLength;
            normals[at + 2] = (az * c + across.z * s / breadth) / normalLength;
            colours[at] = ringColour.r;
            colours[at + 1] = ringColour.g;
            colours[at + 2] = ringColour.b;
        }
    }
}

const scaleAt = new THREE.Vector3();

/**
 * Papery scales on a frond's rolled parts and the foot of its stalk, by the same rule as in 2D: a pair of beads on every other
 * ring, on opposite sides of the midrib, the pair turning from ring to ring so the scales sit all over it.
 */
function placeScales3D(mesh, cursor, frond, curve) {
    const { out, across, foot } = frond;
    for (let ring = 1; ring < curve.u.length - 1; ring += 2) {
        const bead = curve.width[ring] * 0.16 * scaliness(curve, ring);
        const radius = curve.width[ring] / 2;
        const sin = Math.sin(curve.angle[ring]);
        const cos = Math.cos(curve.angle[ring]);
        [0, Math.PI].forEach(half => {
            const index = cursor.scale++;
            if (bead < 1e-5) {
                mesh.setMatrixAt(index, HIDDEN);
                return;
            }
            const inward = Math.cos(ring * 2.4 + half) * radius;
            const sideways = Math.sin(ring * 2.4 + half) * radius * curve.breadth[ring];
            scaleAt.set(
                foot.x + out.x * (curve.x[ring] - sin * inward) + across.x * sideways,
                foot.y + curve.y[ring] + cos * inward,
                foot.z + out.z * (curve.x[ring] - sin * inward) + across.z * sideways);
            pose.makeScale(bead, bead, bead).setPosition(scaleAt);
            mesh.setMatrixAt(index, pose);
        });
    }
}

// Scratch for laying out pinnae in 3D, reused for every one.
const spot3D = { x: 0, y: 0, angle: 0 };
const onRachis = new THREE.Vector3();
const alongRachis = new THREE.Vector3();
const upperSide = new THREE.Vector3();
const pinnaDir = new THREE.Vector3();
const towardTip = new THREE.Vector3();
const bladeUp = new THREE.Vector3();
const costaAt = new THREE.Vector3();
const swept = new THREE.Vector3();
const sweptAcross = new THREE.Vector3();
const costaDir = new THREE.Vector3();
const costaUp = new THREE.Vector3();
const leafletDir = new THREE.Vector3();
const leafletWide = new THREE.Vector3();
const sorusAt = new THREE.Vector3();
const leafletColour = new THREE.Color();
const costaColour = new THREE.Color();
const rolledColour = new THREE.Color();
const soriColour = new THREE.Color();

/** The costa's frame after turning `sweep` in the blade (toward the frond tip) and `curl` up out of it: costaDir, sweptAcross, costaUp. */
function costaFrame(sweep, curl) {
    swept.copy(pinnaDir).multiplyScalar(Math.cos(sweep)).addScaledVector(towardTip, Math.sin(sweep));
    sweptAcross.copy(towardTip).multiplyScalar(Math.cos(sweep)).addScaledVector(pinnaDir, -Math.sin(sweep));
    costaDir.copy(swept).multiplyScalar(Math.cos(curl)).addScaledVector(bladeUp, Math.sin(curl));
    costaUp.copy(bladeUp).multiplyScalar(Math.cos(curl)).addScaledVector(swept, -Math.sin(curl));
}

/** One pinnule at costaAt, turned `angle` off the costa to `side` (±1), `length` long, with its sorus `sorus` (0–1) grown. */
function writeLeaflet(parts, index, angle, side, length, sorus) {
    if (length < 1e-4) {
        parts.leaflets.setMatrixAt(index, HIDDEN);
        parts.sori.setMatrixAt(index, HIDDEN);
        return;
    }
    leafletDir.copy(costaDir).multiplyScalar(Math.cos(angle)).addScaledVector(sweptAcross, side * Math.sin(angle));
    leafletWide.crossVectors(leafletDir, costaUp);
    const width = length * FERN.pinnuleWidth;
    setPose(parts.leaflets, index, costaAt, leafletWide, leafletDir, costaUp, width, length, width);
    parts.leaflets.setColorAt(index, leafletColour);
    // Its sori sit on its underside: one flat bead spanning both rows, kept just below the leaflet so they never show through.
    const radius = width * FERN.soriSize * sorus;
    if (radius < 1e-5) {
        parts.sori.setMatrixAt(index, HIDDEN);
        return;
    }
    sorusAt.copy(costaAt).addScaledVector(leafletDir, length * 0.45).addScaledVector(costaUp, -radius * 0.7);
    setPose(parts.sori, index, sorusAt, leafletWide, leafletDir, costaUp, radius * 1.6, radius * 1.6, radius * 0.6);
    parts.sori.setColorAt(index, soriColour);
}

/** A pinna that has not budded yet: all its pieces hidden. */
function hidePinna3D(parts, cursor, count) {
    for (let $_ = 0; $_ < count * 2 + 1; $_++) {
        parts.leaflets.setMatrixAt(cursor.leaflet, HIDDEN);
        parts.sori.setMatrixAt(cursor.leaflet++, HIDDEN);
    }
    for (let $_ = 0; $_ < count; $_++) parts.costae.setMatrixAt(cursor.costa++, HIDDEN);
}

/**
 * A pinna in 3D: it opens out across the frond (and a little up, so the blade is a shallow trough), then unrolls from its foot
 * to its tip out of a curl toward the blade's upper side, the way it lay rolled up in the fiddlehead. Its costa is a hairline
 * where grown and as fat as the rolled pinnules where still curled; every node it has unrolled carries a pair of pinnules.
 */
function placePinna3D(parts, cursor, frond, pinna, curve, phases, palette, sori) {
    const count = pinna.pinnules;
    const open = pinnaOpening(phases.front, pinna.u);
    if (open <= 0.002) {
        hidePinna3D(parts, cursor, count);
        return;
    }
    const spot = rachisSpot(curve, pinna.at, spot3D);
    const sin = Math.sin(spot.angle);
    const cos = Math.cos(spot.angle);
    onRachis.copy(frond.foot).addScaledVector(frond.out, spot.x);
    onRachis.y += spot.y;
    alongRachis.copy(frond.out).multiplyScalar(cos).addScaledVector(UP, sin);
    upperSide.copy(frond.out).multiplyScalar(-sin).addScaledVector(UP, cos);

    const spread = lerp(FERN.pinnaFold, FERN.pinnaAngle, open);
    const lift = FERN.pinnaLift * open;
    pinnaDir.copy(alongRachis).multiplyScalar(Math.cos(spread)).addScaledVector(frond.across, pinna.side * Math.sin(spread));
    pinnaDir.multiplyScalar(Math.cos(lift)).addScaledVector(upperSide, Math.sin(lift)).normalize();
    // In the blade, square to the pinna and toward the frond tip; and the blade's upper side.
    towardTip.copy(alongRachis).addScaledVector(pinnaDir, -pinnaDir.dot(alongRachis)).normalize();
    bladeUp.crossVectors(pinnaDir, towardTip);
    if (bladeUp.dot(upperSide) < 0) bladeUp.negate();

    const reach = pinnaReach(frond, pinna, open);
    const leafletLength = pinnuleLengthOf(frond, pinna);
    const darken = lerp(0.45, 1, phases.ripe);
    const sorus = pinna.fertile ? sori : 0;
    const hairline = frond.length * FERN.costaWidth / 2;
    rolledColour.copy(palette.crozier).lerp(palette.young, open * 0.5);
    costaAt.copy(onRachis);
    let sweep = 0;
    let curl = 0;
    for (let node = 0; node <= count; node++) {
        const w0 = node / count;
        const ripe = costaRipe(open, w0);
        costaFrame(sweep, curl);
        leafletColour.copy(palette.young).lerp(frond.leaf, ripe * open * darken).multiplyScalar(pinna.shade);
        if (node === count) {
            // The single leaflet at the tip bears no sorus.
            writeLeaflet(parts, cursor.leaflet++, 0, 1, leafletLength * 0.55 * ripe, 0);
            break;
        }
        const length = leafletLength * bladeShapeAt(w0, FERN.pinnaShape) * ripe;
        const angle = lerp(FERN.pinnuleFold, FERN.pinnuleAngle, ripe);
        writeLeaflet(parts, cursor.leaflet++, angle, 1, length, sorus);
        writeLeaflet(parts, cursor.leaflet++, angle, -1, length, sorus);

        const w1 = (node + 1) / count;
        const middle = (w0 + w1) / 2;
        const ripeHere = costaRipe(open, middle);
        // Rolled, the pinna curls up toward the blade's upper side; grown, it droops more and more toward its tip.
        const rolledCurl = spiralTurn(w1, FERN.pinnaCurl) - spiralTurn(w0, FERN.pinnaCurl);
        const droop = -FERN.pinnaDroop * (w1 * w1 - w0 * w0);
        const curlTurn = lerp(rolledCurl, droop, ripeHere);
        const sweepTurn = FERN.pinnaSweep * (Math.pow(w1, 1.5) - Math.pow(w0, 1.5)) * ripeHere;
        sweep += sweepTurn / 2;
        curl += curlTurn / 2;
        costaFrame(sweep, curl);
        const step = reach * (w1 - w0) * lerp(FERN.coilCompact, 1, ripeHere);
        const radius = lerp(pinnaCurlRadius(frond, pinna, open, middle), hairline * lerp(1, 0.4, middle), ripeHere);
        costaColour.copy(leafletColour).multiplyScalar(0.8).lerp(rolledColour, 1 - ripeHere);
        setPose(parts.costae, cursor.costa, costaAt, sweptAcross, costaDir, costaUp, radius, step, radius);
        parts.costae.setColorAt(cursor.costa++, costaColour);
        costaAt.addScaledVector(costaDir, step);
        sweep += sweepTurn / 2;
        curl += curlTurn / 2;
    }
}

/** Moss cushions in clumps, fallen leaves, a few twigs and stones, all on the mound; written once per seed. */
function buildFloor3D(rand) {
    const placeOnMound = (r, a, sink) => new THREE.Vector3(Math.cos(a) * r, moundAt(r, a) - sink, Math.sin(a) * r);
    // Moss cushions: clumps of small half-sunk domes, big and lit in the middle, small and shaded at the edge, so each
    // clump swells into one bumpy cushion.
    const clumps = Array.from({ length: FERN.floor.moss }, () => ({
        a: rand() * TAU, r: MOUND.radius * (0.2 + rand() * 0.6), spread: 0.035 + rand() * 0.035, color: new THREE.Color(pick(rand, FERN.colors.moss)),
    }));
    const lit = new THREE.Color(FERN.colors.mossLit);
    const shaded = new THREE.Color(FERN.colors.mossShade);
    const moss = Array.from({ length: clumps.length * FERN.floor.domes }, () => {
        const clump = pick(rand, clumps);
        const outward = Math.sqrt(rand());
        const spreadA = rand() * TAU;
        const x = Math.cos(clump.a) * clump.r + Math.cos(spreadA) * outward * clump.spread;
        const z = Math.sin(clump.a) * clump.r + Math.sin(spreadA) * outward * clump.spread;
        const a = Math.atan2(z, x);
        const r = Math.min(MOUND.radius * rimAt(a) - 0.03, Math.max(0.07, Math.hypot(x, z)));
        const size = lerp(0.03, 0.012, outward) * (0.8 + rand() * 0.4);
        const color = clump.color.clone().lerp(new THREE.Color(pick(rand, FERN.colors.moss)), 0.3);
        if (outward < 0.5) color.lerp(lit, 0.12 * (1 - outward * 2));
        else color.lerp(shaded, 0.25 * (outward - 0.5));
        return {
            position: placeOnMound(r, a, size * 0.3),
            scale: new THREE.Vector3(size, size * 0.8, size * (0.85 + rand() * 0.3)),
            turn: rand() * TAU,
            color,
        };
    });
    const litter = Array.from({ length: FERN.floor.litter }, () => {
        const r = MOUND.radius * (0.12 + Math.sqrt(rand()) * 0.76);
        const size = 0.035 + rand() * 0.03;
        return { position: placeOnMound(r, rand() * TAU, -0.003), scale: new THREE.Vector3(size * 0.6, size, size), turn: rand() * TAU, tilt: (rand() - 0.5) * 0.3, color: pick(rand, FERN.colors.litter) };
    });
    // Twigs stay well inside the rim, so none pokes out over the edge of the mound.
    const twigs = Array.from({ length: FERN.floor.twigs }, () => {
        const r = MOUND.radius * (0.25 + rand() * 0.3);
        return { position: placeOnMound(r, rand() * TAU, -0.004), length: MOUND.radius * (0.12 + rand() * 0.14), turn: rand() * TAU, color: FERN.colors.twig };
    });
    const stones = Array.from({ length: FERN.floor.stones }, () => {
        const r = MOUND.radius * (0.42 + rand() * 0.4);
        const size = 0.03 + rand() * 0.03;
        return { position: placeOnMound(r, rand() * TAU, size * 0.4), scale: new THREE.Vector3(size * 1.2, size * 0.7, size), turn: rand() * TAU, color: FERN.colors.stone };
    });

    const mossMesh = instancedExactly(mossGeometry, floorMaterial, moss.length);
    const litterMesh = instancedExactly(litterGeometry, litterMaterial, litter.length);
    const twigMesh = instancedExactly(twigGeometry, floorMaterial, twigs.length);
    const stoneMesh = instancedExactly(beadGeometry, floorMaterial, stones.length);
    const write = (mesh, items, place) => {
        items.forEach((item, index) => {
            dummy.position.copy(item.position);
            place(item);
            dummy.updateMatrix();
            mesh.setMatrixAt(index, dummy.matrix);
            mesh.setColorAt(index, tint.set(item.color));
        });
        dummy.rotation.set(0, 0, 0);
    };
    write(mossMesh, moss, item => {
        dummy.rotation.set(0, item.turn, 0);
        dummy.scale.copy(item.scale);
    });
    write(litterMesh, litter, item => {
        dummy.rotation.set(item.tilt, item.turn, 0);
        dummy.scale.copy(item.scale);
    });
    // Twigs lie on their side: tip the upright stem over, then turn it.
    write(twigMesh, twigs, item => {
        dummy.rotation.set(Math.PI / 2, item.turn, 0, 'YXZ');
        dummy.scale.set(0.005, item.length, 0.005);
    });
    write(stoneMesh, stones, item => {
        dummy.rotation.set(0, item.turn, 0);
        dummy.scale.copy(item.scale);
    });
    dummy.rotation.order = 'XYZ';
    return [mossMesh, litterMesh, twigMesh, stoneMesh];
}

/** Old frond bases around the crown: short brown stubs leaning out all round. Lengths are shares of the crown's radius. */
function buildStubs3D(rand) {
    const stubs = Array.from({ length: FERN.crown.stubs }, (_, index) => {
        const azimuth = index * GOLDEN_ANGLE + rand() * 0.3;
        return {
            dir: splay(UP, 0.7 + rand() * 0.5, azimuth),
            length: 0.4 + rand() * 0.35,
            color: pick(rand, [FERN.colors.stipe, FERN.colors.crown]),
        };
    });
    const mesh = instancedExactly(stubGeometry, floorMaterial, stubs.length);
    stubs.forEach((stub, index) => mesh.setColorAt(index, tint.set(stub.color)));
    return { stubs, mesh };
}

/** In a pane narrower than FIT_ASPECT, widens the camera's view up and down so it keeps the width the grown fern needs. */
function fitWidth(camera, baseFov, width, height) {
    if (!width || !height) return;
    const halfHeight = Math.tan(THREE.MathUtils.degToRad(baseFov) / 2) * Math.max(1, FIT_ASPECT / (width / height));
    camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(halfHeight));
    camera.updateProjectionMatrix();
}

class FernView extends PlantView {
    constructor() {
        super('fern', { cameraAt: [0, 0.9, 2.2], target: [0, 0.4, 0] });
        this.spec = FERN;
        this.scene3D = null;
        const baseFov = this.stage.camera.fov;
        this.stage.onResize = (width, height) => fitWidth(this.stage.camera, baseFov, width, height);

        // The ground and the crown's knob never change shape, so they are built once; build() colours them from the spec.
        const mound = new THREE.Mesh(moundGeometry, moundMaterial);
        mound.scale.set(MOUND.radius, MOUND.height, MOUND.radius);
        const ground = new THREE.Mesh(new THREE.CircleGeometry(GROUND_RADIUS, 48), new THREE.MeshStandardMaterial({ color: FERN.colors.ground, roughness: 1 }));
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.002;
        this.ground = ground;
        this.knob = new THREE.Mesh(crownGeometry, new THREE.MeshStandardMaterial({ color: FERN.colors.crown, roughness: 0.95, flatShading: true }));
        this.stage.scene.add(mound, ground, this.knob);
    }

    build() {
        paintMound(moundGeometry);
        this.knob.material.color.set(FERN.colors.crown);
        this.ground.material.color.set(FERN.colors.ground);
        this.fern2D = buildFern2D();
        this.buildScene3D();
        this.stages = stagesOf([...this.fern2D.fronds, ...this.scene3D.fronds]);
    }

    buildScene3D() {
        if (this.scene3D) {
            this.stage.scene.remove(this.scene3D.group);
            this.scene3D.disposables.forEach($_ => $_.dispose());
        }
        const { fronds, leaflets, costae } = buildFern3D();
        const tube = makeTubeGeometry(fronds.length, RACHIS_NODES.solid + 1);
        const tubeMesh = new THREE.Mesh(tube, tubeMaterial);
        tubeMesh.frustumCulled = false;
        // A leaflet and its sorus share an index.
        const parts = {
            leaflets: instancedExactly(leafletGeometry, leafletMaterial, leaflets),
            sori: instancedExactly(beadGeometry, floorMaterial, leaflets),
            costae: instancedExactly(costaGeometry, costaMaterial, costae),
            scales: instancedExactly(beadGeometry, floorMaterial, fronds.length * SCALES_PER_FROND),
        };
        tint.set(FERN.colors.scales);
        for (let index = 0; index < parts.scales.count; index++) parts.scales.setColorAt(index, tint);
        const floor = buildFloor3D(mulberry32(FERN.seed + 2000));
        const crown = buildStubs3D(mulberry32(FERN.seed + 3000));
        const group = new THREE.Group();
        group.add(tubeMesh, ...Object.values(parts), crown.mesh, ...floor);
        this.stage.scene.add(group);
        const palette = {};
        ['crozier', 'stipe', 'rachis', 'young', 'soriYoung', 'sori'].forEach(name => { palette[name] = new THREE.Color(FERN.colors[name]); });
        this.scene3D = { fronds, leaflets, tube, parts, crown, group, palette, disposables: [tube, ...Object.values(parts), crown.mesh, ...floor] };
    }

    draw2D(growth) {
        drawFern2D(this.view2D, this.fern2D, growth);
    }

    update3D(growth) {
        const { fronds, tube, parts, crown, palette } = this.scene3D;
        const crownSize = crownAt(growth);
        this.placeCrown3D(crown, crownSize);

        const cursor = { leaflet: 0, costa: 0, scale: 0 };
        fronds.forEach((frond, index) => {
            const phases = frondPhases(frondAge(frond, growth));
            frond.foot.set(frond.root.x * crownSize, FERN.crown.radius * CROWN_TOP.solid * crownSize, frond.root.z * crownSize);
            const curve = layRachis(frond, phases, frond.curve);
            writeTube(tube, index, frond, curve, palette);
            placeScales3D(parts.scales, cursor, frond, curve);
            const sori = soriAt(growth, phases.ripe);
            soriColour.copy(palette.soriYoung).lerp(palette.sori, sori);
            frond.pinnae.forEach(pinna => placePinna3D(parts, cursor, frond, pinna, curve, phases, palette, sori));
        });
        ['position', 'normal', 'color'].forEach(name => { tube.attributes[name].needsUpdate = true; });
        Object.values(parts).forEach(mesh => {
            mesh.instanceMatrix.needsUpdate = true;
            mesh.instanceColor.needsUpdate = true;
        });
    }

    /** The knob swells out of the mound, its old frond bases with it. */
    placeCrown3D(crown, size) {
        const radius = FERN.crown.radius * Math.max(size, 0.00001);
        this.knob.scale.set(radius, radius * 0.64, radius);
        this.knob.position.y = radius * 0.4;
        crown.stubs.forEach((stub, index) => {
            dummy.position.set(stub.dir.x * radius * 0.6, radius * 0.3, stub.dir.z * radius * 0.6);
            dummy.quaternion.setFromUnitVectors(UP, stub.dir);
            dummy.scale.set(radius * 0.13, stub.length * radius, radius * 0.13);
            dummy.updateMatrix();
            crown.mesh.setMatrixAt(index, dummy.matrix);
        });
        crown.mesh.instanceMatrix.needsUpdate = true;
        dummy.quaternion.identity();
    }

    stageLabel(growth) {
        const { fiddleheads, unfurling, lush } = this.stages;
        if (growth >= lush) return { text: 'Lush 🌿', tone: 'green' };
        if (growth >= unfurling) return { text: 'Unfurling', tone: 'green' };
        if (growth >= fiddleheads) return { text: 'Fiddleheads', tone: 'green' };
        return { text: 'Dormant crown', tone: '' };
    }

    describe() {
        const { fronds, leaflets } = this.scene3D;
        return `2D: ${this.fern2D.fronds.length} fronds, ${countPinnae(this.fern2D.fronds)} pinnae · 3D: ${fronds.length} fronds, ${countPinnae(fronds)} pinnae, ${leaflets} pinnules`;
    }
}

registerView(new FernView());
}

        nutRipening: '#b59331',
        nutRipe: '#80572c',
        nutShade: '#141810',    // a coconut's underside
    },

const lerp = (from, to, t) => from + (to - from) * t;
/** 0 until `from`, 1 from `to` on, straight in between; a plain step at `to` when the two are the same. */
const ramp = (value, from, to) => {
    if (to <= from) return value >= to ? 1 : 0;
    return clamp01((value - from) / (to - from));
};
const blend = (from, to, t) => from.map((channel, index) => channel + (to[index] - channel) * t);
const cssRgb = rgb => `rgb(${rgb.map(Math.round).join(',')})`;
const cssRgba = (rgb, alpha) => `rgba(${rgb.map(Math.round).join(',')},${alpha.toFixed(3)})`;
/** The side view swings things towards its left and right a little, so fewer of them point straight at you. */
const towardsSides = (azimuth, bias) => azimuth - bias * Math.sin(2 * azimuth);

const TRUNK_SAMPLES = 120;      // points along the trunk's line
const MIDRIB_FLOATS = 5;        // per midrib point: x, y, z, climb angle, sideways swing
const MIDRIB_SEGMENTS_2D = 12;
const MIDRIB_SEGMENTS_3D = 9;
const LEAFLET_JITTERS = 4;      // per leaflet: length, angle, tilt, shade
const SHAPE_FLOATS = 9;         // per 2D leaflet: base x, y, middle x, y, tip x, y, half-width offset x, y, length
// A spec with tiny leaf intervals would otherwise plan fronds without end.
const MAX_FRONDS = 400;
// Nothing hangs further than straight down.
const STRAIGHT_DOWN = -Math.PI / 2;

// ─── The plan: everything the palm will ever grow, fixed by the seed ───

function planPalm(spec) {
    const rand = mulberry32(spec.seed);
    const leanSide = rand() < 0.5 ? -1 : 1;
    const trunk = planTrunk(spec.trunk, rand, leanSide);
    const fronds = planFronds(spec, rand);
    const bunches = planBunches(spec, rand);
    const roots = planRoots(spec.trunk, rand);
    // The nut lies on the side away from the lean, so the trunk never grows through it.
    const nut = { side: -leanSide, turn: (rand() - 0.5) * 0.7 };
    // A wavy shore, the same in both views: a few slow waves round the edge.
    const shore = [2, 3, 5].map(count => ({ count, phase: rand() * TAU, size: spec.sand.shore * (0.5 + rand() * 0.8) }));
    const ripples = Array.from({ length: spec.sand.ripples }, () => {
        const angle = rand() * TAU;
        const reach = spec.sand.radius * (0.35 + rand() * 0.45);
        return { x: Math.cos(angle) * reach, z: Math.sin(angle) * reach, length: 0.05 + rand() * 0.07, curve: 0.2 + rand() * 0.2 };
    });
    return { trunk, fronds, bunches, roots, nut, shore, ripples };
}

/** How far out the shore is at `angle`, as a share of the sand's radius. */
const shoreAt = (plan, angle) => 1 + plan.shore.reduce((sum, wave) => sum + wave.size * Math.sin(wave.count * angle + wave.phase), 0);

/** The trunk's centre line, fixed from the start: it only ever grows at the top, so its rings never move. */
function planTrunk(trunk, rand, leanSide) {
    // Leaning mostly across the side view, so its sweep shows there as well.
    const azimuth = (leanSide > 0 ? 0 : Math.PI) + (rand() - 0.5) * 0.5;
    const lean = trunk.lean * (0.8 + rand() * 0.4);
    const kink = (rand() - 0.5) * 0.1;
    const step = trunk.height / TRUNK_SAMPLES;
    const points = [];
    const tangents = [];
    let position = [0, 0, 0];
    for (let index = 0; index <= TRUNK_SAMPLES; index++) {
        const along = index / TRUNK_SAMPLES;
        const tilt = lean * (1 - trunk.straighten * Math.pow(along, 0.75)) + kink * Math.sin(along * TAU);
        const tangent = [Math.sin(tilt) * Math.cos(azimuth), Math.cos(tilt), Math.sin(tilt) * Math.sin(azimuth)];
        points.push(position);
        tangents.push(tangent);
        position = position.map((value, axis) => value + tangent[axis] * step);
    }
    return { points, tangents, step };
}

/** Every frond the palm will ever grow, oldest first: when it breaks out, which way it faces, how big, long-lived and divided. */
function planFronds(spec, rand) {
    const F = spec.fronds;
    const jitterCount = spec.leaflets.perSide * 2 * LEAFLET_JITTERS;
    const fronds = [];
    let azimuth = rand() * TAU;
    let birth = F.first;
    for (let index = 0; birth <= F.last && index < MAX_FRONDS; index++) {
        // How grown-up the palm is when a frond starts decides its size, its life and how divided it is.
        const maturity = smooth(ramp(birth, 0, F.adultAt));
        let life = lerp(F.juvenileLife, F.adultLife, maturity);
        // Fruition never catches a frond in mid-fall: one that would still be dropping at growth 1 is down by then.
        if (birth + life * F.shedFrom < 1 && birth + life > 1) life = 1 - birth;
        fronds.push({
            birth,
            maturity,
            azimuth,
            azimuth2D: towardsSides(azimuth, spec.view2D.sideBias),
            length: lerp(F.juvenileLength, F.adultLength, maturity) * (1 + (rand() - 0.5) * F.lengthJitter),
            life,
            form: smooth(ramp(index, F.simpleLeaves - 1, F.simpleLeaves + F.splitOver)),
            lift: (rand() - 0.5) * F.angleJitter,
            bend: 1 + (rand() - 0.5) * 0.3,
            sweep: (rand() - 0.5) * F.sideCurve,
            color: pick(rand, spec.colors.leaf),
            jitter: Float32Array.from({ length: jitterCount }, () => rand() - 0.5),
        });
        azimuth += F.phyllotaxis + (rand() - 0.5) * 0.3;
        birth += lerp(F.juvenileInterval, F.adultInterval, maturity) * (0.85 + rand() * 0.3);
    }
    return fronds;
}

/** Coconut bunches, one after the other, each hanging from between the fronds on its own side of the crown. */
function planBunches(spec, rand) {
    const fruit = spec.fruit;
    let azimuth = rand() * TAU;
    return Array.from({ length: fruit.bunches }, (_, index) => {
        azimuth += TAU / fruit.bunches + (rand() - 0.5) * 0.8;
        const count = fruit.nuts[0] + Math.floor(rand() * (fruit.nuts[1] - fruit.nuts[0] + 1));
        const turn = rand() * TAU;
        return {
            flowerAt: fruit.from + index * fruit.interval + (rand() - 0.5) * 0.015,
            azimuth,
            azimuth2D: towardsSides(azimuth, spec.view2D.sideBias),
            drop: 0.45 + rand() * 0.4,          // how far down the crown it hangs, as a share of the crown's depth
            // Nuts packed round the end of the stalk: `out` from it and `along` it, in nut radii.
            nuts: Array.from({ length: count }, (_, nutIndex) => ({
                around: turn + nutIndex / count * TAU + (rand() - 0.5) * 0.6,
                out: 0.8 + rand() * 0.5,
                along: (rand() - 0.35) * 1.4,
                size: 0.85 + rand() * 0.3,
                lag: rand() * 0.04,              // they don't all brown at once
            })),
            spikelets: Array.from({ length: fruit.spikelets }, () => ({ around: rand() * TAU, tilt: 0.5 + rand() * 0.8, length: 0.6 + rand() * 0.6 })),
        };
    });
}

/** Roots breaking out all round the swollen base and plunging into the sand. */
function planRoots(trunk, rand) {
    const [dipFrom, dipTo] = trunk.rootDip;
    const [bornFrom, bornTo] = trunk.rootsFrom;
    return Array.from({ length: trunk.roots }, (_, index) => ({
        azimuth: (index + rand() * 0.8) / trunk.roots * TAU,
        dip: lerp(dipFrom, dipTo, rand()),       // radians below horizontal
        length: trunk.rootLength * (0.6 + rand() * 0.7),
        birth: lerp(bornFrom, bornTo, rand()),
    }));
}

// ─── Growth: where everything is at a given growth ───

function trunkRadiusAt(trunk, distance) {
    const flare = 1 + trunk.flare * Math.exp(-distance / trunk.flareHeight);
    return trunk.radius * flare * (1 - trunk.taper * distance / trunk.height);
}

/** How far apart the ring scars are, never closer than this: closer would be thousands of instances, and 0 an endless loop. */
const ringSpacing = trunk => Math.max(trunk.ringSpacing, 0.004);

/** Point and direction `distance` up the trunk's line. */
function alongTrunk(trunk, distance) {
    const at = Math.min(TRUNK_SAMPLES, Math.max(0, distance / trunk.step));
    const index = Math.min(TRUNK_SAMPLES - 1, Math.floor(at));
    const t = at - index;
    const point = trunk.points[index].map((value, axis) => lerp(value, trunk.points[index + 1][axis], t));
    const tangent = trunk.tangents[index].map((value, axis) => lerp(value, trunk.tangents[index + 1][axis], t));
    const length = Math.hypot(...tangent);
    return { point, tangent: tangent.map(value => value / length) };
}

/** The top of the trunk: where the fronds and bunches start, how thick the stem is, how grown-up the palm is. */
function crownAt(plan, spec, growth) {
    const T = spec.trunk;
    // Rising from the moment it starts (a plain smoothstep would stall for a while) and easing off towards full height.
    const rise = ramp(growth, T.risesFrom, T.risesTo);
    const height = T.height * (rise + smooth(rise)) / 2;
    // Nothing until the first spear breaks out of the nut; then a seedling's stem, thickening to full girth.
    const sprout = smooth(ramp(growth, spec.fronds.first, spec.fronds.first + spec.fronds.expand));
    const girth = lerp(T.seedlingGirth, 1, smooth(ramp(growth, T.girthFrom, T.girthTo))) * sprout;
    const { point, tangent } = alongTrunk(plan.trunk, height);
    const radius = trunkRadiusAt(T, height) * girth;
    const maturity = smooth(ramp(growth, 0, spec.fronds.adultAt));
    return {
        height, girth, radius, maturity,
        axis: tangent,
        // The growing point, wrapped in leaf bases just above the newest ring.
        apex: point.map((value, axis) => value + tangent[axis] * radius * 0.6),
        depth: spec.fronds.crownDepth * maturity,
    };
}

/** Where a point round the crown sits: `drop` down the trunk from the growing point and `reach` out towards `azimuth`. */
function onCrown(crown, drop, reach, azimuth) {
    const base = crown.apex.map((value, axis) => value - crown.axis[axis] * drop);
    base[0] += Math.cos(azimuth) * reach;
    base[2] += Math.sin(azimuth) * reach;
    return base;
}

/**
 * A frond at this growth: where it starts and heads, how long it is, how far it has opened, sunk and aged, and how far it has
 * dropped since it broke off. Null before and after its life.
 */
function frondPose(frond, crown, spec, growth, azimuth) {
    const F = spec.fronds;
    const age = growth - frond.birth;
    const life = age / frond.life;
    if (age <= 0 || life >= 1) return null;
    const settle = smooth(clamp01(age / F.settle));
    const sinking = smooth(ramp(life, F.matureAt, F.yellowFrom));
    const yellow = smooth(ramp(life, F.yellowFrom, F.brownFrom));
    const open = smooth(ramp(age, F.expand * F.unfoldDelay, F.expand * F.unfoldDelay + F.unfold));
    // A spear stays short, its leaflets folded round it; it stretches to full length as they open.
    const extend = easeOut(clamp01(age / F.expand)) * lerp(F.spearReach, 1, open);
    // Dead, it hangs against the trunk until it breaks off whole: it drops to the sand, shrivelling as it falls.
    const shed = smooth(ramp(life, F.shedFrom, 1));
    // Upright as a spear, then opening out, sinking with age and hanging once dead.
    let elevation = lerp(F.spearAngle, lerp(F.seedlingYoungAngle, F.youngAngle, frond.maturity) + frond.lift, settle);
    elevation = lerp(elevation, lerp(F.seedlingOldAngle, F.oldAngle, frond.maturity) + frond.lift, sinking);
    elevation = lerp(elevation, lerp(F.seedlingDeadAngle, F.deadAngle, frond.maturity), yellow);
    // Older fronds sit lower on the crown, round the growing point.
    const base = onCrown(crown, crown.depth * smooth(clamp01(life / 0.9)), crown.radius * 0.7, azimuth);
    // Broken off, it drops straight down to the sand.
    const fallen = Math.max(0, base[1] - spec.sand.height) * shed;
    base[1] -= fallen;
    return {
        base, fallen,
        heading: [Math.cos(azimuth), Math.sin(azimuth)],
        elevation,
        // The leaflets' weight arches it; a dead frond hangs straighter.
        bend: F.bend * frond.bend * open * lerp(F.simpleBend, 1, frond.form) * lerp(1, F.oldBend, sinking) * (1 - 0.5 * yellow),
        sweep: frond.sweep * open,
        length: frond.length * extend * (1 - shed),
        open, sinking, yellow,
        brown: smooth(ramp(life, F.brownFrom, 1)),
        fresh: 1 - smooth(clamp01(age / (F.expand * 1.2))),
        form: frond.form,
    };
}

/** The heading turned sideways by `swing` radians, round the vertical. */
function swung(heading, swing) {
    const cos = Math.cos(swing);
    const sin = Math.sin(swing);
    return [heading[0] * cos - heading[1] * sin, heading[0] * sin + heading[1] * cos];
}

/**
 * Walks the midrib's arch into `out`: segments + 1 points, each x, y, z, its climb angle above horizontal and its sideways swing.
 * The climb drops from the base's elevation by `bend` towards the tip. A frond that reaches the sand lies along it: a young
 * palm's old leaves rest their tips on the ground.
 */
function traceMidrib(pose, spec, segments, out) {
    const power = spec.fronds.bendPower;
    const floor = spec.sand.height;
    const step = pose.length / segments;
    const climbs = [];
    let [x, y, z] = pose.base;
    for (let k = 0; k <= segments; k++) {
        const at = k * MIDRIB_FLOATS;
        out[at] = x;
        out[at + 1] = y;
        out[at + 2] = z;
        out[at + 4] = pose.sweep * k / segments;
        if (k === segments) break;
        // Step on along the direction half way to the next point, never down through the sand.
        const middle = (k + 0.5) / segments;
        const room = (floor - y) / Math.max(step, 1e-9);
        const lowest = room >= 0 ? 0 : Math.asin(Math.max(-1, room));
        const climb = Math.max(lowest, STRAIGHT_DOWN, pose.elevation - pose.bend * Math.pow(middle, power));
        const [hx, hz] = swung(pose.heading, pose.sweep * middle);
        x += Math.cos(climb) * hx * step;
        y += Math.sin(climb) * step;
        z += Math.cos(climb) * hz * step;
        climbs.push(climb);
    }
    // Each point leans the way the midrib runs through it.
    for (let k = 0; k <= segments; k++) {
        const before = climbs[Math.max(0, k - 1)];
        const after = climbs[Math.min(segments - 1, k)];
        out[k * MIDRIB_FLOATS + 3] = (before + after) / 2;
    }
}

/** Leaflet length along a feather frond: short at the stalk, longest a third of the way out, short again at the tip. */
const featherProfile = v => v < 0.35 ? 0.5 + 0.5 * smooth(v / 0.35) : 1 - 0.78 * smooth((v - 0.35) / 0.65);
/** …and the pleats along a simple blade: longest at the tip, where the blade splits in two. */
const bladeProfile = v => 0.25 + 0.75 * Math.pow(v, 0.8);

// Scratch vectors for laying out leaflets: where the midrib runs, the frond's up, a row's side (square to both) and that side
// turned down by the row's tilt…
const midribRun = new THREE.Vector3();
const frondUp = new THREE.Vector3();
const rowSide = new THREE.Vector3();
const rowOut = new THREE.Vector3();
// …and the frame handed to each leaflet: where it sits, its direction, its blade's normal and its width direction.
const leafletFrame = { point: new THREE.Vector3(), direction: new THREE.Vector3(), normal: new THREE.Vector3(), across: new THREE.Vector3() };

/**
 * Every leaflet of a frond, two staggered rows: visit(index, frame, length, width, droop) with `frame` (see leafletFrame) only
 * valid during the call. The blade curls down (against its normal) by `droop` of its length.
 * A simple blade is the same leaflets, wide, close to the midrib and overlapping: that is how a palm leaf starts out, unsplit.
 */
function forEachLeaflet(frond, pose, midrib, segments, spec, visit) {
    const L = spec.leaflets;
    const F = spec.fronds;
    const { form, open, sinking } = pose;
    const rowTilt = lerp(L.simpleTilt, lerp(L.tilt, L.oldTilt, sinking), form) * open;
    const droop = lerp(L.closedDroop, lerp(L.simpleDroop, lerp(L.droop, L.oldDroop, sinking), form), open);
    const widthShare = lerp(L.simpleWidth, L.width, form) * lerp(0.45, 1, open);
    const lengthShare = lerp(L.simpleLength, L.length, form);
    const jitter = frond.jitter;
    const { point, direction, normal, across } = leafletFrame;
    for (let side = 0; side < 2; side++) {
        const sign = side === 0 ? -1 : 1;
        for (let k = 0; k < L.perSide; k++) {
            const index = side * L.perSide + k;
            const j = index * LEAFLET_JITTERS;
            const v = clamp01((k + 0.5 + sign * 0.25) / L.perSide);
            // The midrib's point and angles where this leaflet sits.
            const station = (F.petiole + (1 - F.petiole) * v) * segments;
            const k0 = Math.min(segments - 1, Math.floor(station));
            const t = station - k0;
            const a = k0 * MIDRIB_FLOATS;
            const b = a + MIDRIB_FLOATS;
            point.set(lerp(midrib[a], midrib[b], t), lerp(midrib[a + 1], midrib[b + 1], t), lerp(midrib[a + 2], midrib[b + 2], t));
            const climb = lerp(midrib[a + 3], midrib[b + 3], t);
            const [hx, hz] = swung(pose.heading, lerp(midrib[a + 4], midrib[b + 4], t));
            midribRun.set(Math.cos(climb) * hx, Math.sin(climb), Math.cos(climb) * hz);
            frondUp.set(-Math.sin(climb) * hx, Math.cos(climb), -Math.sin(climb) * hz);
            rowSide.set(-hz * sign, 0, hx * sign);
            // The row hangs below the frond by its tilt: turn the side and the up round the midrib.
            const tilt = rowTilt + jitter[j + 2] * L.jitter * 2 * open;
            rowOut.copy(rowSide).multiplyScalar(Math.cos(tilt)).addScaledVector(frondUp, -Math.sin(tilt));
            normal.copy(frondUp).multiplyScalar(Math.cos(tilt)).addScaledVector(rowSide, Math.sin(tilt));
            // The leaflet leaves the midrib at its angle, out towards the row's side.
            const spread = lerp(lerp(L.simpleAngle, L.simpleTipAngle, Math.pow(v, 0.7)), lerp(L.angle, L.tipAngle, v), form);
            const angle = lerp(L.closedAngle, spread, open) + jitter[j + 1] * L.jitter * 1.2 * open;
            direction.copy(midribRun).multiplyScalar(Math.cos(angle)).addScaledVector(rowOut, Math.sin(angle));
            across.crossVectors(direction, normal);
            const profile = lerp(bladeProfile(v), featherProfile(v), form);
            const length = pose.length * lengthShare * profile * (1 + jitter[j] * L.jitter * 2);
            visit(index, leafletFrame, length, length * widthShare, droop);
        }
    }
}

/** A bunch at this growth: its stalk, how far its flowers have opened and its nuts swollen. Null before it flowers. */
function bunchPose(bunch, crown, spec, growth, azimuth) {
    const fruit = spec.fruit;
    const age = growth - bunch.flowerAt;
    if (age <= 0) return null;
    const spike = easeOut(clamp01(age / fruit.spikeGrow));
    const swell = smooth(ramp(age, fruit.setAfter, fruit.setAfter + fruit.swell));
    const base = onCrown(crown, crown.depth * bunch.drop, crown.radius * 0.9, azimuth);
    // The stalk leans out and sags as its nuts get heavy.
    const climb = lerp(fruit.stalkAngle, fruit.ladenAngle, swell);
    const direction = new THREE.Vector3(Math.cos(climb) * Math.cos(azimuth), Math.sin(climb), Math.cos(climb) * Math.sin(azimuth));
    const end = base.map((value, axis) => value + direction.getComponent(axis) * fruit.stalkLength * spike);
    return { age, spike, swell, base, end, direction, ...basisOf(direction) };
}

/** One nut of a bunch: its centre, radius, which way it points out of the cluster, and its colour's ripeness (0 green → 1 brown). */
function nutPlacement(pose, nut, spec) {
    const fruit = spec.fruit;
    const radius = fruit.nutRadius * nut.size * pose.swell;
    // The cluster loosens as the nuts grow, so small ones don't float apart.
    const pack = fruit.nutRadius * lerp(0.5, 1.1, pose.swell);
    const cos = Math.cos(nut.around);
    const sin = Math.sin(nut.around);
    const out = [0, 1, 2].map(axis => pose.u.getComponent(axis) * cos + pose.v.getComponent(axis) * sin);
    const centre = pose.end.map((value, axis) => value + out[axis] * nut.out * pack + pose.direction.getComponent(axis) * nut.along * pack);
    const ripe = smooth(ramp(pose.age - nut.lag, fruit.ripenAfter, fruit.ripenAfter + fruit.ripen));
    return { centre, radius, out, ripe };
}

/** The coconut it sprouted from: pushed aside as the base swells, then sinking into the sand as it rots. Null once gone. */
function seedPose(plan, spec, crown, growth) {
    const N = spec.nut;
    const rot = smooth(ramp(growth, N.rotFrom, N.rotTo));
    if (rot >= 1) return null;
    const direction = [plan.nut.side * Math.cos(plan.nut.turn), Math.sin(plan.nut.turn)];
    const out = N.length * 0.31 + spec.trunk.radius * (1 + spec.trunk.flare) * crown.girth * 0.85;
    const height = N.width * (0.5 - N.buried) - N.width * 1.05 * rot;
    return { centre: [direction[0] * out, height, direction[1] * out], direction, rot };
}

/** A root at this growth: how far it has grown out of the base. */
const rootProgress = (root, trunk, growth) => easeOut(ramp(growth, root.birth, root.birth + trunk.rootGrow));

/** Start and direction of a root: out of the swollen base, just above the sand, and down into it. */
function rootEnds(root, plan, spec, girth) {
    const T = spec.trunk;
    const rise = spec.sand.height + T.rootHeight;
    // Round the trunk's line at that height, a little inside its bark: the trunk leans even this low.
    const { point } = alongTrunk(plan.trunk, rise);
    const reach = trunkRadiusAt(T, rise) * 0.8 * girth;
    const start = [point[0] + Math.cos(root.azimuth) * reach, rise, point[2] + Math.sin(root.azimuth) * reach];
    const direction = [Math.cos(root.dip) * Math.cos(root.azimuth), -Math.sin(root.dip), Math.cos(root.dip) * Math.sin(root.azimuth)];
    return { start, direction };
}

/** Midrib radius at its base: in proportion to the frond, and thicker while it is a spear with its leaflets folded round it. */
function midribRadius(pose, spec) {
    const F = spec.fronds;
    return F.midribWidth * (pose.length / F.adultLength) * (1 + F.spearWidth * (1 - pose.open));
}

/** …and `u` of the way out (0–1), as a share of that: it narrows by the same share every step, so instanced pieces join flush. */
const midribTaper = (fronds, u) => Math.pow(fronds.midribTip, u);

/** The bundle of leaf bases round the growing point: its centre a little below it, half its length along the trunk, half its width. */
function knobOf(crown) {
    const r = crown.radius;
    return { centre: crown.apex.map((value, axis) => value - crown.axis[axis] * r * 0.9), along: r * 1.7, across: r * 1.25 };
}

// ─── Colours, as [r, g, b], shared by both views ───

/** A frond's leaflets and midrib at its age: pale as a spear, then green, yellowing and brown. */
function frondColors(frond, pose, rgb, ribTint) {
    let leaf = blend(frond.rgb, rgb.spear, pose.fresh);
    leaf = blend(leaf, rgb.yellowing, pose.yellow);
    leaf = blend(leaf, rgb.dead, pose.brown);
    let rib = blend(rgb.midrib, rgb.spear, pose.fresh);
    rib = blend(rib, rgb.yellowing, pose.yellow * 0.6);
    rib = blend(rib, rgb.dead, pose.brown);
    return { leaf, rib: blend(rib, leaf, ribTint) };
}

/** The crown's shadow on the sand: how dark it is in the middle and how far it spreads. */
function crownShade(spec, crown, growth) {
    const shade = spec.shade;
    return {
        strength: shade.sand * smooth(ramp(growth, shade.from, shade.to)),
        reach: lerp(shade.reach[0], shade.reach[1], crown.maturity),
    };
}

/** A coconut: green, through yellow-brown, to brown. */
function nutColor(rgb, ripe) {
    return ripe < 0.5 ? blend(rgb.nutGreen, rgb.nutRipening, ripe * 2) : blend(rgb.nutRipening, rgb.nutRipe, ripe * 2 - 1);
}

const huskColor = (rgb, seed) => blend(rgb.husk, rgb.huskDark, seed.rot * 0.7);
const knobColor = (rgb, crown) => blend(rgb.sheathYoung, rgb.sheath, crown.maturity);
const stalkColor = rgb => blend(rgb.stalk, rgb.sheath, 0.3);
// Golden flower strands, which stay on as the nuts' stalks.
const strandColor = (rgb, pose) => blend(rgb.flower, rgb.stalk, pose.swell);

/** Sets a THREE.Color from an [r, g, b] colour. */
const setColor = (color, rgb) => color.setRGB(rgb[0] / 255, rgb[1] / 255, rgb[2] / 255, THREE.SRGBColorSpace);

/** How many fronds are in the crown at this growth. */
const frondsAt = (plan, growth) => plan.fronds.filter(frond => growth > frond.birth && growth < frond.birth + frond.life).length;

// ─── Palm in 2D ───

/**
 * Turns scene points into side-view pixels. The view looks down by `pitch`, so nearer things sit a little lower and a circle
 * on the sand shows as a flat ellipse. depthOf says how near a point is, for drawing far things first.
 */
function sideView(view, spec) {
    const V = spec.view2D;
    const { scale, sx, sy } = framing(view, V);
    const cos = Math.cos(V.pitch);
    const sin = Math.sin(V.pitch);
    const flatY = (y, z) => y * cos - z * sin;
    return {
        g: view.ctx, width: view.width, scale, sx, sy, flatY, sinPitch: sin,
        py: (y, z) => sy(flatY(y, z)),
        depthOf: (y, z) => z * cos + y * sin,
    };
}

/** Paints on the sand round screen point (x, y): whatever `paint` draws round (0, 0) lies flat, as the side view sees it. */
function onSand(g, x, y, sinPitch, paint) {
    g.save();
    g.translate(x, y);
    g.scale(1, sinPitch);
    paint();
    g.restore();
}

/** The screen direction square to a line of points at point k, to the right of the way it runs. */
function stripNormal(xs, ys, k) {
    const before = Math.max(0, k - 1);
    const after = Math.min(xs.length - 1, k + 1);
    const dx = xs[after] - xs[before];
    const dy = ys[after] - ys[before];
    const length = Math.hypot(dx, dy) || 1;
    return [-dy / length, dx / length];
}

/** A filled strip along screen points, `halves[k]` pixels either side of point k: midribs and trunks. */
function fillStrip(g, xs, ys, halves) {
    const count = xs.length;
    const edge = (k, sign) => {
        const [nx, ny] = stripNormal(xs, ys, k);
        return [xs[k] + nx * halves[k] * sign, ys[k] + ny * halves[k] * sign];
    };
    g.beginPath();
    for (let k = 0; k < count; k++) g.lineTo(...edge(k, 1));
    for (let k = count - 1; k >= 0; k--) g.lineTo(...edge(k, -1));
    g.closePath();
    g.fill();
}

// ─── Palm in 3D ───

/**
 * One leaflet, one unit long along x, one unit wide across z: narrow at its base, tapering to a point, its tip curling down
 * (–y) and its two halves folded down from the midvein. Each instance scales y by its own length × droop.
 */
function leafletGeometry(spec) {
    // Stations along the leaflet: how far along, and its width there.
    const stations = [[0, 0.3], [0.08, 0.75], [0.22, 1], [0.42, 0.95], [0.62, 0.8], [0.8, 0.55], [0.92, 0.28], [1, 0]];
    const positions = [];
    stations.forEach(([x, width]) => {
        const y = -x * x;
        const crease = spec.leaflets.fold * width;
        positions.push(x, y, -width / 2, x, y + crease, 0, x, y, width / 2);
    });
    const indices = [];
    for (let station = 0; station < stations.length - 1; station++) {
        const at = station * 3;
        const next = at + 3;
        indices.push(at, next, at + 1, at + 1, next, next + 1, at + 1, next + 1, at + 2, at + 2, next + 1, next + 2);
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();
    return geometry;
}

/** One ring of trunk, base at 0 and top at 1, radius 1: a plain stretch, then the raised scar where a frond fell. */
function ringGeometry() {
    const profile = [[1, 0], [0.97, 0.12], [0.96, 0.6], [1.03, 0.76], [1.07, 0.86], [1, 1]];
    return new THREE.LatheGeometry(profile.map(([radius, y]) => new THREE.Vector2(radius, y)), 9);
}

/**
 * A coconut in its husk, two units long along x and two across: its far end (+x, away from the shoot) narrowing to a blunt
 * point, and three faint ridges running its length.
 */
function huskGeometry(spec) {
    const { point, ridges } = spec.nut;
    const geometry = new THREE.IcosahedronGeometry(1, 2);
    const position = geometry.attributes.position;
    for (let index = 0; index < position.count; index++) {
        const x = position.getX(index);
        const y = position.getY(index);
        const z = position.getZ(index);
        const ridged = 1 + ridges * Math.cos(3 * Math.atan2(z, y));
        const narrowing = 1 - point * Math.max(0, x) ** 2;
        position.setXYZ(index, x, y * ridged * narrowing, z * ridged * narrowing);
    }
    geometry.computeVertexNormals();
    return geometry;
}

/** A low mound of sand with the plan's wavy shore, its colour per vertex so the crown's shade can be painted on. */
function sandGeometry(spec, plan, rand) {
    const { radius, height, shoreDrop } = spec.sand;
    const rings = 8;
    const spokes = 48;
    const positions = [0, height, 0];
    for (let ring = 1; ring <= rings; ring++) {
        const across = ring / rings;
        for (let spoke = 0; spoke < spokes; spoke++) {
            const angle = (spoke + (ring % 2) * 0.5) / spokes * TAU;
            const reach = radius * across * lerp(1, shoreAt(plan, angle), across);
            const y = height * (1 - across * across) - shoreDrop * smooth(ramp(across, 0.75, 1)) + (rand() - 0.5) * 0.005 * across;
            positions.push(Math.cos(angle) * reach, y, Math.sin(angle) * reach);
        }
    }
    const indices = [];
    for (let spoke = 0; spoke < spokes; spoke++) indices.push(0, 1 + (spoke + 1) % spokes, 1 + spoke);
    for (let ring = 1; ring < rings; ring++) {
        const inner = 1 + (ring - 1) * spokes;
        const outer = inner + spokes;
        for (let spoke = 0; spoke < spokes; spoke++) {
            const next = (spoke + 1) % spokes;
            indices.push(inner + spoke, inner + next, outer + spoke, inner + next, outer + next, outer + spoke);
        }
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(positions.length), 3));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();
    return geometry;
}

// ─── Wind: the 3D palm sways on the GPU, so a frame costs nothing but a clock tick ───

const WIND_GLSL = `
uniform float palmTime;
uniform float palmSway;
uniform float palmBob;
uniform float palmFlutter;
uniform vec3 palmCrown;
// One displacement for every part of the palm, so whatever touches stays touching.
vec3 palmWind( vec3 p ) {
    float height = max( p.y, 0.0 );
    // The whole palm leans with the gusts, more the higher up.
    float gust = sin( palmTime * 0.8 ) + 0.4 * sin( palmTime * 2.1 + 1.3 );
    vec3 offset = vec3( gust, 0.0, 0.45 * cos( palmTime * 0.6 ) ) * palmSway * height * height;
    // Each frond rises and falls on its own beat, its tip the most; whatever rests on the sand stays put.
    vec2 reach = p.xz - palmCrown.xz;
    float beat = atan( reach.y, reach.x + 1e-5 ) * 3.0;
    offset.y += palmBob * dot( reach, reach ) * sin( palmTime * 1.9 + beat ) * smoothstep( 0.0, 0.1, height );
    return offset;
}`;

const WIND_PROJECT = `
vec4 mvPosition = vec4( transformed, 1.0 );
#ifdef USE_INSTANCING
    mvPosition = instanceMatrix * mvPosition;
#endif
vec4 windWorld = modelMatrix * mvPosition;
windWorld.xyz += palmWind( windWorld.xyz );
mvPosition = viewMatrix * windWorld;
gl_Position = projectionMatrix * mvPosition;`;

// Leaflets flutter as well: the tip most, each on its own beat, taken from where it sits.
const WIND_FLUTTER = `
#ifdef USE_INSTANCING
    transformed.y += palmFlutter * transformed.x * transformed.x * sin( palmTime * 5.0 + dot( instanceMatrix[ 3 ].xyz, vec3( 37.0, 23.0, 29.0 ) ) );
#endif`;

/** Lets a material move with the wind `uniforms`; leaflets also flutter. */
function inWind(material, uniforms, flutter = false) {
    material.onBeforeCompile = shader => {
        Object.assign(shader.uniforms, uniforms);
        shader.vertexShader = shader.vertexShader
            .replace('#include <common>', `#include <common>\n${WIND_GLSL}`)
            .replace('#include <project_vertex>', (flutter ? WIND_FLUTTER : '') + WIND_PROJECT);
    };
    // Its own shader program: without this, three.js could hand it one compiled for a plain material.
    material.customProgramCacheKey = () => (flutter ? 'palm-wind-flutter' : 'palm-wind');
    return material;
}

/**
 * An instanced mesh that draws exactly `count` instances, none when it is 0 (the shared helper always keeps one, which would
 * show at full size), with a colour per instance: white, so the material's own colour, until set.
 */
function instancedParts(geometry, material, count) {
    const mesh = instanced(geometry, material, count);
    mesh.count = count;
    // three.js would only make this buffer on the first setColorAt.
    mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(mesh.instanceMatrix.count * 3).fill(1), 3);
    return mesh;
}

const leafletMatrix = new THREE.Matrix4();
const leafletScale = new THREE.Vector3();

/** Places one leaflet: x along its direction, y along its normal (its curl, `lift` deep), z across its blade. */
function placeLeaflet(mesh, index, { point, direction, normal, across }, length, lift, width) {
    leafletMatrix.makeBasis(direction, normal, across).scale(leafletScale.set(length, lift, width)).setPosition(point);
    mesh.setMatrixAt(index, leafletMatrix);
}

const segmentStart = new THREE.Vector3();
const segmentEnd = new THREE.Vector3();
const segmentDirection = new THREE.Vector3();

/** Places one instanced stem from `start` to `end`, `radius` thick. */
function placeStem(mesh, index, start, end, radius) {
    segmentDirection.subVectors(end, start);
    const length = segmentDirection.length();
    if (length > 1e-6) segmentDirection.divideScalar(length);
    else segmentDirection.copy(UP);
    dummy.position.copy(start);
    dummy.quaternion.setFromUnitVectors(UP, segmentDirection);
    dummy.scale.set(radius, Math.max(length, 0.00001), radius);
    dummy.updateMatrix();
    mesh.setMatrixAt(index, dummy.matrix);
}

/** Hides instances [from, to) by scaling them to nothing. */
const hideInstances = (mesh, from, to) => mesh.instanceMatrix.array.fill(0, from * 16, to * 16);

class PalmView extends PlantView {
    constructor() {
        super('palm', { target: [0, 0.44, 0], cameraAt: [0, 0.74, 2.15], background: PALM_SPEC.colors.background });
        this.spec = PALM_SPEC;
        this.scene3D = null;
        // Shared by every swaying material; kept across rebuilds, so a new seed doesn't restart the breeze.
        this.wind = {
            palmTime: { value: 0 },
            palmSway: { value: 0 },
            palmBob: { value: 0 },
            palmFlutter: { value: 0 },
            palmCrown: { value: new THREE.Vector3() },
        };
    }

    /** Only the breeze's clock moves every frame; the shaders do the rest. */
    animate(dt) {
        this.wind.palmTime.value += dt * this.spec.wind.speed;
    }

    build() {
        const { spec } = this;
        this.plan = planPalm(spec);
        // Colours as [r, g, b] for mixing in 2D.
        this.rgb = Object.fromEntries(Object.entries(spec.colors).filter(([, value]) => typeof value === 'string').map(([key, value]) => [key, hexToRgb(value)]));
        this.plan.fronds.forEach(frond => { frond.rgb = hexToRgb(frond.color); });
        this.shapes2D = new Float32Array(spec.leaflets.perSide * 2 * SHAPE_FLOATS);
        this.buildScene3D();
    }

    stageLabel(growth) {
        const { plan, spec } = this;
        // Fruiting once the first nutlets have set, not while there is only a flower spike.
        const firstNutlets = plan.bunches.length ? plan.bunches[0].flowerAt + spec.fruit.setAfter : Infinity;
        if (growth >= 1) return { text: 'Bearing coconuts 🥥', tone: 'gold' };
        if (growth >= firstNutlets) return { text: 'Fruiting', tone: 'gold' };
        // The trunk counts once it has risen clear of its swollen base.
        if (crownAt(plan, spec, growth).height > spec.trunk.flareHeight) return { text: 'Trunk rising', tone: 'green' };
        return { text: 'Seedling', tone: 'green' };
    }

    describe() {
        const { plan, spec } = this;
        const nuts = plan.bunches.reduce((sum, bunch) => sum + bunch.nuts.length, 0);
        return `${frondsAt(plan, 1)} fronds in the crown at fruition, ${plan.fronds.length} over its life · ${spec.leaflets.perSide * 2} leaflets a frond · ${plan.bunches.length} bunches, ${nuts} coconuts`;
    }

    // ─── 2D ───

    draw2D(growth) {
        const view = this.view2D;
        // Not measured yet: the tab has only just been shown. Its size comes in a moment and repaints it; 0 × 0 would make NaNs.
        if (!view.width || !view.height) return;
        const { spec, plan } = this;
        const p = sideView(view, spec);
        p.g.clearRect(0, 0, view.width, view.height);
        const crown = crownAt(plan, spec, growth);
        this.drawSand2D(p, crown, growth);

        // Far things first: fronds by their middles, bunches, the trunk on its axis, the old nut.
        const layers = [];
        plan.fronds.forEach(frond => {
            const pose = frondPose(frond, crown, spec, growth, frond.azimuth2D);
            if (!pose) return;
            const midrib = new Float32Array((MIDRIB_SEGMENTS_2D + 1) * MIDRIB_FLOATS);
            traceMidrib(pose, spec, MIDRIB_SEGMENTS_2D, midrib);
            const middle = (MIDRIB_SEGMENTS_2D >> 1) * MIDRIB_FLOATS;
            // Ordered by where it hung before it fell, so a falling frond doesn't jump behind or in front of the trunk.
            const depth = p.depthOf(midrib[middle + 1] + pose.fallen - crown.apex[1], midrib[middle + 2] - crown.apex[2]);
            layers.push({ depth, draw: () => this.drawFrond2D(p, frond, pose, midrib, depth) });
        });
        plan.bunches.forEach(bunch => {
            const pose = bunchPose(bunch, crown, spec, growth, bunch.azimuth2D);
            if (pose) layers.push({ depth: p.depthOf(0, pose.end[2] - crown.apex[2]) + 0.01, draw: () => this.drawBunch2D(p, bunch, pose) });
        });
        const seed = seedPose(plan, spec, crown, growth);
        if (seed) layers.push({ depth: p.depthOf(0, seed.centre[2]) + 0.02, draw: () => this.drawSeed2D(p, seed) });
        layers.push({ depth: 0, draw: () => this.drawTrunk2D(p, crown, growth) });
        // The leaf bases round the growing point go over the fronds' ends, where they all meet.
        layers.push({ depth: Infinity, draw: () => this.drawKnob2D(p, crown) });
        layers.sort((a, b) => a.depth - b.depth).forEach(layer => layer.draw());
    }

    drawSand2D(p, crown, growth) {
        const { g, scale, sinPitch } = p;
        const { colors, sand } = this.spec;
        const rgb = this.rgb;
        const cx = p.sx(0);
        const cy = p.py(0, 0);
        const rx = sand.radius * scale;
        const ry = rx * sinPitch;
        // Its wavy shore, as on the 3D island, on the ground seen from a little above.
        const shore = Array.from({ length: 64 }, (_, index) => {
            const angle = index / 64 * TAU;
            const reach = sand.radius * shoreAt(this.plan, angle);
            return [p.sx(Math.cos(angle) * reach), p.py(0, Math.sin(angle) * reach)];
        });
        const outline = drop => {
            g.beginPath();
            shore.forEach(([x, y]) => g.lineTo(x, y + drop));
            g.closePath();
        };
        // A soft dark pool under the patch, so it rests on the panel instead of floating.
        onSand(g, cx, cy + sand.edge * scale, sinPitch, () => {
            const pool = g.createRadialGradient(0, 0, rx * 0.8, 0, 0, rx * 1.25);
            pool.addColorStop(0, cssRgba(rgb.pool, sand.pool));
            pool.addColorStop(1, cssRgba(rgb.pool, 0));
            g.fillStyle = pool;
            g.beginPath();
            g.arc(0, 0, rx * 1.25, 0, TAU);
            g.fill();
        });
        // The front edge, then the top: lighter in the middle, the crown's shade straight under it.
        const edge = g.createLinearGradient(0, cy, 0, cy + ry + sand.edge * scale);
        edge.addColorStop(0, colors.sandDark);
        edge.addColorStop(1, mixRgb(rgb.sandDark, rgb.background, 0.35));
        g.fillStyle = edge;
        outline(sand.edge * scale);
        g.fill();
        g.save();
        outline(0);
        g.clip();
        onSand(g, cx, cy, sinPitch, () => {
            const top = g.createRadialGradient(-rx * 0.15, -rx * 0.2, 0, 0, 0, rx * 1.1);
            top.addColorStop(0, colors.sandLight);
            top.addColorStop(0.5, colors.sand);
            top.addColorStop(1, mixRgb(rgb.sand, rgb.sandDark, 0.55));
            g.fillStyle = top;
            g.fillRect(-rx * 1.3, -rx * 1.3, rx * 2.6, rx * 2.6);
        });
        const { strength, reach } = crownShade(this.spec, crown, growth);
        if (strength > 0.005) {
            onSand(g, p.sx(crown.apex[0]), p.py(0, crown.apex[2]), sinPitch, () => {
                const shadow = g.createRadialGradient(0, 0, 0, 0, 0, reach * scale);
                shadow.addColorStop(0, cssRgba(rgb.shade, strength));
                shadow.addColorStop(1, cssRgba(rgb.shade, 0));
                g.fillStyle = shadow;
                g.beginPath();
                g.arc(0, 0, reach * scale, 0, TAU);
                g.fill();
            });
        }
        g.restore();
        // Wind ripples: a shaded trough with a lit crest above it.
        const ripple = (color, lift) => {
            g.strokeStyle = color;
            g.lineWidth = 1;
            g.beginPath();
            this.plan.ripples.forEach(({ x, z, length, curve }) => {
                g.moveTo(p.sx(x - length / 2), p.py(0, z) - lift);
                g.quadraticCurveTo(p.sx(x), p.py(0, z - length * curve) - lift, p.sx(x + length / 2), p.py(0, z) - lift);
            });
            g.stroke();
        };
        ripple(mixRgb(rgb.sand, rgb.sandDark, 0.6), 0);
        ripple(colors.sandLight, 1);
    }

    drawSeed2D(p, seed) {
        const { g, scale } = p;
        const N = this.spec.nut;
        const rgb = this.rgb;
        const [x, y, z] = seed.centre;
        const cx = p.sx(x);
        const cy = p.py(y, z);
        // Seen from the side, the long axis shortens as it turns towards you.
        const rx = N.length / 2 * Math.hypot(seed.direction[0], seed.direction[1] * p.sinPitch) * scale;
        const ry = N.width / 2 * scale;
        // `along` the husk runs from the shoot's end (–1) to the far end (1), which narrows to a blunt point.
        const narrowing = along => 1 - N.point * Math.max(0, along) ** 2;
        // Whatever has sunk below the sand is cut away.
        const groundY = p.py(0, z) + N.width * 0.12 * scale;
        g.save();
        g.beginPath();
        g.rect(cx - rx * 2, groundY - ry * 4, rx * 4, ry * 4);
        g.clip();
        // From here on the nut lies along x, its far end at +x and dipping a little, as in 3D: the shoot's end is lifted.
        g.translate(cx, cy);
        g.scale(seed.direction[0] >= 0 ? 1 : -1, 1);
        g.rotate(0.12);
        const husk = huskColor(rgb, seed);
        g.fillStyle = cssRgb(husk);
        g.beginPath();
        for (let step = 0; step < 40; step++) {
            const angle = step / 40 * TAU;
            const along = Math.cos(angle);
            g.lineTo(along * rx, Math.sin(angle) * ry * narrowing(along));
        }
        g.closePath();
        g.fill();
        // Inside its outline: shade underneath, a faint glint on top (a husk is matt), and fibres running its length.
        g.clip();
        g.fillStyle = mixRgb(husk, rgb.huskDark, 0.6);
        g.beginPath();
        g.ellipse(0, ry * 0.75, rx * 1.1, ry * 0.7, 0, 0, TAU);
        g.fill();
        g.fillStyle = mixRgb(husk, rgb.glint, 0.08 * (1 - seed.rot));
        g.beginPath();
        g.ellipse(-rx * 0.1, -ry * 0.5, rx * 0.45, ry * 0.18, 0, 0, TAU);
        g.fill();
        g.strokeStyle = mixRgb(husk, rgb.huskDark, 0.4);
        g.lineWidth = Math.max(0.6, 0.0016 * scale);
        g.beginPath();
        [-0.65, -0.35, -0.05, 0.25, 0.55].forEach(round => {
            for (let step = 0; step <= 10; step++) {
                const along = -0.9 + 1.8 * step / 10;
                const fibreY = round * ry * Math.sqrt(1 - along * along) * narrowing(along);
                if (step === 0) g.moveTo(along * rx, fibreY);
                else g.lineTo(along * rx, fibreY);
            }
        });
        g.stroke();
        g.restore();
        // A lip of sand where it goes under, sinking with it: gone by the time the nut is (at rot ≈ 0.9).
        const lip = 1 - smooth(ramp(seed.rot, 0.5, 0.9));
        if (lip <= 0) return;
        g.globalAlpha = 0.6 * lip;
        g.fillStyle = this.spec.colors.sand;
        g.beginPath();
        g.ellipse(cx, groundY, rx * 1.15 * lip, Math.max(1, 0.007 * scale), 0, 0, TAU);
        g.fill();
        g.globalAlpha = 1;
    }

    /** The roots behind the trunk, the trunk, then the roots in front of it. */
    drawTrunk2D(p, crown, growth) {
        this.drawRoots2D(p, crown, growth, root => Math.sin(root.azimuth) < 0);
        if (crown.height > 0.002) this.drawStem2D(p, crown);
        this.drawRoots2D(p, crown, growth, root => Math.sin(root.azimuth) >= 0);
    }

    drawStem2D(p, crown) {
        const { g, scale } = p;
        const { spec, plan, rgb } = this;
        const T = spec.trunk;
        const colors = spec.colors;
        const steps = Math.max(2, Math.ceil(crown.height / 0.015));
        const xs = [], ys = [], halves = [];
        for (let k = 0; k <= steps; k++) {
            const distance = crown.height * k / steps;
            const { point } = alongTrunk(plan.trunk, distance);
            xs.push(p.sx(point[0]));
            ys.push(p.py(point[1], point[2]));
            halves.push(Math.max(1, trunkRadiusAt(T, distance) * crown.girth * scale));
        }
        g.fillStyle = colors.bark;
        fillStrip(g, xs, ys, halves);
        // Round: shade on the left, light on the right, where the sun is in 3D. Thin washes stacked up, so no hard edge runs
        // down it to cut the rings into bricks.
        const normals = xs.map((_, k) => stripNormal(xs, ys, k));
        const wash = ([from, to], color) => {
            const middle = halves.map(half => half * (to - from) / 2);
            const shifted = halves.map(half => half * (to + from) / 2);
            g.fillStyle = color;
            fillStrip(g, xs.map((x, k) => x + normals[k][0] * shifted[k]), ys.map((y, k) => y + normals[k][1] * shifted[k]), middle);
        };
        g.globalAlpha = 0.3;
        [[-1, -0.1], [-1, -0.45], [-1, -0.75]].forEach(band => wash(band, colors.barkDark));
        [[0.05, 0.7], [0.15, 0.55], [0.25, 0.45]].forEach(band => wash(band, colors.barkLight));
        g.globalAlpha = 1;
        this.drawRings2D(p, crown);
        // The crown shades the top of the trunk.
        const { point: low } = alongTrunk(plan.trunk, Math.max(0, crown.height - 0.16));
        const [ax, ay, az] = crown.apex;
        const shade = g.createLinearGradient(p.sx(low[0]), p.py(low[1], low[2]), p.sx(ax), p.py(ay, az));
        shade.addColorStop(0, cssRgba(rgb.trunkShade, 0));
        shade.addColorStop(1, cssRgba(rgb.trunkShade, spec.shade.trunk));
        g.fillStyle = shade;
        fillStrip(g, xs, ys, halves);
    }

    /**
     * The leaf bases round the growing point, over the fronds' stalks where they all meet: a soft-edged boss, green on a seedling,
     * brown fibre on a grown palm, lit from the right like the trunk. Below the sand it is hidden.
     */
    drawKnob2D(p, crown) {
        const { g, scale } = p;
        const knob = knobOf(crown);
        if (knob.along * scale < 0.5) return;
        const [kx, ky, kz] = knob.centre;
        const color = knobColor(this.rgb, crown);
        g.save();
        g.beginPath();
        g.rect(0, 0, p.width, p.py(0, kz));
        g.clip();
        // From here on x runs up the trunk's axis and y across it, to the lit side; the boss is the unit circle.
        g.translate(p.sx(kx), p.py(ky, kz));
        g.rotate(Math.atan2(-p.flatY(crown.axis[1], crown.axis[2]), crown.axis[0]));
        g.scale(knob.along * scale, knob.across * scale);
        const shaded = blend(color, this.rgb.barkDark, 0.45);
        const boss = g.createRadialGradient(0, 0.3, 0, 0, 0, 1);
        boss.addColorStop(0, cssRgba(color, 1));
        boss.addColorStop(0.75, cssRgba(shaded, 1));
        boss.addColorStop(1, cssRgba(shaded, 0));
        g.fillStyle = boss;
        g.beginPath();
        g.arc(0, 0, 1, 0, TAU);
        g.fill();
        g.restore();
    }

    drawRings2D(p, crown) {
        const { g, scale } = p;
        const T = this.spec.trunk;
        const spacing = ringSpacing(T);
        const top = crown.height - crown.radius * 0.8;
        const rings = [];
        for (let distance = spacing; distance < top; distance += spacing) rings.push(distance);
        if (!rings.length) return;
        // Each ring sags a little in the middle: it wraps round the front of the trunk, seen from a little above.
        const traceRings = (band, shift) => {
            g.beginPath();
            band.forEach(distance => {
                const { point, tangent } = alongTrunk(this.plan.trunk, distance);
                const x = p.sx(point[0]);
                const y = p.py(point[1], point[2]) + shift;
                const tx = tangent[0];
                const ty = -p.flatY(tangent[1], tangent[2]);
                const half = trunkRadiusAt(T, distance) * crown.girth * scale * 0.97;
                const sag = half * 0.3;
                g.moveTo(x + ty * half, y - tx * half);
                g.quadraticCurveTo(x - tx * sag * 2, y - ty * sag * 2, x - ty * half, y + tx * half);
            });
            g.stroke();
        };
        // Weathered smooth near the sand, crisp higher up.
        const bands = [[0, 0.05, 0.3], [0.05, 0.12, 0.6], [0.12, Infinity, 1]];
        bands.forEach(([from, to, alpha]) => {
            const band = rings.filter(distance => distance >= from && distance < to);
            if (!band.length) return;
            g.globalAlpha = alpha;
            g.lineWidth = Math.max(1, spacing * 0.16 * scale);
            g.strokeStyle = this.spec.colors.ring;
            traceRings(band, 0);
            g.strokeStyle = mixRgb(this.rgb.barkLight, this.rgb.bark, 0.3);
            g.lineWidth = Math.max(0.7, spacing * 0.09 * scale);
            traceRings(band, Math.max(1, spacing * 0.15 * scale));
        });
        g.globalAlpha = 1;
    }

    /** The roots that pass `wanted`, as far as they have grown. */
    drawRoots2D(p, crown, growth, wanted) {
        const { g } = p;
        const { spec, plan } = this;
        // The 2D sand is flat at 0, where the 3D mound's top is at sand.height.
        const ground = spec.sand.height;
        const roots = plan.roots.filter(wanted).map(root => {
            const { start, direction } = rootEnds(root, plan, spec, crown.girth);
            const x = start[0];
            const y = p.flatY(start[1] - ground, start[2]);
            const ex = x + direction[0] * root.length;
            const ey = p.flatY(start[1] - ground + direction[1] * root.length, start[2] + direction[2] * root.length);
            const branch = makeBranch2D(x, y, Math.atan2(ey - y, ex - x), Math.hypot(ex - x, ey - y), spec.trunk.rootWidth, 2, root.birth);
            branch.progress = rootProgress(root, spec.trunk, growth);
            return branch;
        });
        // Only what is above the sand shows: they plunge into it.
        g.save();
        g.beginPath();
        g.rect(0, 0, p.width, p.py(0, 0));
        g.clip();
        strokeBranches2D(g, roots, {
            progressOf: branch => branch.progress,
            thickness: crown.girth,
            taper: 0.3,
            color: spec.colors.root,
            sx: p.sx, sy: p.sy, scale: p.scale,
        });
        g.restore();
    }

    /** One frond: its far row of leaflets, its near row, then the midrib on top. */
    drawFrond2D(p, frond, pose, midrib, depth) {
        const { g, scale } = p;
        const { spec, rgb } = this;
        const shapes = this.shapes2D;
        const minHalf = 0.55;
        forEachLeaflet(frond, pose, midrib, MIDRIB_SEGMENTS_2D, spec, (index, { point, direction, normal, across }, length, width, droop) => {
            const half = length / 2;
            const drop = length * droop;
            const bx = p.sx(point.x);
            const by = p.py(point.y, point.z);
            const cx = p.sx(point.x + direction.x * half);
            const cy = p.py(point.y + direction.y * half, point.z + direction.z * half);
