            // Its tip, curled down against the blade's normal.
            const tx = p.sx(point.x + direction.x * length - normal.x * drop);
            const ty = p.py(point.y + direction.y * length - normal.y * drop, point.z + direction.z * length - normal.z * drop);
            // A blade seen edge-on still shows as a sliver.
            const facing = Math.hypot(across.x, p.flatY(across.y, across.z));
            const w = Math.max(minHalf, width / 2 * scale * (0.35 + 0.65 * facing));
            const dx = tx - bx;
            const dy = ty - by;
            const run = Math.hypot(dx, dy) || 1;
            const nx = -dy / run * w;
            const ny = dx / run * w;
            const at = index * SHAPE_FLOATS;
            shapes[at] = bx; shapes[at + 1] = by;
            shapes[at + 2] = cx; shapes[at + 3] = cy;
            shapes[at + 4] = tx; shapes[at + 5] = ty;
            shapes[at + 6] = nx; shapes[at + 7] = ny;
            shapes[at + 8] = length;
        });

        // Fronds behind the trunk sit in the crown's shade, and a frond's far row is darker than its near one.
        const { leaf, rib } = frondColors(frond, pose, rgb, spec.fronds.ribTint);
        const behind = clamp01(-depth / 0.35) * 0.4;
        const near = blend(leaf, rgb.leafShade, behind);
        const far = blend(leaf, rgb.leafShade, behind + 0.28);

        // Shaded where the frond leaves the crown, among the others; lit towards its tip.
        const tipAt = MIDRIB_SEGMENTS_2D * MIDRIB_FLOATS;
        const [fromX, fromY] = [p.sx(midrib[0]), p.py(midrib[1], midrib[2])];
        const [toX, toY] = [p.sx(midrib[tipAt]), p.py(midrib[tipAt + 1], midrib[tipAt + 2])];
        const paint = color => {
            if (Math.hypot(toX - fromX, toY - fromY) < 1) return cssRgb(color);
            const gradient = g.createLinearGradient(fromX, fromY, toX, toY);
            gradient.addColorStop(0, mixRgb(color, rgb.leafShade, 0.35));
            gradient.addColorStop(0.45, cssRgb(color));
            gradient.addColorStop(1, mixRgb(color, rgb.spear, 0.12));
            return gradient;
        };

        // The row on the side facing you is the near one.
        const nearSide = pose.heading[0] >= 0 ? 1 : 0;
        const perSide = spec.leaflets.perSide;
        // An undivided blade gets a soft edge round its overlapping pleats, about a pleat wide, so it reads as one smooth leaf.
        const simple = pose.form < 0.5;
        const pleat = Math.max(1, pose.length * (1 - spec.fronds.petiole) / perSide * scale);
        const fillRow = (side, color) => {
            g.fillStyle = paint(color);
            g.beginPath();
            for (let k = 0; k < perSide; k++) {
                const at = (side * perSide + k) * SHAPE_FLOATS;
                if (shapes[at + 8] <= 0) continue;
                const [bx, by, cx, cy, tx, ty, nx, ny] = shapes.subarray(at, at + 8);
                g.moveTo(bx + nx * 0.35, by + ny * 0.35);
                g.quadraticCurveTo(cx + nx * 2, cy + ny * 2, tx, ty);
                g.quadraticCurveTo(cx - nx * 2, cy - ny * 2, bx - nx * 0.35, by - ny * 0.35);
                g.closePath();
            }
            g.fill();
            if (!simple) return;
            g.strokeStyle = g.fillStyle;
            g.lineWidth = pleat;
            g.lineJoin = 'round';
            g.stroke();
        };
        fillRow(1 - nearSide, far);
        fillRow(nearSide, near);

        // A simple blade shows its pleats.
        if (pose.form < 0.6 && pose.open > 0.2) {
            g.strokeStyle = mixRgb(near, rgb.leafShade, 0.3);
            g.lineWidth = 0.7;
            g.beginPath();
            for (let index = 0; index < perSide * 2; index += 2) {
                const at = index * SHAPE_FLOATS;
                const [bx, by, cx, cy, tx, ty] = shapes.subarray(at, at + 6);
                g.moveTo(bx, by);
                g.quadraticCurveTo(cx, cy, tx, ty);
            }
            g.stroke();
        }

        // The midrib, tapering, its stalk end swollen where it clasps the trunk.
        const F = spec.fronds;
        const thick = midribRadius(pose, spec) * scale;
        const xs = [], ys = [], halves = [];
        for (let k = 0; k <= MIDRIB_SEGMENTS_2D; k++) {
            const at = k * MIDRIB_FLOATS;
            xs.push(p.sx(midrib[at]));
            ys.push(p.py(midrib[at + 1], midrib[at + 2]));
            halves.push(Math.max(0.5, thick * midribTaper(F, k / MIDRIB_SEGMENTS_2D) * (k === 0 ? F.clasp : 1)));
        }
        g.fillStyle = mixRgb(rib, rgb.leafShade, behind);
        fillStrip(g, xs, ys, halves);
    }

    drawBunch2D(p, bunch, pose) {
        const { g, scale } = p;
        const { spec, rgb } = this;
        const fruit = spec.fruit;
        const toScreen = ([x, y, z]) => [p.sx(x), p.py(y, z)];
        const [bx, by] = toScreen(pose.base);
        const [ex, ey] = toScreen(pose.end);
        g.lineCap = 'round';
        g.strokeStyle = cssRgb(strandColor(rgb, pose));
        g.lineWidth = Math.max(0.8, 0.0035 * scale);
        g.beginPath();
        bunch.spikelets.forEach(spikelet => {
            const direction = splay(pose.direction, spikelet.tilt, spikelet.around);
            const reach = fruit.spikeletLength * spikelet.length * pose.spike;
            const [sx, sy] = toScreen(pose.end.map((value, axis) => value + direction.getComponent(axis) * reach));
            g.moveTo(ex, ey);
            g.lineTo(sx, sy);
        });
        g.stroke();
        g.strokeStyle = cssRgb(stalkColor(rgb));
        g.lineWidth = Math.max(1, 0.008 * scale);
        g.beginPath();
        g.moveTo(bx, by);
        g.lineTo(ex, ey);
        g.stroke();

        // Nuts, the far ones first, each with a glint.
        const nuts = bunch.nuts.map(nut => nutPlacement(pose, nut, spec)).filter(nut => nut.radius > 0.0005);
        nuts.sort((a, b) => p.depthOf(a.centre[1], a.centre[2]) - p.depthOf(b.centre[1], b.centre[2]));
        nuts.forEach(nut => {
            const [nx, ny] = toScreen(nut.centre);
            const radius = nut.radius * scale;
            const color = nutColor(rgb, nut.ripe);
            g.fillStyle = mixRgb(color, rgb.nutShade, 0.25);
            g.beginPath();
            g.ellipse(nx, ny, radius, radius * 1.12, Math.atan2(nut.out[0], 1), 0, TAU);
            g.fill();
            g.fillStyle = cssRgb(color);
            g.beginPath();
            g.ellipse(nx + radius * 0.12, ny - radius * 0.14, radius * 0.8, radius * 0.88, 0, 0, TAU);
            g.fill();
            g.fillStyle = mixRgb(color, rgb.glint, 0.35);
            g.beginPath();
            g.ellipse(nx + radius * 0.32, ny - radius * 0.4, radius * 0.28, radius * 0.2, -0.5, 0, TAU);
            g.fill();
        });
    }

    // ─── 3D ───

    disposeScene3D() {
        if (!this.scene3D) return;
        this.stage.scene.remove(this.scene3D.group);
        this.scene3D.owned.forEach($_ => $_.dispose());
        this.scene3D = null;
    }

    buildScene3D() {
        this.disposeScene3D();
        const { spec, plan } = this;
        const colors = spec.colors;
        const rand = mulberry32(spec.seed + 2000);
        const owned = [];
        const own = thing => { owned.push(thing); return thing; };
        const material = options => own(new THREE.MeshStandardMaterial({ roughness: 0.9, flatShading: true, ...options }));
        const swaying = (options, flutter) => inWind(material(options), this.wind, flutter);
        const white = '#ffffff';

        // A dark floor round the island, as under the bonsai's pot, so the sand doesn't float.
        const ground = new THREE.Mesh(own(new THREE.CircleGeometry(spec.sand.floor, 48)), material({ color: colors.ground, roughness: 1, flatShading: false }));
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -spec.sand.shoreDrop - 0.008;

        const sandGeo = own(sandGeometry(spec, plan, rand));
        const sand = new THREE.Mesh(sandGeo, material({ vertexColors: true, roughness: 1 }));
        // Base colour per vertex: lighter towards the middle, speckled.
        const sandColors = new Float32Array(sandGeo.attributes.position.count * 3);
        const light = new THREE.Color(colors.sandLight);
        const dark = new THREE.Color(colors.sandDark);
        const positions = sandGeo.attributes.position.array;
        for (let index = 0; index < sandColors.length / 3; index++) {
            const across = Math.hypot(positions[index * 3], positions[index * 3 + 2]) / spec.sand.radius;
            tint.set(colors.sand).lerp(light, 0.45 * (1 - across) + (rand() - 0.5) * 0.25).lerp(dark, smooth(ramp(across, 0.7, 1.05)) * 0.6);
            sandColors.set([tint.r, tint.g, tint.b], index * 3);
        }

        const seed = new THREE.Mesh(own(huskGeometry(spec)), material({ color: colors.husk, roughness: 0.95 }));

        // The trunk: one ring scar per instance along its fixed line.
        const spacing = ringSpacing(spec.trunk);
        const ringCount = Math.ceil(spec.trunk.height / spacing);
        const rings = Array.from({ length: ringCount }, (_, index) => {
            const distance = index * spacing;
            const { point, tangent } = alongTrunk(plan.trunk, distance);
            const ring = makeBranch3D(new THREE.Vector3(...point), new THREE.Vector3(...tangent), spacing * 1.06, 0, 0, 0);
            ring.distance = distance;
            return ring;
        });
        const trunkMesh = instancedParts(own(ringGeometry()), swaying({ color: white, roughness: 0.95 }), ringCount);
        const barkLight = new THREE.Color(colors.barkLight);
        const sheath = new THREE.Color(colors.sheath);
        rings.forEach((ring, index) => {
            // Weathered grey low down, browner near the crown, every ring a shade different.
            const up = index / ringCount;
            trunkMesh.setColorAt(index, tint.set(colors.bark).lerp(barkLight, 0.35 * (1 - up) + rand() * 0.25).lerp(sheath, smooth(ramp(up, 0.75, 1)) * 0.5));
        });

        const roots = plan.roots.map(root => {
            const { start, direction } = rootEnds(root, plan, spec, 1);
            const branch = makeBranch3D(new THREE.Vector3(...start), new THREE.Vector3(...direction), root.length, spec.trunk.rootWidth, 2, root.birth);
            branch.root = root;
            return branch;
        });
        const rootMesh = instancedParts(own(unitStem(0.35, 5)), swaying({ color: colors.root }), roots.length);

        const knob = new THREE.Mesh(own(new THREE.IcosahedronGeometry(1, 1)), swaying({ color: colors.sheath }));

        // Midrib pieces narrow by the same share each, so one piece's top meets the next one's base.
        const frondCount = plan.fronds.length;
        const perFrond = spec.leaflets.perSide * 2;
        const midribPiece = unitStem(Math.pow(spec.fronds.midribTip, 1 / MIDRIB_SEGMENTS_3D), 5);
        const midribMesh = instancedParts(own(midribPiece), swaying({ color: white, roughness: 0.8 }), frondCount * MIDRIB_SEGMENTS_3D);
        const leafletMesh = instancedParts(own(leafletGeometry(spec)), swaying({ color: white, roughness: 0.75, side: THREE.DoubleSide }, true), frondCount * perFrond);

        const strandCount = plan.bunches.reduce((sum, bunch) => sum + 1 + bunch.spikelets.length, 0);
        const nutCount = plan.bunches.reduce((sum, bunch) => sum + bunch.nuts.length, 0);
        const strandMesh = instancedParts(own(unitStem(0.6, 5)), swaying({ color: white, roughness: 0.8 }), strandCount);
        const nutMesh = instancedParts(own(new THREE.IcosahedronGeometry(1, 1)), swaying({ color: white, roughness: 0.55 }), nutCount);

        const meshes = [ground, sand, seed, trunkMesh, rootMesh, knob, midribMesh, leafletMesh, strandMesh, nutMesh];
        meshes.filter($_ => $_.isInstancedMesh).forEach($_ => own($_));
        const group = new THREE.Group();
        group.add(...meshes);
        this.stage.scene.add(group);
        this.scene3D = {
            group, owned, sand, sandColors, seed, rings, trunkMesh, roots, rootMesh, knob, midribMesh, leafletMesh, strandMesh, nutMesh,
            shade: new THREE.Color(colors.shade),
            midrib: new Float32Array((MIDRIB_SEGMENTS_3D + 1) * MIDRIB_FLOATS),
        };
    }

    update3D(growth) {
        const crown = crownAt(this.plan, this.spec, growth);
        const { wind } = this.spec;
        this.wind.palmCrown.value.set(...crown.apex);
        this.wind.palmSway.value = wind.sway;
        this.wind.palmBob.value = wind.bob;
        this.wind.palmFlutter.value = wind.flutter;
        this.updateSand3D(crown, growth);
        this.updateSeed3D(crown, growth);
        this.updateTrunk3D(crown, growth);
        this.updateFronds3D(crown, growth);
        this.updateBunches3D(crown, growth);
    }

    /** Paints the crown's soft shade under it, and a little round the foot of the trunk as its base swells. */
    updateSand3D(crown, growth) {
        const { sand, sandColors, shade } = this.scene3D;
        const S = this.spec.shade;
        const positions = sand.geometry.attributes.position.array;
        const colors = sand.geometry.attributes.color;
        const { strength, reach } = crownShade(this.spec, crown, growth);
        const foot = S.foot * crown.girth * smooth(ramp(growth, S.from, S.to));
        const shadeColor = [shade.r, shade.g, shade.b];
        const [cx, , cz] = crown.apex;
        for (let index = 0; index < colors.count; index++) {
            const x = positions[index * 3];
            const z = positions[index * 3 + 2];
            const under = 1 - smooth(clamp01(Math.hypot(x - cx, z - cz) / reach));
            const nearFoot = 1 - smooth(clamp01(Math.hypot(x, z) / S.footReach));
            const darken = Math.min(1, strength * under + foot * nearFoot);
            shadeColor.forEach((channel, rgbIndex) => {
                const at = index * 3 + rgbIndex;
                colors.array[at] = lerp(sandColors[at], channel, darken);
            });
        }
        colors.needsUpdate = true;
    }

    updateSeed3D(crown, growth) {
        const { seed } = this.scene3D;
        const pose = seedPose(this.plan, this.spec, crown, growth);
        seed.visible = Boolean(pose);
        if (!pose) return;
        const N = this.spec.nut;
        seed.position.set(...pose.centre);
        seed.scale.set(N.length / 2, N.width / 2, N.width / 2 * N.depth);
        // Long axis along its direction, its far end dipping a little: the sprouting end (towards the palm) is lifted.
        seed.rotation.set(0, Math.atan2(-pose.direction[1], pose.direction[0]), -0.12);
        setColor(seed.material.color, huskColor(this.rgb, pose));
    }

    updateTrunk3D(crown, growth) {
        const { rings, trunkMesh, roots, rootMesh, knob } = this.scene3D;
        const T = this.spec.trunk;
        const spacing = ringSpacing(T);
        placeBranches3D(trunkMesh, rings,
            ring => clamp01((crown.height - ring.distance) / spacing),
            ring => trunkRadiusAt(T, ring.distance + spacing / 2) * crown.girth);
        placeBranches3D(rootMesh, roots, root => rootProgress(root.root, T, growth), root => root.width / 2 * (0.4 + 0.6 * crown.girth));
        // The leaf bases round the growing point: green on a seedling, brown fibre on a grown palm.
        const { centre, along, across } = knobOf(crown);
        knob.position.set(...centre);
        knob.quaternion.setFromUnitVectors(UP, segmentDirection.set(...crown.axis));
        knob.scale.set(across, along, across);
        setColor(knob.material.color, knobColor(this.rgb, crown));
    }

    updateFronds3D(crown, growth) {
        const { spec, plan } = this;
        const F = spec.fronds;
        const { midribMesh, leafletMesh, midrib } = this.scene3D;
        const perFrond = spec.leaflets.perSide * 2;
        const leafletColors = leafletMesh.instanceColor.array;
        const midribColors = midribMesh.instanceColor.array;
        const leaf = new THREE.Color();
        const rib = new THREE.Color();
        plan.fronds.forEach((frond, frondIndex) => {
            const firstLeaflet = frondIndex * perFrond;
            const firstSegment = frondIndex * MIDRIB_SEGMENTS_3D;
            const pose = frondPose(frond, crown, spec, growth, frond.azimuth);
            if (!pose) {
                hideInstances(leafletMesh, firstLeaflet, firstLeaflet + perFrond);
                hideInstances(midribMesh, firstSegment, firstSegment + MIDRIB_SEGMENTS_3D);
                return;
            }
            traceMidrib(pose, spec, MIDRIB_SEGMENTS_3D, midrib);

            const colors = frondColors(frond, pose, this.rgb, F.ribTint);
            setColor(leaf, colors.leaf);
            setColor(rib, colors.rib);

            const thick = midribRadius(pose, spec);
            for (let k = 0; k < MIDRIB_SEGMENTS_3D; k++) {
                const at = k * MIDRIB_FLOATS;
                segmentStart.set(midrib[at], midrib[at + 1], midrib[at + 2]);
                const next = at + MIDRIB_FLOATS;
                segmentEnd.set(midrib[next], midrib[next + 1], midrib[next + 2]);
                // A little longer than the gap, so the joints don't open on the bend.
                segmentEnd.sub(segmentStart).multiplyScalar(1.08).add(segmentStart);
                const radius = thick * midribTaper(F, k / MIDRIB_SEGMENTS_3D) * (k === 0 ? F.clasp : 1);
                placeStem(midribMesh, firstSegment + k, segmentStart, segmentEnd, Math.max(0.0004, radius));
                midribColors.set([rib.r, rib.g, rib.b], (firstSegment + k) * 3);
            }

            // Leaflets vary in shade a little, except on a simple blade, where they overlap and would flicker.
            const variety = 0.16 * frond.form;
            forEachLeaflet(frond, pose, midrib, MIDRIB_SEGMENTS_3D, spec, (index, frame, length, width, droop) => {
                const instance = firstLeaflet + index;
                placeLeaflet(leafletMesh, instance, frame, length, length * droop, width);
                const shade = 1 + frond.jitter[index * LEAFLET_JITTERS + 3] * variety;
                leafletColors[instance * 3] = leaf.r * shade;
                leafletColors[instance * 3 + 1] = leaf.g * shade;
                leafletColors[instance * 3 + 2] = leaf.b * shade;
            });
        });
        dummy.quaternion.identity();
        [midribMesh, leafletMesh].forEach(mesh => {
            mesh.instanceMatrix.needsUpdate = true;
            mesh.instanceColor.needsUpdate = true;
        });
    }

    updateBunches3D(crown, growth) {
        const { spec, plan } = this;
        const { strandMesh, nutMesh } = this.scene3D;
        const fruit = spec.fruit;
        const strandColors = strandMesh.instanceColor.array;
        const nutColors = nutMesh.instanceColor.array;
        const stalk = setColor(new THREE.Color(), stalkColor(this.rgb));
        const strand = new THREE.Color();
        const ripening = new THREE.Color();
        let strandIndex = 0;
        let nutIndex = 0;
        plan.bunches.forEach(bunch => {
            const strands = 1 + bunch.spikelets.length;
            const pose = bunchPose(bunch, crown, spec, growth, bunch.azimuth);
            if (!pose) {
                hideInstances(strandMesh, strandIndex, strandIndex + strands);
                hideInstances(nutMesh, nutIndex, nutIndex + bunch.nuts.length);
                strandIndex += strands;
                nutIndex += bunch.nuts.length;
                return;
            }
            segmentStart.set(...pose.base);
            segmentEnd.set(...pose.end);
            placeStem(strandMesh, strandIndex, segmentStart, segmentEnd, 0.005 * pose.spike);
            strandColors.set([stalk.r, stalk.g, stalk.b], strandIndex * 3);
            strandIndex++;
            setColor(strand, strandColor(this.rgb, pose));
            bunch.spikelets.forEach(spikelet => {
                const direction = splay(pose.direction, spikelet.tilt, spikelet.around);
                segmentStart.set(...pose.end);
                segmentEnd.copy(segmentStart).addScaledVector(direction, fruit.spikeletLength * spikelet.length * pose.spike);
                placeStem(strandMesh, strandIndex, segmentStart, segmentEnd, 0.0022 * pose.spike + 0.0002);
                strandColors.set([strand.r, strand.g, strand.b], strandIndex * 3);
                strandIndex++;
            });
            bunch.nuts.forEach(nut => {
                const placed = nutPlacement(pose, nut, spec);
                dummy.position.set(...placed.centre);
                dummy.quaternion.setFromUnitVectors(UP, segmentDirection.set(...placed.out).addScaledVector(pose.direction, 0.6).normalize());
                dummy.scale.set(placed.radius, placed.radius * 1.15, placed.radius).addScalar(0.00001);
                dummy.updateMatrix();
                nutMesh.setMatrixAt(nutIndex, dummy.matrix);
                setColor(ripening, nutColor(this.rgb, placed.ripe));
                nutColors.set([ripening.r, ripening.g, ripening.b], nutIndex * 3);
                nutIndex++;
            });
        });
        dummy.quaternion.identity();
        [strandMesh, nutMesh].forEach(mesh => {
            mesh.instanceMatrix.needsUpdate = true;
            mesh.instanceColor.needsUpdate = true;
        });
    }
}

registerView(new PalmView());
}

// ===== sunflower =====
{
// ═══════════════════════════ Sunflower ═══════════════════════════
// Helianthus annuus, from seed to a nodding head. The disc follows Vogel's model of phyllotaxis: floret n sits at radius c·√n
// and angle n × the golden angle (137.508°), which packs the florets evenly and draws the interlocking 34 and 55 spirals.
// One plant model (florets, petals, bracts, nodes and leaves) feeds both views; each view draws it with its own geometry.

const SUNFLOWER = {
    seed: 11,
    // Stem
    height: 0.84,             // soil to the back of the head, once grown
    hypocotyl: 0.07,          // soil to the seed leaves: the first bit of stem out of the ground
    peduncle: 2.2,            // the bare stalk under the head, against an average internode
    stemRadius: 0.019,        // at the soil, once grown
    stemTaper: 0.5,           // radius just under the head, as a share of the base
    sway: 0.06,               // radians of seeded wander along the stem
    hook: 2.5,                // radians the seedling's hook is bent as it breaks the soil
    neck: 0.3,                // radians the top of the stem leans as the head turns to the viewer
    nod: 0.42,                // …and leans further as the ripening head grows heavy
    bristles: 90,             // stiff hairs along the stem (2D)
    hairsIn: [0.1, 0.33],     // growth after sprouting over which the hairs come in
    // Leaves
    leaves: 10,               // true leaves: opposite pairs first, then one at a time, each the golden angle round
    pairs: 2,                 // how many opposite pairs before the leaves start to spiral
    leafLength: 0.2,          // blade length of the biggest leaf
    leafWidth: 0.88,          // blade width as a share of its length
    petiole: 0.75,            // leaf stalk as a share of the blade: sunflower leaves hang on long stalks
    teeth: 9,                 // serrations along each side of a blade (0: a smooth margin)
    leafDroop: 0.32,          // how far a grown blade's tip hangs, as a share of its length
    leafHang: [-0.6, -0.15],  // radians a grown blade points above the horizontal: lowest leaf, top leaf
    leafRoll: 0.25,           // radians a blade is tipped about its midrib to face the light, the way the head faces (3D)
    leafLobe: 0.2,            // how far the heart's two lobes reach back past the stalk, as a share of the blade
    cotyledon: 0.06,          // length of each of the two seed leaves
    seedLeavesFade: [0.33, 0.62], // the seed leaves start to yellow, and have shrivelled away by…
    // Head
    discRadius: 0.13,         // radius of the disc of florets, once open
    florets: 580,             // disc florets: about 580 make 34 and 55 the spirals you see at the rim
    goldenAngle: 137.508,     // degrees between one floret and the next
    floretSize: 0.8,          // floret radius as a share of Vogel's spacing c (0.95 would touch)
    discDome: 0.14,           // how much the disc bulges, as a share of its radius
    headDepth: 0.36,          // the green back of the head, as a share of the disc radius
    budSize: 0.5,             // the closed bud, as a share of the open head
    budDepth: 2.4,            // the bud is rounder: its depth stretched by this much, easing to 1 as it opens
    faceTurn: 0.32,           // radians the open head is turned from the viewer: a three-quarter view
    bloomPitch: 0.2,          // radians the open face looks up…
    nodPitch: -0.36,          // …and down, once the seeds are heavy
    rays: 34,                 // ray petals: they carry on the disc's spiral just past the rim
    petalLength: 0.125,       // an average ray petal, once grown
    petalWidth: 0.3,          // as a share of the petal's length
    petalFold: -0.15,         // radians a petal leans in while folded in the bud (0 points straight out of the face), a short crown…
    petalBudLength: 0.35,     // …this share of its full length, lengthening as it unfolds…
    petalOpen: 1.66,          // …to lie back once open (π/2 is flat)
    petalCurl: 0.12,          // how far a petal curls back towards its tip, as a share of its length
    bracts: 34,               // green bracts round the back of the head
    bractLength: 0.06,        // an average bract on the open head
    budBracts: 1.1,           // bracts on the bud are this much longer against the head: the head swells past them as it opens
    bractBud: [-0.3, 0.9],    // radians the bracts stand out from the bud's axis: innermost (arching in over it), outermost
    bractOpen: [1.5, 2.15],   // …and once the head is open, folded back behind the petals
    bractCurl: 0.35,          // how far a bract's tip curls out, as a share of its length
    ripen: 0.12,              // growth a floret takes to go from pollen gold to a brown seed…
    ripeSpan: 2.4,            // …and, in multiples of that, to a ripe one: long enough that a brown-to-gold gradient remains at fruition
    // Growth arc: when each part starts and ends, as a share of growth
    sprout: 0.02,             // the hook breaks the soil
    hypocotylGrow: 0.09,      // growth the first bit of stem takes to reach full length
    leavesFrom: 0.07,         // the first true leaves appear…
    leavesTo: 0.45,           // …and the last one
    leafGrow: 0.15,           // growth a leaf takes to reach full size
    internodeGrow: 0.17,      // growth a stretch of stem takes to reach full length
    budFrom: 0.25,            // the bud shows at the top
    turnFrom: 0.5,            // the bud turns from the sky to face the viewer…
    turnTo: 0.66,
    openFrom: 0.55,           // the bracts part and the petals push out…
    petalsTo: 0.8,            // …and lie spread by here
    floretsFrom: 0.77,        // disc florets open from the rim…
    floretsTo: 0.975,         // …to the centre, which is still gold with pollen at full bloom
    nodFrom: 0.78,            // the head starts to nod as the seeds fill
    colors: {
        stem: '#5e8f30',         // the stem and leaf stalks
        stemShade: '#3b6620',    // the stem's shaded side (2D)
        stemLight: '#9cc46a',    // its lit side (2D)
        bristle: '#d6e6b4',      // the stem's hairs
        leaf: ['#3f7f2c', '#4a8b33', '#44852e'],   // one picked per leaf
        leafShade: '#2a5a1d',    // the blade's half away from the light (2D)
        vein: '#9dc76c',         // midrib and veins
        cotyledon: '#7cb04a',    // the seed leaves…
        withered: '#c9b45a',     // …as they shrivel
        bract: '#4f8629',        // the green bracts round the head
        receptacle: '#4c7f27',   // the head's green back…
        receptacleShade: '#2f5a1a', // …in shade
        petal: ['#f7c41d', '#fbd03a', '#f3b614', '#f9c82a', '#fcd84a'],   // one picked per ray petal
        petalBase: '#d9840c',    // a petal deepens towards this at its base
        petalBack: '#c7b445',    // the paler underside of a petal
        floretClosed: '#86a83a', // a disc floret still closed…
        pollen: '#f6bd2c',       // …open and dusted with pollen…
        seed: '#85532a',         // …a filling seed…
        ripe: '#6b4526',         // …and a ripe one
        glint: '#fff0c8',        // the light catching each floret (2D)
        discYoung: '#56631f',    // between the closed florets of a young head…
        disc: '#0e0804',         // …and between the seeds
        soil: '#4c3726',         // the mound…
        soilDark: '#2c1f15',     // …its shaded skirt, and the darker clods…
        soilLight: '#71553b',    // …its lit top, and the lighter clods
        ground: '#12161f',       // the floor round the mound (3D)
    },
    petalGlow: 0.38,          // how strongly petals glow in their own colour, so they stay golden on the side away from the sun (3D)
    bladeGlow: 0.2,           // how strongly leaves and bracts glow in the leaves' green, so blades seen edge on don't go black (3D)
    soilRadius: 0.35,         // the patch of soil the plant stands in
    clods: 22,                // lumps of soil on the mound
};

const STEM_STEPS = 30;        // straight pieces along the stem, in both views
/** How far growth is through [from, to], 0–1; a window of zero width is a step at `to`, not 0 / 0. */
const progressIn = (growth, from, to) => (to > from ? clamp01((growth - from) / (to - from)) : growth >= to ? 1 : 0);
const ramp = (growth, from, to) => smooth(progressIn(growth, from, to));
const lerp = (from, to, t) => from + (to - from) * t;

// ─── Shapes shared by both views: blades as rows of { y, half, midY } from base (y = 0) to tip (y = 1) ───
// half is the half-width at y; midY is where the midrib is on that row (behind the stalk the heart's lobes have none).

/** A ray petal: narrow at the base, widest a third of the way out, a blunt tip. Width 1. */
function petalRows() {
    const rows = Array.from({ length: 8 }, (_, index) => {
        const y = index / 8;
        return { y, half: 0.5 * Math.pow(Math.sin(Math.PI * (0.1 + 0.82 * y)), 0.8), midY: y };
    });
    return [...rows, { y: 0.97, half: 0.16, midY: 0.97 }, { y: 1, half: 0, midY: 1 }];
}

/** An involucral bract: a broad base drawn out into a long point. Width 1. */
const bractRows = () => Array.from({ length: 7 }, (_, index) => {
    const y = index / 6;
    return { y, half: 0.5 * Math.pow(Math.sin(Math.PI * (0.5 + 0.5 * y)), 1.5), midY: y };
});

/** A seed leaf: a plain oval. Width 1. */
const cotyledonRows = () => Array.from({ length: 7 }, (_, index) => {
    const y = index / 6;
    return { y, half: 0.5 * Math.pow(Math.sin(Math.PI * y), 0.75), midY: y };
});

/** The true leaf's outline: half its width at y, 0 at the bottom of the lobes and at the tip, 1 where it is widest. */
const LEAF_WIDEST = 0.3;
function leafHalfWidth(spec, y) {
    const lobe = -spec.leafLobe;
    return y < LEAF_WIDEST
        ? Math.pow(Math.sin(Math.PI / 2 * clamp01((y - lobe) / (LEAF_WIDEST - lobe))), 0.55)
        : Math.pow(Math.cos(Math.PI / 2 * clamp01((y - LEAF_WIDEST) / (1 - LEAF_WIDEST))), 1.2);
}

/** A true leaf: heart-shaped, the two lobes reaching back past the stalk, then tapering to a point, toothed along the margin. Width 1. */
function leafRows(spec) {
    const toothed = spec.teeth > 0;
    // A smooth leaf still needs points along its margin.
    const count = (toothed ? spec.teeth : 9) * 2 + 1;
    const margin = Array.from({ length: count }, (_, index) => {
        const t = index / (count - 1);
        const y = lerp(0.02 - spec.leafLobe, 1, Math.pow(t, 0.92));
        // Every other point pushed out is a tooth; they fade out towards the lobes and the tip.
        const tooth = toothed && index % 2 === 1 ? 0.05 * Math.sin(Math.PI * t) : 0;
        return { y, half: index === count - 1 ? 0 : 0.5 * (leafHalfWidth(spec, y) + tooth), midY: Math.max(0, y) };
    });
    return [{ y: 0, half: 0, midY: 0 }, { y: -spec.leafLobe, half: 0.06, midY: 0 }, ...margin];
}

// ─── The plant: every part placed once from the seed; growth only decides how far along each part is ───

function buildPlant(spec) {
    const rand = mulberry32(spec.seed);
    const golden = spec.goldenAngle * Math.PI / 180;
    const side = rand() < 0.5 ? -1 : 1;   // which way the face is turned (and the 2D drawing bends)

    // Disc florets by Vogel's model; the outermost sits on the rim, which fixes c.
    const c = spec.discRadius / Math.sqrt(spec.florets);
    const florets = Array.from({ length: spec.florets }, (_, n) => {
        const radius = c * Math.sqrt(n + 0.5);
        const share = Math.min(1, radius / spec.discRadius);
        return {
            n,
            angle: n * golden,
            x: Math.cos(n * golden) * radius,
            y: Math.sin(n * golden) * radius,
            // A ring at a time from the rim inwards, the front moving at an even pace across the radius.
            opens: lerp(spec.floretsFrom, spec.floretsTo, 1 - share) + (rand() - 0.5) * 0.01,
            shade: 0.86 + rand() * 0.28,
        };
    });

    // Petals and bracts carry on the same spiral past the rim, which spaces them evenly and staggers them in rows by itself.
    const petals = Array.from({ length: spec.rays }, (_, index) => {
        const n = spec.florets + index;
        return {
            angle: n * golden,
            radius: c * Math.sqrt(n),
            // Later ones sit a little further back and spread a little more, so neighbours overlap instead of clipping.
            layer: index / Math.max(1, spec.rays - 1),
            length: spec.petalLength * (0.88 + rand() * 0.24),
            width: spec.petalLength * spec.petalWidth * (0.88 + rand() * 0.24),
            twist: (rand() - 0.5) * 0.4,
            droop: (rand() - 0.5) * 0.2,
            lag: rand(),
            color: pick(rand, spec.colors.petal),
        };
    });
    const bracts = Array.from({ length: spec.bracts }, (_, index) => {
        const n = spec.florets + spec.rays + index;
        return {
            angle: n * golden,
            radius: c * Math.sqrt(n),
            layer: index / Math.max(1, spec.bracts - 1),
            length: spec.bractLength * (0.85 + rand() * 0.3),
            width: spec.bractLength * (0.7 + rand() * 0.2),
            twist: (rand() - 0.5) * 0.5,
            lag: rand(),
        };
    });

    // Nodes up the stem: opposite pairs first, each pair square to the one below, then single leaves the golden angle apart.
    const cotyledonAzimuth = rand() * TAU;
    const nodes = [];
    let azimuth = cotyledonAzimuth;
    let leavesLeft = spec.leaves;
    while (leavesLeft > 0) {
        const paired = nodes.length < spec.pairs && leavesLeft >= 2;
        azimuth += paired || nodes.length === 0 ? Math.PI / 2 : golden;
        nodes.push({ azimuth, count: paired ? 2 : 1 });
        leavesLeft -= paired ? 2 : 1;
    }
    // Internodes are short at the bottom, longest in the middle; the peduncle under the head is longer still.
    const weights = nodes.map((_, index) => 0.35 + Math.sin(Math.PI * (0.08 + 0.8 * index / Math.max(1, nodes.length - 1))));
    const totalWeight = weights.reduce((sum, weight) => sum + weight, 0) + spec.peduncle;
    const perWeight = (spec.height - spec.hypocotyl) / totalWeight;
    const leaves = [];
    nodes.forEach((node, index) => {
        const t = index / Math.max(1, nodes.length - 1);   // 0 at the bottom, 1 at the top
        node.born = lerp(spec.leavesFrom, spec.leavesTo, t) + (rand() - 0.5) * 0.01;
        node.internode = weights[index] * perWeight;
        // The middle leaves are the biggest; the first ones and the top ones under the head are small.
        const size = spec.leafLength * (0.45 + 0.55 * Math.sin(Math.PI * Math.pow(t, 0.8)));
        for (let $_ = 0; $_ < node.count; $_++) {
            leaves.push({
                node: index,
                azimuth: node.azimuth + $_ * Math.PI + (rand() - 0.5) * 0.25,
                size: size * (0.92 + rand() * 0.16),
                born: node.born + $_ * 0.006,
                // Grown leaves: the low ones hang below the horizontal, the high ones stay a little above it.
                elevation: lerp(spec.leafHang[0], spec.leafHang[1], t) + (rand() - 0.5) * 0.18,
                droop: spec.leafDroop * (0.75 + rand() * 0.5) * lerp(1.2, 0.6, t),
                wobble: rand() * 2 - 1,
                color: pick(rand, spec.colors.leaf),
            });
        }
    });

    // Turn the whole plant about its stem so that the top leaves don't stand in front of the face.
    const yaw = spec.faceTurn * side;          // the head's turn about the stem, away from facing the viewer (+z)
    const faceAzimuth = Math.PI / 2 - yaw;     // the same direction as an azimuth (cos, 0, sin), the way bends and leaves count
    const apart = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
    const topLeaves = leaves.slice(-3);
    const clearance = spin => Math.min(...topLeaves.map(leaf => apart(leaf.azimuth + spin, faceAzimuth)));
    const spin = Array.from({ length: 36 }, (_, index) => index / 36 * TAU)
        .reduce((best, candidate) => (clearance(candidate) > clearance(best) ? candidate : best));
    leaves.forEach(leaf => {
        leaf.azimuth += spin;
        // Blades tip their upper faces towards the light, which the head faces too: sin() is how far the face is to the blade's side.
        leaf.roll = spec.leafRoll * (0.75 * Math.sin(faceAzimuth - leaf.azimuth) + 0.25 * leaf.wobble);
    });

    return {
        florets, petals, bracts, nodes, leaves, c, side, yaw, faceAzimuth,
        cotyledonAzimuth: cotyledonAzimuth + spin,
        peduncle: spec.peduncle * perWeight,
        swayPhase: rand() * TAU,
        swayAzimuth: rand() * TAU,
        // The hook bends square to the seed leaves, which come up pressed together and open sideways.
        hookAzimuth: cotyledonAzimuth + spin + Math.PI / 2,
    };
}

/** The spiral counts you see at the rim: how many steps along Vogel's sequence each outer floret's nearest neighbours are. */
function visibleSpirals(florets) {
    const outer = florets.slice(-Math.min(florets.length, 320));
    const tally = new Map();
    outer.slice(-40).forEach(floret => {
        outer
            .filter(other => other !== floret)
            .map(other => ({ step: Math.abs(other.n - floret.n), distance: Math.hypot(other.x - floret.x, other.y - floret.y) }))
            .sort((a, b) => a.distance - b.distance)
            .slice(0, 4)
            .forEach(({ step }) => tally.set(step, (tally.get(step) ?? 0) + 1));
    });
    return [...tally.entries()].sort((a, b) => b[1] - a[1]).slice(0, 2).map(([step]) => step).sort((a, b) => a - b);
}

// ─── Growth: where every part is at a given growth (both views) ───

/** The seedling breaks the soil bent over in a hook, which pulls the seed leaves out backwards, then straightens. */
const hookAt = (spec, growth) => spec.hook * (1 - ramp(growth, spec.sprout + 0.012, spec.sprout + 0.06));
/** The top of the stem leans the way the face looks: a little as the head turns, more as the seeds grow heavy. */
const neckAt = (spec, growth) => spec.neck * ramp(growth, spec.turnFrom, spec.turnTo) + spec.nod * ramp(growth, spec.nodFrom, 1);
/** The stem keeps thickening until the head has opened. */
const stemThicknessAt = (spec, growth) => 0.28 + 0.72 * ramp(growth, spec.sprout, spec.petalsTo - 0.1);

/** How big the head is: a small bud first, then it swells as it opens. */
function headSizeAt(spec, growth) {
    const bud = easeOut(progressIn(growth, spec.budFrom, spec.openFrom));
    const open = ramp(growth, spec.openFrom, spec.petalsTo - 0.04);
    return spec.budSize * bud + (1 - spec.budSize) * open;
}

/** How much deeper than the open head the bud is: a rounded bud flattens into a broad head as it opens. */
const headStretchAt = (spec, growth) => lerp(spec.budDepth, 1, ramp(growth, spec.openFrom - 0.02, spec.openFrom + 0.12));

/** The face's elevation: to the sky as a bud, turned to the viewer as it opens, dipping as the seeds fill. */
function headPitchAt(spec, growth) {
    const turned = lerp(Math.PI / 2, spec.bloomPitch, ramp(growth, spec.turnFrom, spec.turnTo));
    return lerp(turned, spec.nodPitch, ramp(growth, spec.nodFrom, 1));
}

const headEuler = new THREE.Euler(0, 0, 0, 'YXZ');
/** The head's turn: its local z is where the face points, its local y the face's "up"; `yaw` swings it round the stem. */
const headQuaternion = (spec, growth, yaw, target) => target.setFromEuler(headEuler.set(-headPitchAt(spec, growth), yaw, 0, 'YXZ'));

/** A floret's weights: open (a closed bud becomes a fresh floret dusted with pollen), brown (a filling seed), dark (ripe). */
const floretStage = (spec, floret, growth) => ({
    open: ramp(growth, floret.opens - 0.012, floret.opens + 0.012),
    brown: ramp(growth, floret.opens + 0.008, floret.opens + spec.ripen),
    dark: ramp(growth, floret.opens + spec.ripen * 0.6, floret.opens + spec.ripen * spec.ripeSpan),
});
/** A floret's width as a share of its full size: closed buds pack tight, seeds shrink a little so the spirals open up. */
const floretWidth = stage => lerp(0.9, 1, stage.open) - 0.14 * stage.brown;
/** The colour between the florets: young green, darkening once the first florets open. */
const discDarkness = (spec, growth) => ramp(growth, spec.floretsFrom - 0.02, spec.floretsFrom + 0.08);

/**
 * How far a petal has pushed out (0–1), and its spread: 0 points straight out of the face, π/2 lies flat, more bends back.
 * As the bracts part the petals push out short and nearly upright, a gold crown round the disc, then lengthen as they unfold.
 */
function petalStage(spec, petal, growth) {
    const start = spec.openFrom - 0.04 + petal.lag * 0.03;
    const unfold = ramp(growth, spec.openFrom + 0.04 + petal.layer * 0.03 + petal.lag * 0.02, spec.petalsTo - 0.04 + petal.lag * 0.04);
    return {
        // Short while they stand round the rim, full length once spread.
        length: ramp(growth, start, start + 0.06) * lerp(spec.petalBudLength, 1, unfold),
        spread: lerp(spec.petalFold, spec.petalOpen + petal.droop + petal.layer * 0.12, unfold),
    };
}

/**
 * A bract's spread and its size against the head. On the bud the inner ones arch in over it, closing it, and the outer ones flare
 * a little; as it opens they all fold back, the inner ones staying near the petals. They hardly grow, while the head swells past them.
 */
function bractStage(spec, bract, growth) {
    const open = ramp(growth, spec.openFrom - 0.03 + bract.lag * 0.03, spec.openFrom + 0.11 + bract.lag * 0.04);
    return {
        spread: lerp(lerp(spec.bractBud[0], spec.bractBud[1], bract.layer), lerp(spec.bractOpen[0], spec.bractOpen[1], bract.layer), open),
        size: lerp(spec.budBracts, 1, open),
    };
}

/** Where on the head a ray petal or a bract sits, in head units (the face looks along +z, the disc's surface is at z = depth). */
const petalSeat = (spec, petal) => ({ radius: petal.radius * 0.97, w: spec.discRadius * (spec.headDepth - 0.01 - 0.05 * petal.layer) });
function bractSeat(spec, bract) {
    const depth = spec.discRadius * spec.headDepth;
    // Inner bracts just under the rim, outer ones further down the green back, on its surface.
    const w = depth * (0.85 - 0.6 * bract.layer);
    return { radius: bract.radius * Math.sqrt(Math.max(0, 1 - ((depth - w) / depth) ** 2)), w };
}

/**
 * A petal's or bract's frame on the head: its base, the way it runs (along), its width (across) and its back. It stands on the rim
 * at `angle`, tipped out from the face by `spread` and twisted about its own length by `twist`.
 */
function rimFrame(angle, radius, w, spread, twist) {
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    const along = [Math.sin(spread) * cos, Math.sin(spread) * sin, Math.cos(spread)];
    const across = [-sin, cos, 0];
    const back = [Math.cos(spread) * cos, Math.cos(spread) * sin, -Math.sin(spread)];
    const twistCos = Math.cos(twist);
    const twistSin = Math.sin(twist);
    return {
        base: [radius * cos, radius * sin, w],
        along,
        across: across.map((value, index) => value * twistCos + back[index] * twistSin),
        back: back.map((value, index) => value * twistCos - across[index] * twistSin),
    };
}

/** A point on a rim part, in head units: x across its width, y along its length, curled back by `curl` towards the tip. */
const onRimPart = (frame, x, y, width, length, curl) => frame.base.map((value, index) =>
    value + frame.across[index] * x * width + frame.along[index] * y * length + frame.back[index] * curl * y * y * length);

// ─── The stem: the same centreline in both views, bent in 3D or in the picture's plane ───

const bendAxis = new THREE.Vector3();
/** Turns `dir` towards the horizontal direction at `azimuth` (cos, 0, sin) by `angle`, in the upright plane through it. */
function bendTowards(dir, azimuth, angle) {
    if (angle === 0) return;
    bendAxis.set(Math.sin(azimuth), 0, -Math.cos(azimuth));
    dir.applyAxisAngle(bendAxis, angle);
}

/**
 * The stem at this growth: its centreline from the soil up in STEM_STEPS straight pieces, its radius along the way, and how far
 * up each node has been carried. Each internode stretches once its leaves have appeared, so new leaves always start at the tip.
 * bends: the azimuths that the wander, the seedling's hook and the neck lean towards.
 */
function stemAt(plant, spec, growth, bends) {
    const hypocotyl = spec.hypocotyl * easeOut(progressIn(growth, spec.sprout, spec.sprout + spec.hypocotylGrow));
    let reach = hypocotyl;
    const nodeAt = plant.nodes.map(node => {
        reach += node.internode * ramp(growth, node.born, node.born + spec.internodeGrow);
        return reach;
    });
    const length = reach + plant.peduncle * ramp(growth, spec.leavesTo - 0.05, spec.leavesTo + 0.17);
    const step = length / STEM_STEPS;

    // Each bend is spread over its own stretch of stem: weights per piece that add up to 1.
    const middles = Array.from({ length: STEM_STEPS }, (_, index) => (index + 0.5) * step);
    const normalised = list => {
        const sum = list.reduce((total, value) => total + value, 0);
        return list.map(value => (sum > 0 ? value / sum : 0));
    };
    const hookSpan = Math.max(step, Math.min(length, 0.035));
    const hookWeights = normalised(middles.map(s => Math.max(0, s - (length - hookSpan)) / hookSpan));
    const neckWeights = normalised(middles.map(s => Math.pow(Math.max(0, (s / Math.max(length, 1e-6) - 0.55) / 0.45), 1.5)));
    const hook = hookAt(spec, growth);
    const neck = neckAt(spec, growth);
    // The wander is fixed along the stem's length, so the lower stem keeps its shape while the top grows.
    const swayAngle = s => spec.sway * (Math.sin(plant.swayPhase + TAU * 1.1 * s / spec.height) - Math.sin(plant.swayPhase));

    const radius = spec.stemRadius * stemThicknessAt(spec, growth);
    const points = [new THREE.Vector3(0, 0, 0)];
    const dirs = [];
    const radii = [radius];
    const dir = UP.clone();
    for (let index = 0; index < STEM_STEPS; index++) {
        bendTowards(dir, bends.sway, swayAngle((index + 1) * step) - swayAngle(index * step));
        bendTowards(dir, bends.hook, hook * hookWeights[index]);
        bendTowards(dir, bends.neck, neck * neckWeights[index]);
        dirs.push(dir.clone());
        points.push(points[index].clone().addScaledVector(dir, step));
        radii.push(radius * lerp(1, spec.stemTaper, (index + 1) / STEM_STEPS));
    }
    return { points, dirs, radii, length, step, hypocotyl, nodeAt, tip: points[STEM_STEPS] };
}

/** The point, direction and radius at arclength s along the stem. */
function alongStem(stem, s) {
    const at = clamp01(stem.length > 0 ? s / stem.length : 0) * STEM_STEPS;
    const index = Math.min(STEM_STEPS - 1, Math.floor(at));
    const t = at - index;
    return {
        point: stem.points[index].clone().lerp(stem.points[index + 1], t),
        dir: stem.dirs[index],
        radius: lerp(stem.radii[index], stem.radii[index + 1], t),
    };
}

/** How grown a leaf is, and its blade's and stalk's elevation: young leaves point up, grown ones spread out and hang. */
function leafPose(spec, leaf, growth) {
    const mature = ramp(growth, leaf.born, leaf.born + spec.leafGrow * 1.4);
    return {
        grow: ramp(growth, leaf.born, leaf.born + spec.leafGrow),
        mature,
        elevation: lerp(1.2, leaf.elevation, mature),
        stalk: lerp(1.3, 0.8 + leaf.elevation * 0.5, mature),
    };
}

/** Seed leaves: they come up folded, open flat, then yellow and shrivel once the true leaves have taken over. */
function cotyledonSize(spec, growth) {
    const [fadeFrom, goneBy] = spec.seedLeavesFade;
    return spec.cotyledon * ramp(growth, spec.sprout, spec.sprout + 0.1) * (1 - ramp(growth, lerp(fadeFrom, goneBy, 0.3), goneBy));
}
const cotyledonSpread = (spec, growth) => lerp(0.12, 1.25, ramp(growth, spec.sprout + 0.03, spec.sprout + 0.1));
const cotyledonWither = (spec, growth) => ramp(growth, spec.seedLeavesFade[0], lerp(spec.seedLeavesFade[0], spec.seedLeavesFade[1], 0.75));

// ─── Sunflower in 2D ───

// Scene units the drawing must fit: the plant stands about 1.1 tall with the open head on top.
const FRAME_2D = { across: 1.25, up: 1.32, base: 0.14 };
const VEINS = [0.45, 0.65];   // where a leaf's fainter upper side veins leave the midrib, above the two strong basal ones

/** Things only the drawing needs: stiff hairs along the stem, clods on the soil. */
function buildDecor2D(spec) {
    const rand = mulberry32(spec.seed + 1);
    const bristles = Array.from({ length: spec.bristles }, () => ({
        at: rand(),
        side: rand() < 0.5 ? -1 : 1,
        length: 0.006 + rand() * 0.007,
        tilt: 0.5 + rand() * 0.5,     // radians the hair leans up the stem
    }));
    const clodColors = [spec.colors.soilLight, spec.colors.soilDark, spec.colors.soil];
    const soil = spec.soilRadius;
    const clods = Array.from({ length: spec.clods }, () => {
        const x = (rand() - 0.5) * 1.7 * soil;
        const room = Math.sqrt(Math.max(0, 1 - (x / (0.95 * soil)) ** 2));
        return { x, y: (rand() - 0.5) * 0.21 * soil * room, r: 0.005 + rand() * 0.009, color: pick(rand, clodColors) };
    });
    // Far ones first; none right where the stem comes up.
    return { bristles, clods: clods.filter(clod => Math.abs(clod.x) > 0.035).sort((a, b) => b.y - a.y) };
}

/** The convex hull of 2D points (monotone chain): the outline of the head's rounded green back from any side. */
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const chainOf = list => {
        const chain = [];
        list.forEach(point => {
            while (chain.length >= 2 && cross(chain[chain.length - 2], chain[chain.length - 1], point) <= 0) chain.pop();
            chain.push(point);
        });
        return chain.slice(0, -1);
    };
    return [...chainOf(sorted), ...chainOf([...sorted].reverse())];
}

/** Traces a blade's outline (rows from petalRows() and the like) through at(x, y), which maps blade units to pixels. */
function traceBlade(g, rows, at) {
    g.beginPath();
    rows.forEach(row => g.lineTo(...at(row.half, row.y)));
    for (let index = rows.length - 1; index >= 0; index--) g.lineTo(...at(-rows[index].half, rows[index].y));
    g.closePath();
}

/** Traces one half of a blade, out along the margin and back down the midrib: `side` 1 or -1. */
function traceHalfBlade(g, rows, at, side) {
    g.beginPath();
    rows.forEach(row => g.lineTo(...at(side * row.half, row.y)));
    for (let index = rows.length - 1; index >= 0; index--) g.lineTo(...at(0, rows[index].midY));
    g.closePath();
}

/** Blade units to pixels for a blade lying in the picture: from `base` along `angle`, its tip hanging down by `droop`. */
function flatBlade(base, angle, length, width, droop, sx, sy) {
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    return (x, y) => [
        sx(base[0] + cos * y * length - sin * x * width),
        sy(base[1] + sin * y * length + cos * x * width - droop * length * y * y),
    ];
}

function drawSoil2D(g, spec, decor, sx, sy, scale) {
    const colors = spec.colors;
    const radius = spec.soilRadius;
    // A low mound seen a little from above: its dark skirt, the lit top, then clods.
    g.fillStyle = colors.soilDark;
    g.beginPath();
    g.ellipse(sx(0), sy(-0.02), radius * 1.06 * scale, radius * 0.19 * scale, 0, 0, TAU);
    g.fill();
    const top = g.createRadialGradient(sx(-radius * 0.2), sy(0.012), 0, sx(0), sy(0), radius * 1.03 * scale);
    top.addColorStop(0, colors.soilLight);
    top.addColorStop(1, colors.soil);
    g.fillStyle = top;
    g.beginPath();
    g.ellipse(sx(0), sy(0), radius * scale, radius * 0.14 * scale, 0, 0, TAU);
    g.fill();
    decor.clods.forEach(clod => {
        g.fillStyle = clod.color;
        g.beginPath();
        g.ellipse(sx(clod.x), sy(clod.y), clod.r * scale, clod.r * 0.6 * scale, 0, 0, TAU);
        g.fill();
    });
}

function drawStem2D(g, spec, stem, decor, growth, sx, sy, scale) {
    if (stem.length < 1e-4) return;
    const { points, dirs, radii } = stem;
    const colors = spec.colors;
    // A point square to the stem (averaging the pieces either side), `share` of the radius out to the left (negative: right).
    const edge = (index, share) => {
        const before = dirs[Math.max(0, index - 1)];
        const after = dirs[Math.min(STEM_STEPS - 1, index)];
        const nx = -(before.y + after.y);
        const ny = before.x + after.x;
        const reach = radii[index] * share / (Math.hypot(nx, ny) || 1);
        return [sx(points[index].x + nx * reach), sy(points[index].y + ny * reach)];
    };
    const band = (from, to) => {
        g.beginPath();
        for (let index = 0; index <= STEM_STEPS; index++) g.lineTo(...edge(index, from));
        for (let index = STEM_STEPS; index >= 0; index--) g.lineTo(...edge(index, to));
        g.closePath();
        g.fill();
    };
    g.fillStyle = colors.stem;
    band(1, -1);
    // Light from the upper left: shade down the right side, a highlight down the left.
    g.globalAlpha = 0.6;
    g.fillStyle = colors.stemShade;
    band(-0.2, -1);
    g.globalAlpha = 0.45;
    g.fillStyle = colors.stemLight;
    band(0.75, 0.3);

    // Stiff hairs, leaning up the stem: they come with age, and only where the stem is thick enough to show them.
    const thickness = stemThicknessAt(spec, growth);
    const hairy = ramp(growth, spec.sprout + spec.hairsIn[0], spec.sprout + spec.hairsIn[1]);
    if (hairy <= 0) {
        g.globalAlpha = 1;
        return;
    }
    g.globalAlpha = 0.6 * hairy;
    g.strokeStyle = colors.bristle;
    g.lineWidth = 0.8;
    g.beginPath();
    decor.bristles.forEach(bristle => {
        const { point, dir, radius } = alongStem(stem, bristle.at * stem.length);
        if (radius * scale < 1.5) return;
        const nx = -dir.y * bristle.side;
        const ny = dir.x * bristle.side;
        const length = bristle.length * thickness;
        const ox = point.x + nx * radius * 0.9;
        const oy = point.y + ny * radius * 0.9;
        const outX = nx * Math.cos(bristle.tilt) + dir.x * Math.sin(bristle.tilt);
        const outY = ny * Math.cos(bristle.tilt) + dir.y * Math.sin(bristle.tilt);
        g.moveTo(sx(ox), sy(oy));
        g.lineTo(sx(ox + outX * length), sy(oy + outY * length));
    });
    g.stroke();
    g.globalAlpha = 1;
}

/** One true leaf: its stalk from the stem, then the blade, shaded below the midrib, with its veins. */
function drawLeaf2D(g, spec, leaf, stem, growth, rows, sx, sy, scale) {
    const pose = leafPose(spec, leaf, growth);
    if (pose.grow <= 0) return;
    const colors = spec.colors;
    const node = alongStem(stem, stem.nodeAt[leaf.node]);
    const across = Math.cos(leaf.azimuth);
    const side = across >= 0 ? 1 : -1;
    // Seen from the side, a leaf pointing at or away from the viewer looks shorter.
    const foreshorten = 0.45 + 0.55 * Math.abs(across);
    const size = leaf.size * pose.grow;

    // The stalk: a slight arch out of the side of the stem.
    const start = [node.point.x + side * node.radius * 0.7, node.point.y];
    const stalkLength = size * spec.petiole * foreshorten;
    const base = [start[0] + side * Math.cos(pose.stalk) * stalkLength, start[1] + Math.sin(pose.stalk) * stalkLength];
    g.strokeStyle = colors.stem;
    g.lineCap = 'round';
    g.lineWidth = Math.max(1, node.radius * 0.55 * scale);
    g.beginPath();
    g.moveTo(sx(start[0]), sy(start[1]));
    g.quadraticCurveTo(sx((start[0] + base[0]) / 2), sy(Math.max(start[1], base[1]) + stalkLength * 0.12), sx(base[0]), sy(base[1]));
    g.stroke();

    const angle = side > 0 ? pose.elevation : Math.PI - pose.elevation;
    const at = flatBlade(base, angle, size * foreshorten, size * spec.leafWidth, leaf.droop * pose.mature, sx, sy);
    g.fillStyle = leaf.color;
    traceBlade(g, rows, at);
    g.fill();
    g.globalAlpha = 0.5;
    g.fillStyle = colors.leafShade;
    traceHalfBlade(g, rows, at, -side);
    g.fill();
    // Triplinerved, as sunflower leaves are: the midrib and two strong veins from the base, then fainter pairs higher up.
    g.globalAlpha = 0.55;
    g.strokeStyle = colors.vein;
    g.lineWidth = Math.max(0.6, size * scale * 0.012);
    g.beginPath();
    g.moveTo(...at(0, 0));
    [0.25, 0.5, 0.75, 0.95].forEach(y => g.lineTo(...at(0, y)));
    [-1, 1].forEach(sign => {
        g.moveTo(...at(0, 0.03));
        g.quadraticCurveTo(...at(sign * 0.3, 0.14), ...at(sign * 0.3, 0.55));
    });
    g.stroke();
    g.globalAlpha = 0.35;
    g.beginPath();
    VEINS.forEach(y => [-1, 1].forEach(sign => {
        const reach = y + 0.16;
        g.moveTo(...at(0, y));
        g.quadraticCurveTo(...at(sign * 0.2 * leafHalfWidth(spec, reach), y + 0.1), ...at(sign * 0.4 * leafHalfWidth(spec, reach), reach));
    }));
    g.stroke();
    g.globalAlpha = 1;
}

function drawCotyledons2D(g, spec, stem, growth, rows, sx, sy) {
    const size = cotyledonSize(spec, growth);
    if (size <= 0 || stem.length <= 0) return;
    const node = alongStem(stem, stem.hypocotyl);
    const pointing = Math.atan2(node.dir.y, node.dir.x);
    const spread = cotyledonSpread(spec, growth);
    g.fillStyle = mixRgb(hexToRgb(spec.colors.cotyledon), hexToRgb(spec.colors.withered), cotyledonWither(spec, growth));
    [-1, 1].forEach(sign => {
        traceBlade(g, rows, flatBlade([node.point.x, node.point.y], pointing + sign * spread, size, size * 0.52, 0.1, sx, sy));
        g.fill();
    });
}

const mixChannels = (from, to, t) => from.map((channel, index) => channel + (to[index] - channel) * t);
/** The average of a list of '#rrggbb' colours, as [r, g, b]. */
const averageRgb = list => list.map(hexToRgb)
    .reduce((sum, rgb) => sum.map((channel, index) => channel + rgb[index] / list.length), [0, 0, 0]);
const rgbString = rgb => `rgb(${rgb.map(channel => Math.min(255, Math.max(0, Math.round(channel)))).join(',')})`;

/** Floret colour as [r, g, b]: closed green, pollen gold as it opens, then browning to a ripe seed; `shade` varies one from the next. */
function floretRgb(palette, stage, shade) {
    const opened = mixChannels(palette.closed, palette.pollen, stage.open);
    const filling = mixChannels(opened, palette.seed, stage.brown);
    return mixChannels(filling, palette.ripe, stage.dark).map(channel => channel * shade);
}

const headTurn2D = new THREE.Quaternion();
const headAxes2D = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];

/**
 * The head, as a small 3D model drawn flat: its green back, bracts, disc and petals are placed in head units, turned with the
 * head and painted back to front. Whatever is behind the disc's surface goes first, then the disc, then what stands in front.
 */
function drawHead2D(g, spec, plant, stem, growth, rows, sx, sy, scale) {
    const size = headSizeAt(spec, growth);
    if (size <= 0.002) return;
    const colors = spec.colors;
    headQuaternion(spec, growth, plant.yaw, headTurn2D);
    const [ax, ay, az] = headAxes2D;
    ax.set(1, 0, 0).applyQuaternion(headTurn2D);
    ay.set(0, 1, 0).applyQuaternion(headTurn2D);
    az.set(0, 0, 1).applyQuaternion(headTurn2D);
    const radius = spec.discRadius;
    const depth = radius * spec.headDepth;
    const tip = stem.tip;
    const deep = size * headStretchAt(spec, growth);
    // Head units to the scene: x and y in the picture, z towards the viewer.
    const toScene = ([u, v, w]) => [
        tip.x + size * (u * ax.x + v * ay.x) + deep * w * az.x,
        tip.y + size * (u * ax.y + v * ay.y) + deep * w * az.y,
        size * (u * ax.z + v * ay.z) + deep * w * az.z,
    ];
    const toPixel = point => {
        const [x, y] = toScene(point);
        return [sx(x), sy(y)];
    };
    // How squarely a petal's or bract's front faces the viewer: 1 face on, 0 edge on, -1 from behind.
    const facingOf = frame => -(frame.back[0] * ax.z + frame.back[1] * ay.z + frame.back[2] * az.z);
    const parts = [];

    // The green back of the head: rings from the rim back to the stalk, whose outline from any side is their hull.
    const ring = (r, w, count) => Array.from({ length: count }, (_, index) => {
        const angle = index / count * TAU;
        return [Math.cos(angle) * r, Math.sin(angle) * r, w];
    });
    const backOfHead = [
        ...ring(radius * 1.02, depth, 24),
        ...ring(radius * 0.86, depth * 0.55, 18),
        ...ring(radius * 0.45, depth * 0.12, 12),
        ...ring(radius * 0.25, depth * 0.03, 10),   // rounds the bottom off where the stalk joins: the bud is a knob, not a cup
    ];
    parts.push({
        w: depth * 0.4,
        z: toScene([0, 0, depth * 0.4])[2],
        draw: () => {
            const hull = convexHull(backOfHead.map(toPixel));
            const ys = hull.map(point => point[1]);
            const shade = g.createLinearGradient(0, Math.min(...ys), 0, Math.max(...ys) + 1);
            shade.addColorStop(0, colors.receptacle);
            shade.addColorStop(1, colors.receptacleShade);
            g.fillStyle = shade;
            g.beginPath();
            hull.forEach(([x, y]) => g.lineTo(x, y));
            g.closePath();
            g.fill();
        },
    });

    const bractRgb = hexToRgb(colors.bract);
    const bractShadeRgb = hexToRgb(colors.receptacleShade);
    plant.bracts.forEach(bract => {
        const base = bractSeat(spec, bract);
        const stage = bractStage(spec, bract, growth);
        const frame = rimFrame(bract.angle, base.radius, base.w, stage.spread, bract.twist);
        // On the bud they are longer against the head, but not as much wider.
        const at = (x, y) => onRimPart(frame, x, y, bract.width * Math.sqrt(stage.size), bract.length * stage.size, spec.bractCurl);
        const middle = at(0, 0.5);
        parts.push({
            w: middle[2],
            z: toScene(middle)[2],
            draw: () => {
                g.fillStyle = mixRgb(bractRgb, bractShadeRgb, 0.15 + 0.35 * (1 - Math.abs(facingOf(frame))));
                traceBlade(g, rows.bract, (x, y) => toPixel(at(x, y)));
                g.fill();
            },
        });
    });

    const petalBaseRgb = hexToRgb(colors.petalBase);
    const petalBackRgb = hexToRgb(colors.petalBack);
    plant.petals.forEach(petal => {
        const stage = petalStage(spec, petal, growth);
        if (stage.length <= 0.002) return;
        const base = petalSeat(spec, petal);
        const frame = rimFrame(petal.angle, base.radius, base.w, stage.spread, petal.twist);
        const length = petal.length * stage.length;
        const width = petal.width * lerp(0.45, 1, stage.length);
        const at = (x, y) => onRimPart(frame, x, y, width, length, spec.petalCurl);
        const middle = at(0, 0.5);
        parts.push({
            w: middle[2],
            z: toScene(middle)[2],
            draw: () => {
                const facing = facingOf(frame);
                // Face on: the petal's own gold, deepening a little edge on; from behind, its paler underside.
                g.fillStyle = facing >= 0
                    ? mixRgb(hexToRgb(petal.color), petalBaseRgb, 0.22 * (1 - facing))
                    : mixRgb(hexToRgb(petal.color), petalBackRgb, 0.25 + 0.45 * -facing);
                traceBlade(g, rows.petal, (x, y) => toPixel(at(x, y)));
                g.fill();
                g.globalAlpha = 0.3;
                g.strokeStyle = colors.petalBase;
                g.lineWidth = Math.max(0.5, width * scale * size * 0.08);
                g.beginPath();
                g.moveTo(...toPixel(at(0, 0.05)));
                g.lineTo(...toPixel(at(0, 0.5)));
                g.lineTo(...toPixel(at(0, 0.85)));
                g.stroke();
                g.globalAlpha = 1;
            },
        });
    });

    const palette = {
        closed: hexToRgb(colors.floretClosed),
        pollen: hexToRgb(colors.pollen),
        seed: hexToRgb(colors.seed),
        ripe: hexToRgb(colors.ripe),
        glint: hexToRgb(colors.glint),
    };
    const drawDisc = () => {
        // The disc is flat in head units, so one transform turns every floret circle into its ellipse on the page.
        const centre = toScene([0, 0, depth]);
        const k = scale * size;
        g.save();
        g.transform(k * ax.x, -k * ax.y, k * ay.x, -k * ay.y, sx(centre[0]), sy(centre[1]));
        g.fillStyle = mixRgb(hexToRgb(colors.discYoung), hexToRgb(colors.disc), discDarkness(spec, growth));
        g.beginPath();
        g.arc(0, 0, radius * 1.03, 0, TAU);
        g.fill();
        // Each floret a bead with a glint towards the light (upper left on the face), once big enough on screen to show one.
        const floretRadius = plant.c * spec.floretSize;
        const glints = floretRadius * k > 1.3;
        plant.florets.forEach(floret => {
            const stage = floretStage(spec, floret, growth);
            const rgb = floretRgb(palette, stage, floret.shade);
            const r = floretRadius * floretWidth(stage);
            g.fillStyle = rgbString(rgb);
            g.beginPath();
            g.arc(floret.x, floret.y, r, 0, TAU);
            g.fill();
            if (!glints) return;
            g.fillStyle = rgbString(mixChannels(rgb, palette.glint, 0.35));
            g.beginPath();
            g.arc(floret.x - r * 0.28, floret.y + r * 0.28, r * 0.42, 0, TAU);
            g.fill();
        });
        // A soft shadow towards the rim rounds the disc off.
        const dome = g.createRadialGradient(0, 0, 0, 0, 0, radius * 1.03);
        dome.addColorStop(0, `rgba(${palette.glint.join(',')},0.1)`);
        dome.addColorStop(0.62, 'rgba(0,0,0,0)');
        dome.addColorStop(1, 'rgba(0,0,0,0.3)');
        g.fillStyle = dome;
        g.beginPath();
        g.arc(0, 0, radius * 1.03, 0, TAU);
        g.fill();
        g.restore();
    };

    const byDepth = list => list.sort((a, b) => a.z - b.z);
    byDepth(parts.filter(part => part.w < depth)).forEach(part => part.draw());
    // Edge on (the bud looking at the sky) the disc can't be seen.
    if (az.z > 0.03) drawDisc();
    byDepth(parts.filter(part => part.w >= depth)).forEach(part => part.draw());
}

function drawSunflower2D(view, spec, plant, decor, rows, growth) {
    const g = view.ctx;
    g.clearRect(0, 0, view.width, view.height);
    const { scale, sx, sy } = framing(view, FRAME_2D);
    drawSoil2D(g, spec, decor, sx, sy, scale);
    // In the picture every bend is sideways: the neck leans the way the face is turned, the seedling's hook the other way.
    const facingSide = plant.side > 0 ? 0 : Math.PI;
    const stem = stemAt(plant, spec, growth, { sway: 0, hook: Math.PI - facingSide, neck: facingSide });
    // Leaves pointing away from the viewer go behind the stem, the others in front.
    const behind = plant.leaves.filter(leaf => Math.sin(leaf.azimuth) < 0);
    const before = plant.leaves.filter(leaf => Math.sin(leaf.azimuth) >= 0);
    behind.forEach(leaf => drawLeaf2D(g, spec, leaf, stem, growth, rows.leaf, sx, sy, scale));
    drawStem2D(g, spec, stem, decor, growth, sx, sy, scale);
    drawCotyledons2D(g, spec, stem, growth, rows.cotyledon, sx, sy);
    before.forEach(leaf => drawLeaf2D(g, spec, leaf, stem, growth, rows.leaf, sx, sy, scale));
    drawHead2D(g, spec, plant, stem, growth, rows, sx, sy, scale);
}

// ─── Sunflower in 3D ───

const Z_AXIS = new THREE.Vector3(0, 0, 1);
const HIDDEN = new THREE.Matrix4().makeScale(1e-5, 1e-5, 1e-5);
const partMatrix = new THREE.Matrix4();
const partScale = new THREE.Vector3();

/**
 * A blade mesh from rows of { y, half, midY }: five vertices across each row, from one margin through the midrib to the other.
 * bend(x, y) gives each vertex its z (curl, droop); tone(x, y) its shade as a vertex colour, multiplied into the instance colour.
 */
function bladeGeometry(rows, bend, tone) {
    const columns = [-1, -0.5, 0, 0.5, 1];
    const positions = [];
    const colors = [];
    rows.forEach(row => columns.forEach(column => {
        const x = column * row.half;
        const y = lerp(row.midY, row.y, Math.abs(column));
        positions.push(x, y, bend(x, y));
        colors.push(...tone(x, y));
    }));
    const index = [];
    for (let row = 0; row < rows.length - 1; row++) {
        for (let column = 0; column < columns.length - 1; column++) {
            const a = row * columns.length + column;
            const c = a + columns.length;
            index.push(a, a + 1, c + 1, a, c + 1, c);
        }
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geometry.setIndex(index);
    geometry.computeVertexNormals();
    return geometry;
}

/** A petal's or bract's instance matrix: its frame on the head, scaled to its width and length. */
function rimPartMatrix(target, frame, width, length) {
    const { across, along, back, base } = frame;
    return target.set(
        across[0] * width, along[0] * length, back[0] * length, base[0],
        across[1] * width, along[1] * length, back[1] * length, base[1],
        across[2] * width, along[2] * length, back[2] * length, base[2],
        0, 0, 0, 1,
    );
}

/** A low mound of soil, lumpy round its rim. */
function soilGeometry(radius, rand) {
    const geometry = new THREE.CylinderGeometry(radius * 0.86, radius * 1.06, 0.06, 22, 1).translate(0, -0.03, 0);
    const phases = Array.from({ length: 4 }, () => rand() * TAU);
    const position = geometry.attributes.position;
    for (let index = 0; index < position.count; index++) {
        const x = position.getX(index);
        const y = position.getY(index);
        const z = position.getZ(index);
        if (Math.hypot(x, z) < 1e-6) continue;   // the caps' centres stay put
        const angle = Math.atan2(z, x);
        const wobble = 1 + 0.05 * Math.sin(2 * angle + phases[0]) + 0.035 * Math.sin(5 * angle + phases[1]);
        position.setX(index, x * wobble);
        position.setZ(index, z * wobble);
        // The top rim sits a little below the middle, so the soil mounds up round the stem.
        if (y > -0.001) position.setY(index, -0.008 - 0.005 * Math.sin(3 * angle + phases[2]));
    }
    geometry.computeVertexNormals();
    return geometry;
}

class SunflowerView extends PlantView {
    constructor() {
        // The plant is taller than the default framing: the camera stands back and looks at its middle, mound to head in view.
        super('sunflower', { target: [0, 0.43, 0], cameraAt: [0, 0.74, 2.25] });
        this.spec = SUNFLOWER;
        this.parts = null;
    }

    build() {
        const spec = this.spec;
        this.plant = buildPlant(spec);
        this.spirals = visibleSpirals(this.plant.florets);
        this.decor2D = buildDecor2D(spec);
        this.rows = { petal: petalRows(), bract: bractRows(), cotyledon: cotyledonRows(), leaf: leafRows(spec) };
        // In 3D the neck leans the way the face looks.
        this.bends3D = { sway: this.plant.swayAzimuth, hook: this.plant.hookAzimuth, neck: this.plant.faceAzimuth };
        this.buildScene3D();
    }

    buildScene3D() {
        if (this.parts) {
            this.stage.scene.remove(this.parts.root);
            this.parts.disposables.forEach($_ => $_.dispose());
        }
        const spec = this.spec;
        const plant = this.plant;
        const colors = spec.colors;
        const rand = mulberry32(spec.seed + 2);
        const disposables = [];
        const keep = thing => {
            disposables.push(thing);
            return thing;
        };
        const radius = spec.discRadius;
        const depth = radius * spec.headDepth;

        // Materials. White ones take their colour per instance; blades also carry their shading in vertex colours.
        const material = options => keep(new THREE.MeshStandardMaterial({ flatShading: true, ...options }));
        const leafRgb = averageRgb(colors.leaf);
        const petalRgb = averageRgb(colors.petal);
        // A faint glow in the leaves' own green keeps blades seen edge on from going black.
        const bladeMaterial = material({
            color: '#ffffff', vertexColors: true, roughness: 0.75, side: THREE.DoubleSide,
            emissive: rgbString(leafRgb), emissiveIntensity: spec.bladeGlow,
        });
        // A glow in the petals' own colour keeps them golden on the side away from the sun.
        const petalMaterial = material({
            color: '#ffffff', vertexColors: true, roughness: 0.55, side: THREE.DoubleSide,
            emissive: rgbString(petalRgb), emissiveIntensity: spec.petalGlow,
        });
        const stemMaterial = material({ color: colors.stem, roughness: 0.8 });
        const floretMaterial = material({ color: '#ffffff', roughness: 0.85 });
        const receptacleMaterial = material({ color: colors.receptacle, roughness: 0.8 });
        const discMaterial = material({ color: colors.disc, roughness: 1 });
        const soilMaterial = material({ color: colors.soil, roughness: 1 });
        const clodMaterial = material({ color: '#ffffff', roughness: 1 });
        const groundMaterial = material({ color: colors.ground, roughness: 1, flatShading: false });

        // Blades: petals deepen towards petalBase at the base; leaves lighten towards vein down the midrib; bracts darken to
        // their tips. Vertex colours multiply the instance colour, so the shading is each colour against the average blade's.
        const against = (rgb, average) => rgb.map((channel, index) => channel / Math.max(1, average[index]));
        const petalBaseTone = against(hexToRgb(colors.petalBase), petalRgb).map(channel => Math.min(1, channel));
        const veinTone = against(hexToRgb(colors.vein), leafRgb);
        const petalGeometry = keep(bladeGeometry(this.rows.petal,
            (x, y) => spec.petalCurl * y * y - 0.1 * x * x,
            (x, y) => mixChannels(petalBaseTone, [1, 1, 1], smooth(clamp01(y / 0.3)))));
        const bractGeometry = keep(bladeGeometry(this.rows.bract,
            (x, y) => spec.bractCurl * y * y - 0.12 * x * x,
            (x, y) => [lerp(1.08, 0.72, y), lerp(1.08, 0.78, y), lerp(1.0, 0.7, y)]));
        const leafGeometry = keep(bladeGeometry(this.rows.leaf,
            (x, y) => -0.16 * x * x - spec.leafDroop * 0.8 * y * y,
            (x, y) => {
                const vein = Math.pow(1 - Math.min(1, Math.abs(x) * 2), 3);
                return mixChannels([0.85, 0.85, 0.85], veinTone, 0.25 * vein);
            }));
        const cotyledonGeometry = keep(bladeGeometry(this.rows.cotyledon, (x, y) => -0.2 * x * x, () => [1, 1, 1]));

        // The disc's surface is a shallow dome: a spherical cap whose rim sits at the front of the head's green back.
        const capRadius = radius * 1.03;
        const capHeight = Math.max(1e-4, spec.discDome * radius);
        const sphere = (capRadius * capRadius + capHeight * capHeight) / (2 * capHeight);
        const sphereCentre = depth + capHeight - sphere;
        const discGeometry = keep(new THREE.SphereGeometry(sphere, 48, 5, 0, TAU, 0, Math.asin(Math.min(1, capRadius / sphere)))
            .rotateX(Math.PI / 2).translate(0, 0, sphereCentre));
        const receptacleGeometry = keep(new THREE.SphereGeometry(1, 24, 7, 0, TAU, 0, Math.PI / 2)
            .rotateX(-Math.PI / 2).scale(capRadius, capRadius, depth).translate(0, 0, depth));
        // A floret: a little six-sided cushion standing on the dome, its axis along +z.
        const floretGeometry = keep(new THREE.CylinderGeometry(0.62, 1, 1, 6).translate(0, 0.5, 0).rotateX(Math.PI / 2));
        const floretRadius = plant.c * spec.floretSize;
        const floretPlaces = plant.florets.map(floret => {
            const reach = Math.hypot(floret.x, floret.y);
            const surface = sphereCentre + Math.sqrt(Math.max(0, sphere * sphere - reach * reach));
            const normal = new THREE.Vector3(floret.x, floret.y, surface - sphereCentre).normalize();
            // Each floret turned to its own angle, so the cushions line up along the spirals.
            const quaternion = new THREE.Quaternion().setFromUnitVectors(Z_AXIS, normal)
                .multiply(new THREE.Quaternion().setFromAxisAngle(Z_AXIS, floret.angle));
            const position = new THREE.Vector3(floret.x, floret.y, surface).addScaledVector(normal, -floretRadius * 0.25);
            return { position, quaternion };
        });

        const stem = keep(instanced(keep(unitStem(0.96, 8)), stemMaterial, STEM_STEPS));
        const petioles = keep(instanced(keep(unitStem(0.7, 6)), stemMaterial, plant.leaves.length));
        const leaves = keep(instanced(leafGeometry, bladeMaterial, plant.leaves.length));
        plant.leaves.forEach((leaf, index) => leaves.setColorAt(index, tint.set(leaf.color)));
        const cotyledons = keep(instanced(cotyledonGeometry, bladeMaterial, 2));

        const florets = keep(instanced(floretGeometry, floretMaterial, plant.florets.length));
        const petals = keep(instanced(petalGeometry, petalMaterial, plant.petals.length));
        plant.petals.forEach((petal, index) => petals.setColorAt(index, tint.set(petal.color)));
        const bracts = keep(instanced(bractGeometry, bladeMaterial, plant.bracts.length));
        // Bracts a shade lighter or darker than the next.
        plant.bracts.forEach((bract, index) => bracts.setColorAt(index, tint.set(colors.bract).multiplyScalar(0.9 + rand() * 0.2)));
        // instanced() keeps at least one instance, which would show at full size if a list is empty: draw only real ones.
        [[petioles, plant.leaves], [leaves, plant.leaves], [florets, plant.florets], [petals, plant.petals], [bracts, plant.bracts]]
            .forEach(([mesh, list]) => { mesh.count = list.length; });
        const head = new THREE.Group();
        const receptacle = new THREE.Mesh(receptacleGeometry, receptacleMaterial);
        head.add(receptacle, new THREE.Mesh(discGeometry, discMaterial), florets, petals, bracts);

        // The ground: a dark floor, a low mound of soil and a few clods.
        const ground = new THREE.Mesh(keep(new THREE.CircleGeometry(0.8, 48)), groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.06;
        const soil = new THREE.Mesh(keep(soilGeometry(spec.soilRadius, rand)), soilMaterial);
        const clodCount = spec.clods;
