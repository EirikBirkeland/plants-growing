    function buildLitter3D(spec, rand, heightAt, materials) {
        const { ground, colors } = spec;
        const spot = (inner, outer) => {
            const r = inner + Math.pow(rand(), 0.8) * (outer - inner);
            const angle = rand() * TAU;
            return [Math.cos(angle) * r, Math.sin(angle) * r];
        };
        const moss = instancedExactly(new THREE.IcosahedronGeometry(1, 1), materials.moss, ground.moss);
        for (let $_ = 0; $_ < ground.moss; $_++) {
            const [x, z] = spot(0.14, 1.5);
            const size = 0.014 + rand() * 0.034;
            dummy.position.set(x, heightAt(x, z) - size * 0.12, z);
            dummy.rotation.set(0, rand() * TAU, 0);
            dummy.scale.set(size * (1 + rand() * 0.6), size * (0.35 + rand() * 0.25), size);
            dummy.updateMatrix();
            moss.setMatrixAt($_, dummy.matrix);
            moss.setColorAt($_, tint.set(pick(rand, colors.moss)).multiplyScalar(ground.mossLift3D * (0.8 + rand() * 0.4)));
        }
        const pebbles = instancedExactly(new THREE.DodecahedronGeometry(1, 0), materials.pebble, ground.pebbles);
        for (let $_ = 0; $_ < ground.pebbles; $_++) {
            const [x, z] = spot(0.16, 1.2);
            const size = 0.01 + rand() * 0.024;
            dummy.position.set(x, heightAt(x, z) + size * 0.2, z);
            dummy.rotation.set(rand() * TAU, rand() * TAU, rand() * TAU);
            dummy.scale.set(size * (1 + rand() * 0.5), size * 0.6, size);
            dummy.updateMatrix();
            pebbles.setMatrixAt($_, dummy.matrix);
            pebbles.setColorAt($_, tint.set(colors.pebble).multiplyScalar(0.7 + rand() * 0.5));
        }
        const twigs = instancedExactly(unitStem(0.6, 5), materials.twig, ground.twigs);
        for (let $_ = 0; $_ < ground.twigs; $_++) {
            const [x, z] = spot(0.3, 1.3);
            const heading = rand() * TAU;
            const dir = new THREE.Vector3(Math.cos(heading), (rand() - 0.5) * 0.15, Math.sin(heading)).normalize();
            const radius = 0.004 + rand() * 0.004;
            dummy.position.set(x, heightAt(x, z) + radius, z);
            dummy.quaternion.setFromUnitVectors(UP, dir);
            dummy.scale.set(radius, 0.1 + rand() * 0.2, radius);
            dummy.updateMatrix();
            twigs.setMatrixAt($_, dummy.matrix);
        }
        dummy.rotation.set(0, 0, 0);
        dummy.quaternion.identity();
        return [moss, pebbles, twigs];
    }

    /**
     * Glowing threads over the ground: strands from the spore, forking, fusing where tips meet. Each thread is laid over the
     * ground in a few pieces whose joints are pushed sideways, so it wanders like the 2D threads instead of running dead
     * straight. The pieces are what gets drawn; a piece grows once the one before it has.
     */
    function buildMycelium3D(spec, rand, heightAt, companions) {
        const mycelium = spec.mycelium;
        const growDur = spec.myceliumUntil / mycelium.levels;
        const kinks = Math.max(1, Math.round(mycelium.kinks));
        const onGround = (x, z) => new THREE.Vector3(x, heightAt(x, z) + 0.004, z);

        /** A thread from `start` over the ground to (endX, endZ). */
        function thread(start, endX, endZ, width, level, birth) {
            const end = onGround(endX, endZ);
            const length = Math.hypot(endX - start.x, endZ - start.z);
            const heading = Math.atan2(endZ - start.z, endX - start.x);
            const sideways = Math.sin(mycelium.kink) * length / kinks;
            const joints = Array.from({ length: kinks + 1 }, (_, index) => {
                if (index === 0) return start;
                if (index === kinks) return end;
                const t = index / kinks;
                const push = (rand() * 2 - 1) * sideways;
                return onGround(lerp(start.x, endX, t) - Math.sin(heading) * push, lerp(start.z, endZ, t) + Math.cos(heading) * push);
            });
            const self = { start, end, heading, length, width, level, birth };
            self.pieces = joints.slice(0, -1).map((from, index) => {
                const delta = joints[index + 1].clone().sub(from);
                const pieceWidth = lerp(width, width * mycelium.widthDecay, index / kinks);
                const piece = makeBranch3D(from, delta.clone().normalize(), Math.max(1e-5, delta.length()), pieceWidth, level, birth);
                piece.thread = self;
                piece.part = index;
                return piece;
            });
            return self;
        }

        function spawn(branch, level) {
            const birth = branch.birth + growDur * (0.85 + rand() * 0.3);
            const away = Math.atan2(branch.end.z, branch.end.x);
            return Array.from({ length: mycelium.forks }, (_, index) => {
                const side = forkSide(index, mycelium.forks, rand);
                const heading = turnTowards(branch.heading + side * mycelium.spread * (0.6 + rand() * 0.6), away, mycelium.outward);
                const length = branch.length * mycelium.lengthDecay * (0.8 + rand() * 0.4);
                const endX = branch.end.x + Math.cos(heading) * length;
                const endZ = branch.end.z + Math.sin(heading) * length;
                return thread(branch.end, endX, endZ, branch.width * mycelium.widthDecay, level + 1, birth);
            });
        }

        // Strands spread round the spore; the first ones head for the companions, which fruit from these threads.
        const first = rand() * TAU;
        const origin = onGround(0, 0);
        const strands = Array.from({ length: mycelium.strands }, (_, index) => {
            const heading = index < companions.length
                ? companions[index].azimuth
                : first + index / mycelium.strands * TAU + (rand() - 0.5) * 0.5;
            const length = mycelium.length * (0.8 + rand() * 0.4);
            return thread(origin, Math.cos(heading) * length, Math.sin(heading) * length, mycelium.width, 0, rand() * growDur * 0.5);
        });
        const cap = Math.max(1, Math.floor(mycelium.maxThreads / Math.max(1, mycelium.strands)));
        const grown = strands.map(trunk => growGenerations({ trunk, generations: mycelium.levels, cap, spawn }));
        const threads = grown.flatMap($_ => $_.branches);

        // Fusing tips, bridged once both have finished growing.
        const pairs = pairTips(fusingTips(threads, mycelium.levels), tip => [tip.end.x, tip.end.z], rand, mycelium);
        const links = pairs.slice(0, Math.max(0, mycelium.maxThreads - threads.length)).map(([from, to]) => {
            const birth = Math.max(from.birth, to.birth) + growDur;
            return thread(from.end, to.end.x, to.end.z, Math.min(from.width, to.width) * mycelium.widthDecay, mycelium.levels, birth);
        });
        const all = [...threads, ...links];
        const pieces = all.flatMap($_ => $_.pieces);
        // Distance from the centre, for the light that pulses inwards along the threads.
        pieces.forEach(piece => { piece.reach = Math.hypot(piece.start.x + piece.end.x, piece.start.z + piece.end.z) / 2; });
        return { threads: all, pieces, growDur, kinks, capped: grown.some($_ => $_.capped) };
    }

    /** One 3D mushroom: a group at its foot turned towards its lean, holding the stem and a frame at the stem top for the cap. */
    function makeBody(spec, textures, foot, leanAzimuth, wavePhase, spots) {
        const { colors } = spec;
        const group = new THREE.Group();
        group.position.copy(foot);
        group.rotation.y = -leanAzimuth;
        const stemMaterial = withRim(new THREE.MeshStandardMaterial({
            color: colors.stem, emissive: '#ffffff', emissiveMap: textures.stem, roughness: 0.55,
        }), colors.rim);
        const capMaterial = withRim(new THREE.MeshStandardMaterial({
            color: colors.cap, emissive: '#ffffff', emissiveMap: textures.cap, roughness: 0.3, transparent: true,
        }), colors.rim, colors.veil);
        const gillMaterial = new THREE.MeshStandardMaterial({
            color: '#ffffff', map: textures.gills, emissive: '#ffffff', emissiveMap: textures.gills, roughness: 0.8, side: THREE.DoubleSide,
        });
        const stem = new THREE.Mesh(makeGrid(22, 18, true), stemMaterial);
        const cap = new THREE.Mesh(makeGrid(18, 48, false), capMaterial);
        const gills = new THREE.Mesh(makeGrid(6, 96, true), gillMaterial);
        [stem, cap, gills].forEach($_ => { $_.frustumCulled = false; });
        const capFrame = new THREE.Group();
        capFrame.add(gills, cap);
        group.add(stem, capFrame);
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({
            map: glowDot, color: colors.halo, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
        }));
        return {
            group, stem, cap, gills, capFrame, halo, wavePhase, spots,
            footY: foot.y,
            materials: [stemMaterial, capMaterial, gillMaterial, halo.material],
        };
    }

    // Scratch objects for placing instances.
    const spotNormal = new THREE.Vector3();
    const worldMatrix = new THREE.Matrix4();
    const sporeAt = { x: 0, y: 0, z: 0, alpha: 0 };
    // The two bands of each inward wave in 2D: half-width (share of the reach) and strength.
    const WAVE_BANDS = [[0.05, 1], [0.1, 0.45]];
    // Spores are drawn this much brighter than their colour in 3D, so the bloom picks them up.
    const SPORE_GLOW_3D = 2.4;

    class MushroomView extends PlantView {
        constructor() {
            super('mushroom', { background: SPEC.colors.night, night: true, target: SPEC.view.target, cameraAt: SPEC.view.cameraAt });
            this.spec = SPEC;
            this.clock = 0;
            this.scene3D = null;
            this.layers = {};
            this.backdropKey = null;
            this.setUpBloom();
        }

        /** Bloom: the scene goes into a multisampled HDR buffer, bright parts are blurred and added, then tone-mapped. */
        setUpBloom() {
            const { renderer, scene, camera } = this.stage;
            const { bloom } = this.spec.glow;
            // No tone curve: a filmic one crushes the dark night to black and bleaches the blues; the glow levels are kept in range instead.
            renderer.toneMapping = THREE.NoToneMapping;
            const buffer = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
            this.composer = new EffectComposer(renderer, buffer);
            this.composer.addPass(new RenderPass(scene, camera));
            this.bloomPass = new UnrealBloomPass(new THREE.Vector2(256, 256), bloom.strength[0], bloom.radius, bloom.threshold);
            this.composer.addPass(this.bloomPass);
            const factors = this.bloomPass.compositeMaterial?.uniforms?.bloomFactors;
            if (factors) factors.value = [...bloom.spread];
            // The pass's blur has sigma = its kernel radius and stops there: nearly a box, so small bright dots bloom into
            // squares. A narrower Gaussian over the same kernel gives round halos.
            this.bloomPass.separableBlurMaterials?.forEach(material => {
                const radius = material.defines?.KERNEL_RADIUS;
                const coefficients = material.uniforms?.gaussianCoefficients;
                if (!radius || !coefficients) return;
                const sigma = radius / 2.5;
                coefficients.value = Array.from({ length: radius }, (_, index) => Math.exp(-0.5 * (index / sigma) ** 2));
            });
            this.composer.addPass(new OutputPass());
            this.size3D = [0, 0];
            this.stage.onResize = (width, height) => {
                this.size3D = [width, height];
                this.composer.setSize(width, height);
            };
            // A hidden tab has no size: skip the frame rather than render into empty buffers.
            this.stage.render = () => {
                if (this.size3D[0] > 0 && this.size3D[1] > 0) this.composer.render();
            };
        }

        build() {
            const spec = this.spec;
            this.companions = makeCompanions(spec, mulberry32(spec.seed + 300));
            this.scene2D = buildScene2D(spec, this.companions);
            this.sprites = {
                spot: makeGlowSprite(spec.colors.spots),
                thread: makeGlowSprite(spec.colors.mycelium),
                spore: makeGlowSprite(spec.colors.spores),
            };
            this.backdropKey = null;
            this.spores = new SporeCloud(spec);
            this.weightsGrowth = null;
            this.buildScene3D();
        }

        buildScene3D() {
            const spec = this.spec;
            const { colors } = spec;
            if (this.scene3D) {
                this.stage.scene.remove(this.scene3D.world);
                this.scene3D.owned.forEach($_ => $_.dispose());
            }
            const owned = [];
            const own = thing => {
                owned.push(thing);
                return thing;
            };
            const rand = mulberry32(spec.seed + 1000);
            const heightAt = groundShape(spec);
            const world = new THREE.Group();
            // The same night as the 2D sky: dark above, deep blue towards the horizon, where the floor fades into fog.
            const sky = own(paintedTexture(4, 256, (g, width, height) => {
                const gradient = g.createLinearGradient(0, 0, 0, height);
                gradient.addColorStop(0, colors.night);
                gradient.addColorStop(0.55, mixHex(colors.night, colors.nightLow, 0.75));
                gradient.addColorStop(1, mixHex(colors.night, colors.nightLow, 0.5));
                g.fillStyle = gradient;
                g.fillRect(0, 0, width, height);
            }));
            // The background plane's v runs up the screen, unlike the mushroom grids: flipped, the top of the canvas is on top.
            sky.flipY = true;
            this.stage.scene.background = sky;
            this.stage.scene.fog = new THREE.Fog(mixHex(colors.night, colors.nightLow, 0.6), ...spec.view.fog);

            // One pool of light round each mushroom's foot (main first), on the floor and everything lying on it.
            const pools = Array.from({ length: 1 + this.companions.length }, () => new THREE.Vector4());
            // Smooth, not flat-shaded: the round grid's thin centre triangles would show as a star.
            const groundMaterial = own(withPools(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }), pools, colors.light));
            world.add(new THREE.Mesh(own(buildGroundGeometry(spec, heightAt)), groundMaterial));
            const litterMaterials = {
                moss: own(withPools(new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 1, flatShading: true }), pools, colors.light)),
                pebble: own(withPools(new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.8, flatShading: true }), pools, colors.light)),
                twig: own(withPools(new THREE.MeshStandardMaterial({ color: colors.twig, roughness: 1, flatShading: true }), pools, colors.light)),
            };
            buildLitter3D(spec, rand, heightAt, litterMaterials).forEach(mesh => {
                own(mesh.geometry);
                world.add(own(mesh));
            });

            // Threads: brightness per piece in the instance colour (thicker is brighter), hue and strength in the material.
            const mycelium = buildMycelium3D(spec, rand, heightAt, this.companions);
            mycelium.reach = Math.max(...mycelium.pieces.map(piece => piece.reach), 0.01);
            const threadMaterial = own(new THREE.MeshBasicMaterial({ color: colors.mycelium }));
            const threads = own(instancedExactly(own(unitStem(0.9, 5)), threadMaterial, mycelium.pieces.length));
            mycelium.pieces.forEach((piece, index) => threads.setColorAt(index, tint.setScalar(this.threadBrightness(piece))));
            const tipMaterial = own(new THREE.MeshBasicMaterial({ color: colors.mycelium }));
            const tips = own(instancedExactly(own(new THREE.IcosahedronGeometry(1, 1)), tipMaterial, mycelium.threads.length));
            const knot = new THREE.Sprite(own(new THREE.SpriteMaterial({
                map: glowDot, color: colors.mycelium, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
            })));
            knot.position.set(0, 0.012, 0);
            world.add(threads, tips, knot);

            // The mushrooms: the main one at the centre, companions round it on the mound.
            const textures = {
                cap: own(capTexture(colors, spec.cap.striae)),
                gills: own(gillTexture(colors, spec.cap.gills)),
                stem: own(stemTexture(colors)),
            };
            const main = {
                ...makeBody(spec, textures, new THREE.Vector3(0, 0, 0), 0, rand() * TAU, makeSpots(spec.cap.spots, rand)),
                size: 1,
                shape: MAIN_SHAPE,
                ageAt: growth => mainAge(spec, growth),
            };
            const companionSpots = Math.round(spec.cap.spots * spec.companions.spotShare);
            const companions = this.companions.map(companion => {
                const x = Math.cos(companion.azimuth) * companion.distance;
                const z = Math.sin(companion.azimuth) * companion.distance;
                const foot = new THREE.Vector3(x, heightAt(x, z), z);
                const body = makeBody(spec, textures, foot, companion.leanAzimuth, companion.wavePhase, makeSpots(companionSpots, rand));
                return { ...body, size: companion.size, shape: companion.shape, ageAt: growth => companionAge(companion, growth) };
            });
            const bodies = [main, ...companions];
            bodies.forEach(body => {
                body.materials.forEach(own);
                [body.stem, body.cap, body.gills].forEach(mesh => own(mesh.geometry));
                world.add(body.group, body.halo);
            });

            const spotTotal = bodies.reduce((sum, body) => sum + body.spots.length, 0);
            const spotMaterial = own(new THREE.MeshBasicMaterial({ color: colors.spots }));
            const spotMesh = own(instancedExactly(own(new THREE.IcosahedronGeometry(1, 2)), spotMaterial, spotTotal));
            bodies.flatMap(body => body.spots).forEach((spot, index) => spotMesh.setColorAt(index, tint.setScalar(0.65 + 0.35 * spot.size)));
            const ringMaterial = own(withRim(new THREE.MeshStandardMaterial({
                color: colors.veil, emissive: colors.veil, roughness: 0.6, side: THREE.DoubleSide, transparent: true, opacity: 0.85,
            }), colors.rim));
            const rings = own(instancedExactly(own(makeSkirtGeometry(spec.stem.ringFlare)), ringMaterial, bodies.length));
            world.add(spotMesh, rings);

            const sporeGeometry = own(new THREE.BufferGeometry());
            sporeGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(spec.spores.count * 3), 3));
            sporeGeometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(spec.spores.count * 3), 3));
            const sporeMaterial = own(new THREE.PointsMaterial({
                size: spec.spores.size[1], map: glowDot, vertexColors: true,
                transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
            }));
            const spores = new THREE.Points(sporeGeometry, sporeMaterial);
            spores.frustumCulled = false;
            world.add(spores);

            this.stage.scene.add(world);
            this.scene3D = {
                world, owned, mycelium, threads, threadMaterial, tips, tipMaterial, knot, bodies, pools,
                spotMesh, spotMaterial, rings, ringMaterial, spores,
                sporeColor: hexToRgb(colors.spores).map(channel => channel / 255 * SPORE_GLOW_3D),
            };
            this.anchors3D = [];
            this.glowBase = null;
            this.threadsPlain = true;
            this.sporesHidden = false;
        }

        /** Thick threads near the spore shine more than the finest ones at the edge. */
        threadBrightness(piece) {
            return 0.45 + 0.55 * Math.pow(this.spec.mycelium.widthDecay, piece.level);
        }

        update3D(growth) {
            const spec = this.spec;
            const scene3D = this.scene3D;
            const glowLevel = glowAt(spec, growth);
            const magic = magicAt(spec, growth);

            // Threads piece by piece, and a bright bead on the tip of every thread still growing.
            const { threads, pieces, growDur, kinks } = scene3D.mycelium;
            const progressOf = thread => easeOut(clamp01((growth - thread.birth) / growDur));
            placeBranches3D(scene3D.threads, pieces, piece => clamp01(progressOf(piece.thread) * kinks - piece.part), piece => piece.width / 2);
            threads.forEach((thread, index) => {
                const progress = progressOf(thread);
                const bead = tipBead(progress);
                if (bead > 0.001) {
                    const along = Math.min(kinks - 1e-6, progress * kinks);
                    const piece = thread.pieces[Math.floor(along)];
                    dummy.position.copy(piece.start).addScaledVector(piece.dir, piece.length * (along - Math.floor(along)));
                } else {
                    dummy.position.copy(thread.start);
                }
                dummy.scale.setScalar(Math.max(0.00001, (0.004 + thread.width * 0.5) * bead));
                dummy.updateMatrix();
                scene3D.tips.setMatrixAt(index, dummy.matrix);
            });
            scene3D.tips.instanceMatrix.needsUpdate = true;

            // The spore, then the knot the threads gather into.
            const knot = smooth(window01(growth, spec.knotFrom, spec.pinFrom + 0.1));
            scene3D.knot.scale.setScalar(0.035 + 0.13 * knot + 0.06 * glowLevel);
            scene3D.knot.material.opacity = 0.45 + 0.55 * knot;

            let spotIndex = 0;
            scene3D.bodies.forEach((body, index) => {
                const state = mushroomState(spec, body.ageAt(growth), body.size, body.shape);
                body.state = state;
                body.group.visible = state.visible;
                body.halo.visible = state.visible;
                // A pin still swelling sits partly in the ground, which hides what is buried.
                body.group.position.y = body.footY - state.sink;
                if (state.visible) this.poseBody(body, state, glowLevel, magic);
                // Its pool of light, the same size as in 2D; the strength breathes with the glow (applyGlow).
                const { x, z } = body.group.position;
                scene3D.pools[index].set(x, z, 0.6 * (0.1 + 1.3 * state.cap.a), 0);
                body.pool = state.visible ? spec.glow.pool * glowLevel * state.form : 0;
                this.placeRing(body, index, state);
                spotIndex = this.placeSpots(body, spotIndex, state);
            });
            scene3D.rings.instanceMatrix.needsUpdate = true;
            scene3D.spotMesh.instanceMatrix.needsUpdate = true;

            this.anchors3D = scene3D.bodies.map(body => body.state.visible
                ? { position: body.capFrame.localToWorld(new THREE.Vector3(0, body.state.cap.rimY, 0)), rim: body.state.cap.rim }
                : null);
            this.glowBase = {
                threads: between(spec.glow.mycelium, glowLevel),
                spots: between(spec.glow.spots, glowLevel),
                bloom: between(spec.glow.bloom.strength, glowLevel),
                ring: between(spec.glow.ring, glowLevel),
            };
            this.applyGlow(this.breathAt(growth));
        }

        poseBody(body, state, glowLevel, magic) {
            const spec = this.spec;
            const { colors, glow } = spec;
            writeStem(body.stem.geometry, state);
            const curve = stemCurve(state);
            const [tx, ty] = curveTangent(curve, 1);
            body.capFrame.position.set(curve.top[0], curve.top[1], 0);
            body.capFrame.rotation.set(0, 0, -Math.atan2(tx, ty) * spec.cap.tilt);
            writeCap(body.cap.geometry, state.cap, body.wavePhase, spec.cap.waves);
            writeGills(body.gills.geometry, state, body.wavePhase, spec.cap.waves);
            body.group.updateMatrixWorld(true);

            // The egg is wrapped in its pale veil; the blue shows as the cap opens.
            const [, capMaterial, gillMaterial] = body.materials;
            const egg = 1 - state.open;
            capMaterial.color.set(colors.cap).lerp(tint.set(colors.veil), egg * egg * 0.8);
            capMaterial.emissive.set('#ffffff').lerp(tint.set(colors.veil), egg * egg * 0.8);
            capMaterial.opacity = between(glow.capOpacity, magic);
            gillMaterial.color.set('#ffffff').lerp(tint.set(colors.veil), egg);
            body.glow = {
                cap: between(glow.cap, glowLevel) * (0.4 + 0.6 * state.form),
                veil: glow.veil * egg * egg,
                gills: between(glow.gills, glowLevel) * (0.15 + 0.85 * state.open),
                stem: between(glow.stem, glowLevel),
                rim: between(glow.rim, glowLevel),
                halo: 0.16 * glow.halo * (0.2 * glowLevel + 0.8 * magic) * (0.3 + 0.7 * state.open),
            };
            body.capFrame.localToWorld(body.halo.position.set(0, state.cap.centre + state.cap.b * 0.35, 0));
            body.halo.scale.setScalar(state.cap.a * 3.4 + 0.05);
        }

        /** The torn veil hangs as a skirt round the stem, below the cap. */
        placeRing(body, index, state) {
            const { stem } = this.spec;
            const shown = state.visible && state.ring > 0.01;
            const curve = stemCurve(state);
            const [x, y] = curvePoint(curve, stem.ringAt);
            const radius = stemRadiusAt(state, stem.ringAt) * lerp(1.05, stem.ringFlare, state.ring) / stem.ringFlare;
            dummy.position.set(x, y, 0);
            dummy.scale.set(shown ? radius : 0.00001, shown ? stem.ringLength * state.size * state.ring : 0.00001, shown ? radius : 0.00001);
            dummy.updateMatrix();
            this.scene3D.rings.setMatrixAt(index, worldMatrix.multiplyMatrices(body.group.matrixWorld, dummy.matrix));
        }

        /** Spots sit on the cap's surface, turned to its normal; they appear as the veil cracks and spread with the cap. */
        placeSpots(body, firstIndex, state) {
            const spec = this.spec;
            body.spots.forEach((spot, offset) => {
                const grown = state.visible ? spotProgress(spot, state.open) : 0;
                const size = Math.max(0.00001, spec.cap.spotSize * spot.size * state.size * grown);
                const p = capPoint(state.cap, spot.along, spot.around, body.wavePhase, spec.cap.waves);
                const normal = capNormal(state.cap, p.theta, spot.around);
                spotNormal.set(normal.x, normal.y, normal.z);
                dummy.position.set(p.x, p.y, p.z).addScaledVector(spotNormal, size * 0.1);
                dummy.quaternion.setFromUnitVectors(UP, spotNormal);
                dummy.scale.set(size, size * 0.32, size);
                dummy.updateMatrix();
                this.scene3D.spotMesh.setMatrixAt(firstIndex + offset, worldMatrix.multiplyMatrices(body.capFrame.matrixWorld, dummy.matrix));
            });
            dummy.quaternion.identity();
            return firstIndex + body.spots.length;
        }

        /** At fruition the glow breathes slowly. */
        breathAt(growth) {
            const { pulse, breathSpeed } = this.spec.glow;
            return 1 + pulse * magicAt(this.spec, growth) * Math.sin(this.clock * breathSpeed);
        }

        applyGlow(breath) {
            const scene3D = this.scene3D;
            const base = this.glowBase;
            if (!base) return;
            const { colors } = this.spec;
            scene3D.bodies.forEach((body, index) => {
                scene3D.pools[index].w = (body.pool ?? 0) * breath;
                if (!body.state?.visible || !body.glow) return;
                const [stemMaterial, capMaterial, gillMaterial, haloMaterial] = body.materials;
                capMaterial.emissiveIntensity = body.glow.cap * breath;
                capMaterial.userData.rim.rimStrength.value = body.glow.rim * breath;
                capMaterial.userData.rim.veilGlow.value = body.glow.veil * breath;
                gillMaterial.emissiveIntensity = body.glow.gills * breath;
                stemMaterial.emissiveIntensity = body.glow.stem * breath;
                stemMaterial.userData.rim.rimStrength.value = body.glow.rim * 0.45 * breath;
                haloMaterial.opacity = clamp01(body.glow.halo * breath);
            });
            scene3D.threadMaterial.color.set(colors.mycelium).multiplyScalar(base.threads);
            scene3D.tipMaterial.color.set(colors.mycelium).lerp(tint.set('#ffffff'), 0.5).multiplyScalar(base.threads * 1.5);
            scene3D.spotMaterial.color.set(colors.spots).multiplyScalar(base.spots * breath);
            scene3D.ringMaterial.emissiveIntensity = base.ring * breath;
            scene3D.ringMaterial.userData.rim.rimStrength.value = base.ring * 0.5 * breath;
            this.bloomPass.strength = base.bloom * (1 + (breath - 1) * 0.5);
        }

        /** Spores and the pulsing light keep moving by themselves once the magic starts: then animate() shows the 2D picture. */
        movesByItself(growth) {
            return magicAt(this.spec, growth) > 0 || sporesAt(this.spec, growth) > 0;
        }

        /** Which caps give spores: depends only on growth, so worked out once per growth rather than every frame. */
        sporeWeightsAt(growth) {
            if (this.weightsGrowth !== growth) {
                this.weights = sporeWeights(this.spec, growth, this.companions);
                this.weightsGrowth = growth;
            }
            return this.weights;
        }

        animate(dt, growth) {
            if (!this.scene3D) return;
            const spec = this.spec;
            this.clock += dt;
            const magic = magicAt(spec, growth);
            const share = sporesAt(spec, growth);
            const fronts = this.waveFronts();
            this.applyGlow(this.breathAt(growth));
            this.pulseThreads(magic, fronts);
            if (share > 0) this.spores.step(dt, this.sporeWeightsAt(growth));
            this.placeSpores3D(share);
            if (this.movesByItself(growth)) this.composite2D(growth, fronts);
        }

        /** Two waves of light run inwards along the threads, towards the mushroom they feed. */
        pulseThreads(magic, fronts) {
            const scene3D = this.scene3D;
            // Without magic there are no waves: reset the threads once, then leave them be.
            if (!scene3D.threads.instanceColor || (magic <= 0 && this.threadsPlain)) return;
            this.threadsPlain = magic <= 0;
            const strength = this.spec.glow.waves * magic;
            const { pieces, reach } = scene3D.mycelium;
            pieces.forEach((piece, index) => {
                const along = piece.reach / reach;
                const lit = fronts.reduce((sum, { front, fade }) => sum + fade * Math.exp(-(((along - front) / 0.07) ** 2)), 0);
                scene3D.threads.setColorAt(index, tint.setScalar(this.threadBrightness(piece) * (1 + strength * 2.5 * lit)));
            });
            scene3D.threads.instanceColor.needsUpdate = true;
        }

        /** Where the inward waves are now: 1 at the edge of the threads → 0 at the centre, fading in and out. */
        waveFronts() {
            return [0, 0.5].map(offset => {
                const front = 1 - ((this.clock * this.spec.glow.waveSpeed + offset) % 1);
                return { front, fade: Math.sin(Math.PI * front) };
            });
        }

        placeSpores3D(share) {
            // Nothing to show and nothing shown last frame: leave the buffers alone.
            if (share <= 0 && this.sporesHidden) return;
            this.sporesHidden = share <= 0;
            const scene3D = this.scene3D;
            const geometry = scene3D.spores.geometry;
            const position = geometry.attributes.position.array;
            const color = geometry.attributes.color.array;
            const base = scene3D.sporeColor;
            const shown = share * this.spores.spores.length;
            this.spores.spores.forEach((spore, index) => {
                const anchor = this.anchors3D[spore.source];
                const visible = clamp01(shown - index);
                let alpha = 0;
                if (anchor && visible > 0) {
                    this.spores.place(spore, anchor.rim, sporeAt);
                    alpha = sporeAt.alpha * visible;
                    position[index * 3] = anchor.position.x + sporeAt.x;
                    position[index * 3 + 1] = anchor.position.y + sporeAt.y;
                    position[index * 3 + 2] = anchor.position.z + sporeAt.z;
                }
                color[index * 3] = base[0] * alpha;
                color[index * 3 + 1] = base[1] * alpha;
                color[index * 3 + 2] = base[2] * alpha;
            });
            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;
            geometry.setDrawRange(0, Math.ceil(shown));
        }

        draw2D(growth) {
            const view = this.view2D;
            if (view.width < 2 || view.height < 2) return;
            const spec = this.spec;
            const ratio = view.ctx.canvas.width / view.width || 1;
            const frame = framing(view, spec.view.frame2D);
            this.frame2D = frame;
            this.layers.plate = fitLayer(this.layers.plate, view, ratio);
            // The glow layer only feeds the blur, so half the pixels are plenty; the blurs themselves need even fewer.
            this.layers.glow = fitLayer(this.layers.glow, view, ratio * 0.5);
            this.layers.bloomNear = fitLayer(this.layers.bloomNear, view, ratio * 0.5);
            this.layers.bloomWide = fitLayer(this.layers.bloomWide, view, ratio * 0.25);
            this.layers.softLight = fitLayer(this.layers.softLight, view, ratio * 0.25);
            const key = `${view.width}x${view.height}x${ratio}`;
            if (this.backdropKey !== key) {
                this.layers.backdrop = fitLayer(this.layers.backdrop, view, ratio);
                paintBackdrop(this.layers.backdrop.g, view, this.scene2D, spec, frame);
                this.backdropKey = key;
            }
            this.anchors2D = paintScene2D(this.layers, view, frame, this.scene2D, spec, growth, this.sprites);
            // Once something moves by itself, animate() puts the picture on screen every frame, this one included.
            if (!this.movesByItself(growth)) this.composite2D(growth);
        }

        /** The plate, plus what moves by itself: light pulsing along the threads, the breathing halo, drifting spores. */
        composite2D(growth, fronts = this.waveFronts()) {
            const view = this.view2D;
            const frame = this.frame2D;
            if (!this.layers.plate || !this.anchors2D || !frame || view.width < 2 || view.height < 2) return;
            const spec = this.spec;
            const g = view.ctx;
            const { sx, sy, scale } = frame;
            g.globalCompositeOperation = 'source-over';
            g.globalAlpha = 1;
            g.drawImage(this.layers.plate.canvas, 0, 0, view.width, view.height);
            g.globalCompositeOperation = 'lighter';

            const magic = magicAt(spec, growth);
            if (magic > 0) {
                // The glow layer's threads, seen through rings closing in on the knot, inside the cut only.
                const knot = this.scene2D.knot;
                const halfWidth = view.width / 2 / scale + 0.05;
                const reach = 0.9 * scale;
                g.save();
                traceSoil(g, this.scene2D, frame, halfWidth, -spec.ground.depth - view.height / scale);
                g.clip();
                fronts.forEach(({ front, fade }) => {
                    WAVE_BANDS.forEach(([band, strength]) => {
                        g.save();
                        g.beginPath();
                        g.arc(sx(knot.x), sy(knot.y), (front + band) * reach, 0, TAU);
                        g.arc(sx(knot.x), sy(knot.y), Math.max(0, front - band) * reach, 0, TAU);
                        g.clip('evenodd');
                        g.globalAlpha = clamp01(spec.glow.waves * magic * fade * strength * 0.7);
                        g.drawImage(this.layers.glow.canvas, 0, 0, view.width, view.height);
                        g.restore();
                    });
                });
                g.restore();

                const main = this.anchors2D[0];
                if (main) {
                    const breath = 0.5 + 0.5 * Math.sin(this.clock * spec.glow.breathSpeed);
                    const radius = (main.rim * 2.2 + 0.05) * scale;
                    const halo = g.createRadialGradient(sx(main.x), sy(main.y), 0, sx(main.x), sy(main.y), radius);
                    halo.addColorStop(0, rgba(spec.colors.halo, 0.12 * spec.glow.halo * magic * breath));
                    halo.addColorStop(1, rgba(spec.colors.halo, 0));
                    g.fillStyle = halo;
                    g.fillRect(sx(main.x) - radius, sy(main.y) - radius, radius * 2, radius * 2);
                }
            }

            const share = sporesAt(spec, growth);
            if (share > 0) {
                const shown = share * this.spores.spores.length;
                const below = spec.glow.underside2D;
                this.spores.spores.forEach((spore, index) => {
                    const anchor = this.anchors2D[spore.source];
                    const visible = clamp01(shown - index);
                    if (!anchor || visible <= 0) return;
                    this.spores.place(spore, anchor.rim, sporeAt);
                    // Nearer spores look bigger and brighter.
                    const near = Math.min(1.6, Math.max(0.5, 1 + sporeAt.z * 2));
                    const size = spec.spores.size[0] * near * anchor.k * scale;
                    g.globalAlpha = clamp01(sporeAt.alpha * visible * (1 - anchor.fade) * (0.6 + 0.4 * near));
                    const x = sx(anchor.x + sporeAt.x * anchor.k);
                    const y = sy(anchor.y + (sporeAt.y + sporeAt.z * below) * anchor.k);
                    g.drawImage(this.sprites.spore, x - size, y - size, size * 2, size * 2);
                });
            }
            g.globalAlpha = 1;
            g.globalCompositeOperation = 'source-over';
        }

        stageLabel(growth) {
            const spec = this.spec;
            const opening = growthOfAge(spec, spec.life.openFrom);
            const glowing = Math.max(spec.glowFrom, growthOfAge(spec, 0.8));
            if (growth >= 1) return { text: 'In full glow ✨', tone: 'cyan' };
            if (growth >= glowing) return { text: 'Glowing', tone: 'cyan' };
            if (growth >= opening) return { text: 'Opening', tone: 'cyan' };
            if (growth >= spec.pinFrom) return { text: 'Pinning', tone: '' };
            return { text: 'Mycelium spreading', tone: '' };
        }

        describe() {
            const mushrooms = 1 + this.companions.length;
            const spots = this.scene3D.bodies.reduce((sum, body) => sum + body.spots.length, 0);
            const capped = this.scene2D.mycelium.capped || this.scene3D.mycelium.capped ? ' (capped)' : '';
            const threads2D = this.scene2D.mycelium.branches.length;
            const threads3D = this.scene3D.mycelium.threads.length;
            const counts = `${mushrooms} mushrooms, ${spots} spots, ${this.spec.spores.count} spores`;
            return `2D: ${threads2D} threads · 3D: ${threads3D} threads${capped} · ${counts}`;
        }
    }

    registerView(new MushroomView());
}

// ===== fern =====
{
// ═══════════════════════════ Fern ═══════════════════════════
// A woodland fern after Dryopteris: a crown of twice-divided fronds. Each frond comes up as a fiddlehead, the whole frond rolled
// into a spiral, and unrolls from its foot to its tip while its pinnae unroll in turn just behind; the grown fronds arch out
// into a vase. Last, the sori (the spore cases under the pinnules) swell and ripen: the fern's fruition. One frond model
// (where the midrib lies at any age) drives both views; each view dresses it in its own geometry.

const FERN = {
    seed: 11,
    fronds: 12,              // fronds in the 3D crown, set out on a golden-angle spiral as real leaves are
    fronds2D: 7,             // fronds in the 2D side view
    length: [0.9, 0.95],     // frond length, innermost (last up) → outermost (first up)
    lean: [0.2, 0.62],       // radians a frond leans out from upright at its foot, innermost → outermost
    arch: [0.5, 1.3],        // radians a grown frond bows outward from foot to tip, innermost → outermost: outer tips pass level
    variety: 0.1,            // how far one frond's length, lean and bow stray from the plan (share)
    archPower: 2,            // above 1 the stalk stays straight and the blade bows: the weight is in the leafy part
    settle: 0.15,            // share of the bow a frond only takes on as it hardens: the vase opens a little at the end
    youngLean: 0.25,         // share of its lean a fiddlehead has: it comes up nearly upright and leans out as it opens
    stipe: 0.16,             // share of the frond that is bare stalk below the first pinnae
    stipeBrown: [0.5, 1.1],  // the stalk is brown under its scales up to the first share of the stipe, green from the second
    rachisWidth: 0.009,      // midrib thickness at the foot, as a share of frond length…
    rachisTaper: 0.85,       // …and the share of it gone by the tip
    coilWidth: 0.034,        // fiddlehead thickness at its outer turn (the whole blade rolled up), as a share of frond length
    coilBreadth: 2.2,        // 3D: a rolled-up blade is this much wider across than through: its pinnae are rolled up on both sides
    coilFrom: 0.15,          // the spiral starts this far up: the top of the stalk bends over into it
    coilTurns: 2.3,          // turns of the fiddlehead spiral
    coilTightness: 0.92,     // 0–1: how much tighter each inner turn is (a logarithmic spiral); pinnae curl the same way
    coilCompact: 0.24,       // a rolled-up stretch is this share of its grown length: the turns lie close, and the frond lengthens as it unrolls
    unrollZone: 0.2,         // share of the frond over which the curl relaxes into the grown arch
    pinnaPairs: 14,          // pinnae on each side of the midrib
    pinnaLength: 0.21,       // longest pinna, as a share of frond length
    pinnaAngle: 1.1,         // radians between midrib and a grown pinna, which points a little toward the tip
    pinnaFold: 0.3,          // the same angle while the pinna is still folded against the midrib
    pinnaLift: 0.3,          // 3D: radians the pinnae rise out of the blade at their foot, giving the frond a shallow trough…
    pinnaDroop: 0.6,         // …and radians a grown pinna bends down toward its tip, so each pinna arches
    pinnaCurl: 2.4,          // radians a young pinna is rolled up: its own little fiddlehead
    pinnaCurlZone: 0.35,     // share of a pinna over which its curl relaxes
    pinnaCurlWidth: 0.12,    // a pinna's thickness where it is still rolled up, as a share of its grown length
    pinnaSweep: 0.32,        // radians a grown pinna curves toward the frond tip
    pinnaLag: 0.02,          // pinnae start to unroll this far (share of the frond) behind the midrib's unrolling front…
    pinnaUnroll: 0.22,       // …and are fully open this much further back
    costaWidth: 0.003,       // a pinna's own midrib (costa), as a share of frond length; in 3D it thins to 0.4 of that at its tip
    bladeShape: { peakAt: 0.3, base: 0.6, tipPower: 0.8 },   // pinna length along the blade: a lance-shaped frond
    pinnules: 13,            // pinnules on each side of the longest pinna; shorter pinnae have fewer
    pinnuleLength: 0.15,     // pinnule length, as a share of the longest pinna
    pinnuleWidth: 0.6,       // pinnule width, as a share of its length
    pinnuleAngle: 1.25,      // radians between a pinna's midrib and its pinnules
    pinnuleFold: 0.3,        // the same angle while the pinnule is still folded
    pinnaShape: { peakAt: 0.12, base: 0.92, tipPower: 0.4 },  // pinnule length along a pinna: the last ones merge into its tip
    fertileFrom: 0.35,       // pinnae from this share of the blade up bear sori
    soriSize: 0.13,          // radius of a ripe sorus (a cluster of spore cases), as a share of its pinnule's width
    // When things happen on the growth slider (0 → 1).
    crownGrow: 0.08,         // the crown swells out of the moss by here
    emerge: [0.02, 0.56],    // the first and the last fiddlehead break through
    frondTime: 0.44,         // growth one frond takes from breaking through to fully open: the last is open at 1
    rise: 0.22,              // share of a frond's time spent rising as a fiddlehead on its lengthening stalk
    unroll: 0.84,            // share of a frond's time by which the curl has run out at the tip; after that it hardens
    sori: [0.8, 1],          // the sori swell and ripen from pale to brown over this stretch, on every hardened frond at once
    crown: { radius: 0.065, stubs: 16, roots: [0.02, 0.055] },   // the knob of old frond bases: its size, its stubs (3D), and
                             // how far from its middle the fronds leave it, innermost → outermost (3D)
    floor: { moss: 11, domes: 17, tufts: 700, litter: 16, twigs: 4, stones: 2 },   // forest floor: moss cushions, the domes
                             // that make up one cushion (3D) and its tufts per unit of width (2D), fallen leaves, twigs (3D), stones
    shadeFade: 0.8,          // 2D: how far the backmost frond fades toward colors.shade once the fronds in front have come up
    colors: {
        crozier: '#a3c45a',      // a fiddlehead's fresh skin
        scales: '#b9935c',       // papery scales on the stalk and the fiddlehead
        stipe: '#6b5337',        // the foot of the stalk, brown under its scales
        rachis: '#6f963e',       // a grown midrib
        young: '#a8d266',        // newly unrolled leaflets
        leaf: ['#45923d', '#52a046', '#3c8439', '#5b9a3c', '#6aa84a', '#3a7f4a'],   // grown leaflets, one shade per frond
        soriYoung: '#c2cc86',    // sori as they form, pale under their covers…
        sori: '#6b4520',         // …and ripe, dark brown
        outline: '#2f3b1d',      // 2D: ink line around fiddleheads and young stalks
        shade: '#16211b',        // 2D: fronds further back fade toward this
        crown: '#5a4230',        // the knob of old frond bases the fronds come up through
        soil: '#2c2219',         // the forest floor
        moss: ['#3f6b2a', '#4c7c2f', '#355d25', '#5b8c35'],   // moss cushions, one shade per cushion
        mossLit: '#c8e878',      // moss tips in the sun
        mossShade: '#121c10',    // moss in its own shadow
        litter: ['#5e3b22', '#6b4426', '#4f3420', '#7a5530'],   // last year's fallen leaves, gone dull on the ground
        litterVein: '#33200f',   // 2D: a fallen leaf's midrib
        stone: '#5c5f63',        // pebbles half sunk in the floor
        stoneLit: '#707275',     // 2D: the lit top of a pebble
        twig: '#4a3524',         // 3D: dead twigs on the floor
        ground: '#12161f',       // 3D: the dark disc the mound sits on, and the colour its rim fades into
    },
};

const FERN_FRAME = { across: 1.8, up: 1.2, base: 0.17 };   // 2D: scene units that must fit, and how high the ground sits
const RACHIS_NODES = { flat: 60, solid: 40 };    // nodes along a midrib in 2D and in 3D
const TIP_CROWDING = 1.35;    // nodes crowd toward the tip, where the spiral winds tightest
const TUBE_SIDES = 6;         // 3D: sides of a midrib tube
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
const CROWN_TOP = { flat: 0.34, solid: 0.72 };      // the fronds leave the crown this high, as a share of its radius
const PATCH = { y: -0.035, rx: 0.8, ry: 0.075 };    // 2D: the patch of forest floor, an ellipse seen at a slant
const MOUND = { radius: 0.5, height: 0.045, fade: 0.2 };   // 3D: the low mound of forest floor; its outer `fade` melts into the ground
const GROUND_RADIUS = 0.62;   // 3D: the dark disc under the mound
const FIT_ASPECT = 1.4;       // 3D: the camera is placed for panes this wide; a narrower one sees more height instead of losing frond tips
const SCALES_PER_FROND = 2 * Math.floor(RACHIS_NODES.solid / 2);   // 3D: a pair of scales on every other ring of the midrib

const lerp = (from, to, t) => from + (to - from) * t;

/** Where `value` lies between `from` and `to`, 0–1. A span of zero is a step, not a division by zero. */
const ramp = (value, from, to) => clamp01((value - from) / Math.max(to - from, 1e-6));

// ─── Fern: the frond model both views share ───

/** Length of a leaflet at `v` along its blade (0 foot → 1 tip), as a share of the longest: rising to a peak, then tapering. */
function bladeShapeAt(v, { peakAt, base, tipPower }) {
    if (v < peakAt) return base + (1 - base) * Math.sin(v / peakAt * Math.PI / 2);
    return Math.pow(Math.max(0, 1 - v) / (1 - peakAt), tipPower);
}

/** Turning of a rolled-up spiral from its start to share `c` of it: a logarithmic spiral, every turn tighter than the last. */
function spiralTurn(c, total) {
    const tightness = Math.min(FERN.coilTightness, 0.999);
    // Without any tightening the spiral is a circle, which turns evenly (the limit of the formula below).
    if (tightness < 1e-6) return total * c;
    return total * Math.log(1 - tightness * c) / Math.log(1 - tightness);
}

/** Share of the fiddlehead spiral at `u` (share of the frond): 0 below coilFrom, 1 at the tip. */
const coilShare = u => ramp(u, FERN.coilFrom, 1);

/** How green the stalk is at `u` (0–1): brown under its scales at the foot, green from just above the first pinnae. */
const greening = u => smooth(ramp(u, FERN.stipeBrown[0] * FERN.stipe, FERN.stipeBrown[1] * FERN.stipe));

const crownAt = growth => easeOut(ramp(growth, 0, FERN.crownGrow));
const frondAge = (frond, growth) => ramp(growth, frond.birth, frond.birth + FERN.frondTime);

/** How far a frond's sori have come (0–1): they swell and ripen late, all together, on every frond that has hardened. */
const soriAt = (growth, frondRipe) => smooth(ramp(growth, FERN.sori[0], FERN.sori[1])) * frondRipe;

/** A frond's life at `age` (0–1): how big the fiddlehead is, where the unrolling front has got to, how far it has opened and darkened. */
function frondPhases(age) {
    const { rise, unroll, stipe, unrollZone } = FERN;
    const rising = ramp(age, 0, rise);
    const opening = smooth(ramp(age, rise, unroll));
    return {
        size: easeOut(rising),
        // The front first runs up the stalk, which lengthens under the fiddlehead, then through the blade to past the tip.
        front: stipe * smooth(rising) + (1 + unrollZone - stipe) * opening,
        opening,
        ripe: smooth(ramp(age, unroll, 1)),
    };
}

/** How far a pinna at `u` has unrolled while the midrib's front is at `front`: 0 still rolled in the fiddlehead, 1 open. */
const pinnaOpening = (front, u) => smooth(ramp(front - u, FERN.pinnaLag, FERN.pinnaLag + FERN.pinnaUnroll));

/** How far node `w` (0–1 along a pinna) has unrolled when the pinna as a whole is `open`: pinnae unroll from foot to tip too. */
const costaRipe = (open, w) => smooth(ramp(open * (1 + FERN.pinnaCurlZone) - w, 0, FERN.pinnaCurlZone));

/** How big a pinna has budded out of the midrib: from nothing to its rolled-up size over the first fifth of its opening. */
const pinnaBud = open => smooth(ramp(open, 0, 0.2));

/** Length of a pinna's midrib (costa) as it opens: it buds out, and lengthens from a third to full while it unrolls. */
const pinnaReach = (frond, pinna, open) => frond.length * FERN.pinnaLength * pinna.reach * lerp(0.3, 1, open) * pinnaBud(open);

/** Radius of a pinna's rolled-up part at `w` along it, while it is curled: as thick as the pinnules rolled up inside, thinner toward its tip. */
const pinnaCurlRadius = (frond, pinna, open, w) =>
    frond.length * FERN.pinnaLength * pinna.reach * FERN.pinnaCurlWidth / 2 * pinnaBud(open) * (1 - 0.5 * w);

/** A grown pinnule's length on this pinna: those on the short pinnae near the tip are a little smaller. */
const pinnuleLengthOf = (frond, pinna) => frond.length * FERN.pinnaLength * FERN.pinnuleLength * lerp(0.7, 1, pinna.reach);

/** Arrays for a midrib's nodes; u is each node's place along the grown frond (0–1), crowded toward the tip. */
function makeCurve(segments) {
    const nodes = () => new Float64Array(segments + 1);
    const u = nodes().map((_, index) => 1 - Math.pow(1 - index / segments, TIP_CROWDING));
    return { u, x: nodes(), y: nodes(), angle: nodes(), width: nodes(), breadth: nodes(), ripe: nodes() };
}

/** Which segment of a midrib holds `u`, and how far along it. */
function segmentAt(curveU, u) {
    let index = 0;
    while (index < curveU.length - 2 && curveU[index + 1] <= u) index++;
    return { index, along: clamp01((u - curveU[index]) / (curveU[index + 1] - curveU[index])) };
}

/**
 * Lays out a frond's midrib for the phases of its life, in the frond's own upright plane: x outward from the crown, y up, scene
 * units from its foot. Unrolled stretches take the grown arch (bowing outward); rolled ones keep the spiral, which bends inward
 * over the crown (a fiddlehead rolls toward its upper side) and is only coilCompact of its grown length.
 * Also how thick it is there, and how much broader across the frond than that (rolled pinnae on both sides; 3D only).
 */
function layRachis(frond, phases, curve) {
    const { size, front, opening } = phases;
    const { u, x, y, angle, width, breadth, ripe } = curve;
    const last = u.length - 1;
    const scale = frond.length * size;
    const coil = FERN.coilTurns * TAU;
    const arch = frond.arch * lerp(1 - FERN.settle, 1, phases.ripe);
    let heading = Math.PI / 2 - frond.lean * lerp(FERN.youngLean, 1, opening);
    let px = 0;
    let py = 0;
    for (let index = 0; index <= last; index++) {
        const here = u[index];
        ripe[index] = smooth(ramp(front - here, 0, FERN.unrollZone));
        // Rolled up, the frond is as thick as its rolled pinnae, thinning toward the heart of the spiral.
        const rolledWidth = FERN.coilWidth * (1 - 0.8 * FERN.coilTightness * coilShare(here));
        const grownWidth = FERN.rachisWidth * (1 - FERN.rachisTaper * here);
        width[index] = scale * lerp(rolledWidth, grownWidth, ripe[index]);
        // The spiral swells to its full breadth over its first tenth, where the first pinnae are rolled in.
        const rolledBreadth = lerp(1, FERN.coilBreadth, smooth(ramp(coilShare(here), 0, 0.1)));
        breadth[index] = lerp(rolledBreadth, 1, ripe[index]);
        x[index] = px;
        y[index] = py;
        angle[index] = heading;
        if (index === last) break;

        const next = u[index + 1];
        const ripeHere = smooth(ramp(front - (here + next) / 2, 0, FERN.unrollZone));
        const rolledTurn = spiralTurn(coilShare(next), coil) - spiralTurn(coilShare(here), coil);
        const grownTurn = -arch * (Math.pow(next, FERN.archPower) - Math.pow(here, FERN.archPower));
        const turn = lerp(rolledTurn, grownTurn, ripeHere);
        const step = scale * (next - here) * lerp(FERN.coilCompact, 1, ripeHere);
        // Half the turn before the step and half after keeps the tight inner turns round.
        heading += turn / 2;
        px += Math.cos(heading) * step;
        py += Math.sin(heading) * step;
        heading += turn / 2;
    }
    return curve;
}

/** How thickly scaled a midrib is at node `index` (0–1): thick on the fiddlehead and the foot of the stalk, thinning as it opens. */
function scaliness(curve, index) {
    const thick = Math.max(1 - curve.ripe[index], 1 - ramp(curve.u[index], 0, FERN.stipe * 0.6));
    return ramp(thick, 0.15, 1);
}

/** Point and heading of a midrib part way along a segment, into `spot`. */
function rachisSpot(curve, { index, along }, spot) {
    const next = index + 1;
    spot.x = lerp(curve.x[index], curve.x[next], along);
    spot.y = lerp(curve.y[index], curve.y[next], along);
    spot.angle = lerp(curve.angle[index], curve.angle[next], along);
    return spot;
}

/** Pinnae along a frond: alternate sides, a little irregular, from the top of the stalk to the tip, sized by the blade's outline. */
function makePinnae(curveU, rand) {
    const count = FERN.pinnaPairs * 2;
    return Array.from({ length: count }, (_, index) => {
        const v = (index + 0.5 + (rand() - 0.5) * 0.35) / count;
        const u = FERN.stipe + v * (1 - FERN.stipe);
        const reach = bladeShapeAt(v, FERN.bladeShape);
        return {
            u,
            side: index % 2 === 0 ? 1 : -1,
            reach,
            // Shorter pinnae carry fewer pinnules rather than much smaller ones, as on a real frond.
            pinnules: Math.max(1, Math.round(FERN.pinnules * Math.pow(reach, 0.9))),
            fertile: v >= FERN.fertileFrom,
            at: segmentAt(curveU, u),
            shade: 0.9 + rand() * 0.16,
        };
    });
}

/** The fronds of one view. The first up is the outermost, longest and leans the most; each next one comes a little later, further in. */
function makeFronds(count, segments, rand) {
    // The last one up must still have its whole life before the slider ends.
    const latest = 1 - FERN.frondTime;
    return Array.from({ length: count }, (_, order) => {
        const outer = count === 1 ? 1 : 1 - order / (count - 1);
        const stray = () => 1 + (rand() - 0.5) * 2 * FERN.variety;
        const curve = makeCurve(segments);
        const planned = lerp(FERN.emerge[0], FERN.emerge[1], 1 - outer) + (rand() - 0.5) * 0.02;
        return {
            birth: Math.min(latest, Math.max(0.004, planned)),
            length: lerp(FERN.length[0], FERN.length[1], outer) * stray(),
            lean: lerp(FERN.lean[0], FERN.lean[1], outer) * stray(),
            arch: lerp(FERN.arch[0], FERN.arch[1], outer) * stray(),
            curve,
            pinnae: makePinnae(curve.u, rand),
        };
    });
}

const countPinnae = fronds => fronds.reduce((sum, frond) => sum + frond.pinnae.length, 0);

/** When the label's stages begin, from the fronds' own timing: the first fiddlehead shows, the first frond unrolls, every frond is open. */
function stagesOf(fronds) {
    const births = fronds.map($_ => $_.birth);
    const first = Math.min(...births);
    const span = FERN.frondTime;
    return {
        // A tenth of the way up, the first fiddlehead shows above the moss.
        fiddleheads: first + 0.1 * FERN.rise * span,
        unfurling: first + FERN.rise * span,
        lush: Math.max(...births) + FERN.unroll * span,
    };
}

// ─── Fern in 2D ───

const blendRgb = (from, to, t) => from.map((channel, index) => channel + (to[index] - channel) * t);
const rgbText = (rgb, light = 1) => `rgb(${rgb.map(channel => Math.round(Math.min(255, channel * light))).join(',')})`;

function buildFern2D() {
    const rand = mulberry32(FERN.seed);
    const fronds = makeFronds(FERN.fronds2D, RACHIS_NODES.flat, rand);
    fronds.forEach((frond, order) => {
        // From the outside in, right and left by turns, so the last fronds up stand in the middle…
        frond.side = order % 2 === 0 ? 1 : -1;
        frond.x = (rand() - 0.5) * 0.03;
        // …and further forward: the young ones unroll in front of the grown ones, not hidden behind them. 0 back, 1 front.
        frond.depth = clamp01(lerp(0.2, 1, order / Math.max(1, fronds.length - 1)) + (rand() - 0.5) * 0.1);
        frond.leaf = hexToRgb(pick(rand, FERN.colors.leaf));
    });
    // Scratch for walking one pinna's midrib (costa): a node per pinnule pair, and one at the tip.
    const nodes = () => new Float64Array(FERN.pinnules + 1);
    return {
        fronds,
        backToFront: [...fronds].sort((a, b) => a.depth - b.depth),
        floor: buildFloor2D(mulberry32(FERN.seed + 1)),
        costa: { x: nodes(), y: nodes(), heading: nodes(), ripe: nodes(), length: nodes(), spread: nodes() },
    };
}

/** Moss cushions, fallen leaves and a stone or two on the patch, back to front, split into what lies behind the crown and in front. */
function buildFloor2D(rand) {
    const onPatch = (spread = 0.94) => {
        const a = rand() * TAU;
        const r = Math.sqrt(rand()) * spread;
        return { x: Math.cos(a) * r * PATCH.rx, y: PATCH.y + Math.sin(a) * r * PATCH.ry };
    };
    // Moss grows in cushions: low domes of tiny tufts, each cushion in its own shade of green.
    const moss = Array.from({ length: FERN.floor.moss }, () => {
        const half = 0.03 + rand() * 0.035;
        const height = half * (0.35 + rand() * 0.25);
        // Tufts fill the dome's outline; `up` (0 at its foot, 1 at its crest) later picks how sunlit each one is.
        const tufts = Array.from({ length: Math.round(half * FERN.floor.tufts) }, () => {
            const across = rand() * 2 - 1;
            const up = rand() * Math.sqrt(1 - across * across);
            return { dx: across * half, dy: up * height, r: 0.004 + rand() * 0.005, up };
        });
        return { kind: 'moss', ...onPatch(0.86), half, height, shade: hexToRgb(pick(rand, FERN.colors.moss)), tufts };
    });
    const litter = Array.from({ length: FERN.floor.litter }, () => ({
        kind: 'leaf', ...onPatch(), r: 0.018 + rand() * 0.016, turn: (rand() - 0.5) * 1.2, color: pick(rand, FERN.colors.litter),
    }));
    // Stones keep clear of the crown, so they never hide the fiddleheads.
    const stones = Array.from({ length: FERN.floor.stones }, (_, index) => ({
        kind: 'stone', x: (index % 2 ? -1 : 1) * (0.38 + rand() * 0.25), y: PATCH.y + (rand() - 0.6) * 0.06, r: 0.022 + rand() * 0.018,
    }));
    const all = [...moss, ...litter, ...stones].sort((a, b) => b.y - a.y);
    return { back: all.filter($_ => $_.y >= 0), front: all.filter($_ => $_.y < 0) };
}

function drawPatch2D(g, { sx, sy, scale }) {
    // A soft-edged ellipse of dark earth: a radial gradient squashed to the patch's slant, fading out at its rim.
    const soil = hexToRgb(FERN.colors.soil).join(',');
    g.save();
    g.translate(sx(0), sy(PATCH.y));
    g.scale(1, PATCH.ry / PATCH.rx);
    const earth = g.createRadialGradient(0, 0, 0, 0, 0, PATCH.rx * scale);
    earth.addColorStop(0, FERN.colors.soil);
    earth.addColorStop(0.8, FERN.colors.soil);
    earth.addColorStop(1, `rgba(${soil},0)`);
    g.fillStyle = earth;
    g.beginPath();
    g.arc(0, 0, PATCH.rx * scale, 0, TAU);
    g.fill();
    g.restore();
}

// A moss cushion's tufts in three tones, from the shaded foot to the sunlit crest: [highest `up` in the band, light].
const MOSS_TONES = [[0.35, -0.35], [0.7, 0], [1, 0.3]];

function drawMoss2D(g, cushion, { sx, sy, scale }) {
    const lit = hexToRgb(FERN.colors.mossLit);
    const shadow = hexToRgb(FERN.colors.mossShade);
    // Its shadow on the earth grounds it, then the tufts, darkest first so the lit ones sit on top.
    g.fillStyle = mixRgb(cushion.shade, shadow, 0.6);
    g.beginPath();
    g.ellipse(sx(cushion.x), sy(cushion.y), cushion.half * 1.05 * scale, cushion.height * 0.45 * scale, 0, 0, TAU);
    g.fill();
    let floor = -1;
    MOSS_TONES.forEach(([ceiling, light]) => {
        g.fillStyle = light < 0 ? mixRgb(cushion.shade, shadow, -light) : mixRgb(cushion.shade, lit, light);
        g.beginPath();
        cushion.tufts.forEach(tuft => {
            if (tuft.up <= floor || tuft.up > ceiling) return;
            const x = sx(cushion.x + tuft.dx);
            const y = sy(cushion.y + tuft.dy);
            const r = tuft.r * scale;
            g.moveTo(x + r, y);
            g.arc(x, y, r, 0, TAU);
        });
        g.fill();
        floor = ceiling;
    });
}

function drawFloorItem2D(g, item, look) {
    if (item.kind === 'moss') {
        drawMoss2D(g, item, look);
        return;
    }
    const { sx, sy, scale } = look;
    const x = sx(item.x);
    const y = sy(item.y);
    const r = item.r * scale;
    if (item.kind === 'leaf') {
        // A fallen leaf lying flat, so seen squashed: pointed at both ends, with its midrib.
        g.save();
        g.translate(x, y);
        g.scale(1, 0.45);
        g.rotate(item.turn);
        g.fillStyle = item.color;
        g.beginPath();
        g.moveTo(-r, 0);
        g.quadraticCurveTo(0, -r * 0.8, r, 0);
        g.quadraticCurveTo(0, r * 0.8, -r, 0);
        g.fill();
        g.strokeStyle = FERN.colors.litterVein;
        g.lineWidth = 0.8;
        g.beginPath();
        // The stalk sticks out a little past the foot.
        g.moveTo(-r * 1.2, 0);
        g.lineTo(r * 0.8, 0);
        g.stroke();
        g.restore();
        return;
    }
    g.fillStyle = FERN.colors.stone;
    g.beginPath();
    g.ellipse(x, y - r * 0.3, r * 1.3, r * 0.75, 0, 0, TAU);
    g.fill();
    g.fillStyle = FERN.colors.stoneLit;
    g.beginPath();
    g.ellipse(x - r * 0.25, y - r * 0.6, r * 0.75, r * 0.32, 0, 0, TAU);
    g.fill();
}

/** The crown: a scaly knob of old frond bases the fiddleheads come up through. */
function drawCrown2D(g, size, { sx, sy, scale }) {
    if (size <= 0) return;
    const r = FERN.crown.radius * size;
    const middle = r * 0.12;
    g.fillStyle = FERN.colors.crown;
    g.beginPath();
    g.ellipse(sx(0), sy(middle), r * scale, r * 0.62 * scale, 0, 0, TAU);
    g.fill();
    g.strokeStyle = FERN.colors.stipe;
    g.lineWidth = Math.max(1, r * 0.18 * scale);
    g.beginPath();
    for (let $_ = 0; $_ < 9; $_++) {
        const a = Math.PI * (0.1 + 0.8 * $_ / 8);
        g.moveTo(sx(Math.cos(a) * r * 0.4), sy(middle + Math.sin(a) * r * 0.2));
        g.lineTo(sx(Math.cos(a) * r * 1.1), sy(middle + Math.sin(a) * r * 0.75));
    }
    g.stroke();
}

/**
 * How deep in shade a frond stands (0–1): the further back, the deeper, but only as the fronds in front of it come up. So the
 * first fiddleheads, alone on the floor, are fresh, and the old fronds darken behind the young ones.
 */
const shadeOf = (frond, growth) => (1 - frond.depth) * FERN.shadeFade * smooth(ramp(growth, FERN.emerge[0], FERN.emerge[1]));

/** One frond's colours, faded `fade` of the way toward the shade. */
function frondColours2D(frond, fade) {
    const shade = hexToRgb(FERN.colors.shade);
    const faded = hex => blendRgb(hexToRgb(hex), shade, fade);
    return {
        crozier: faded(FERN.colors.crozier),
        scales: mixRgb(hexToRgb(FERN.colors.scales), shade, fade),
        stipe: faded(FERN.colors.stipe),
        rachis: faded(FERN.colors.rachis),
        young: faded(FERN.colors.young),
        leaf: blendRgb(frond.leaf, shade, fade),
        outline: mixRgb(hexToRgb(FERN.colors.outline), shade, fade),
        soriYoung: faded(FERN.colors.soriYoung),
        sori: faded(FERN.colors.sori),
    };
}

/** Adds one leaflet to the current path: an oblong, broad at its foot and blunt at its tip, from (bx, by) along `angle`. */
function addLeaflet2D(g, X, Y, bx, by, angle, length, width) {
    const dx = Math.cos(angle);
    const dy = Math.sin(angle);
    const nx = -dy * width * 0.62;
    const ny = dx * width * 0.62;
    const tx = bx + dx * length;
    const ty = by + dy * length;
    // Each side leaves the foot square to the leaflet and comes into the tip square to it too: broad foot, rounded tip.
    const shoulderX = tx - dx * length * 0.12;
    const shoulderY = ty - dy * length * 0.12;
    g.moveTo(X(bx), Y(by));
    g.bezierCurveTo(X(bx + nx), Y(by + ny), X(shoulderX + nx), Y(shoulderY + ny), X(tx), Y(ty));
    g.bezierCurveTo(X(shoulderX - nx), Y(shoulderY - ny), X(bx - nx), Y(by - ny), X(bx), Y(by));
}

const spot2D = { x: 0, y: 0, angle: 0 };

/**
 * A pinna in 2D, a small frond of its own: it opens out from the midrib toward the frond tip, unrolls its own curl (toward the
 * frond tip, in the picture plane) from foot to tip, and puts out a pair of pinnules at every node it has unrolled.
 */
function drawPinna2D(pen, frond, pinna, curve, phases) {
    const { g, X, Y, scale, colours, costa } = pen;
    const open = pinnaOpening(phases.front, pinna.u);
    if (open <= 0.004) return;
    const spot = rachisSpot(curve, pinna.at, spot2D);
    const reach = pinnaReach(frond, pinna, open);
    const leafletLength = pinnuleLengthOf(frond, pinna);
    const count = pinna.pinnules;
    const towardTip = -pinna.side;
    let heading = spot.angle + pinna.side * lerp(FERN.pinnaFold, FERN.pinnaAngle, open);
    let px = spot.x;
    let py = spot.y;
    for (let node = 0; node <= count; node++) {
        const w0 = node / count;
        const ripe = costaRipe(open, w0);
        costa.x[node] = px;
        costa.y[node] = py;
        costa.heading[node] = heading;
        costa.ripe[node] = ripe;
        // The pinnule pair here; the tip carries a single, smaller one.
        costa.length[node] = leafletLength * ripe * (node === count ? 0.55 : bladeShapeAt(w0, FERN.pinnaShape));
        costa.spread[node] = node === count ? 0 : lerp(FERN.pinnuleFold, FERN.pinnuleAngle, ripe);
        if (node === count) break;
        const w1 = (node + 1) / count;
        const ripeHere = costaRipe(open, (w0 + w1) / 2);
        const curl = spiralTurn(w1, FERN.pinnaCurl) - spiralTurn(w0, FERN.pinnaCurl);
        const sweep = FERN.pinnaSweep * (Math.pow(w1, 1.5) - Math.pow(w0, 1.5));
        const turn = towardTip * lerp(curl, sweep, ripeHere);
        const step = reach * (w1 - w0) * lerp(FERN.coilCompact, 1, ripeHere);
        heading += turn / 2;
        px += Math.cos(heading) * step;
        py += Math.sin(heading) * step;
        heading += turn / 2;
    }

    const colourT = open * lerp(0.45, 1, phases.ripe);
    const leafColour = blendRgb(colours.young, colours.leaf, colourT);

    // Its midrib, thin; a little lighter on the fronds in front, so they stand out from those behind.
    g.strokeStyle = rgbText(leafColour, lerp(0.85, 1.1, frond.depth));
    g.lineWidth = Math.max(0.6, frond.length * FERN.costaWidth * scale);
    g.beginPath();
    g.moveTo(X(costa.x[0]), Y(costa.y[0]));
    for (let node = 1; node <= count; node++) g.lineTo(X(costa.x[node]), Y(costa.y[node]));
    g.stroke();

    // The pinnules, all in one path.
    g.fillStyle = rgbText(leafColour, pinna.shade);
    g.beginPath();
    for (let node = 0; node <= count; node++) {
        const length = costa.length[node];
        if (length * scale < 0.7) continue;
        const sides = node === count ? [0] : [1, -1];
        sides.forEach(side => addLeaflet2D(g, X, Y, costa.x[node], costa.y[node], costa.heading[node] + side * costa.spread[node], length, length * FERN.pinnuleWidth));
    }
    g.fill();

    if (pen.sori > 0 && pinna.fertile) drawSori2D(pen, count);

    // The part still rolled up: a row of overlapping beads that reads as a little curl.
    if (costa.ripe[count] > 0.97) return;
    g.fillStyle = mixRgb(colours.crozier, colours.young, open * 0.5);
    g.beginPath();
    for (let node = 0; node <= count; node++) {
        const radius = pinnaCurlRadius(frond, pinna, open, node / count) * (1 - costa.ripe[node]) * scale;
        if (radius < 0.4) continue;
        const bx = X(costa.x[node]);
        const by = Y(costa.y[node]);
        g.moveTo(bx + radius, by);
        g.arc(bx, by, radius, 0, TAU);
    }
    g.fill();
}

/** A pinna's sori: under each pinnule a row of spore cases on either side of its own midrib, drawn here as a dot each. */
function drawSori2D(pen, count) {
    const { g, X, Y, scale, costa, sori } = pen;
    g.fillStyle = pen.soriColour;
    g.beginPath();
    for (let node = 0; node < count; node++) {
        const length = costa.length[node];
        const width = length * FERN.pinnuleWidth;
        const radius = width * FERN.soriSize * sori * scale;
        if (radius < 0.3) continue;
        [1, -1].forEach(side => {
            const angle = costa.heading[node] + side * costa.spread[node];
            const dx = Math.cos(angle);
            const dy = Math.sin(angle);
            const midX = costa.x[node] + dx * length * 0.45;
            const midY = costa.y[node] + dy * length * 0.45;
            [1, -1].forEach(row => {
                const x = X(midX - dy * width * 0.22 * row);
                const y = Y(midY + dx * width * 0.22 * row);
                g.moveTo(x + radius, y);
                g.arc(x, y, radius, 0, TAU);
            });
        });
    }
    g.fill();
}

/**
 * The midrib in 2D: an ink outline under its thick young parts, then the body segment by segment (brown at the foot, fresh
 * where it is still rolled up, green where grown), then the groove and sheen of the spiral, then its scales.
 */
function drawRachis2D(pen, curve, coilPx) {
    const { g, X, Y, scale, colours } = pen;
    const { u, x, y, angle, width, ripe } = curve;
    const last = u.length - 1;

    // The outline thickens in as the part does, so it never switches on all at once.
    g.strokeStyle = colours.outline;
    for (let index = 0; index < last; index++) {
        const thickness = (width[index] + width[index + 1]) / 2 * scale;
        const ink = 1.6 * clamp01((thickness - 1.5) / 2);
        if (ink <= 0) continue;
        g.lineWidth = thickness + ink;
        g.beginPath();
        g.moveTo(X(x[index]), Y(y[index]));
        g.lineTo(X(x[index + 1]), Y(y[index + 1]));
        g.stroke();
    }

    for (let index = 0; index < last; index++) {
        const grown = blendRgb(colours.stipe, colours.rachis, greening(u[index]));
        g.strokeStyle = mixRgb(colours.crozier, grown, (ripe[index] + ripe[index + 1]) / 2);
        g.lineWidth = Math.max(0.7, (width[index] + width[index + 1]) / 2 * scale);
        g.beginPath();
        g.moveTo(X(x[index]), Y(y[index]));
        g.lineTo(X(x[index + 1]), Y(y[index + 1]));
        g.stroke();
    }

    // Along the spiral's inner edge a dark line reads as the gap between its turns; a light one along the back makes it round.
    // Both are as wide as a share of the fiddlehead, so they grow with it.
    [[0.5, colours.outline, Math.min(1, coilPx * 0.12)], [-0.22, rgbText(colours.crozier, 1.22), coilPx * 0.2]].forEach(([offset, colour, lineWidth]) => {
        if (lineWidth < 0.1) return;
        g.strokeStyle = colour;
        g.lineWidth = lineWidth;
        g.beginPath();
        let drawing = false;
        for (let index = 0; index <= last; index++) {
            if (ripe[index] > 0.6) {
                drawing = false;
                continue;
            }
            const side = width[index] * offset;
            const px = X(x[index] - Math.sin(angle[index]) * side);
            const py = Y(y[index] + Math.cos(angle[index]) * side);
            if (drawing) g.lineTo(px, py);
            else g.moveTo(px, py);
            drawing = true;
        }
        g.stroke();
    });

    // Scales sit thick on the fiddlehead and the foot of the stalk, and thin out as the frond opens.
    g.fillStyle = colours.scales;
    g.beginPath();
    for (let index = 1; index < last; index += 2) {
        const radius = width[index] * scale * 0.16 * scaliness(curve, index);
        if (radius < 0.35) continue;
        const side = (index % 4 === 1 ? 0.45 : -0.45) * width[index];
        const px = X(x[index] - Math.sin(angle[index]) * side);
        const py = Y(y[index] + Math.cos(angle[index]) * side);
        g.moveTo(px + radius, py);
        g.arc(px, py, radius, 0, TAU);
    }
    g.fill();
}

function drawFrond2D(g, fern, frond, growth, footY, { sx, sy, scale }) {
    const age = frondAge(frond, growth);
    if (age <= 0) return;
    const phases = frondPhases(age);
    const curve = layRachis(frond, phases, frond.curve);
    const colours = frondColours2D(frond, shadeOf(frond, growth));
    const sori = soriAt(growth, phases.ripe);
    const pen = {
        g, scale, colours, sori,
        costa: fern.costa,
        soriColour: mixRgb(colours.soriYoung, colours.sori, sori),
        // Frond coordinates to the canvas, mirrored for fronds leaning left.
        X: x => sx(frond.x + frond.side * x),
        Y: y => sy(footY + y),
    };
    frond.pinnae.forEach(pinna => drawPinna2D(pen, frond, pinna, curve, phases));
    drawRachis2D(pen, curve, frond.length * phases.size * FERN.coilWidth * scale);
}

function drawFern2D(view, fern, growth) {
    const g = view.ctx;
    g.clearRect(0, 0, view.width, view.height);
    // Every stroke here has round ends. Set once at the start, so no paint depends on what the one before left behind.
    g.lineCap = 'round';
    const look = framing(view, FERN_FRAME);
    const crown = crownAt(growth);
    drawPatch2D(g, look);
    fern.floor.back.forEach(item => drawFloorItem2D(g, item, look));
    drawCrown2D(g, crown, look);
    const footY = FERN.crown.radius * CROWN_TOP.flat * crown;
    fern.backToFront.forEach(frond => drawFrond2D(g, fern, frond, growth, footY, look));
    // Moss in front of the crown hides the feet of the stalks, so the fronds come up out of it.
    fern.floor.front.forEach(item => drawFloorItem2D(g, item, look));
}

// ─── Fern in 3D ───

/** A small leaf: foot at the origin, tip at y = 1, `rows` of [y, half width], its edges cupped up toward +z. */
function makeLeafGeometry(rows, cup) {
    const positions = [];
    for (let row = 0; row < rows.length - 1; row++) {
        const [y0, half0] = rows[row];
        const [y1, half1] = rows[row + 1];
        [-1, 1].forEach(side => {
            const edge0 = [side * half0, y0, half0 * cup];
            const edge1 = [side * half1, y1, half1 * cup];
            positions.push(0, y0, 0, ...edge0, ...edge1, 0, y0, 0, ...edge1, 0, y1, 0);
        });
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.computeVertexNormals();
    return geometry;
}

// A pinnule: oblong, broad at its foot and blunt at its tip. A fallen leaf: pointed, lying flat (its length along z, its face up).
const leafletGeometry = makeLeafGeometry([[0, 0.22], [0.16, 0.42], [0.45, 0.5], [0.75, 0.44], [0.92, 0.3], [1, 0.1]], 0.35);
const litterGeometry = makeLeafGeometry([[0, 0], [0.25, 0.32], [0.6, 0.3], [0.85, 0.15], [1, 0]], 0.25).rotateX(-Math.PI / 2).translate(0, 0, 0.5);
const mossGeometry = new THREE.IcosahedronGeometry(1, 1);
const beadGeometry = new THREE.IcosahedronGeometry(1, 0);   // stones, scales and sori
const stubGeometry = unitStem(0.45, 5);
const twigGeometry = unitStem(0.6, 5);
const costaGeometry = unitStem(0.85, 4);
const crownGeometry = new THREE.IcosahedronGeometry(1, 1);

/** The mound's rim wanders in and out a little, so the patch of forest floor is no perfect disc. */
const rimAt = a => 1 + 0.07 * Math.sin(3 * a + 1) + 0.04 * Math.sin(5 * a + 2.5);

/** Height of the mound of forest floor at distance `r` from the middle, in direction `a`. */
const moundAt = (r, a) => MOUND.height * Math.sqrt(Math.max(0, 1 - (r / (MOUND.radius * rimAt(a))) ** 2));

/** A unit dome whose rim follows rimAt, smooth (a soft heap of leaf mould), with room for a colour per vertex; the mesh scales it. */
function makeMoundGeometry() {
    const geometry = new THREE.SphereGeometry(1, 48, 12, 0, TAU, 0, Math.PI / 2);
    const position = geometry.attributes.position;
    for (let index = 0; index < position.count; index++) {
